    /* ═══════════════════════════════════════════════════════════
       SEVEN HORSES CRM — STYLES

     /* ═══════════════════════════════════════════════════════════
   CHUNK 2 — CSS VARIABLES (Single Source of Truth)
   Rule: No hardcoded colors/sizes anywhere else in the file.
   All components must consume these tokens only.
   ═══════════════════════════════════════════════════════════ */

:root {
  /* ─── NAVY (Primary — 60% UI) ─── */
  --navy:        #0F1B2D;
  --navy-light:  #1E3049;
  --navy-dark:   #080F1A;

  /* ─── GOLD (Accent — 10% UI) ─── */
  --gold:        #C9A961;
  --gold-light:  #E8B86A;
  --gold-dark:   #A8853F;

  /* ─── NEUTRALS (30% UI) ─── */
  --white:       #FFFFFF;
  --bg:          #F7F5F0;
  --bg-subtle:   #FAF9F5;
  --bg-card:     #FFFFFF;

  /* ─── TEXT ─── */
  --text-primary:   #0F1B2D;
  --text-secondary: #5A6478;
  --text-muted:     #8B96A8;
  --text-inverse:   #FFFFFF;

  /* ─── BORDERS (subtle gold tint) ─── */
  --border:        #EAE3D2;
  --border-light:  #F0EDE3;
  --border-strong: #D4C9AE;

  /* ─── STATUS ─── */
  --success:    #10B981;
  --success-bg: #ECFDF5;
  --error:      #EF4444;
  --error-bg:   #FEF2F2;
  --warning:    #F59E0B;
  --warning-bg: #FFFBEB;
  --info:       #3B82F6;
  --info-bg:    #EFF6FF;

  /* ─── TYPOGRAPHY — Families ─── */
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans:  'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  /* ─── TYPOGRAPHY — Sizes ─── */
  --fs-4xl:  40px;   /* Hero */
  --fs-3xl:  32px;   /* Page title */
  --fs-2xl:  26px;   /* Mobile page */
  --fs-xl:   22px;   /* Section */
  --fs-lg:   18px;   /* Card title */
  --fs-base: 14px;   /* Body */
  --fs-sm:   13px;   /* Secondary */
  --fs-xs:   12px;   /* Labels */
  --fs-2xs:  11px;   /* Badges */
  --fs-3xs:  10px;   /* Micro */

  /* ─── TYPOGRAPHY — Weights ─── */
  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;

  /* ─── TYPOGRAPHY — Line Heights ─── */
  --lh-heading: 1.15;
  --lh-body:    1.55;
  --lh-small:   1.5;
  --lh-stats:   1.0;

  /* ─── TYPOGRAPHY — Letter Spacing ─── */
  --ls-heading:   -0.02em;
  --ls-body:      -0.005em;
  --ls-uppercase:  0.08em;

  /* ─── SPACING (8px grid) ─── */
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3:  12px;
  --sp-4:  16px;
  --sp-5:  24px;
  --sp-6:  32px;
  --sp-7:  48px;
  --sp-8:  64px;

  /* ─── BORDER RADIUS ─── */
  --radius-sm:   4px;
  --radius:      10px;
  --radius-md:   12px;
  --radius-lg:   16px;
  --radius-xl:   20px;
  --radius-full: 999px;

  /* ─── SHADOWS (navy-based, low opacity) ─── */
  --shadow-sm:   0 1px 3px rgba(15, 27, 45, 0.04);
  --shadow:      0 4px 12px -2px rgba(15, 27, 45, 0.08);
  --shadow-md:   0 8px 24px -4px rgba(15, 27, 45, 0.12);
  --shadow-lg:   0 16px 40px -8px rgba(15, 27, 45, 0.16);
  --shadow-gold: 0 8px 24px -6px rgba(201, 169, 97, 0.3);

  /* ─── TRANSITIONS ─── */
  --t-fast:   150ms;
  --t-normal: 250ms;
  --t-slow:   400ms;
  --t-ease:   cubic-bezier(0.4, 0, 0.2, 1);

  /* ─── LAYOUT DIMENSIONS ─── */
  --sidebar-w:           250px;
  --sidebar-w-collapsed: 64px;
  --header-h:            60px;
  --drawer-w:            560px;
  --drawer-w-lg:         720px;
  --drawer-w-xl:         900px;

  /* ─── BREAKPOINTS (reference only — media queries use raw values) ─── */
  /* mobile:  <480px  | tablet: 480-900px | desktop: >900px */
}
    /* ═══════════════════════════════════════════════════════════
   CHUNK 3 — RESET + BASE
   Universal box model, scroll, selection, focus, app shell.
   Rule: Base layer me sirf tokens use honge. No magic values.
   ═══════════════════════════════════════════════════════════ */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-behavior: smooth;
  height: 100%;
}

body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  font-weight: var(--fw-regular);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  color: var(--text-primary);
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  position: relative;
}

/* ─── App shell ─── */
#app {
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  isolation: isolate;
}

/* ─── Boot loader fade-out (used by Chunk 11+) ─── */
#boot-loader {
  transition: opacity var(--t-slow) var(--t-ease),
              visibility var(--t-slow) var(--t-ease);
}
#boot-loader.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* ─── Media reset ─── */
img,
svg,
video,
canvas {
  display: block;
  max-width: 100%;
  height: auto;
}

/* ─── Interactive reset ─── */
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  outline: none;
}

button {
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

a {
  color: inherit;
  text-decoration: none;
}

ul, ol {
  list-style: none;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
  width: 100%;
}

/* ─── Text selection (gold tint) ─── */
::selection {
  background: rgba(201, 169, 97, 0.28);
  color: var(--text-primary);
}
::-moz-selection {
  background: rgba(201, 169, 97, 0.28);
  color: var(--text-primary);
}

/* ─── Focus-visible (accessibility, gold ring) ─── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ─── Custom scrollbar (subtle, gold-tinted) ─── */
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: var(--bg-subtle);
}
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-full);
  border: 2px solid var(--bg-subtle);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--gold-dark);
}

/* Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) var(--bg-subtle);
}

/* ─── Reduced motion (accessibility) ─── */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ─── Screen-reader only utility ─── */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ─── Utility: hide / show ─── */
[hidden] { display: none !important; }
    /* ═══════════════════════════════════════════════════════════
   CHUNK 4 — TYPOGRAPHY
   Playfair = headings | Inter = body & UI.
   Rule: Har text style token-driven. No ad-hoc sizes.
   ═══════════════════════════════════════════════════════════ */

/* ─── Headings (Playfair, tight tracking, tight leading) ─── */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-serif);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
}

h1 { font-size: var(--fs-4xl); font-weight: var(--fw-bold); }
h2 { font-size: var(--fs-3xl); font-weight: var(--fw-bold); }
h3 { font-size: var(--fs-2xl); }
h4 { font-size: var(--fs-xl); }
h5 { font-size: var(--fs-lg); }
h6 { font-size: var(--fs-base); font-weight: var(--fw-semibold); }

/* ─── Body & inline ─── */
p {
  font-size: var(--fs-base);
  line-height: var(--lh-body);
  color: var(--text-secondary);
}

small {
  font-size: var(--fs-xs);
  color: var(--text-muted);
}

strong, b { font-weight: var(--fw-semibold); color: var(--text-primary); }
em, i     { font-style: italic; }

/* ─── Display / Hero ─── */
.display-1 {
  font-family: var(--font-serif);
  font-size: var(--fs-4xl);
  font-weight: var(--fw-bold);
  line-height: var(--lh-heading);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
}

.display-2 {
  font-family: var(--font-serif);
  font-size: var(--fs-3xl);
  font-weight: var(--fw-bold);
  line-height: var(--lh-heading);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
}

/* ─── Section title (used across pages) ─── */
.section-title {
  font-family: var(--font-serif);
  font-size: var(--fs-xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
  margin-bottom: var(--sp-3);
}

/* ─── Label (uppercase, tracked, small) ─── */
.label {
  font-family: var(--font-sans);
  font-size: var(--fs-2xs);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-uppercase);
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ─── Stat number (dashboard cards) ─── */
.stat-value {
  font-family: var(--font-serif);
  font-size: var(--fs-3xl);
  font-weight: var(--fw-bold);
  line-height: var(--lh-stats);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
}

.stat-label {
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  color: var(--text-secondary);
  margin-top: var(--sp-1);
}

/* ─── Size utilities ─── */
.text-4xl  { font-size: var(--fs-4xl); }
.text-3xl  { font-size: var(--fs-3xl); }
.text-2xl  { font-size: var(--fs-2xl); }
.text-xl   { font-size: var(--fs-xl); }
.text-lg   { font-size: var(--fs-lg); }
.text-base { font-size: var(--fs-base); }
.text-sm   { font-size: var(--fs-sm); }
.text-xs   { font-size: var(--fs-xs); }
.text-2xs  { font-size: var(--fs-2xs); }
.text-3xs  { font-size: var(--fs-3xs); }

/* ─── Weight utilities ─── */
.fw-regular  { font-weight: var(--fw-regular); }
.fw-medium   { font-weight: var(--fw-medium); }
.fw-semibold { font-weight: var(--fw-semibold); }
.fw-bold     { font-weight: var(--fw-bold); }

/* ─── Font-family utilities ─── */
.ff-serif { font-family: var(--font-serif); }
.ff-sans  { font-family: var(--font-sans); }

/* ─── Color utilities (text only) ─── */
.text-primary   { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-muted     { color: var(--text-muted); }
.text-inverse   { color: var(--text-inverse); }
.text-gold      { color: var(--gold); }
.text-success   { color: var(--success); }
.text-error     { color: var(--error); }
.text-warning   { color: var(--warning); }
.text-info      { color: var(--info); }

/* ─── Alignment ─── */
.text-left    { text-align: left; }
.text-center  { text-align: center; }
.text-right   { text-align: right; }

/* ─── Case ─── */
.uppercase { text-transform: uppercase; letter-spacing: var(--ls-uppercase); }
.capitalize { text-transform: capitalize; }
.lowercase { text-transform: lowercase; }

/* ─── Truncation ─── */
.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.line-clamp-2 {
  display: -webkit-box;
  display: box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  box-orient: vertical;
  overflow: hidden;
}

.line-clamp-3 {
  display: -webkit-box;
  display: box;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  -webkit-box-orient: vertical;
  box-orient: vertical;
  overflow: hidden;
}
    /* ═══════════════════════════════════════════════════════════
   CHUNK 5 — FORMS + INPUTS
   Text, email, password, number, select, textarea, checkbox,
   radio, switch, label, helper, error. Gold focus ring.
   Rule: Har field same height + radius + padding. No exceptions.
   ═══════════════════════════════════════════════════════════ */

/* ─── Field wrapper (label + control + helper) ─── */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin-bottom: var(--sp-4);
}

.field:last-child { margin-bottom: 0; }

/* ─── Label ─── */
.field-label {
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  color: var(--text-secondary);
  letter-spacing: var(--ls-body);
  display: flex;
  align-items: center;
  gap: var(--sp-1);
}

.field-label .required {
  color: var(--error);
  font-weight: var(--fw-bold);
}

/* ─── Base control (text, email, password, number, etc.) ─── */
.input,
.textarea,
.select {
  width: 100%;
  height: 44px;
  padding: var(--sp-3) var(--sp-4);
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  font-weight: var(--fw-regular);
  line-height: var(--lh-body);
  color: var(--text-primary);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color var(--t-fast) var(--t-ease),
              box-shadow var(--t-fast) var(--t-ease),
              background var(--t-fast) var(--t-ease);
  appearance: none;
  -webkit-appearance: none;
}

.input::placeholder,
.textarea::placeholder {
  color: var(--text-muted);
  opacity: 1;
}

/* ─── Hover ─── */
.input:hover:not(:disabled):not(:focus),
.textarea:hover:not(:disabled):not(:focus),
.select:hover:not(:disabled):not(:focus) {
  border-color: var(--border-strong);
}

/* ─── Focus (gold border + soft glow) ─── */
.input:focus,
.textarea:focus,
.select:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.15);
  background: var(--white);
}

/* ─── Disabled ─── */
.input:disabled,
.textarea:disabled,
.select:disabled {
  background: var(--bg-subtle);
  color: var(--text-muted);
  cursor: not-allowed;
  border-color: var(--border-light);
}

/* ─── Error state ─── */
.input.is-error,
.textarea.is-error,
.select.is-error {
  border-color: var(--error);
}

.input.is-error:focus,
.textarea.is-error:focus,
.select.is-error:focus {
  border-color: var(--error);
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
}

/* ─── Success state (used sparingly) ─── */
.input.is-success,
.textarea.is-success,
.select.is-success {
  border-color: var(--success);
}

/* ─── Textarea ─── */
.textarea {
  height: auto;
  min-height: 96px;
  padding: var(--sp-3) var(--sp-4);
  resize: vertical;
  line-height: var(--lh-body);
}

/* ─── Select (custom gold chevron) ─── */
.select {
  padding-right: var(--sp-8);
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235A6478' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right var(--sp-3) center;
  background-size: 16px;
  cursor: pointer;
}

.select:focus {
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23C9A961' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
}

.select option {
  padding: var(--sp-2);
  color: var(--text-primary);
  background: var(--white);
}

/* ─── Input with leading icon ─── */
.input-group {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}

.input-group .input {
  padding-left: 42px;
}

.input-group .input-icon {
  position: absolute;
  left: var(--sp-3);
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--text-muted);
  pointer-events: none;
  transition: color var(--t-fast) var(--t-ease);
}

.input-group .input:focus ~ .input-icon {
  color: var(--gold);
}

/* ─── Password toggle button ─── */
.input-group .input-toggle {
  position: absolute;
  right: var(--sp-2);
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  transition: color var(--t-fast) var(--t-ease),
              background var(--t-fast) var(--t-ease);
}

.input-group .input-toggle:hover {
  color: var(--gold-dark);
  background: var(--bg-subtle);
}

/* ─── Helper + Error text ─── */
.field-helper {
  font-size: var(--fs-2xs);
  font-weight: var(--fw-regular);
  color: var(--text-muted);
  line-height: var(--lh-small);
  margin-top: var(--sp-1);
}

.field-error {
  font-size: var(--fs-2xs);
  font-weight: var(--fw-medium);
  color: var(--error);
  line-height: var(--lh-small);
  margin-top: var(--sp-1);
  display: flex;
  align-items: center;
  gap: var(--sp-1);
}

/* ─── Checkbox ─── */
.checkbox {
  display: inline-flex;
  align-items: flex-start;
  gap: var(--sp-2);
  cursor: pointer;
  user-select: none;
  font-size: var(--fs-sm);
  color: var(--text-primary);
  line-height: var(--lh-small);
}

.checkbox input[type="checkbox"] {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  margin-top: 2px;
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--white);
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  transition: background var(--t-fast) var(--t-ease),
              border-color var(--t-fast) var(--t-ease);
  position: relative;
}

.checkbox input[type="checkbox"]:hover {
  border-color: var(--gold);
}

.checkbox input[type="checkbox"]:checked {
  background: var(--gold);
  border-color: var(--gold);
}

.checkbox input[type="checkbox"]:checked::after {
  content: "";
  position: absolute;
  left: 5px;
  top: 1px;
  width: 5px;
  height: 10px;
  border: solid var(--navy);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.checkbox input[type="checkbox"]:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.15);
}

/* ─── Radio ─── */
.radio {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  cursor: pointer;
  user-select: none;
  font-size: var(--fs-sm);
  color: var(--text-primary);
}

.radio input[type="radio"] {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius-full);
  background: var(--white);
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  transition: border-color var(--t-fast) var(--t-ease);
  position: relative;
}

.radio input[type="radio"]:hover { border-color: var(--gold); }

.radio input[type="radio"]:checked {
  border-color: var(--gold);
  border-width: 5px;
}

.radio input[type="radio"]:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.15);
}

/* ─── Switch (iOS-style toggle) ─── */
.switch {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  cursor: pointer;
  user-select: none;
  font-size: var(--fs-sm);
  color: var(--text-primary);
}

.switch input[type="checkbox"] {
  position: relative;
  width: 40px;
  height: 22px;
  border-radius: var(--radius-full);
  background: var(--border-strong);
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  transition: background var(--t-normal) var(--t-ease);
  flex-shrink: 0;
}

.switch input[type="checkbox"]::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: var(--radius-full);
  background: var(--white);
  box-shadow: var(--shadow-sm);
  transition: transform var(--t-normal) var(--t-ease);
}

.switch input[type="checkbox"]:checked {
  background: var(--gold);
}

.switch input[type="checkbox"]:checked::after {
  transform: translateX(18px);
}

.switch input[type="checkbox"]:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.15);
}

/* ─── Field row (side-by-side, responsive) ─── */
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-4);
}

@media (max-width: 480px) {
  .field-row { grid-template-columns: 1fr; }
}

/* ─── Fieldset / Form group title ─── */
.form-group-title {
  font-family: var(--font-sans);
  font-size: var(--fs-2xs);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-uppercase);
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: var(--sp-3);
  padding-bottom: var(--sp-2);
  border-bottom: 1px solid var(--border-light);
}
    /* ═══════════════════════════════════════════════════════════
   CHUNK 6 — BUTTONS
   Primary (gold) / Secondary (navy) / Ghost / Text / Danger /
   Success / Icon. Sizes: sm 32h / md 40h / lg 48h.
   Rule: 10px radius, Inter 13px 600, 150ms transitions.
   ═══════════════════════════════════════════════════════════ */

/* ─── Base ─── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  height: 40px;
  padding: 0 var(--sp-4);
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  font-weight: var(--fw-semibold);
  line-height: 1;
  letter-spacing: var(--ls-body);
  border-radius: var(--radius);
  border: 1px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  text-decoration: none;
  transition: transform var(--t-fast) var(--t-ease),
              background var(--t-fast) var(--t-ease),
              border-color var(--t-fast) var(--t-ease),
              color var(--t-fast) var(--t-ease),
              box-shadow var(--t-fast) var(--t-ease);
  position: relative;
  overflow: hidden;
}

.btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.35);
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.55;
  transform: none !important;
  box-shadow: none !important;
}

.btn .btn-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* ─── Sizes ─── */
.btn-sm {
  height: 32px;
  padding: 0 var(--sp-3);
  font-size: var(--fs-xs);
}
.btn-sm .btn-icon { width: 14px; height: 14px; }

.btn-lg {
  height: 48px;
  padding: 0 var(--sp-5);
  font-size: var(--fs-base);
}
.btn-lg .btn-icon { width: 18px; height: 18px; }

/* ─── Full width ─── */
.btn-block {
  width: 100%;
}

/* ─── Primary (gold gradient, navy text, gold shadow) ─── */
.btn-primary {
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
  color: var(--navy);
  border-color: transparent;
  box-shadow: var(--shadow-gold);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 10px 28px -6px rgba(201, 169, 97, 0.45);
}

.btn-primary:active:not(:disabled) {
  transform: translateY(0);
  box-shadow: var(--shadow-gold);
}

/* ─── Secondary (navy solid) ─── */
.btn-secondary {
  background: var(--navy);
  color: var(--text-inverse);
  border-color: var(--navy);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--navy-light);
  border-color: var(--navy-light);
}

.btn-secondary:active:not(:disabled) {
  background: var(--navy-dark);
  border-color: var(--navy-dark);
}

/* ─── Ghost (outline, transparent) ─── */
.btn-ghost {
  background: transparent;
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.btn-ghost:hover:not(:disabled) {
  background: var(--bg-subtle);
  border-color: var(--gold);
  color: var(--gold-dark);
}

.btn-ghost:active:not(:disabled) {
  background: var(--bg);
}

/* ─── Text (no border, gold text) ─── */
.btn-text {
  background: transparent;
  color: var(--gold-dark);
  border-color: transparent;
  padding: 0 var(--sp-2);
  height: auto;
}

.btn-text:hover:not(:disabled) {
  color: var(--gold);
  background: rgba(201, 169, 97, 0.08);
}

/* ─── Danger ─── */
.btn-danger {
  background: var(--error);
  color: var(--text-inverse);
  border-color: var(--error);
}

.btn-danger:hover:not(:disabled) {
  background: #DC2626;
  border-color: #DC2626;
  transform: translateY(-1px);
  box-shadow: 0 8px 20px -6px rgba(239, 68, 68, 0.4);
}

/* ─── Success ─── */
.btn-success {
  background: var(--success);
  color: var(--text-inverse);
  border-color: var(--success);
}

.btn-success:hover:not(:disabled) {
  background: #059669;
  border-color: #059669;
  transform: translateY(-1px);
  box-shadow: 0 8px 20px -6px rgba(16, 185, 129, 0.4);
}

/* ─── Icon-only button (38x38) ─── */
.btn-icon-only {
  width: 38px;
  height: 38px;
  padding: 0;
  border-radius: var(--radius);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  transition: all var(--t-fast) var(--t-ease);
}

.btn-icon-only:hover:not(:disabled) {
  color: var(--gold-dark);
  border-color: var(--gold);
  background: rgba(201, 169, 97, 0.06);
}

.btn-icon-only:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.35);
}

.btn-icon-only .btn-icon {
  width: 18px;
  height: 18px;
}

.btn-icon-only.btn-icon-sm {
  width: 32px;
  height: 32px;
}
.btn-icon-only.btn-icon-sm .btn-icon { width: 16px; height: 16px; }

.btn-icon-only.btn-icon-lg {
  width: 44px;
  height: 44px;
}

/* ─── Inline feedback state (chunk 56 will trigger) ─── */
.btn.is-loading {
  pointer-events: none;
  opacity: 0.85;
}

.btn.is-loading .btn-icon {
  animation: btn-spin 800ms linear infinite;
}

.btn.is-success {
  background: var(--success) !important;
  color: var(--text-inverse) !important;
  border-color: var(--success) !important;
  transform: none !important;
}

@keyframes btn-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* ─── Button group (joined) ─── */
.btn-group {
  display: inline-flex;
  align-items: stretch;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--white);
}

.btn-group > .btn {
  border-radius: 0;
  border: none;
  border-right: 1px solid var(--border-light);
  box-shadow: none;
  transform: none;
  background: transparent;
  color: var(--text-secondary);
  height: 36px;
}

.btn-group > .btn:last-child { border-right: none; }

.btn-group > .btn:hover:not(:disabled) {
  background: var(--bg-subtle);
  color: var(--gold-dark);
  transform: none;
}

.btn-group > .btn.is-active {
  background: var(--gold);
  color: var(--navy);
  font-weight: var(--fw-semibold);
}

/* ─── Responsive: touch targets on mobile ─── */
@media (max-width: 480px) {
  .btn { min-height: 40px; }
  .btn-sm { min-height: 36px; }
  .btn-icon-only { width: 40px; height: 40px; }
}
    /* ═══════════════════════════════════════════════════════════
   CHUNK 7 — CARDS + BADGES + CHIPS
   Cards: white, 16px radius, subtle border, optional hover lift.
   Badges: full radius pills, 6 variants.
   Chips: filter pills, default + active states.
   ═══════════════════════════════════════════════════════════ */

/* ══════════════ CARDS ══════════════ */

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-5);
  transition: border-color var(--t-normal) var(--t-ease),
              box-shadow var(--t-normal) var(--t-ease),
              transform var(--t-normal) var(--t-ease);
}

/* ─── Clickable card (hover lift + gold border) ─── */
.card-clickable {
  cursor: pointer;
}

.card-clickable:hover {
  border-color: var(--gold);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.card-clickable:active {
  transform: translateY(-1px);
}

/* ─── Flat card (no hover) ─── */
.card-flat {
  cursor: default;
}

/* ─── Stat card (dashboard — gold radial glow top-right) ─── */
.card-stat {
  position: relative;
  padding: var(--sp-4);
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: border-color var(--t-normal) var(--t-ease),
              box-shadow var(--t-normal) var(--t-ease),
              transform var(--t-normal) var(--t-ease);
}

.card-stat::before {
  content: "";
  position: absolute;
  top: -40px;
  right: -40px;
  width: 130px;
  height: 130px;
  background: radial-gradient(circle,
    rgba(201, 169, 97, 0.22) 0%,
    rgba(201, 169, 97, 0.05) 45%,
    transparent 70%);
  pointer-events: none;
}

.card-stat:hover {
  border-color: var(--gold);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.card-stat .stat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-3);
  position: relative;
  z-index: 1;
}

.card-stat .stat-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(201, 169, 97, 0.12);
  color: var(--gold-dark);
}

.card-stat .stat-icon svg {
  width: 18px;
  height: 18px;
}

.card-stat .stat-value {
  position: relative;
  z-index: 1;
}

.card-stat .stat-label {
  position: relative;
  z-index: 1;
}

/* ─── Card header (title + action) ─── */
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--border-light);
}

.card-header .card-title {
  font-family: var(--font-serif);
  font-size: var(--fs-lg);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
}

.card-header .card-subtitle {
  font-size: var(--fs-xs);
  color: var(--text-muted);
  margin-top: 2px;
}

/* ─── Card body / footer ─── */
.card-body {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-2);
  margin-top: var(--sp-4);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--border-light);
}

/* ─── Card density variants ─── */
.card-compact { padding: var(--sp-4); }
.card-airy    { padding: var(--sp-6); }

/* ══════════════ BADGES ══════════════ */

.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  padding: 3px 10px;
  font-family: var(--font-sans);
  font-size: var(--fs-2xs);
  font-weight: var(--fw-semibold);
  line-height: 1.4;
  letter-spacing: var(--ls-body);
  border-radius: var(--radius-full);
  white-space: nowrap;
  border: 1px solid transparent;
}

.badge-success {
  background: var(--success-bg);
  color: var(--success);
  border-color: rgba(16, 185, 129, 0.2);
}

.badge-error {
  background: var(--error-bg);
  color: var(--error);
  border-color: rgba(239, 68, 68, 0.2);
}

.badge-warning {
  background: var(--warning-bg);
  color: var(--warning);
  border-color: rgba(245, 158, 11, 0.2);
}

.badge-info {
  background: var(--info-bg);
  color: var(--info);
  border-color: rgba(59, 130, 246, 0.2);
}

.badge-navy {
  background: var(--navy);
  color: var(--text-inverse);
  border-color: var(--navy);
}

.badge-gold {
  background: rgba(201, 169, 97, 0.15);
  color: var(--gold-dark);
  border-color: rgba(201, 169, 97, 0.3);
}

.badge-neutral {
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border-color: var(--border);
}

/* ─── Critical badge with pulsing dot ─── */
.badge-critical {
  background: var(--error-bg);
  color: var(--error);
  border-color: rgba(239, 68, 68, 0.25);
  padding-left: 8px;
}

.badge-critical::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: var(--radius-full);
  background: var(--error);
  animation: badge-pulse 1.6s var(--t-ease) infinite;
}

@keyframes badge-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.5; transform: scale(0.85); }
}

/* ─── Badge with leading icon ─── */
.badge .badge-icon {
  width: 11px;
  height: 11px;
  flex-shrink: 0;
}

/* ══════════════ CHIPS ══════════════ */

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  padding: 5px 12px;
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  line-height: 1.4;
  border-radius: var(--radius-full);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  transition: all var(--t-fast) var(--t-ease);
  white-space: nowrap;
}

.chip:hover:not(.is-active):not(:disabled) {
  background: var(--white);
  border-color: var(--border-strong);
  color: var(--text-primary);
}

.chip.is-active {
  background: rgba(201, 169, 97, 0.15);
  border-color: var(--gold);
  color: var(--gold-dark);
}

.chip:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.25);
}

.chip:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ─── Chip with count ─── */
.chip .chip-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  font-size: var(--fs-3xs);
  font-weight: var(--fw-bold);
  border-radius: var(--radius-full);
  background: var(--border-light);
  color: var(--text-secondary);
}

.chip.is-active .chip-count {
  background: var(--gold);
  color: var(--navy);
}

/* ─── Chip with removable ✕ ─── */
.chip .chip-remove {
  width: 14px;
  height: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-full);
  color: currentColor;
  opacity: 0.6;
  transition: opacity var(--t-fast) var(--t-ease);
}

.chip .chip-remove:hover { opacity: 1; }

/* ─── Chip row (wrap container) ─── */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
}

/* ─── Responsive: cards tighten on mobile ─── */
@media (max-width: 480px) {
  .card { padding: var(--sp-4); border-radius: var(--radius-md); }
  .card-airy { padding: var(--sp-5); }
  .card-stat { padding: var(--sp-3); }
  }
    /* ═══════════════════════════════════════════════════════════
   CHUNK 8 — LAYOUT (Sidebar / Header / Grid / Page)
   Desktop: sidebar 250 (collapsed 64) + header 60 + content.
   Mobile: sidebar as overlay drawer + header with hamburger.
   ═══════════════════════════════════════════════════════════ */

/* ══════════════ SHELL GRID ══════════════ */

.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-areas:
    "sidebar header"
    "sidebar main";
  min-height: 100vh;
  min-height: 100dvh;
}

.app-shell.is-collapsed {
  grid-template-columns: var(--sidebar-w-collapsed) 1fr;
}

/* ══════════════ SIDEBAR ══════════════ */

.sidebar {
  grid-area: sidebar;
  width: var(--sidebar-w);
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  z-index: 40;
  transition: width var(--t-normal) var(--t-ease);
}

.app-shell.is-collapsed .sidebar {
  width: var(--sidebar-w-collapsed);
}

/* ─── Sidebar brand ─── */
.sidebar-brand {
  height: var(--header-h);
  padding: 0 var(--sp-4);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}

.sidebar-brand .brand-mark {
  width: 32px;
  height: 32px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
  color: var(--navy);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-weight: var(--fw-bold);
  font-size: var(--fs-base);
  flex-shrink: 0;
}

.sidebar-brand .brand-text {
  font-family: var(--font-serif);
  font-size: var(--fs-base);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  transition: opacity var(--t-fast) var(--t-ease);
}

.app-shell.is-collapsed .sidebar-brand {
  justify-content: center;
  padding: 0;
}

.app-shell.is-collapsed .brand-text {
  opacity: 0;
  width: 0;
  pointer-events: none;
}

/* ─── Sidebar nav (scrollable) ─── */
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--sp-3) var(--sp-2);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

/* ─── Section label ─── */
.nav-section {
  font-family: var(--font-sans);
  font-size: var(--fs-3xs);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-uppercase);
  text-transform: uppercase;
  color: var(--text-muted);
  padding: var(--sp-3) var(--sp-3) var(--sp-1);
  white-space: nowrap;
  overflow: hidden;
}

.app-shell.is-collapsed .nav-section {
  opacity: 0;
  height: 0;
  padding: 0;
}

/* ─── Nav item ─── */
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 9px 12px;
  border-radius: var(--radius);
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  color: var(--text-secondary);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  position: relative;
  transition: background var(--t-fast) var(--t-ease),
              color var(--t-fast) var(--t-ease);
  border-left: 3px solid transparent;
}

.nav-item .nav-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  color: currentColor;
}

.nav-item .nav-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-item .nav-badge {
  font-size: var(--fs-3xs);
  font-weight: var(--fw-bold);
  padding: 2px 6px;
  border-radius: var(--radius-full);
  background: var(--error);
  color: var(--text-inverse);
  line-height: 1;
  flex-shrink: 0;
}

.nav-item:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.nav-item.is-active {
  background: linear-gradient(90deg,
    rgba(201, 169, 97, 0.14) 0%,
    rgba(201, 169, 97, 0.04) 100%);
  color: var(--gold-dark);
  border-left-color: var(--gold);
  font-weight: var(--fw-semibold);
}

.app-shell.is-collapsed .nav-item {
  justify-content: center;
  padding: 9px;
  border-left: none;
  border-left: 3px solid transparent;
}

.app-shell.is-collapsed .nav-label,
.app-shell.is-collapsed .nav-badge {
  display: none;
}

/* ─── Sidebar footer (user chip) ─── */
.sidebar-footer {
  padding: var(--sp-3);
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
}

/* ══════════════ HEADER ══════════════ */

.app-header {
  grid-area: header;
  height: var(--header-h);
  background: var(--navy);
  color: var(--text-inverse);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0 var(--sp-4);
  position: sticky;
  top: 0;
  z-index: 30;
  box-shadow: 0 1px 3px rgba(15, 27, 45, 0.15);
}

.header-hamburger {
  display: none;
  width: 38px;
  height: 38px;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  color: var(--gold-light);
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: all var(--t-fast) var(--t-ease);
  flex-shrink: 0;
}

.header-hamburger:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.35);
}

.header-title {
  font-family: var(--font-serif);
  font-size: var(--fs-lg);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-heading);
  color: var(--text-inverse);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-spacer { flex: 1; }

.header-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

/* ─── Header icon button ─── */
.header-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-light);
  border: 1px solid rgba(255, 255, 255, 0.2);
  position: relative;
  transition: all var(--t-fast) var(--t-ease);
  flex-shrink: 0;
}

.header-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.35);
  color: var(--gold);
}

.header-btn .header-icon {
  width: 18px;
  height: 18px;
}

.header-btn .dot-badge {
  position: absolute;
  top: -2px;
  right: -2px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: var(--radius-full);
  background: var(--error);
  color: var(--text-inverse);
  font-size: var(--fs-3xs);
  font-weight: var(--fw-bold);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--navy);
  line-height: 1;
}

/* ══════════════ MAIN CONTENT ══════════════ */

.app-main {
  grid-area: main;
  padding: var(--sp-5);
  min-width: 0;
  overflow-x: hidden;
}

/* ─── Page wrapper ─── */
.page {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}

/* ─── Page header (title + actions) ─── */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-4);
  flex-wrap: wrap;
}

.page-header .page-title-group {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  min-width: 0;
}

.page-header .page-title {
  font-family: var(--font-serif);
  font-size: var(--fs-3xl);
  font-weight: var(--fw-bold);
  line-height: var(--lh-heading);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
}

.page-header .page-subtitle {
  font-size: var(--fs-sm);
  color: var(--text-muted);
  line-height: var(--lh-small);
}

.page-header .page-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
}

/* ─── Sections stack ─── */
.section {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

/* ══════════════ GRIDS ══════════════ */

.grid {
  display: grid;
  gap: var(--sp-4);
}

/* Dashboard cards grid — 4x2 desktop, 2x4 mobile */
.grid-stats {
  grid-template-columns: repeat(4, 1fr);
}

.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }

.grid-auto {
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}

/* ══════════════ MOBILE BACKDROP ══════════════ */

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 27, 45, 0.5);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 39;
  opacity: 0;
  transition: opacity var(--t-normal) var(--t-ease);
}

.sidebar-backdrop.is-open {
  display: block;
  opacity: 1;
}

/* ══════════════ RESPONSIVE ══════════════ */

/* Tablet */
@media (max-width: 900px) {
  .grid-stats { grid-template-columns: repeat(2, 1fr); }
  .grid-3     { grid-template-columns: repeat(2, 1fr); }
  .app-main   { padding: var(--sp-4); }
}

/* Mobile */
@media (max-width: 480px) {
  .app-shell {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "main";
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    height: 100vh;
    height: 100dvh;
    width: 250px;
    transform: translateX(-100%);
    transition: transform var(--t-normal) var(--t-ease);
    box-shadow: var(--shadow-lg);
    z-index: 45;
  }

  .sidebar.is-open {
    transform: translateX(0);
  }

  .header-hamburger { display: inline-flex; }

  .grid-stats { grid-template-columns: repeat(2, 1fr); }
  .grid-2     { grid-template-columns: 1fr; }
  .grid-3     { grid-template-columns: 1fr; }
  .grid-auto  { grid-template-columns: 1fr; }

  .app-main   { padding: var(--sp-3); }
  .page       { gap: var(--sp-4); }

  .page-header .page-title { font-size: var(--fs-2xl); }

  .header-btn,
  .header-hamburger { width: 36px; height: 36px; }

  .header-title { font-size: var(--fs-base); }
  }
    /* ═══════════════════════════════════════════════════════════
   CHUNK 9 — MODAL + DRAWER + TOAST + SKELETON
   Modal: centered, radius 16, blur backdrop, slideUp.
   Drawer: right slide, 560/720/900 width, slideIn.
   Toast: top-right, navy bg, left accent bar.
   Skeleton: shimmer 1.6s.
   ═══════════════════════════════════════════════════════════ */

/* ══════════════ OVERLAY (shared) ══════════════ */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 27, 45, 0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-4);
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--t-normal) var(--t-ease),
              visibility var(--t-normal) var(--t-ease);
}

.overlay.is-open {
  opacity: 1;
  visibility: visible;
}

/* ══════════════ MODAL ══════════════ */

.modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 520px;
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
  transform: translateY(16px) scale(0.98);
  opacity: 0;
  transition: transform var(--t-normal) var(--t-ease),
              opacity var(--t-normal) var(--t-ease);
  overflow: hidden;
}

.overlay.is-open .modal {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.modal-sm { max-width: 400px; }
.modal-lg { max-width: 720px; }
.modal-xl { max-width: 960px; }

/* ─── Modal header ─── */
.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-5);
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}

.modal-header .modal-title-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.modal-header .modal-title {
  font-family: var(--font-serif);
  font-size: var(--fs-xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
}

.modal-header .modal-subtitle {
  font-size: var(--fs-xs);
  color: var(--text-muted);
}

/* ─── Modal close (✕) ─── */
.modal-close {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  flex-shrink: 0;
  transition: all var(--t-fast) var(--t-ease);
}

.modal-close:hover {
  color: var(--error);
  background: var(--error-bg);
}

/* ─── Modal body (scrollable) ─── */
.modal-body {
  padding: var(--sp-5);
  overflow-y: auto;
  flex: 1;
}

/* ─── Modal footer ─── */
.modal-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-2);
  padding: var(--sp-4) var(--sp-5);
  background: var(--bg-subtle);
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
}

/* ══════════════ DRAWER ══════════════ */

.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 27, 45, 0.45);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 110;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--t-normal) var(--t-ease),
              visibility var(--t-normal) var(--t-ease);
}

.drawer-overlay.is-open {
  opacity: 1;
  visibility: visible;
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: var(--drawer-w);
  max-width: 100vw;
  background: var(--white);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform var(--t-normal) var(--t-ease);
  z-index: 111;
}

.drawer-overlay.is-open .drawer {
  transform: translateX(0);
}

.drawer-lg { width: var(--drawer-w-lg); }
.drawer-xl { width: var(--drawer-w-xl); }

/* ─── Drawer header ─── */
.drawer-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-5);
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}

.drawer-header .drawer-title-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}

.drawer-header .drawer-title {
  font-family: var(--font-serif);
  font-size: var(--fs-xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
}

.drawer-header .drawer-subtitle {
  font-size: var(--fs-xs);
  color: var(--text-muted);
}

/* ─── Drawer tabs (scroll-x) ─── */
.drawer-tabs {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  padding: 0 var(--sp-4);
  border-bottom: 1px solid var(--border-light);
  overflow-x: auto;
  overflow-y: hidden;
  flex-shrink: 0;
  scrollbar-width: none;
}

.drawer-tabs::-webkit-scrollbar { display: none; }

.drawer-tab {
  padding: var(--sp-3) var(--sp-3);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--t-fast) var(--t-ease),
              border-color var(--t-fast) var(--t-ease);
}

.drawer-tab:hover { color: var(--text-primary); }

.drawer-tab.is-active {
  color: var(--gold-dark);
  border-bottom-color: var(--gold);
  font-weight: var(--fw-semibold);
}

/* ─── Drawer body ─── */
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-5);
}

/* ─── Drawer footer ─── */
.drawer-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-2);
  padding: var(--sp-4) var(--sp-5);
  background: var(--bg-subtle);
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
}

/* ══════════════ TOAST ══════════════ */

.toast-container {
  position: fixed;
  top: var(--sp-4);
  right: var(--sp-4);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  pointer-events: none;
  max-width: 320px;
  width: calc(100% - 32px);
}

.toast {
  pointer-events: auto;
  background: var(--navy);
  color: var(--text-inverse);
  border-radius: var(--radius);
  padding: var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-3);
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
  font-size: var(--fs-sm);
  line-height: var(--lh-small);
  position: relative;
  overflow: hidden;
  transform: translateX(120%);
  transition: transform var(--t-normal) var(--t-ease);
  min-width: 240px;
}

.toast.is-open { transform: translateX(0); }

/* ─── Left accent bar ─── */
.toast::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--gold);
}

.toast.toast-success::before { background: var(--success); }
.toast.toast-error::before   { background: var(--error); }
.toast.toast-warning::before { background: var(--warning); }
.toast.toast-info::before    { background: var(--info); }

.toast .toast-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 2px;
  color: var(--gold-light);
}

.toast.toast-success .toast-icon { color: var(--success); }
.toast.toast-error   .toast-icon { color: var(--error); }
.toast.toast-warning .toast-icon { color: var(--warning); }
.toast.toast-info    .toast-icon { color: var(--info); }

.toast .toast-message {
  flex: 1;
  font-weight: var(--fw-medium);
  color: var(--text-inverse);
}

.toast .toast-close {
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  color: rgba(255, 255, 255, 0.6);
  flex-shrink: 0;
  transition: color var(--t-fast) var(--t-ease),
              background var(--t-fast) var(--t-ease);
}

.toast .toast-close:hover {
  color: var(--white);
  background: rgba(255, 255, 255, 0.1);
}

/* ─── Toast progress bar ─── */
.toast .toast-progress {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  background: var(--gold);
  width: 100%;
  transform-origin: left center;
  animation: toast-progress linear forwards;
}

.toast.toast-success .toast-progress { background: var(--success); }
.toast.toast-error   .toast-progress { background: var(--error); }
.toast.toast-warning .toast-progress { background: var(--warning); }
.toast.toast-info    .toast-progress { background: var(--info); }

@keyframes toast-progress {
  from { transform: scaleX(1); }
  to   { transform: scaleX(0); }
}

/* ══════════════ SKELETON ══════════════ */

.skeleton {
  background: linear-gradient(90deg,
    var(--border-light) 0%,
    var(--bg-subtle) 50%,
    var(--border-light) 100%);
  background-size: 200% 100%;
  border-radius: var(--radius-sm);
  animation: skeleton-shimmer 1.6s ease-in-out infinite;
  display: block;
}

@keyframes skeleton-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ─── Skeleton variants ─── */
.skeleton-text {
  height: 14px;
  border-radius: var(--radius-sm);
  margin-bottom: var(--sp-2);
}

.skeleton-title {
  height: 22px;
  width: 40%;
  border-radius: var(--radius-sm);
  margin-bottom: var(--sp-3);
}

.skeleton-avatar {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-full);
  flex-shrink: 0;
}

.skeleton-block {
  height: 96px;
  border-radius: var(--radius);
}

.skeleton-card {
  height: 140px;
  border-radius: var(--radius-lg);
}

/* ─── Skeleton card layout ─── */
.skeleton-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}

.skeleton-row .skeleton-text { flex: 1; margin-bottom: 0; }

/* ══════════════ RESPONSIVE ══════════════ */

@media (max-width: 900px) {
  .drawer-lg, .drawer-xl { width: var(--drawer-w); }
}

@media (max-width: 480px) {
  /* Modal → bottom-sheet */
  .overlay {
    align-items: flex-end;
    padding: 0;
  }

  .modal {
    max-width: 100%;
    max-height: 92vh;
    max-height: 92dvh;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    transform: translateY(100%);
  }

  .overlay.is-open .modal {
    transform: translateY(0);
  }

  .modal-header { padding: var(--sp-4); }
  .modal-body   { padding: var(--sp-4); }
  .modal-footer { padding: var(--sp-3) var(--sp-4); }

  /* Drawer full width */
  .drawer,
  .drawer-lg,
  .drawer-xl { width: 100vw; }

  .drawer-header { padding: var(--sp-4); }
  .drawer-body   { padding: var(--sp-4); }
  .drawer-footer { padding: var(--sp-3) var(--sp-4); }

  /* Toast */
  .toast-container {
    top: var(--sp-3);
    right: var(--sp-3);
    left: var(--sp-3);
    width: auto;
    max-width: none;
  }

  .toast { min-width: 0; }
  }
    /* ═══════════════════════════════════════════════════════════
   CHUNK 10 — COMPONENTS + TABLES + AVATAR + TABS +
               EMPTY STATES + TOOLTIP + DROPDOWN + FINAL
   Ye CSS foundation ka last chunk hai.
   ═══════════════════════════════════════════════════════════ */

/* ══════════════ TABLES ══════════════ */

.table-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.table-scroll {
  overflow-x: auto;
  width: 100%;
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-sm);
  min-width: 640px;
}

.table thead th {
  background: var(--bg-subtle);
  text-align: left;
  padding: var(--sp-3) var(--sp-4);
  font-size: var(--fs-3xs);
  font-weight: var(--fw-bold);
  letter-spacing: var(--ls-uppercase);
  text-transform: uppercase;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}

.table tbody td {
  padding: var(--sp-3) var(--sp-4);
  color: var(--text-primary);
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
}

.table tbody tr:last-child td { border-bottom: none; }

.table tbody tr {
  transition: background var(--t-fast) var(--t-ease);
}

.table tbody tr:hover { background: var(--bg-subtle); }

.table tbody tr.is-selected {
  background: rgba(201, 169, 97, 0.08);
}

.table .cell-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-1);
}

.table .cell-muted { color: var(--text-muted); font-size: var(--fs-xs); }

/* ══════════════ TABS (underline + pill) ══════════════ */

.tabs {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  border-bottom: 1px solid var(--border-light);
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  padding: var(--sp-3) 0;
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--t-fast) var(--t-ease),
              border-color var(--t-fast) var(--t-ease);
}

.tab:hover { color: var(--text-primary); }

.tab.is-active {
  color: var(--gold-dark);
  border-bottom-color: var(--gold);
  font-weight: var(--fw-semibold);
}

/* ─── Pill tabs ─── */
.tabs-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  padding: var(--sp-1);
  background: var(--bg-subtle);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-full);
}

.tab-pill {
  padding: 6px 14px;
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  color: var(--text-secondary);
  border-radius: var(--radius-full);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--t-fast) var(--t-ease);
}

.tab-pill:hover { color: var(--text-primary); }

.tab-pill.is-active {
  background: var(--white);
  color: var(--gold-dark);
  box-shadow: var(--shadow-sm);
}

/* ══════════════ AVATAR ══════════════ */

.avatar {
  width: 40px;
  height: 40px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
  color: var(--navy);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  font-weight: var(--fw-semibold);
  letter-spacing: 0;
  flex-shrink: 0;
  overflow: hidden;
  position: relative;
  user-select: none;
  text-transform: uppercase;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-sm { width: 32px; height: 32px; font-size: var(--fs-xs); }
.avatar-md { width: 40px; height: 40px; font-size: var(--fs-sm); }
.avatar-lg { width: 56px; height: 56px; font-size: var(--fs-lg); }
.avatar-xl { width: 80px; height: 80px; font-size: var(--fs-2xl); border-radius: var(--radius-lg); }

.avatar-round { border-radius: var(--radius-full); }

/* ─── Avatar with online dot ─── */
.avatar-wrap {
  position: relative;
  display: inline-flex;
  flex-shrink: 0;
}

.avatar-wrap .avatar-status {
  position: absolute;
  bottom: -1px;
  right: -1px;
  width: 11px;
  height: 11px;
  border-radius: var(--radius-full);
  border: 2px solid var(--white);
  background: var(--text-muted);
}

.avatar-wrap .avatar-status.is-online { background: var(--success); }
.avatar-wrap .avatar-status.is-away   { background: var(--warning); }
.avatar-wrap .avatar-status.is-busy   { background: var(--error); }

/* ══════════════ EMPTY STATE ══════════════ */

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--sp-8) var(--sp-4);
  gap: var(--sp-3);
}

.empty-state .empty-icon {
  width: 56px;
  height: 56px;
  color: var(--text-muted);
  opacity: 0.5;
  margin-bottom: var(--sp-2);
}

.empty-state .empty-title {
  font-family: var(--font-serif);
  font-size: var(--fs-lg);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
  letter-spacing: var(--ls-heading);
  color: var(--text-primary);
}

.empty-state .empty-message {
  font-size: var(--fs-sm);
  color: var(--text-muted);
  max-width: 380px;
  line-height: var(--lh-body);
}

.empty-state .empty-action {
  margin-top: var(--sp-2);
}

/* ══════════════ TOOLTIP ══════════════ */

.tooltip {
  position: relative;
}

.tooltip::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  padding: 5px 10px;
  background: var(--navy);
  color: var(--text-inverse);
  font-size: var(--fs-3xs);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-body);
  border-radius: var(--radius-sm);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-fast) var(--t-ease),
              transform var(--t-fast) var(--t-ease);
  z-index: 90;
  max-width: 240px;
}

.tooltip:hover::after {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ══════════════ DROPDOWN MENU ══════════════ */

.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 200px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: var(--sp-1);
  z-index: 95;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-4px);
  transition: opacity var(--t-fast) var(--t-ease),
              visibility var(--t-fast) var(--t-ease),
              transform var(--t-fast) var(--t-ease);
}

.dropdown.is-open .dropdown-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.dropdown-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  color: var(--text-primary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--t-fast) var(--t-ease),
              color var(--t-fast) var(--t-ease);
}

.dropdown-item:hover {
  background: var(--bg-subtle);
  color: var(--gold-dark);
}

.dropdown-item.is-danger { color: var(--error); }
.dropdown-item.is-danger:hover { background: var(--error-bg); color: var(--error); }

.dropdown-item .dropdown-icon {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

.dropdown-separator {
  height: 1px;
  background: var(--border-light);
  margin: var(--sp-1) 0;
}

/* ══════════════ LIST ITEM (row card) ══════════════ */

.list-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: border-color var(--t-fast) var(--t-ease),
              box-shadow var(--t-fast) var(--t-ease);
}

.list-item:hover {
  border-color: var(--gold);
  box-shadow: var(--shadow-sm);
}

.list-item .list-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.list-item .list-title {
  font-size: var(--fs-sm);
  font-weight: var(--fw-semibold);
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.list-item .list-subtitle {
  font-size: var(--fs-xs);
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ══════════════ DIVIDER ══════════════ */

.divider {
  height: 1px;
  background: var(--border-light);
  margin: var(--sp-4) 0;
  border: none;
}

.divider-gold {
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--gold) 50%,
    transparent 100%);
  opacity: 0.35;
  margin: var(--sp-5) 0;
  border: none;
}

/* ══════════════ PAGINATION ══════════════ */

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-1);
  padding: var(--sp-4) 0;
}

.pagination .page-btn {
  min-width: 34px;
  height: 34px;
  padding: 0 var(--sp-2);
  border-radius: var(--radius-sm);
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  background: var(--white);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all var(--t-fast) var(--t-ease);
  cursor: pointer;
}

.pagination .page-btn:hover:not(:disabled) {
  border-color: var(--gold);
  color: var(--gold-dark);
}

.pagination .page-btn.is-active {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--navy);
}

.pagination .page-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ══════════════ PROGRESS BAR ══════════════ */

.progress {
  width: 100%;
  height: 6px;
  background: var(--border-light);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-light), var(--gold));
  border-radius: var(--radius-full);
  transition: width var(--t-slow) var(--t-ease);
}

.progress-bar.is-success { background: var(--success); }
.progress-bar.is-error   { background: var(--error); }
.progress-bar.is-warning { background: var(--warning); }

/* ══════════════ SPINNER ══════════════ */

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: var(--radius-full);
  animation: spinner-spin 700ms linear infinite;
  display: inline-block;
  flex-shrink: 0;
}

.spinner-lg { width: 32px; height: 32px; border-width: 3px; }

@keyframes spinner-spin {
  to { transform: rotate(360deg); }
}

/* ══════════════ FINAL RESPONSIVE PASS ══════════════ */

@media (max-width: 900px) {
  .table { min-width: 560px; }
}

@media (max-width: 480px) {
  .table-wrap { border-radius: var(--radius); }
  .table thead th,
  .table tbody td {
    padding: var(--sp-2) var(--sp-3);
  }

  .empty-state { padding: var(--sp-6) var(--sp-3); }
  .empty-state .empty-icon { width: 48px; height: 48px; }

  .dropdown-menu {
    min-width: 180px;
  }

  .pagination .page-btn {
    min-width: 32px;
    height: 32px;
  }
}

/* ══════════════ PRINT ══════════════ */

@media print {
  .sidebar,
  .app-header,
  .toast-container,
  .drawer-overlay,
  .overlay,
  .no-print { display: none !important; }

  .app-main { padding: 0; }
  body { background: var(--white); }

  .card,
  .table-wrap {
    box-shadow: none !important;
    border-color: var(--border-strong) !important;
  }
}
