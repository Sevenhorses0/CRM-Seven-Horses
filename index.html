    }
  ];

  function featureRow(icon, title, sub) {
    return `
      <div style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--bg-subtle);border-radius:var(--radius);">
        <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--gold-light),var(--gold));display:flex;align-items:center;justify-content:center;color:var(--navy);flex-shrink:0;">
          ${UIKIT.icon(icon, 14)}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;color:var(--text-primary);">${Utils.escapeHtml(title)}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${Utils.escapeHtml(sub)}</div>
        </div>
      </div>`;
  }

  function tipRow(icon, title, sub) {
    return `
      <div style="display:flex;gap:10px;align-items:center;padding:8px 10px;">
        <span style="color:var(--gold-dark);">${UIKIT.icon(icon.toLowerCase(), 16)}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;color:var(--text-primary);">${Utils.escapeHtml(title)}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:1px;">${Utils.escapeHtml(sub)}</div>
        </div>
      </div>`;
  }

  // ─────────────── RENDER ───────────────
  function renderStep() {
    const s = STEPS[_step];
    const total = STEPS.length;
    const isFirst = _step === 0;
    const isLast = _step === total - 1;

    const dots = STEPS.map((_, i) => `
      <button type="button" class="ob-dot" data-dot="${i}" aria-label="Step ${i + 1}" style="width:${i === _step ? '24px' : '8px'};height:8px;border-radius:4px;border:none;cursor:pointer;background:${i === _step ? 'var(--gold)' : i < _step ? 'var(--gold-dark)' : 'var(--border-strong)'};transition:all .25s;"></button>
    `).join('');

    return `
      <div class="modal" style="max-width:520px;">
        <div class="modal-header" style="border-bottom:none;padding-bottom:0;">
          <div class="modal-title-group">
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">
              <span style="font-size:10px;font-weight:700;letter-spacing:0.08em;color:var(--text-muted);text-transform:uppercase;">
                Step ${_step + 1} of ${total}
              </span>
            </div>
          </div>
          <button class="modal-close" data-action="skip" title="Skip tour">${UIKIT.icon('x', 16)}</button>
        </div>
        <div class="modal-body" style="padding-top:12px;">
          <div style="text-align:center;margin-bottom:16px;">
            <div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--gold-light),var(--gold));margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--navy);box-shadow:var(--shadow-gold);">
              ${UIKIT.icon(s.icon, 26)}
            </div>
            <div style="font-family:var(--font-serif);font-size:var(--fs-2xl);font-weight:600;letter-spacing:-0.02em;">${Utils.escapeHtml(s.title)}</div>
            <div class="text-muted" style="font-size:13px;margin-top:4px;">${Utils.escapeHtml(s.subtitle)}</div>
          </div>
          <div>${s.body}</div>
        </div>
        <div class="modal-footer" style="justify-content:space-between;">
          <div style="display:flex;gap:6px;align-items:center;">${dots}</div>
          <div style="display:flex;gap:8px;">
            ${!isFirst ? UIKIT.button({ label: 'Back', variant: 'ghost', size: 'sm', data: 'back' }) : ''}
            ${isLast
              ? UIKIT.button({ label: 'Get Started', variant: 'primary', icon: 'rocket', data: 'finish' })
              : UIKIT.button({ label: 'Next', variant: 'primary', icon: 'arrow-right', data: 'next' })}
          </div>
        </div>
      </div>`;
  }

    // ═══════════════════════════════════════════════════════════
  //  OPEN / CLOSE / EVENTS
  // ═══════════════════════════════════════════════════════════

  function open(onDone) {
    if (_overlay) return; // already open
    _onDone = typeof onDone === 'function' ? onDone : null;
    _step = 0;

    _overlay = document.createElement('div');
    _overlay.className = 'overlay';
    _overlay.id = 'onboarding-overlay';
    _overlay.innerHTML = renderStep();
    document.body.appendChild(_overlay);
    if (typeof lucide !== 'undefined' && lucide.createIcons) {
      try { lucide.createIcons(); } catch (_) {}
    }
    requestAnimationFrame(() => _overlay.classList.add('is-open'));
    bindEvents();
  }

  function rerender() {
    if (!_overlay) return;
    _overlay.innerHTML = renderStep();
    if (typeof lucide !== 'undefined' && lucide.createIcons) {
      try { lucide.createIcons(); } catch (_) {}
    }
    bindEvents();
  }

  function close() {
    if (!_overlay) return;
    _overlay.classList.remove('is-open');
    const el = _overlay;
    _overlay = null;
    document.removeEventListener('keydown', onKeyDown);
    setTimeout(() => el.remove(), 250);
    if (_onDone) { const cb = _onDone; _onDone = null; cb(); }
  }

  function next() {
    if (_step < STEPS.length - 1) { _step++; rerender(); }
  }

  function back() {
    if (_step > 0) { _step--; rerender(); }
  }

  function finish() {
    saveCompletion().finally(() => close());
  }

  function onKeyDown(e) {
    if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); if (_step === STEPS.length - 1) finish(); else next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(); }
  }

  function bindEvents() {
    if (!_overlay) return;
    _overlay.querySelectorAll('[data-action="next"]').forEach(b => b.addEventListener('click', next));
    _overlay.querySelectorAll('[data-action="back"]').forEach(b => b.addEventListener('click', back));
    _overlay.querySelectorAll('[data-action="finish"]').forEach(b => b.addEventListener('click', finish));
    _overlay.querySelectorAll('[data-action="skip"]').forEach(b => b.addEventListener('click', finish));
    _overlay.querySelectorAll('.ob-dot').forEach(d => {
      d.addEventListener('click', () => { _step = Number(d.dataset.dot) || 0; rerender(); });
    });
    // Backdrop click = skip
    _overlay.addEventListener('click', (e) => { if (e.target === _overlay) finish(); });
    // Keyboard nav
    document.removeEventListener('keydown', onKeyDown);
    document.addEventListener('keydown', onKeyDown);
  }

  // ─────────────── SAVE COMPLETION ───────────────
  async function saveCompletion() {
    const uid = STATE.user?.uid;
    if (!uid) return;
    try {
      await DB.update(`${CONST.COLLECTIONS.USERS}/${uid}`, {
        onboardingDone: true,
        onboardingDoneAt: DB.ts()
      });
      // Update local profile
      if (STATE.profile) STATE.profile.onboardingDone = true;
      // Audit
      try {
        await DB.add(CONST.COLLECTIONS.AUDIT, {
          type: 'system',
          action: 'onboarding:completed',
          meta: { step: _step + 1, total: STEPS.length },
          at: DB.ts(),
          by: uid
        });
      } catch (_) {}
    } catch (err) {
      console.warn('[Onboarding.save]', err.message);
    }
  }

  // ─────────────── RESET (for Settings replay) ───────────────
  async function reset() {
    const uid = STATE.user?.uid;
    if (!uid) return;
    try {
      await DB.update(`${CONST.COLLECTIONS.USERS}/${uid}`, {
        onboardingDone: false
      });
      if (STATE.profile) STATE.profile.onboardingDone = false;
      UI.toast({ message: 'Tour reset. Reload to see it.', type: 'success' });
    } catch (err) {
      UI.toast({ message: err.message, type: 'error' });
    }
  }

  // ─────────────── SHOW LOGIC ───────────────
  function shouldShow() {
    if (!STATE.profile) return false;
    // Skip for MASTER? No — MASTER also can see it once
    // Skip for CLIENT (this is CRM-side only)
    const roles = STATE.roles || [];
    if (roles.includes('CLIENT') && roles.length === 1) return false;
    // Skip if already done
    if (STATE.profile.onboardingDone === true) return false;
    return true;
  }

  // Called by auto-trigger after shell mounts
  function maybeShow() {
    if (!shouldShow()) return false;
    // Wait a tick to ensure shell is visible
    setTimeout(() => open(), 600);
    return true;
  }

  // ─────────────── PUBLIC API ───────────────
  return { open, close, reset, maybeShow, shouldShow, STEPS };
})();

  // ═══════════════════════════════════════════════════════════
//  NOTIFICATIONS CENTER — Header bell → drawer
//  Priority colored · Mark read / all read / dismiss
//  Grouped by date. Realtime unread badge on header bell.
// ═══════════════════════════════════════════════════════════

const NotificationsCenter = (function () {
  'use strict';

  let _items = [];
  let _filter = { priority: null, unreadOnly: false };
  let _drawer = null;
  let _unsub = null;

  const PRIORITY_META = {
    critical: { label: 'Critical', color: 'error',   icon: 'alert-octagon' },
    high:     { label: 'High',     color: 'warning', icon: 'alert-triangle' },
    medium:   { label: 'Medium',   color: 'info',    icon: 'info' },
    low:      { label: 'Low',      color: 'muted',   icon: 'bell' }
  };

  // ─────────────── RENDER ───────────────
  function renderDrawerContent() {
    const filtered = applyFilters();
    const unreadTotal = _items.filter(i => !i.read).length;

    return `
      <div style="display:flex;flex-direction:column;height:100%;">
        <div style="padding:12px 16px;border-bottom:1px solid var(--border-light);display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <div>
              <div style="font-size:12px;color:var(--text-muted);">
                ${unreadTotal > 0 ? `<strong style="color:var(--error);">${unreadTotal}</strong> unread` : 'All caught up'}
              </div>
            </div>
            <div style="display:flex;gap:6px;">
              ${unreadTotal > 0 ? UIKIT.button({ label: 'Mark All Read', variant: 'ghost', size: 'sm', icon: 'check-check', data: 'notif-mark-all' }) : ''}
              ${_items.length ? UIKIT.button({ label: 'Clear All', variant: 'ghost', size: 'sm', icon: 'trash-2', data: 'notif-clear-all' }) : ''}
            </div>
          </div>
          <div class="chip-row" id="notif-priority-chips">${renderPriorityChips()}</div>
        </div>

        <div id="notif-list" style="flex:1;overflow-y:auto;">
          ${renderList(filtered)}
        </div>
      </div>`;
  }

  function renderPriorityChips() {
    const priorities = ['ALL','critical','high','medium','low'];
    return priorities.map(p => {
      const active = (p === 'ALL' && !_filter.priority) || _filter.priority === p;
      const count = p === 'ALL' ? _items.length : _items.filter(i => i.priority === p).length;
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-priority="${p === 'ALL' ? '' : p}">
        ${p === 'ALL' ? 'All' : (PRIORITY_META[p]?.label || p)}
        <span class="chip-count">${count}</span>
      </button>`;
    }).join('');
  }

  function renderList(items) {
    if (!items.length) {
      return UIKIT.emptyState({
        icon: 'bell-off',
        title: _filter.priority ? 'Nothing here' : 'No notifications',
        message: _filter.priority ? 'Try a different filter.' : 'You will see updates here as they happen.'
      });
    }
    // Group by date
    const groups = new Map();
    for (const n of items) {
      const at = n.createdAt?.toDate ? n.createdAt.toDate() : new Date(n.createdAt || Date.now());
      const key = at.toISOString().slice(0, 10);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push({ n, at });
    }

    let html = '';
    for (const [day, entries] of groups) {
      html += `
        <div style="padding:10px 16px 4px;">
          <div class="text-muted" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;">${Utils.formatDate(day)}</div>
        </div>
        ${entries.map(e => notifRow(e.n, e.at)).join('')}`;
    }
    return html;
  }

  function notifRow(n, at) {
    const pm = PRIORITY_META[n.priority] || PRIORITY_META.low;

  function applyFilters() {
    let rows = _items;

    // ═══════════════════════════════════════════════════════════
  //  OPEN / RENDER / EVENTS
  // ═══════════════════════════════════════════════════════════

  async function open() {
    // Load notifications
    await load();
    _filter = { priority: null, unreadOnly: false };

    _drawer = UI.openDrawer(renderDrawerContent(), {
      title: 'Notifications',
      subtitle: 'Live updates',
      size: 'md'
    });

    // Override drawer-body padding for full-width list
    const body = _drawer.el.querySelector('.drawer-body');
    if (body) body.style.padding = '0';

    bindEvents();
    attachRealtime();
  }

  // ─────────────── LOAD ───────────────
  async function load() {
    const uid = STATE.user?.uid;
    if (!uid) { _items = []; return; }
    try {
      _items = await DB.list(CONST.COLLECTIONS.NOTIFICATIONS, {
        where: [['userId', '==', uid], ['dismissed', '==', false]],
        orderBy: ['createdAt', 'desc'],
        limit: 100
      });
    } catch (err) {
      console.error('[NotifCenter.load]', err);
      _items = [];
    }
  }

  function rerenderList() {
    const list = document.getElementById('notif-list');
    const chips = document.getElementById('notif-priority-chips');
    if (list) { list.innerHTML = renderList(applyFilters()); bindRowEvents(); }
    if (chips) { chips.innerHTML = renderPriorityChips(); bindChipClicks(); }
    // Update header counts
    const headerInfo = _drawer?.el?.querySelector('.drawer-header');
    if (headerInfo) {
      const unread = _items.filter(i => !i.read).length;
      const unreadEl = headerInfo.querySelector('.notif-unread-count');
      if (unreadEl) unreadEl.textContent = unread > 0 ? `${unread} unread` : 'All caught up';
    }
    updateHeaderBadge();
  }

  // ─────────────── EVENTS ───────────────
  function bindEvents() {
    // Mark all read
    document.querySelectorAll('[data-action="notif-mark-all"]').forEach(b => {
      b.addEventListener('click', async (e) => {
        await UI.btnSave(e.currentTarget, async () => {
          await Notifications.markAllRead();
          await load();
          rerenderList();
          UI.toast({ message: 'All marked read', type: 'success', duration: 1000 });
        }, { label: 'Marking…', successLabel: 'Done', revertMs: 800 });
      });
    });

    // Clear all (dismiss each)
    document.querySelectorAll('[data-action="notif-clear-all"]').forEach(b => {
      b.addEventListener('click', async () => {
        const ok = await UI.confirm({
          title: 'Clear all notifications?',
          message: 'This dismisses every notification in the list.',
          danger: true, okText: 'Clear All'
        });
        if (!ok) return;
        await UI.btnSave(b, async () => {
          for (const n of _items) {
            try { await Notifications.dismiss(n.id); } catch (_) {}
          }
          _items = [];
          rerenderList();
          UI.toast({ message: 'Cleared', type: 'success' });
        });
      });
    });

    bindChipClicks();
    bindRowEvents();
  }

  function bindChipClicks() {
    document.querySelectorAll('#notif-priority-chips .chip').forEach(c => {
      c.addEventListener('click', () => {
        _filter.priority = c.dataset.priority || null;
        rerenderList();
      });
    });
  }

  function bindRowEvents() {
    document.querySelectorAll('.notif-row[data-notif-id]').forEach(row => {
      row.addEventListener('click', async (e) => {
        // Ignore clicks on dismiss button
        if (e.target.closest('[data-action="notif-dismiss"]')) return;
        const id = row.dataset.notifId;
        const n = _items.find(x => x.id === id);
        if (!n) return;

        // Mark read
        if (!n.read) {
          try { await Notifications.markRead(id); } catch (_) {}
          n.read = true;
          rerenderList();
        }

        // Navigate if data has route hints
        const data = n.data || {};
        if (data.route && Router.list().includes(data.route)) {
          if (_drawer) _drawer.close();
          Router.navigateTo(data.route, data.params || {});
        } else if (data.taskId) {
          if (_drawer) _drawer.close();
          Router.navigateTo('tasks', { id: data.taskId });
        } else if (data.companyId) {
          if (_drawer) _drawer.close();
          Router.navigateTo('companies', { id: data.companyId });
        } else if (data.candidateId) {
          if (_drawer) _drawer.close();
          Router.navigateTo('candidates', { id: data.candidateId });
        }
      });
    });

    // Dismiss buttons
    document.querySelectorAll('[data-action="notif-dismiss"]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.dataset.notif;
        try {
          await Notifications.dismiss(id);
          _items = _items.filter(x => x.id !== id);
          rerenderList();
        } catch (err) {
          UI.toast({ message: err.message, type: 'error' });
        }
      });
    });
  }

  // ─────────────── REALTIME ───────────────
  function attachRealtime() {
    const uid = STATE.user?.uid;
    if (!uid) return;
    if (_unsub) _unsub();
    _unsub = Notifications.watchForUser(uid, (rows) => {
      _items = rows;
      if (_drawer) rerenderList();
      updateHeaderBadge();
    }, 100);
  }

  function detachRealtime() {
    if (_unsub) { _unsub(); _unsub = null; }
  }

  // ─────────────── HEADER BADGE ───────────────
  function updateHeaderBadge() {
    const unread = _items.filter(i => !i.read).length;
    STATE.unreadNotifications = unread;
    const badge = document.getElementById('notif-badge');
    if (!badge) return;
    if (unread <= 0) { badge.hidden = true; badge.textContent = '0'; }
    else { badge.hidden = false; badge.textContent = unread > 99 ? '99+' : String(unread); }
  }

  // ─────────────── BIND HEADER BELL ───────────────
  function bindHeader() {
    const btn = document.getElementById('btn-notifications');
    if (!btn || btn.dataset._bound) return;
    btn.dataset._bound = '1';
    btn.addEventListener('click', open);
  }

  // ─────────────── UNREAD BADGE INIT (post-mount) ───────────────
  function initBadge() {
    const uid = STATE.user?.uid;
    if (!uid) return;
    // Watch unread count realtime
    Notifications.watchForUser(uid, (rows) => {
      _items = rows;
      updateHeaderBadge();
    }, 100);
  }

  return { open, bindHeader, initBadge, updateHeaderBadge };
})();

      // ─────────────── MUSTACHE-LITE RENDER ───────────────
      // Supports {{key}}, {{a.b.c}} and {{#key}}...{{/key}} (only truthy)
      function render(templateStr, vars) {
        if (!templateStr) return '';
        const v = vars || {};

        // Conditionals first: {{#key}}...{{/key}} (single-level, no nesting)
        let out = String(templateStr).replace(
          /\{\{#\s*([\w.]+)\s*\}\}([\s\S]*?)\{\{\/\s*\1\s*\}\}/g,
          (_, key, inner) => {
            const val = resolve(key, v);
            return (val === undefined || val === null || val === '' || val === false || val === 0)
              ? '' : inner;
          }
        );

        // Simple vars
        out = out.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, key) => {
          const val = resolve(key, v);
          if (val === undefined || val === null) return '';
          return String(val);
        });

        return out;
      }

      function resolve(path, obj) {
        if (!path) return undefined;
        const keys = String(path).split('.');
        let cur = obj;
        for (const k of keys) {
          if (cur == null || typeof cur !== 'object') return undefined;
          cur = cur[k];
        }
        return cur;
      }

      // ─────────────── GET / LIST ───────────────
      async function get(id) {
        if (!id) return null;
        try {
          const doc = await DB.get(`${COL}/${id}`);
          if (doc) return mergeWithDefault(id, doc);
        } catch (_) {}
        return DEFAULTS[id] ? { ...DEFAULTS[id] } : null;
      }

      function mergeWithDefault(id, remote) {
        const def = DEFAULTS[id];
        if (!def) return remote;
        return { ...def, ...remote };
      }

      async function list(opts = {}) {
        let remote = [];
        try {
          remote = await DB.list(COL, { limit: 200 });
        } catch (_) {}
        const remoteMap = new Map(remote.map(t => [t.id, t]));

        // Merge: default ids present unless overridden by remote
        const merged = {};
        for (const [id, def] of Object.entries(DEFAULTS)) {
          merged[id] = remoteMap.has(id) ? mergeWithDefault(id, remoteMap.get(id)) : { ...def };
        }
        // Custom (non-default) templates
        for (const [id, r] of remoteMap) {
          if (!DEFAULTS[id]) merged[id] = r;
        }

        let rows = Object.values(merged);
        if (opts.category) rows = rows.filter(t => t.category === opts.category);
        if (opts.query) {
          const q = opts.query.toLowerCase();
          rows = rows.filter(t =>
            (t.name || '').toLowerCase().includes(q) ||
            (t.subject || '').toLowerCase().includes(q) ||
            (t.id || '').toLowerCase().includes(q)
          );
        }
        return rows.sort((a, b) => (a.category || '').localeCompare(b.category || ''));
      }

      function listCategories() {
        const set = new Set(Object.values(DEFAULTS).map(t => t.category));
        return [...set].sort();
      }

  async function save(id, data) {
    if (!id) throw new Error('Template id required');
    const payload = {
      id,
      category: data.category || 'custom',
      name: data.name || id,
      description: data.description || '',
      subject: data.subject || '',
      body: data.body || '',
      updatedAt: DB.ts(),
      updatedBy: STATE.user?.uid || null
    };
    await DB.set(`${COL}/${id}`, payload, true);
    await logActivity(id, 'template:saved');
    return id;
  }

  async function remove(id) {
    if (!id) throw new Error('Template id required');
    // Cannot delete defaults — only overrides (reset)
    if (DEFAULTS[id]) {
      throw new Error('Default template cannot be deleted. Reset instead.');
    }
    await DB.remove(`${COL}/${id}`);
    await logActivity(id, 'template:deleted');
  }

  async function reset(id) {
    if (!id) throw new Error('Template id required');
    if (!DEFAULTS[id]) throw new Error('Not a default template');
    try { await DB.remove(`${COL}/${id}`); } catch (_) {}
    await logActivity(id, 'template:reset');
    return { ...DEFAULTS[id] };
  }

  async function duplicate(id, newId) {
    const src = await get(id);
    if (!src) throw new Error('Source template not found');
    const nid = newId || (id + '_copy_' + Date.now().toString(36));
    await save(nid, {
      category: src.category,
      name: (src.name || '') + ' (copy)',
      description: src.description,
      subject: src.subject,
      body: src.body
    });
    return nid;
  }

  // ─────────────── VARIABLE EXTRACTION ───────────────
  // Extract {{a.b.c}} tokens from subject + body
  function extractVariables(template) {
    if (!template) return [];
    const text = (template.subject || '') + '\n' + (template.body || '');
    const seen = new Set();
    const re = /\{\{\s*#?\s*([\w.]+)\s*\}\}/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      const key = m[1];
      if (key && !seen.has(key)) seen.add(key);
    }
    return [...seen];
  }

  // ─────────────── PREVIEW ───────────────
  // Returns { subject, body } with placeholders resolved
  function preview(id, vars) {
    const t = DEFAULTS[id] || null;
    // Note: preview uses defaults if remote not passed. Pages call with their own copy.
    if (!t) return { subject: '', body: '' };
    return {
      subject: render(t.subject, vars),
      body: render(t.body, vars)
    };
  }

  // Build a preview from any template object (used by Settings page)
  function renderTemplate(template, vars) {
    if (!template) return { subject: '', body: '' };
    return {
      subject: render(template.subject || '', vars || {}),
      body: render(template.body || '', vars || {})
    };
  }

  // ═══════════════════════════════════════════════════════════
//  WORKER SERVICE — Cloudflare Worker proxy
//  Handles: Brevo emails · Cloudinary uploads · Sheets archive
//  Endpoint: WORKER_URL (+ path)
//  All calls include a client timestamp + optional auth header.
// ═══════════════════════════════════════════════════════════

const Worker = (function () {
  'use strict';

  const BASE = () => {
    try { return Config.get('apiKeys.workerUrl') || WORKER_URL; }
    catch (_) { return WORKER_URL; }
  };

  const TIMEOUT_MS = 15000;

  // ─────────────── CORE FETCH ───────────────
  // fetchJSON(path, { method, body, headers, timeout })
  async function fetchJSON(path, opts = {}) {
    const url = BASE().replace(/\/$/, '') + '/' + String(path).replace(/^\//, '');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), opts.timeout || TIMEOUT_MS);

    const headers = {
      'Content-Type': 'application/json',
      'X-Client': '7h-crm',
      'X-Client-Version': APP.version,
      ...(opts.headers || {})
    };
    // Attach user id if available (worker may audit)
    if (STATE.user?.uid) headers['X-User-Id'] = STATE.user.uid;

    const init = {
      method: opts.method || 'POST',
      headers,
      signal: controller.signal
    };
    if (opts.body !== undefined && opts.method !== 'GET') {
      init.body = JSON.stringify(opts.body);
    }

    try {
      const res = await fetch(url, init);
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch (_) { json = { raw: text }; }
      if (!res.ok) {
        const msg = (json && (json.error || json.message)) || ('HTTP ' + res.status);
        throw new Error('Worker ' + res.status + ': ' + msg);
      }
      return json;
    } catch (err) {
      if (err.name === 'AbortError') throw new Error('Worker request timed out');
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  // ─────────────── HEALTH ───────────────
  async function ping() {
    try {
      const t0 = Date.now();
      const res = await fetchJSON('health', { method: 'GET', timeout: 5000 });
      return { ok: true, ms: Date.now() - t0, res };
    } catch (err) {
      return { ok: false, error: err.message };
    }
  }

  // ═══════════════════════════════════════════════════════════
  //  EMAIL (Brevo)
  //  sendEmail({ to, toName, subject, html, text, templateId, vars, replyTo })
  //  OR sendEmail({ toUserId, template, vars }) → resolves user email
  // ═══════════════════════════════════════════════════════════
  async function sendEmail(opts = {}) {
    if (!opts.to && !opts.toEmail && !opts.toUserId) {
      throw new Error('sendEmail: recipient required');
    }

    let toEmail = opts.to || opts.toEmail || null;
    let toName = opts.toName || null;

    // Resolve from userId if provided
    if (!toEmail && opts.toUserId) {
      try {
        const u = await DB.get(`${CONST.COLLECTIONS.USERS}/${opts.toUserId}`);
        if (u) { toEmail = u.email; toName = u.name || null; }
      } catch (_) {}
    }
    if (!toEmail) throw new Error('Recipient email not found');

    // Template mode
    let subject = opts.subject || '';
    let html = opts.html || '';
    let text = opts.text || '';

    if (opts.template || opts.templateId) {
      const tid = opts.template || opts.templateId;
      try {
        const tpl = await Templates.get(tid);
        if (!tpl) throw new Error('Template not found: ' + tid);
        const rendered = Templates.renderTemplate(tpl, opts.vars || {});
        subject = subject || rendered.subject;
        html = html || rendered.body;
        text = text || rendered.body;
      } catch (err) {
        throw new Error('Template render failed: ' + err.message);
      }
    }

    if (!subject) throw new Error('Email subject required');

    const payload = {
      to: [{ email: toEmail, name: toName || '' }],
      subject,
      html: html || `<pre style="font-family:Inter,sans-serif;">${Utils.escapeHtml(text)}</pre>`,
      text: text || subject,
      replyTo: opts.replyTo || null,
      tags: opts.tags || ['7h-crm']
    };

    try {
      const res = await fetchJSON('email/send', { body: payload });
      await logEmail({ toEmail, subject, ok: true, res, tags: payload.tags });
      return res;
    } catch (err) {
      await logEmail({ toEmail, subject, ok: false, error: err.message, tags: payload.tags });
      throw err;
    }
  }

  // Bulk send — sequential with tiny delay to stay under rate limits
  async function sendBulk(emails, opts = {}) {
    const results = [];
    const delayMs = opts.delayMs ?? 400;
    for (const e of emails) {
      try {
        const r = await sendEmail(e);
        results.push({ ok: true, to: e.to || e.toEmail || e.toUserId, res: r });
      } catch (err) {
        results.push({ ok: false, to: e.to || e.toEmail || e.toUserId, error: err.message });
      }
      if (delayMs > 0) await new Promise(r => setTimeout(r, delayMs));
    }
    return results;
  }

    // ═══════════════════════════════════════════════════════════
  //  CLOUDINARY UPLOAD (unsigned preset via Worker)
  //  uploadFile(file, { folder, tags }) → { url, publicId, bytes }
  // ═══════════════════════════════════════════════════════════
  async function uploadFile(file, opts = {}) {
    if (!file) throw new Error('File required');
    if (file.size > 10 * 1024 * 1024) throw new Error('File too large (max 10 MB)');

    // Read file as base64 (simpler than multipart via worker)
    const base64 = await fileToBase64(file);
    const payload = {
      fileName: file.name || 'upload',
      mimeType: file.type || 'application/octet-stream',
      base64,
      folder: opts.folder || '7h',
      tags: opts.tags || ['7h-crm'],
      publicId: opts.publicId || null
    };

    try {
      const res = await fetchJSON('upload/cloudinary', {
        body: payload,
        timeout: 30000
      });
      return res;
    } catch (err) {
      throw new Error('Upload failed: ' + err.message);
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const s = String(r.result || '');
        const i = s.indexOf(',');
        resolve(i >= 0 ? s.slice(i + 1) : s);
      };
      r.onerror = () => reject(new Error('Failed to read file'));
      r.readAsDataURL(file);
    });
  }

  // Upload multiple — sequential
  async function uploadMany(files, opts = {}) {
    const out = [];
    for (const f of files) {
      try {
        const r = await uploadFile(f, opts);
        out.push({ ok: true, file: f.name, res: r });
      } catch (err) {
        out.push({ ok: false, file: f.name, error: err.message });
      }
    }
    return out;
  }

  // Delete a Cloudinary asset via Worker
  async function deleteUpload(publicId) {
    if (!publicId) throw new Error('publicId required');
    return fetchJSON('upload/delete', { body: { publicId } });

  // ═══════════════════════════════════════════════════════════
  //  GOOGLE SHEETS ARCHIVE

  // ═══════════════════════════════════════════════════════════
//  EMAILJS SERVICE — Auth-only emails
//  Scope: password reset, magic link, welcome (self-signup),
//         email verification, 2FA codes
//  Free tier: 200 emails/month
//  Rule: Non-auth emails go through Worker/Brevo, NOT EmailJS.
// ═══════════════════════════════════════════════════════════

const EmailJS = (function () {
  'use strict';

  const SDK_URL = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js';
  const MONTHLY_LIMIT = 200;
  const LOCAL_USAGE_KEY = '7h.emailjs.usage';
  let _sdkPromise = null;
  let _initialized = false;

  // ─────────────── CONFIG ───────────────
  function cfg() {
    return {
      serviceId:  Config.get('communication.emailjsServiceId', ''),
      templateId: Config.get('communication.emailjsTemplateId', ''),
      publicKey:  Config.get('communication.emailjsPublicKey', '')
    };
  }

  function isConfigured() {
    const c = cfg();
    return !!(c.serviceId && c.templateId && c.publicKey);
  }

  // ─────────────── SDK LOADER (lazy, cached) ───────────────
  function loadSDK() {
    if (_sdkPromise) return _sdkPromise;
    _sdkPromise = new Promise((resolve, reject) => {
      if (typeof window.emailjs !== 'undefined') return resolve(window.emailjs);
      const s = document.createElement('script');
      s.src = SDK_URL;
      s.async = true;
      s.onload = () => {
        if (typeof window.emailjs === 'undefined') return reject(new Error('EmailJS SDK failed to load'));
        resolve(window.emailjs);
      };
      s.onerror = () => reject(new Error('EmailJS SDK network error'));
      document.head.appendChild(s);
    });
    return _sdkPromise;
  }

  async function ensureInit() {
    if (_initialized) return;
    const c = cfg();
    if (!c.publicKey) throw new Error('EmailJS not configured (missing public key)');
    const sdk = await loadSDK();
    try {
      sdk.init({ publicKey: c.publicKey });
      _initialized = true;
    } catch (err) {
      throw new Error('EmailJS init failed: ' + err.message);
    }
  }

  // ─────────────── LOCAL USAGE TRACKING ───────────────
  // Prevents hitting the 200/month limit silently
  function monthKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function getUsage() {
    try {
      const raw = localStorage.getItem(LOCAL_USAGE_KEY);
      const data = raw ? JSON.parse(raw) : {};
      const mk = monthKey();
      if (!data[mk]) data[mk] = 0;
      return { month: mk, count: data[mk] || 0, limit: MONTHLY_LIMIT };
    } catch (_) {
      return { month: monthKey(), count: 0, limit: MONTHLY_LIMIT };
    }
  }

  function bumpUsage() {
    try {
      const raw = localStorage.getItem(LOCAL_USAGE_KEY);
      const data = raw ? JSON.parse(raw) : {};
      const mk = monthKey();
      data[mk] = (data[mk] || 0) + 1;
      // Prune old months (keep last 3)
      const keys = Object.keys(data).sort();
      while (keys.length > 3) { delete data[keys.shift()]; }
      localStorage.setItem(LOCAL_USAGE_KEY, JSON.stringify(data));
    } catch (_) {}
  }

  function quotaRemaining() {
    const u = getUsage();
    return Math.max(0, u.limit - u.count);
  }

  // ═══════════════════════════════════════════════════════════
  //  CORE SEND
  //  send({ to_email, to_name, subject, message, templateParams, templateId })
  // ═══════════════════════════════════════════════════════════
  async function send(opts = {}) {
    if (!opts.to_email) throw new Error('Recipient email required');
    if (!Utils.isEmail(opts.to_email)) throw new Error('Invalid recipient email');

    // Quota guard
    const remaining = quotaRemaining();
    if (remaining <= 0) {
      throw new Error('EmailJS monthly limit reached (200). Try again next month.');
    }

    if (!isConfigured()) {
      // Dev fallback: log instead of crashing
      console.warn('[EmailJS] Not configured. Would have sent:', opts);
      return { simulated: true, to: opts.to_email, template: opts.templateId || cfg().templateId };
    }

    await ensureInit();
    const sdk = window.emailjs;

    const templateId = opts.templateId || cfg().templateId;
    const params = {
      to_email: opts.to_email,
      to_name: opts.to_name || '',
      subject: opts.subject || '',
      message: opts.message || '',
      ...(opts.templateParams || {})
    };

    try {
      const res = await sdk.send(cfg().serviceId, templateId, params);
      bumpUsage();
      await logEmail({
        to: opts.to_email,
        template: templateId,
        ok: true,
        res,
        purpose: opts.purpose || 'auth'
      });
      return res;
    } catch (err) {
      await logEmail({
        to: opts.to_email,
        template: templateId,
        ok: false,
        error: err.message || String(err),
        purpose: opts.purpose || 'auth'
      });
      // Normalize common errors
      const msg = (err && (err.text || err.message)) || 'EmailJS send failed';
      throw new Error(msg);
    }
  }

    // ═══════════════════════════════════════════════════════════
  //  HIGH-LEVEL AUTH HELPERS
  //  Ye Firebase Auth ke native flows ko complement karte hain.
  //  Firebase Auth already sends reset email on its own — hum optional
  //  branding override karte hain via EmailJS (agar configured ho).
  // ═══════════════════════════════════════════════════════════

  // Password reset — branded override (Firebase handles default too)
  async function sendPasswordReset(email, resetLink, opts = {}) {
    const e = Utils.normalizeEmail(email);
    if (!Utils.isEmail(e)) throw new Error('Invalid email');

    // If EmailJS not configured, delegate to Firebase's built-in
    if (!isConfigured()) {
      try {
        await STATE.auth.sendPasswordResetEmail(e);
        UI.toast({ message: 'Reset link sent (Firebase)', type: 'success' });
        return { via: 'firebase' };
      } catch (err) {
        throw err;
      }
    }

    // Branded send via EmailJS
    const vars = {
      'user.name': opts.name || e.split('@')[0],
      'action.link': resetLink || 'https://seven-horses-crm.web.app/reset',
      'action.expiryHours': opts.expiryHours || 1
    };
    let subject = 'Reset your Seven Horses password';
    let message = `Click to reset: ${vars['action.link']}\n\nExpires in ${vars['action.expiryHours']} hour(s).`;
    try {
      const tpl = await Templates.get('password_reset');
      if (tpl) {
        subject = Templates.render(tpl.subject, vars) || subject;
        message = Templates.render(tpl.body, vars) || message;
      }
    } catch (_) {}

    const res = await send({
      to_email: e,
      to_name: opts.name || '',
      subject,
      message,
      purpose: 'password_reset'
    });
    return { via: 'emailjs', res };
  }

  // Magic link onboarding — used by client flow
  async function sendMagicLink(email, name, link, opts = {}) {
    const e = Utils.normalizeEmail(email);
    if (!Utils.isEmail(e)) throw new Error('Invalid email');

    const vars = {
      'client.name': name || e.split('@')[0],
      'action.link': link,
      'action.expiryHours': opts.expiryHours || 24
    };
    let subject = 'Welcome to Seven Horses — Complete your onboarding';
    let message = `Click to begin: ${link}\n\nExpires in ${vars['action.expiryHours']} hour(s).`;
    try {
      const tpl = await Templates.get('magic_link');
      if (tpl) {
        subject = Templates.render(tpl.subject, vars) || subject;
        message = Templates.render(tpl.body, vars) || message;
      }
    } catch (_) {}

    return send({
      to_email: e,
      to_name: name || '',
      subject,
      message,
      purpose: 'magic_link'
    });
  }

  // Email verification — sent to users who need to verify
  async function sendVerification(email, name, verifyLink) {
    const vars = {
      'user.name': name || email.split('@')[0],
      'action.link': verifyLink,
      'action.expiryHours': 24
    };
    return send({
      to_email: email,
      to_name: name || '',
      subject: 'Verify your Seven Horses email',
      message: `Hi ${vars['user.name']},\n\nPlease verify your email by clicking:\n${verifyLink}\n\nThis link expires in 24 hours.`,
      purpose: 'verify_email'
    });
  }

  // 2FA code (future use)
  async function send2FACode(email, name, code) {
    return send({
      to_email: email,
      to_name: name || '',
      subject: 'Your Seven Horses verification code',
      message: `Your 6-digit code is: ${code}\n\nIt expires in 5 minutes.\n\nIf you didn't request this, ignore this email.`,
      purpose: '2fa'
    });
  }

  // Welcome — sent after user self-signup (rare for CRM, mostly for client)
  async function sendWelcome(email, name, loginUrl) {
    const vars = {
      'user.name': name || email.split('@')[0],
      'action.loginUrl': loginUrl || 'https://seven-horses-crm.web.app/login'
    };
    let subject = 'Welcome to Seven Horses';
    let message = `Hi ${vars['user.name']},\n\nYour account is ready.\n\nLogin: ${vars['action.loginUrl']}\n\n— Team Seven Horses`;
    try {
      const tpl = await Templates.get('welcome');
      if (tpl) {
        subject = Templates.render(tpl.subject, vars) || subject;
        message = Templates.render(tpl.body, vars) || message;
      }
    } catch (_) {}
    return send({
      to_email: email,
      to_name: name || '',
      subject,
      message,
      purpose: 'welcome'
    });
  }

  // ═══════════════════════════════════════════════════════════
  //  EMAIL LOGGING (local Firestore)
  // ═══════════════════════════════════════════════════════════
  async function logEmail(entry) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'email',
        channel: 'emailjs',
        to: entry.to,
        template: entry.template || null,
        purpose: entry.purpose || null,
        ok: !!entry.ok,
        error: entry.error || null,
        response: entry.res ? { status: entry.res.status || null } : null,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  // ═══════════════════════════════════════════════════════════
  //  CONFIG TESTER (used by Settings → Communication)
  // ═══════════════════════════════════════════════════════════
  async function testSend(toEmail) {
    const target = Utils.normalizeEmail(toEmail || STATE.profile?.email || '');

      subject: 'Seven Horses — EmailJS Test',
      message: 'If you received this, EmailJS is working correctly.',
      purpose: 'test'
    });
    return res;
  }

  // ═══════════════════════════════════════════════════════════
  //  PUBLIC API
  // ═══════════════════════════════════════════════════════════
  return {

    sendMagicLink,

  };

function mount() {
  ensureCSS();
  const app = document.getElementById('app');
  if (!app) { console.error('[Login] #app not found'); return; }
  app.innerHTML = render();
  bindEvents();
  // Focus identifier
  setTimeout(() => {
    const el = document.getElementById('login-identifier');
    if (el && !_identifier) el.focus();
    else document.getElementById('login-password')?.focus();
  }, 150);
  if (typeof lucide !== 'undefined' && lucide.createIcons) {
    try { lucide.createIcons(); } catch (_) {}
  }
}

function unmount() {
  const root = document.querySelector('.login-root');
  if (root) root.remove();
}

// ─────────────── BIND EVENTS ───────────────
function bindEvents() {
  const form = document.getElementById('login-form');
  const toggle = document.getElementById('login-toggle-pwd');
  const forgot = document.getElementById('login-forgot');
  const submit = document.getElementById('login-submit');

  // Password toggle
  if (toggle) {
    toggle.addEventListener('click', () => {
      const pwd = document.getElementById('login-password');
      if (!pwd) return;
      const isHidden = pwd.type === 'password';
      pwd.type = isHidden ? 'text' : 'password';
      toggle.innerHTML = UIKIT.icon(isHidden ? 'eye-off' : 'eye', 16);
      if (typeof lucide !== 'undefined' && lucide.createIcons) {
        try { lucide.createIcons(); } catch (_) {}
      }
      pwd.focus();
    });
  }

  // Forgot password
  if (forgot) {
    forgot.addEventListener('click', handleForgotPassword);
  }

  // Form submit
  if (form) {
    form.addEventListener('submit', handleSubmit);
  }

  // Enter on identifier → focus password
  const idEl = document.getElementById('login-identifier');
  if (idEl) {
    idEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('login-password')?.focus();
      }
    });
  }
}

// ─────────────── SHOW / HIDE ERROR ───────────────
function showError(msg) {
  const box = document.getElementById('login-error');
  const txt = document.getElementById('login-error-msg');
  if (!box || !txt) return;
  txt.textContent = msg || 'Something went wrong';
  box.style.display = 'flex';
  // Shake animation (subtle)
  box.animate(
    [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' },
     { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }],
    { duration: 220, easing: 'ease-in-out' }
  );
}

function hideError() {
  const box = document.getElementById('login-error');
  if (box) box.style.display = 'none';
}

// ─────────────── SUBMIT HANDLER ───────────────
async function handleSubmit(e) {
  e.preventDefault();
  if (_loading) return;

  const idEl = document.getElementById('login-identifier');
  const pwdEl = document.getElementById('login-password');
  const btn = document.getElementById('login-submit');
  if (!idEl || !pwdEl || !btn) return;

  let identifier = idEl.value.trim();
  const password = pwdEl.value;

  hideError();

  // ─── Validation ───
  if (!identifier) { showError('Please enter your email or employee ID'); idEl.focus(); return; }
  if (!password) { showError('Please enter your password'); pwdEl.focus(); return; }

  // ─── Identifier resolution ───
  // If not an email, treat as employee ID and resolve to email
  let emailToUse = identifier;
  if (!Utils.isEmail(identifier)) {
    _loading = true;
    setBtnLoading(btn, 'Looking up…');
    try {
      const resolved = await resolveEmployeeEmail(identifier);
      if (!resolved) {
        setBtnLoading(btn, null);
        _loading = false;
        showError('Employee ID not found. Use your email instead.');
        idEl.focus();
        return;
      }
      emailToUse = resolved;
    } catch (err) {
      setBtnLoading(btn, null);
      _loading = false;
      showError('Lookup failed: ' + err.message);
      return;
    }
  }

  _loading = true;
  setBtnLoading(btn, 'Signing in…');

  try {
    await Auth.login(emailToUse, password);
    // Success — Auth.observe() will pick up and AppShell will mount
    // Persist identifier for convenience
    try { localStorage.setItem('7h.lastIdentifier', emailToUse); } catch (_) {}
    // Small delay so the button feedback shows
    await new Promise(r => setTimeout(r, 250));
    // Login succeeded; Boot/AppShell will swap screens automatically
    console.log('[Login] Success:', emailToUse);
  } catch (err) {
    _loading = false;
    setBtnLoading(btn, null);
    showError(normalizeLoginError(err));
    // Focus password for retry
    pwdEl.focus();
    pwdEl.select?.();
  }
}

// ─────────────── IDENTIFIER → EMAIL ───────────────
// Used when user enters an employee code instead of email
async function resolveEmployeeEmail(identifier) {
  const raw = String(identifier || '').trim();
  if (!raw) return null;
  const code = raw.toUpperCase();

  // Try employeeCode lookup
  try {
    const rows = await DB.list(CONST.COLLECTIONS.USERS, {
      where: [['employeeCode', '==', code]],
      limit: 1
    });
    if (rows.length && rows[0].email) return rows[0].email;
  } catch (_) {}

  // Try username field (future)
  try {
    const rows = await DB.list(CONST.COLLECTIONS.USERS, {
      where: [['username', '==', raw.toLowerCase()]],
      limit: 1
    });
    if (rows.length && rows[0].email) return rows[0].email;
  } catch (_) {}

  return null;
}

// ─────────────── ERROR NORMALIZATION ───────────────
function normalizeLoginError(err) {
  const code = err?.code || '';
  const map = {
    'auth/user-not-found':       'No account found with these credentials.',
    'auth/wrong-password':       'Incorrect password. Please try again.',
    'auth/invalid-credential':   'Incorrect email or password.',
    'auth/invalid-email':        'Please enter a valid email address.',
    'auth/too-many-requests':    'Too many attempts. Try again in a few minutes.',
    'auth/network-request-failed': 'Network issue. Check your connection.',
    'auth/user-disabled':        'Your account has been disabled. Contact admin.',
    'auth/operation-not-allowed':'Sign-in method not enabled. Contact admin.'
  };
  return map[code] || err?.message || 'Sign-in failed. Please try again.';
}

// ─────────────── BUTTON LOADING STATE ───────────────
function setBtnLoading(btn, label) {
  if (!btn) return;
  if (label === null) {
    // Reset
    btn.disabled = false;
    btn.classList.remove('is-loading');
    btn.innerHTML = '<span>Sign In</span>';
  } else {
    btn.disabled = true;
    btn.classList.add('is-loading');
    btn.innerHTML = `${UIKIT.icon('loader-2', 16, 'btn-icon')}<span>${Utils.escapeHtml(label)}</span>`;
  }
  if (typeof lucide !== 'undefined' && lucide.createIcons) {
    try { lucide.createIcons(); } catch (_) {}
  }
}

  // ═══════════════════════════════════════════════════════════
  //  FORGOT PASSWORD FLOW
  // ═══════════════════════════════════════════════════════════

  async function handleForgotPassword() {
    const idEl = document.getElementById('login-identifier');
    const current = idEl ? idEl.value.trim() : '';
    const prefill = Utils.isEmail(current) ? current : '';

    // Prompt for email
    const email = prompt('Enter your registered email:', prefill);
    if (!email) return;

    const e = Utils.normalizeEmail(email);
    if (!Utils.isEmail(e)) {
      UI.toast({ message: 'Please enter a valid email address', type: 'error' });
      return;
    }

    try {
      // Try EmailJS-branded first, fall back to Firebase built-in
      if (typeof EmailJS !== 'undefined' && EmailJS.sendPasswordReset) {
        try {
          await EmailJS.sendPasswordReset(e);
          UI.toast({ message: 'Reset link sent to ' + e, type: 'success' });
          return;
        } catch (emailErr) {
          console.warn('[Login] EmailJS failed, using Firebase fallback:', emailErr.message);
        }
      }
      // Fallback — Firebase's own reset email
      await STATE.auth.sendPasswordResetEmail(e);
      UI.toast({ message: 'Reset link sent to ' + e, type: 'success' });
    } catch (err) {
      const code = err?.code || '';
      if (code === 'auth/user-not-found') {
        UI.toast({ message: 'No account found with this email', type: 'error' });
      } else if (code === 'auth/too-many-requests') {
        UI.toast({ message: 'Too many attempts. Try later.', type: 'error' });
      } else {
        UI.toast({ message: err.message || 'Failed to send reset link', type: 'error' });
      }
    }
  }

  // ═══════════════════════════════════════════════════════════
  //  PREFILL LAST IDENTIFIER (convenience on revisit)
  // ═══════════════════════════════════════════════════════════
  function prefillLastIdentifier() {
    try {
      const last = localStorage.getItem('7h.lastIdentifier');
      if (last) _identifier = last;
    } catch (_) {}
  }

  // ═══════════════════════════════════════════════════════════
  //  PUBLIC API
  // ═══════════════════════════════════════════════════════════
  return {
    mount,
    unmount,
    render,
    prefillLastIdentifier
  };
})();

// ═══════════════════════════════════════════════════════════
//  BOOT INTEGRATION — Login vs Setup (auto-switch)
//  1. Users collection empty? → SetupPage
//  2. Users exist?              → LoginPage
//  3. Signed in?                → AppShell
// ═══════════════════════════════════════════════════════════

let _setupCheckCache = null; // avoid re-checking within session

async function hasAnyUser() {
  // Cache result for session — setup runs once
  if (_setupCheckCache !== null) return _setupCheckCache;
  try {
    const rows = await DB.list(CONST.COLLECTIONS.USERS, { limit: 1 });
    _setupCheckCache = rows.length > 0;
  } catch (err) {
    console.warn('[Setup.check] Failed:', err.message);
    // On error, be safe — assume users exist (show login)
    _setupCheckCache = true;
  }
  return _setupCheckCache;
}

Boot.setRenderer(async (user, profile) => {
  // ─── Case 1: Signed in with profile → AppShell ───
  if (user && profile) {
    LoginPage.unmount();
    SetupPage.unmount();
    AppShell.mount(user, profile);
    return;
  }

  // ─── Case 2: Not signed in → check for setup vs login ───
  const usersExist = await hasAnyUser();

  if (!usersExist) {
    // First run — show Setup page
    if (!document.querySelector('.login-root')) {
      SetupPage.mount();
    }
    return;
  }

  // Normal case — show Login page
  if (!document.querySelector('.login-root')) {
    LoginPage.prefillLastIdentifier();
    LoginPage.mount();
  }
});

    LoginPage.prefillLastIdentifier();

});

// ═══════════════════════════════════════════════════════════
//  SETUP FLOW
// ═══════════════════════════════════════════════════════════

async function handleSubmit(e) {
  e.preventDefault();
  if (_loading) return;

  const nameEl = document.getElementById('setup-name');
  const emailEl = document.getElementById('setup-email');
  const phoneEl = document.getElementById('setup-phone');
  const pwdEl = document.getElementById('setup-password');
  const confirmEl = document.getElementById('setup-confirm');
  const keyEl = document.getElementById('setup-key');
  const btn = document.getElementById('setup-submit');

  if (!nameEl || !emailEl || !phoneEl || !pwdEl || !confirmEl || !keyEl || !btn) return;

  const name = nameEl.value.trim();
  const email = Utils.normalizeEmail(emailEl.value);
  const phone = Utils.normalizePhone(phoneEl.value);
  const password = pwdEl.value;
  const confirm = confirmEl.value;
  const setupKey = keyEl.value.trim();

  hideError();

  // ─── Validation ───
  if (name.length < 2) { showError('Please enter your full name (min 2 chars)'); nameEl.focus(); return; }
  if (!Utils.isEmail(email)) { showError('Please enter a valid email address'); emailEl.focus(); return; }
  if (!Utils.isPhone(phone)) { showError('Please enter a valid 10-digit phone (starts 6-9)'); phoneEl.focus(); return; }
  if (password.length < 8) { showError('Password must be at least 8 characters'); pwdEl.focus(); return; }
  if (password !== confirm) { showError('Passwords do not match'); confirmEl.focus(); return; }
  if (setupKey !== SETUP_KEY) { showError('Invalid setup key. Please check and try again.'); keyEl.focus(); return; }

  _loading = true;
  setBtnLoading(btn, 'Creating your account…');

  try {
    // 1. Create Firebase Auth user
    const cred = await STATE.auth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;

    // 2. Update display name
    try { await cred.user.updateProfile({ displayName: name }); } catch (_) {}

    // 3. Create Firestore user doc — MASTER role
    const userDoc = {
      uid,
      name,
      email,
      phone,
      roles: ['MASTER'],
      primaryRole: 'MASTER',
      status: 'active',
      activeApp: 'crm',
      onboardingDone: false,
      createdAt: DB.ts(),
      updatedAt: DB.ts(),
      createdBy: uid,
      setupCompletedAt: DB.ts(),
      dupKeys: { email, phone }
    };
    await DB.set(`${CONST.COLLECTIONS.USERS}/${uid}`, userDoc, false);

    // 4. Audit log
    try {
      await DB.add(CONST.COLLECTIONS.AUDIT, {
        type: 'system',
        action: 'setup:master-created',
        meta: { email, name },
        at: DB.ts(),
        by: uid
      });
    } catch (_) {}

    // 5. Success — Auth.observe() will pick up user doc + mount AppShell
    try { localStorage.setItem('7h.lastIdentifier', email); } catch (_) {}

    setBtnLoading(btn, 'Setup complete! Redirecting…');
    await new Promise(r => setTimeout(r, 600));

    console.log('[Setup] Master account created:', email);
    // Boot.setRenderer is listening to Auth.observe — will auto-switch to AppShell

  } catch (err) {
    _loading = false;
    setBtnLoading(btn, null);
    showError(normalizeSetupError(err));
    if (pwdEl) { pwdEl.value = ''; pwdEl.focus(); }
    if (confirmEl) confirmEl.value = '';
  }
}

// ─── Error normalization ───
function normalizeSetupError(err) {
  const code = (err && err.code) || '';
  const map = {
    'auth/email-already-in-use':   'An account with this email already exists. Try signing in instead.',
    'auth/invalid-email':          'Please enter a valid email address.',
    'auth/weak-password':          'Password is too weak. Use at least 8 characters.',
    'auth/network-request-failed': 'Network issue. Please check your connection.',
    'auth/operation-not-allowed':  'Sign-up method not enabled. Contact admin.',
    'auth/too-many-requests':      'Too many attempts. Please try again in a few minutes.'
  };
  return map[code] || (err && err.message) || 'Setup failed. Please try again.';
}

// ─── Show / hide error ───
function showError(msg) {
  const box = document.getElementById('setup-error');
  const txt = document.getElementById('setup-error-msg');
  if (!box || !txt) return;
  txt.textContent = msg || 'Something went wrong';
  box.style.display = 'flex';
  box.animate(
    [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' },
     { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }],
    { duration: 220, easing: 'ease-in-out' }
  );
}

function hideError() {
  const box = document.getElementById('setup-error');
  if (box) box.style.display = 'none';
}

// ─── Button loading state ───
function setBtnLoading(btn, label) {
  if (!btn) return;
  if (label === null) {
    btn.disabled = false;
    btn.classList.remove('is-loading');
    btn.innerHTML = '<span>Create Master Account</span>';
  } else {
    btn.disabled = true;
    btn.classList.add('is-loading');
    btn.innerHTML = `${UIKIT.icon('loader-2', 16, 'btn-icon')}<span>${Utils.escapeHtml(label)}</span>`;
  }
  if (typeof lucide !== 'undefined' && lucide.createIcons) {
    try { lucide.createIcons(); } catch (_) {}
  }
  }

  return {
    mount,
    unmount,
    render,
    SETUP_KEY
  };
})();
