            console.warn('[7H] Persistence: not supported in this browser.');
          }
        });

      // Auth persistence — survive refresh
      STATE.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .catch((err) => console.warn('[7H] Auth persistence:', err.message));

      console.log('[7H] Firebase initialized · project:', FIREBASE_CONFIG.projectId);
    } catch (err) {
      console.error('[7H] Firebase init failed:', err);
    }
  })();

  // ═══════════════ ONLINE / OFFLINE TRACKER ═══════════════
  window.addEventListener('online',  () => { STATE.online = true;  document.body.classList.remove('is-offline'); });
  window.addEventListener('offline', () => { STATE.online = false; document.body.classList.add('is-offline'); });
  STATE.online = navigator.onLine;

  // ═══════════════ EXPOSE (dev only) ═══════════════
  window.__7H = { STATE, CONST, APP, DEFAULT_CONFIG, FIREBASE_CONFIG, WORKER_URL };

  // ═══════════════════════════════════════════════════════════
//  UTILS — Formatting, Normalization, Helpers
//  Rule: Pure functions only. No DOM, no Firebase, no side effects.
// ═══════════════════════════════════════════════════════════

const Utils = (function () {
  'use strict';

  const IST_OFFSET_MIN = 330; // +5:30

  // ─────────────── NUMBER FORMATTING ───────────────
  function formatNumber(num) {
    if (num === null || num === undefined || num === '') return '—';
    const n = Number(num);
    if (isNaN(n)) return '—';
    return n.toLocaleString('en-IN');
  }

  function formatCurrency(num, opts = {}) {
    if (num === null || num === undefined || num === '') return '—';
    const n = Number(num);
    if (isNaN(n)) return '—';
    const symbol = opts.symbol !== false ? '₹' : '';
    const decimals = opts.decimals ?? 0;
    return symbol + n.toLocaleString('en-IN', {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals
    });
  }

  // ₹12.5L / ₹1.2Cr / ₹45K
  function formatCompact(num) {
    if (num === null || num === undefined || num === '') return '—';
    const n = Number(num);
    if (isNaN(n)) return '—';
    const abs = Math.abs(n);
    const sign = n < 0 ? '-' : '';
    if (abs >= 1e7) return sign + '₹' + (abs / 1e7).toFixed(abs >= 1e8 ? 0 : 1).replace(/\.0$/, '') + 'Cr';
    if (abs >= 1e5) return sign + '₹' + (abs / 1e5).toFixed(abs >= 1e6 ? 0 : 1).replace(/\.0$/, '') + 'L';
    if (abs >= 1e3) return sign + '₹' + (abs / 1e3).toFixed(0) + 'K';
    return sign + '₹' + abs;
  }

  // ─────────────── DATE / TIME ───────────────
  function toIST(date) {
    if (!date) return null;
    const d = date instanceof Date ? date : new Date(date);
    if (isNaN(d.getTime())) return null;
    return new Date(d.getTime() + (IST_OFFSET_MIN + d.getTimezoneOffset()) * 60000);
  }

  // 07 Oct 2026
  function formatDate(date) {
    const d = toIST(date);
    if (!d) return '—';
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return String(d.getDate()).padStart(2, '0') + ' '
         + months[d.getMonth()] + ' '
         + d.getFullYear();
  }

  // 3:30 PM IST
  function formatTime(date) {
    const d = toIST(date);
    if (!d) return '—';
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, '0');
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${m} ${ap}`;
  }

  // 07 Oct 2026, 3:30 PM IST
  function formatDateTimeFull(date) {
    const d = toIST(date);
    if (!d) return '—';
    return formatDate(d) + ', ' + formatTime(d) + ' IST';
  }

  // Today / Yesterday / 2h ago / 3d ago / 07 Oct 2026
  function formatRelative(date) {
    const d = toIST(date);
    if (!d) return '—';
    const now = toIST(new Date());
    const diff = now - d;
    const sec = Math.floor(diff / 1000);
    if (sec < 0) return 'Just now';
    if (sec < 60) return 'Just now';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + 'm ago';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h ago';
    const day = Math.floor(hr / 24);
    if (day === 0) return 'Today';
    if (day === 1) return 'Yesterday';
    if (day < 7) return day + 'd ago';
    return formatDate(d);
  }

  // ─────────────── NORMALIZATION ───────────────
  function normalizePhone(v) {
    if (!v) return '';
    const digits = String(v).replace(/\D/g, '');
    return digits.slice(-10);
  }

  function normalizeEmail(v) {
    return String(v || '').trim().toLowerCase();
  }

  function normalizeName(v) {
    return String(v || '')
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, '')
      .replace(/\s+/g, ' ');
  }

  function normalizeWebsite(v) {
    if (!v) return '';
    let s = String(v).trim().toLowerCase();
    s = s.replace(/^https?:\/\//, '').replace(/^www\./, '');
    return s.split('/')[0].split('?')[0];
  }

  // ─────────────── VALIDATION ───────────────
  function isEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim());
  }

  function isPhone(v) {
    const d = normalizePhone(v);
    return /^[6-9]\d{9}$/.test(d);
  }

  function isGSTIN(v) {
    return /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/.test(String(v || '').trim().toUpperCase());
  }

  // ─────────────── STRING HELPERS ───────────────
  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function initials(name, max = 2) {
    if (!name) return '?';
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return parts.slice(0, max).map(p => p[0].toUpperCase()).join('');
  }

  function truncate(str, len = 40) {
    const s = String(str || '');
    return s.length > len ? s.slice(0, len - 1) + '…' : s;
  }

  // ─────────────── FUNCTION HELPERS ───────────────
  function debounce(fn, wait = 300) {
    let t;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), wait);
    };
  }

  function throttle(fn, wait = 200) {
    let last = 0, timer;
    return function (...args) {
      const now = Date.now();
      const remaining = wait - (now - last);
      if (remaining <= 0) {
        clearTimeout(timer);
        timer = null;
        last = now;
        fn.apply(this, args);
      } else if (!timer) {
        timer = setTimeout(() => {
          last = Date.now();
          timer = null;
          fn.apply(this, args);
        }, remaining);
      }
    };
  }

  // ─────────────── MISC ───────────────
  function uid(prefix = '') {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  function clamp(n, min, max) {
    return Math.min(Math.max(Number(n) || 0, min), max);
  }

  function deepClone(obj) {
    return obj == null ? obj : JSON.parse(JSON.stringify(obj));
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    formatNumber, formatCurrency, formatCompact,
    formatDate, formatTime, formatDateTimeFull, formatRelative,
    normalizePhone, normalizeEmail, normalizeName, normalizeWebsite,
    isEmail, isPhone, isGSTIN,
    escapeHtml, initials, truncate,
    debounce, throttle,
    uid, sleep, clamp, deepClone
  };
})();

  // ═══════════════════════════════════════════════════════════
//  FIRESTORE SERVICE LAYER
//  Rule: Pages kabhi Firestore ko direct touch nahi karenge.
//        Sab kuch DB.* se hoga. Centralized error + timestamps.
// ═══════════════════════════════════════════════════════════

const DB = (function () {
  'use strict';

  // ─────────────── INTERNAL ───────────────
  function docRef(path) { return STATE.db.doc(path); }
  function colRef(path) { return STATE.db.collection(path); }

  // Auto-inject timestamps (create + update)
  function enrich(data, isCreate = false) {
    const out = { ...data };
    if (isCreate && !out.createdAt) out.createdAt = ts();
    out.updatedAt = ts();
    return out;
  }

  // ─────────────── READ ───────────────
  // DB.get("companies/abc123") → { id, ...data } | null
  async function get(path) {
    try {
      const snap = await docRef(path).get();
      return snap.exists ? { id: snap.id, ...snap.data() } : null;
    } catch (err) {
      console.error('[DB.get]', path, err);
      throw err;
    }
  }

  // DB.list("companies", { where: [["stage","==","CLIENT"]], orderBy: ["createdAt","desc"], limit: 20 })
  async function list(collection, options = {}) {
    try {
      let q = colRef(collection);
      if (Array.isArray(options.where)) {
        for (const w of options.where) q = q.where(...w);
      }
      if (options.orderBy) {
        const [f, d = 'asc'] = Array.isArray(options.orderBy)
          ? options.orderBy : [options.orderBy];
        q = q.orderBy(f, d);
      }
      if (options.limit) q = q.limit(options.limit);
      if (options.startAfter) q = q.startAfter(options.startAfter);
      const snap = await q.get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (err) {
      console.error('[DB.list]', collection, err);
      throw err;
    }
  }

  // ─────────────── WRITE ───────────────
  // DB.set("companies/abc", data) → path
  async function set(path, data, merge = false) {
    try {
      await docRef(path).set(enrich(data), { merge });
      return path;
    } catch (err) {
      console.error('[DB.set]', path, err);
      throw err;
    }
  }

  // DB.add("companies", data) → newDocId
  async function add(collection, data) {
    try {
      const ref = await colRef(collection).add(enrich(data, true));
      return ref.id;
    } catch (err) {
      console.error('[DB.add]', collection, err);
      throw err;
    }
  }

  // DB.update("companies/abc", { stage: "CLIENT" })
  async function update(path, data) {
    try {
      await docRef(path).update(enrich(data));
      return path;
    } catch (err) {
      console.error('[DB.update]', path, err);
      throw err;
    }
  }

  // Hard delete — only for drafts / temp / non-recoverable
  async function remove(path) {
    try {
      await docRef(path).delete();
      return true;
    } catch (err) {
      console.error('[DB.remove]', path, err);
      throw err;
    }
  }

  // ─────────────── SOFT DELETE / RESTORE ───────────────
  async function softDelete(path, by = null) {
    return update(path, {
      isDeleted: true,
      deletedAt: ts(),
      deletedBy: by
    });
  }

  async function restore(path) {
    return update(path, {
      isDeleted: false,
      deletedAt: null,
      deletedBy: null,
      restoredAt: ts()
    });
  }

  // ─────────────── REALTIME ───────────────
  // DB.watch("companies/abc", data => {...}) → unsubscribe()
  function watch(path, cb) {
    return docRef(path).onSnapshot(
      snap => cb(snap.exists ? { id: snap.id, ...snap.data() } : null),
      err => console.error('[DB.watch]', path, err)
    );
  }

  // DB.watchList("companies", { where:[...], orderBy:[...], limit:20 }, arr => {...})
  function watchList(collection, options, cb) {
    let q = colRef(collection);
    if (Array.isArray(options.where)) {
      for (const w of options.where) q = q.where(...w);
    }
    if (options.orderBy) {
      const [f, d = 'asc'] = Array.isArray(options.orderBy)
        ? options.orderBy : [options.orderBy];
      q = q.orderBy(f, d);
    }
    if (options.limit) q = q.limit(options.limit);
    return q.onSnapshot(
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => console.error('[DB.watchList]', collection, err)
    );
  }

  // ─────────────── BATCH (atomic multi-write) ───────────────
  // DB.batch([
  //   { type:'set',    path:'companies/a', data:{...} },
  //   { type:'update', path:'candidates/b', data:{...} },
  //   { type:'delete', path:'temp/c' }
  // ])
  async function batch(ops) {
    if (!Array.isArray(ops) || !ops.length) return true;
    const b = STATE.db.batch();
    for (const op of ops) {
      const r = docRef(op.path);
      if (op.type === 'set')         b.set(r, enrich(op.data), { merge: !!op.merge });
      else if (op.type === 'update') b.update(r, enrich(op.data));
      else if (op.type === 'delete') b.delete(r);
      else console.warn('[DB.batch] unknown op:', op.type);
    }
    try {
      await b.commit();
      return true;
    } catch (err) {
      console.error('[DB.batch]', err);
      throw err;
    }
  }

  // ─────────────── FIELD VALUE HELPERS ───────────────
  function ts() {
    return firebase.firestore.FieldValue.serverTimestamp();
  }
  function increment(n) {
    return firebase.firestore.FieldValue.increment(n);
  }
  function arrayUnion(...items) {
    return firebase.firestore.FieldValue.arrayUnion(...items);
  }
  function arrayRemove(...items) {
    return firebase.firestore.FieldValue.arrayRemove(...items);
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    get, list,
    set, add, update, remove,
    softDelete, restore,
    watch, watchList,
    batch,
    ts, increment, arrayUnion, arrayRemove
  };
})();

  // ═══════════════════════════════════════════════════════════
//  CONFIG LOADER
//  DEFAULT_CONFIG (code) + Firestore `settings/config` (override)
//  Result → STATE.config (single source of truth at runtime)
//  Rule: Deep merge. Firestore jeetta hai. Live sync.
// ═══════════════════════════════════════════════════════════

const Config = (function () {
  'use strict';
const deepClone = Utils.deepClone;
  let _unsub = null;

  // ─────────────── DEEP MERGE ───────────────
  // Firestore data overrides DEFAULT_CONFIG (recursive)
  function deepMerge(base, override) {
    if (!override || typeof override !== 'object') return base;
    const out = Array.isArray(base) ? [...base] : { ...base };
    for (const key of Object.keys(override)) {
      const ov = override[key];
      const bv = out[key];
      if (ov && typeof ov === 'object' && !Array.isArray(ov) &&
          bv && typeof bv === 'object' && !Array.isArray(bv)) {
        out[key] = deepMerge(bv, ov);
      } else {
        out[key] = ov;
      }
    }
    return out;
  }

  // ─────────────── LOAD (initial fetch) ───────────────
  async function load() {
    try {
      const remote = await DB.get(`${CONST.COLLECTIONS.SETTINGS}/${CONST.SETTINGS_DOC}`);
      // STATE.config = merged (DEFAULT + Firestore)
      STATE.config = remote
        ? deepMerge(deepClone(DEFAULT_CONFIG), remote)
        : deepClone(DEFAULT_CONFIG);
      // Remove Firestore metadata keys from config surface
      delete STATE.config.id;
      delete STATE.config.createdAt;
      delete STATE.config.updatedAt;

      console.log('[Config] Loaded',
        remote ? '(Firestore override)' : '(defaults only)');
      return STATE.config;
    } catch (err) {
      console.warn('[Config] Load failed — using defaults:', err.message);
      STATE.config = deepClone(DEFAULT_CONFIG);
      return STATE.config;
    }
  }

  // ─────────────── WATCH (realtime sync) ───────────────
  // Admin changes settings → sab live users ko instant milta hai
  function watch() {
    if (_unsub) _unsub();
    _unsub = DB.watch(
      `${CONST.COLLECTIONS.SETTINGS}/${CONST.SETTINGS_DOC}`,
      (remote) => {
        if (!remote) {
          STATE.config = deepClone(DEFAULT_CONFIG);
          return;
        }
        STATE.config = deepMerge(deepClone(DEFAULT_CONFIG), remote);
        delete STATE.config.id;
        delete STATE.config.createdAt;
        delete STATE.config.updatedAt;
        console.log('[Config] Live update received');
        // Optional: fire an event so pages can re-render
        window.dispatchEvent(new CustomEvent('7h:config-update', {
          detail: STATE.config
        }));
      }
    );
    return _unsub;
  }

  function unwatch() {
    if (_unsub) { _unsub(); _unsub = null; }
  }

  // ─────────────── GET (dot-path with fallback) ───────────────
  // Config.get("business.gstRate")  → 18
  // Config.get("business.xyz", 5)   → 5 (fallback)
  function get(path, fallback = null) {
    if (!STATE.config) return fallback;
    const keys = String(path).split('.');
    let cur = STATE.config;
    for (const k of keys) {
      if (cur == null || typeof cur !== 'object') return fallback;
      cur = cur[k];
      if (cur === undefined) return fallback;
    }
    return cur === undefined ? fallback : cur;
  }

  // ─────────────── SET (Admin only — writes to Firestore) ───────────────
  // Config.set("business.gstRate", 18)  → dot-path write (merge)
  async function set(path, value) {
    const keys = String(path).split('.');
    const patch = {};
    let cur = patch;
    for (let i = 0; i < keys.length - 1; i++) {
      cur[keys[i]] = {};
      cur = cur[keys[i]];
    }
    cur[keys[keys.length - 1]] = value;
    await DB.set(
      `${CONST.COLLECTIONS.SETTINGS}/${CONST.SETTINGS_DOC}`,
      patch,
      true // merge
    );
    // Optimistic local update (watch will confirm)
    STATE.config = deepMerge(STATE.config || deepClone(DEFAULT_CONFIG), patch);
    console.log('[Config] Set', path, '=', value);
  }

  // ─────────────── REPLACE (bulk write) ───────────────
  async function replace(patch) {
    if (!patch || typeof patch !== 'object') return;
    await DB.set(
      `${CONST.COLLECTIONS.SETTINGS}/${CONST.SETTINGS_DOC}`,
      patch,
      true
    );
    STATE.config = deepMerge(STATE.config || deepClone(DEFAULT_CONFIG), patch);
    console.log('[Config] Replaced', Object.keys(patch).join(', '));
  }

  // ─────────────── RESET (danger — restores defaults) ───────────────
  async function resetToDefaults() {
    await DB.remove(`${CONST.COLLECTIONS.SETTINGS}/${CONST.SETTINGS_DOC}`);
    STATE.config = deepClone(DEFAULT_CONFIG);
    console.log('[Config] Reset to defaults');
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    load, watch, unwatch,
    get, set, replace,
    resetToDefaults,
    deepMerge // exported for tests
  };
})();

  // ═══════════════════════════════════════════════════════════
//  AUTH + SESSION + ROLE RESOLUTION
//  Firebase Auth → users doc → roles → permissions → STATE.user
//  Rule: Ek hi auth state listener. Sab pages isse subscribe karenge.
// ═══════════════════════════════════════════════════════════

const Auth = (function () {
  'use strict';

  let _authUnsub = null;
  let _profileUnsub = null;
  let _onChangeCb = null;

  // ─────────────── ROLE → PERMISSIONS MAP ───────────────
  // Base role permission sets (dynamic roles come from Firestore user doc)
  const ROLE_PERMISSIONS = {
    MASTER: { all: true },
    ADMIN: {
      companies:   ['view','create','edit','delete','assign'],
      candidates:  ['view','create','edit','delete','approve','submit'],
      employees:   ['view','create','edit','deactivate'],
      clients:     ['view','create','edit','invite'],
      prospects:   ['view','create','edit','delete'],
      payments:    ['view','create','edit'],
      invoices:    ['view','create','edit','send'],
      contract:    ['view','create','edit','terminate'],
      agreements:  ['view','create','send','revoke'],
      inquiries:   ['view','create','edit','convert'],
      tasks:       ['view','create','edit','delete','assign'],
      chat:        ['view','send','group'],
      reports:     ['view','export'],
      audit:       ['view'],
      templates:   ['view','edit'],
      settings:    ['view','edit'],
      passwords:   ['reset.employee','reset.manager','reset.self']
    },
    MANAGER: {
      companies:   ['view','assign','delete'],
      candidates:  ['view','approve','reject'],
      employees:   ['view','create','deactivate'],
      clients:     ['view'],
      prospects:   ['view','create','edit'],
      tasks:       ['view','create','edit','delete','assign'],
      chat:        ['view','send','group'],
      reports:     ['view','export'],
      audit:       ['view'],
      handover:    ['to.admin','to.master']
    },
    EMPLOYEE: {
      companies:   ['view.assigned'],
      candidates:  ['view.assigned','create','edit.own'],
      tasks:       ['view.own','create','edit.own'],
      chat:        ['view','send'],
      attendance:  ['view.own'],
      salary:      ['view.own'],
      handover:    ['to.manager','to.admin']
    },
    INTERNAL_SUPERVISOR: {
      attendance:  ['view','mark','edit'],
      tasks:       ['view.own'],
      chat:        ['view','send']
    },
    EXTERNAL_SUPERVISOR: {
      attendance:  ['view.assigned','mark.assigned'],
      profile:     ['view.own']
    },
    CLIENT: { portalOnly: true }
  };

  // ─────────────── ROLE HELPERS ───────────────
  function normalizeRoles(roleArray, primary) {
    if (!Array.isArray(roleArray) || !roleArray.length) {
      roleArray = primary ? [primary] : [];
    }
    return [...new Set(roleArray.filter(Boolean))];
  }

  function resolvePermissions(roles, customPerms) {
    // Custom permissions on user doc always override role defaults
    if (customPerms && typeof customPerms === 'object') return customPerms;
    const merged = {};
    for (const role of roles) {
      const perms = ROLE_PERMISSIONS[role];
      if (!perms) continue;
      if (perms.all) return { all: true };
      if (perms.portalOnly) { merged.portalOnly = true; continue; }
      for (const [key, val] of Object.entries(perms)) {
        merged[key] = [...new Set([...(merged[key] || []), ...val])];
      }
    }
    return merged;
  }

  function hasRole(role) {
    return STATE.roles && STATE.roles.includes(role);
  }

  function can(resource, action) {
    const p = STATE.permissions || {};
    if (p.all) return true;
    if (!p[resource]) return false;
    if (p[resource].includes('*')) return true;
    if (action && p[resource].includes(action)) return true;
    // Sub-scoped perms like "view.own", "view.assigned"
    if (action && p[resource].some(x => x.startsWith(action + '.'))) return true;
    return p[resource].includes(action);
  }

  // ─────────────── SESSION HANDLERS ───────────────
  function saveSessionMeta(profile) {
    try {
      localStorage.setItem(CONST.LOCAL_KEYS.SESSION, JSON.stringify({
        uid: profile.uid,
        email: profile.email,
        at: Date.now()
      }));
    } catch (_) {}
  }

  function clearSessionMeta() {
    try { localStorage.removeItem(CONST.LOCAL_KEYS.SESSION); } catch (_) {}
  }

  // ─────────────── PROFILE LOADER ───────────────
  async function loadProfile(uid) {
    const doc = await DB.get(`${CONST.COLLECTIONS.USERS}/${uid}`);
    if (!doc) return null;
    if (doc.isDeleted) {
      console.warn('[Auth] User is soft-deleted');
      return null;
    }
    if (doc.status === 'disabled' || doc.status === 'deactivated') {
      console.warn('[Auth] User disabled');
      return null;
    }
    return doc;
  }

  function applyProfile(profile) {
    STATE.profile = profile;
    STATE.roles = normalizeRoles(profile.roles, profile.primaryRole || profile.role);
    STATE.primaryRole = profile.primaryRole || profile.role || STATE.roles[0] || null;
    STATE.permissions = resolvePermissions(STATE.roles, profile.permissions);
    STATE.activeApp = profile.activeApp || 'crm';
    saveSessionMeta(profile);
  }

  // ─────────────── LOGIN / LOGOUT ───────────────
  async function login(email, password) {
    const e = Utils.normalizeEmail(email);
    if (!Utils.isEmail(e)) throw new Error('Invalid email format');
    if (!password || password.length < (Config.get('auth.passwordMinLength', 8))) {
      throw new Error('Password too short');
    }
    try {
      const cred = await STATE.auth.signInWithEmailAndPassword(e, password);
      await STATE.auth.currentUser?.reload?.();
      return { uid: cred.user.uid, email: cred.user.email };
    } catch (err) {
      console.error('[Auth.login]', err.code, err.message);
      throw err;
    }
  }

  async function logout() {
    try {
      detachProfileListener();
      await STATE.auth.signOut();
      STATE.user = null;
      STATE.profile = null;
      STATE.roles = [];
      STATE.permissions = {};
      STATE.primaryRole = null;
      clearSessionMeta();
    } catch (err) {
      console.error('[Auth.logout]', err);
      throw err;
    }
  }

  // ─────────────── PASSWORD RESET (EmailJS wired later) ───────────────
  async function sendPasswordReset(email) {
    const e = Utils.normalizeEmail(email);
    if (!Utils.isEmail(e)) throw new Error('Invalid email');
    return STATE.auth.sendPasswordResetEmail(e);
  }

  // ─────────────── PROFILE REALTIME ───────────────
  function attachProfileListener(uid) {
    detachProfileListener();
    _profileUnsub = DB.watch(`${CONST.COLLECTIONS.USERS}/${uid}`, async (profile) => {
      if (!profile || profile.isDeleted || profile.status === 'disabled') {
        await logout();
        return;
      }
      applyProfile(profile);
      if (STATE.ready && typeof _onChangeCb === 'function') _onChangeCb(STATE.profile);
    });
  }

  function detachProfileListener() {
    if (_profileUnsub) { _profileUnsub(); _profileUnsub = null; }
  }

  // ─────────────── AUTH STATE (single source) ───────────────
  // Usage: Auth.observe((user, profile) => { ...route/render... })
  function observe(cb) {
    _onChangeCb = cb;
    if (_authUnsub) _authUnsub();
    _authUnsub = STATE.auth.onAuthStateChanged(async (user) => {
      STATE.user = user;
      if (!user) {
        STATE.profile = null;
        STATE.roles = [];
        STATE.permissions = {};
        STATE.ready = true;
        clearSessionMeta();
        if (typeof cb === 'function') cb(null, null);
        return;
      }
      try {
        const profile = await loadProfile(user.uid);
        if (!profile) {
          console.warn('[Auth] No profile — signing out');
          await logout();
          return;
        }
        applyProfile(profile);
        attachProfileListener(user.uid);
        STATE.ready = true;
        if (typeof cb === 'function') cb(user, profile);
      } catch (err) {
        console.error('[Auth.observe]', err);
        if (typeof cb === 'function') cb(user, null);
      }
    });
  }

  function stop() {
    if (_authUnsub) { _authUnsub(); _authUnsub = null; }
    detachProfileListener();
    _onChangeCb = null;
  }

  // ─────────────── APP SWITCHER (multi-role) ───────────────
  // STATE.activeApp = "crm" | "client" | "attendance"
  async function switchApp(appName) {
    if (!['crm','client','attendance'].includes(appName)) {
      throw new Error('Invalid app: ' + appName);
    }
    STATE.activeApp = appName;
    if (STATE.profile) {
      try {
        await DB.update(`${CONST.COLLECTIONS.USERS}/${STATE.profile.uid}`, {
          activeApp: appName
        });
      } catch (_) { /* non-fatal */ }
    }
    return appName;
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    observe, stop,
    login, logout,
    sendPasswordReset,
    switchApp,
    hasRole, can,
    ROLE_PERMISSIONS
  };
})();

  // ═══════════════════════════════════════════════════════════
//  ROUTER + STATE RESTORE
//  Pipeline: navigateTo → cleanup → skeleton → fetch → render
//            → afterHooks → restore state/scroll → save state
//  Rule: Ek hi navigateTo(). Koi page Firestore ko direct touch nahi.
// ═══════════════════════════════════════════════════════════

const Router = (function () {
  'use strict';

  // ─────────────── ROUTE REGISTRY ───────────────
  // Pages register here. `render` is a fn returning HTML string or
  // a Promise<HTMLString>. `after` runs after DOM is inserted.
  const ROUTES = new Map();

  // Runtime
  let _current = null;         // "companies"
  let _params = {};            // { id: 'abc' }
  let _cleanup = null;         // fn from previous page
  let _afterHooks = [];        // fns to run after render
  let _container = null;       // main DOM node
  let _timeoutHandle = null;
  const RENDER_TIMEOUT = 10000;

  // ─────────────── REGISTER ───────────────
  // Router.register('companies', { title, render, after, skeleton, permission, cleanup })
  function register(id, def) {
    if (!id || !def || typeof def.render !== 'function') {
      console.error('[Router] Invalid route def:', id);
      return;
    }
    ROUTES.set(id, {
      id,
      title: def.title || id,
      render: def.render,
      after: def.after || null,
      cleanup: def.cleanup || null,
      skeleton: def.skeleton || null,
      permission: def.permission || null, // [resource, action]
      params: def.params || []            // required param names
    });
  }

  function unregister(id) { ROUTES.delete(id); }

  // ─────────────── NAVIGATE ───────────────
  async function navigateTo(id, params = {}, opts = {}) {
    const route = ROUTES.get(id);
    if (!route) {
      console.warn('[Router] Unknown route:', id);
      return renderNotFound(id);
    }

    // Permission gate
    if (route.permission && !Auth.can(route.permission[0], route.permission[1])) {
      return renderForbidden(id);
    }

    // Required params
    for (const p of route.params) {
      if (params[p] === undefined || params[p] === null || params[p] === '') {
        console.warn('[Router] Missing param:', p, 'for', id);
        return;
      }
    }

    // Persist scroll of previous page before leaving
    if (_current) saveScroll(_current);
    if (_current) saveState(_current, _params);

    // Run previous page cleanup
    if (typeof _cleanup === 'function') {
      try { _cleanup(); } catch (e) { console.error('[Router.cleanup]', e); }
    }
    _cleanup = null;
    _afterHooks = [];

    _current = id;
    _params = { ...params };
    STATE.route = id;
    STATE.params = _params;

    // URL hash sync
    if (opts.hash !== false) syncHash(id, _params);

    // Show skeleton if provided
    _container = getContainer();
    if (!_container) {
      console.error('[Router] Container (#page-root) not found.');
      return;
    }

    if (route.skeleton) {
      _container.innerHTML = typeof route.skeleton === 'function'
        ? route.skeleton(_params)
        : route.skeleton;
    } else {
      _container.innerHTML = renderSkeletonGeneric();
    }

    // Render with timeout guard
    try {
      const html = await withTimeout(Promise.resolve(route.render(_params)), RENDER_TIMEOUT);
      if (_current !== id) return; // navigated away mid-render
      _container.innerHTML = html || '';
    } catch (err) {
      console.error('[Router.render]', id, err);
      _container.innerHTML = renderErrorState(err, id);
      return;
    }

    // After hooks (attach listeners, lucide.createIcons, etc.)
    runAfterHooks();

    // Restore previous scroll (if returning to same route with same params)
    restoreScroll(id);
    restoreState(id, _params);

    // Focus management
    try { _container.setAttribute('tabindex', '-1'); _container.focus({ preventScroll: true }); } catch (_) {}

    console.log('[Router] Rendered:', id, _params);
  }

  function runAfterHooks() {
    if (typeof lucide !== 'undefined' && lucide.createIcons) {
      try { lucide.createIcons(); } catch (_) {}
    }
    _afterHooks.forEach(fn => {
      try { fn(); } catch (e) { console.error('[Router.afterHook]', e); }
    });
  }

  // ─────────────── CLEANUP / AFTER HOOKS ───────────────
  // Pages call these inside their `after` to register teardown + hooks.
  function setCleanup(fn) { _cleanup = typeof fn === 'function' ? fn : null; }
  function addAfterHook(fn) { if (typeof fn === 'function') _afterHooks.push(fn); }

  // ─────────────── SCROLL PRESERVE ───────────────
  function saveScroll(id) {
    try {
      const key = '7h.scroll.' + id;
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      sessionStorage.setItem(key, String(y));
    } catch (_) {}
  }

  function restoreScroll(id) {
    try {
      const key = '7h.scroll.' + id;
      const y = Number(sessionStorage.getItem(key) || 0);
      if (y > 0) requestAnimationFrame(() => window.scrollTo({ top: y, behavior: 'instant' }));
    } catch (_) {}
  }

  // ─────────────── PAGE STATE (form drafts, filters) ───────────────
  // key = "companies" + JSON.stringify(params) so different ids keep separate state
  function stateKey(id, params) {
    const suffix = params && Object.keys(params).length ? ':' + JSON.stringify(params) : '';
    return id + suffix;
  }

  function saveState(id, params) {
    try {
      const bucket = window.__7h_state || (window.__7h_state = {});
      // Pages must set their own state via Router.setState(id, params, obj)
      // (no auto-capture — safe default)
      return bucket;
    } catch (_) { return {}; }
  }

  function setState(id, params, obj) {
    try {
      const bucket = window.__7h_state || (window.__7h_state = {});
      bucket[stateKey(id, params)] = obj;
    } catch (_) {}
  }

  function getState(id, params) {
    try {
      const bucket = window.__7h_state || {};
      return bucket[stateKey(id, params)] || null;
    } catch (_) { return null; }
  }

  function restoreState(id, params) {
    // no-op by default — pages call Router.getState() themselves
    return getState(id, params);
  }

  // ─────────────── URL HASH SYNC ───────────────
  function syncHash(id, params) {
    try {
      const qs = Object.keys(params).length
        ? '?' + new URLSearchParams(params).toString()
        : '';
      const h = '#' + id + qs;
      if (location.hash !== h) {
        history.pushState({ route: id, params }, '', h);
      }
    } catch (_) {}
  }

  function parseHash() {
    const raw = (location.hash || '').replace(/^#/, '');
    if (!raw) return { id: null, params: {} };
    const [id, qs] = raw.split('?');
    const params = {};
    if (qs) new URLSearchParams(qs).forEach((v, k) => { params[k] = v; });
    return { id, params };
  }

  // ─────────────── BACK BUTTON ───────────────
  // Priority: drawer → modal → page history
  function installBackHandler() {
    window.addEventListener('popstate', () => {
      // 1) Drawer open? close it
      const drawer = document.querySelector('.drawer-overlay.is-open');
      if (drawer) { drawer.classList.remove('is-open'); history.pushState({}, '', location.href); return; }
      // 2) Modal open? close it
      const modal = document.querySelector('.overlay.is-open');
      if (modal) { modal.classList.remove('is-open'); history.pushState({}, '', location.href); return; }
      // 3) Otherwise let browser handle route via popstate (we read hash)
      const { id, params } = parseHash();
      if (id && ROUTES.has(id)) navigateTo(id, params, { hash: false });
      else if (!id) navigateTo('dashboard', {}, { hash: false });
    });
  }

  // ─────────────── HELPERS ───────────────
  function getContainer() {
    return document.getElementById('page-root')
        || document.getElementById('app-main')
        || document.querySelector('.app-main')
        || document.querySelector('main');
  }

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, rej) => {
        _timeoutHandle = setTimeout(() => rej(new Error('Render timeout')), ms);
      })
    ]).finally(() => { clearTimeout(_timeoutHandle); });
  }

  function renderSkeletonGeneric() {
    return `
      <div class="page">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-block"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text" style="width:80%;"></div>
      </div>`;
  }

  function renderErrorState(err, id) {
    return `
      <div class="page">
        <div class="empty-state">
          <div class="empty-icon" data-lucide="alert-triangle"></div>
          <div class="empty-title">Something went wrong</div>
          <div class="empty-message">${Utils.escapeHtml(err && err.message || 'Failed to load page.')}</div>
          <button class="btn btn-primary empty-action" onclick="Router.navigateTo('${id}')">Retry</button>
        </div>
      </div>`;
  }

  function renderNotFound(id) {
    const c = getContainer();
    if (c) c.innerHTML = `
      <div class="page">
        <div class="empty-state">
          <div class="empty-icon" data-lucide="compass"></div>
          <div class="empty-title">Page not found</div>
          <div class="empty-message">Route "${Utils.escapeHtml(id)}" is not registered.</div>
          <button class="btn btn-primary empty-action" onclick="Router.navigateTo('dashboard')">Go to Dashboard</button>
        </div>
      </div>`;
  }

  function renderForbidden(id) {
    const c = getContainer();
    if (c) c.innerHTML = `
      <div class="page">
        <div class="empty-state">
          <div class="empty-icon" data-lucide="lock"></div>
          <div class="empty-title">Access denied</div>
          <div class="empty-message">You don't have permission to view "${Utils.escapeHtml(id)}".</div>
          <button class="btn btn-ghost empty-action" onclick="history.back()">Go back</button>
        </div>
      </div>`;
  }

  // ─────────────── GETTERS ───────────────
  function current() { return _current; }
  function params()  { return { ..._params }; }
  function list()    { return [...ROUTES.keys()]; }

  // ─────────────── PUBLIC API ───────────────
  return {
    register, unregister,
    navigateTo,
    setCleanup, addAfterHook,
    setState, getState,
    current, params, list,
    installBackHandler,
    parseHash
  };
})();

  // ═══════════════════════════════════════════════════════════
//  UI HELPERS — Toast / Confirm / Drawer / Modal / Feedback
//  Rule: Sab notifications isse honge. Button actions pe inline
//        feedback (toast NAHI). Toast only background events ke liye.
// ═══════════════════════════════════════════════════════════

const UI = (function () {
  'use strict';

  let _toastContainer = null;
  let _modalStack = [];
  let _drawerStack = [];

  // ─────────────── TOAST ───────────────
  function ensureToastContainer() {
    if (_toastContainer && document.body.contains(_toastContainer)) return _toastContainer;
    _toastContainer = document.createElement('div');
    _toastContainer.className = 'toast-container';
    _toastContainer.id = 'toast-container';
    document.body.appendChild(_toastContainer);
    return _toastContainer;
  }

  const TOAST_ICONS = {
    success: 'check-circle-2',
    error:   'alert-circle',
    warning: 'alert-triangle',
    info:    'info'
  };

  // UI.toast('Saved', 'success')
  // UI.toast({ message, type, duration })
  function toast(input, type = 'info', duration = null) {
    const cfg = typeof input === 'object' ? input : { message: input, type, duration };
    const msg = cfg.message || '';
    const t = cfg.type || 'info';
    const dur = cfg.duration ?? (t === 'error' ? 3000 : 1500);
    const c = ensureToastContainer();

    // Cap visible at 3
    const existing = c.querySelectorAll('.toast');
    if (existing.length >= 3) existing[0].remove();

    const el = document.createElement('div');
    el.className = `toast toast-${t}`;
    el.innerHTML = `
      <i class="toast-icon" data-lucide="${TOAST_ICONS[t] || 'info'}"></i>
      <span class="toast-message">${Utils.escapeHtml(msg)}</span>
      <button class="toast-close" aria-label="Close" data-lucide="x"></button>
      <div class="toast-progress" style="animation-duration:${dur}ms;"></div>
    `;
    c.appendChild(el);
    if (typeof lucide !== 'undefined' && lucide.createIcons) {
      try { lucide.createIcons(); } catch (_) {}
    }

    // Slide in
    requestAnimationFrame(() => el.classList.add('is-open'));

    let killed = false;
    const dismiss = () => {
      if (killed) return;
      killed = true;
      el.classList.remove('is-open');
      setTimeout(() => el.remove(), 260);
    };
    el.querySelector('.toast-close').addEventListener('click', dismiss);
    const tmr = setTimeout(dismiss, dur);
    el.addEventListener('mouseenter', () => clearTimeout(tmr));
    el.addEventListener('mouseleave', () => setTimeout(dismiss, 600));
    return dismiss;
  }

  // ─────────────── CONFIRM ───────────────
  // UI.confirm({ title, message, okText, cancelText, danger })
  // → Promise<boolean>
  function confirm(opts = {}) {
    return new Promise((resolve) => {
      const title   = opts.title   || 'Are you sure?';
      const message = opts.message || '';
      const okText  = opts.okText  || 'Confirm';
      const cancelText = opts.cancelText || 'Cancel';
      const danger  = !!opts.danger;
      const btnCls  = danger ? 'btn-danger' : 'btn-primary';

      const wrap = document.createElement('div');
      wrap.className = 'overlay';
      wrap.innerHTML = `
        <div class="modal modal-sm">
          <div class="modal-header">
            <div class="modal-title-group">
              <div class="modal-title">${Utils.escapeHtml(title)}</div>
            </div>
            <button class="modal-close" data-lucide="x"></button>
          </div>
          ${message ? `<div class="modal-body"><p>${Utils.escapeHtml(message)}</p></div>` : ''}
          <div class="modal-footer">
            <button class="btn btn-ghost" data-act="cancel">${Utils.escapeHtml(cancelText)}</button>
            <button class="btn ${btnCls}" data-act="ok">${Utils.escapeHtml(okText)}</button>
          </div>
        </div>`;
      document.body.appendChild(wrap);
      if (typeof lucide !== 'undefined' && lucide.createIcons) {
        try { lucide.createIcons(); } catch (_) {}
      }
      requestAnimationFrame(() => wrap.classList.add('is-open'));

      _modalStack.push(wrap);

      const close = (val) => {
        wrap.classList.remove('is-open');
        _modalStack = _modalStack.filter(m => m !== wrap);
        setTimeout(() => wrap.remove(), 220);
        resolve(val);
      };
      wrap.querySelector('[data-act="ok"]').addEventListener('click', () => close(true));
      wrap.querySelector('[data-act="cancel"]').addEventListener('click', () => close(false));
      wrap.querySelector('.modal-close').addEventListener('click', () => close(false));
      wrap.addEventListener('click', (e) => { if (e.target === wrap) close(false); });
      const onEsc = (e) => {
        if (e.key === 'Escape') { document.removeEventListener('keydown', onEsc); close(false); }
      };
      document.addEventListener('keydown', onEsc);
    });
  }

  // ─────────────── ALERT (info modal) ───────────────
  function alert(opts = {}) {
    return new Promise((resolve) => {
      const title   = opts.title   || 'Notice';
      const message = opts.message || '';
      const okText  = opts.okText  || 'OK';
      const wrap = document.createElement('div');
      wrap.className = 'overlay';
      wrap.innerHTML = `
        <div class="modal modal-sm">
          <div class="modal-header">
            <div class="modal-title-group"><div class="modal-title">${Utils.escapeHtml(title)}</div></div>
            <button class="modal-close" data-lucide="x"></button>
          </div>
          ${message ? `<div class="modal-body"><p>${Utils.escapeHtml(message)}</p></div>` : ''}
          <div class="modal-footer"><button class="btn btn-primary" data-act="ok">${Utils.escapeHtml(okText)}</button></div>
        </div>`;
      document.body.appendChild(wrap);
      if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch (_) {} }
      requestAnimationFrame(() => wrap.classList.add('is-open'));
      const close = () => { wrap.classList.remove('is-open'); setTimeout(() => wrap.remove(), 220); resolve(true); };
      wrap.querySelector('[data-act="ok"]').addEventListener('click', close);
      wrap.querySelector('.modal-close').addEventListener('click', close);
      wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
    });
  }

  // ─────────────── DRAWER ───────────────
  // UI.openDrawer(htmlString, { size:'lg'|'xl', title, subtitle })
  function openDrawer(html, opts = {}) {
    const size = opts.size ? 'drawer-' + opts.size : '';
    const wrap = document.createElement('div');
    wrap.className = 'drawer-overlay';
    wrap.innerHTML = `
      <div class="drawer ${size}">
        ${opts.title ? `
          <div class="drawer-header">
            <div class="drawer-title-group">
              <div class="drawer-title">${Utils.escapeHtml(opts.title)}</div>
              ${opts.subtitle ? `<div class="drawer-subtitle">${Utils.escapeHtml(opts.subtitle)}</div>` : ''}
            </div>
            <button class="modal-close" data-lucide="x"></button>
          </div>` : ''}
        <div class="drawer-body">${html || ''}</div>
      </div>`;
    document.body.appendChild(wrap);
    if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch (_) {} }
    requestAnimationFrame(() => wrap.classList.add('is-open'));

    _drawerStack.push(wrap);

    const close = () => {
      wrap.classList.remove('is-open');
      _drawerStack = _drawerStack.filter(d => d !== wrap);
      setTimeout(() => wrap.remove(), 260);
    };
    const closeBtn = wrap.querySelector('.modal-close');
    if (closeBtn) closeBtn.addEventListener('click', close);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
    return { el: wrap, close };
  }

  function closeTopDrawer() {
    const d = _drawerStack[_drawerStack.length - 1];
    if (!d) return false;
    d.classList.remove('is-open');
    _drawerStack.pop();
    setTimeout(() => d.remove(), 260);
    return true;
  }

  function closeTopModal() {
    const m = _modalStack[_modalStack.length - 1];
    if (!m) return false;
    m.classList.remove('is-open');
    _modalStack.pop();
    setTimeout(() => m.remove(), 220);
    return true;
  }

  // ─────────────── INLINE BUTTON FEEDBACK ───────────────
  // Usage: UI.btnSave(btnEl, async () => { ... await DB.update(...); })
  // Shows: [Save] → [Saving...] → [Saved ✓] → auto-revert
  async function btnSave(btn, asyncFn, opts = {}) {
    if (!btn || btn.disabled) return;
    const original = btn.innerHTML;
    const label    = opts.label    || 'Saving...';
    const successLabel = opts.successLabel || 'Saved';
    const revertMs = opts.revertMs ?? 1200;

    btn.disabled = true;
    btn.classList.add('is-loading');
    btn.innerHTML = `<i class="btn-icon" data-lucide="loader-2"></i><span>${Utils.escapeHtml(label)}</span>`;
    if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch (_) {} }

    try {
      await asyncFn();
      btn.classList.remove('is-loading');
      btn.classList.add('is-success');
      btn.innerHTML = `<i class="btn-icon" data-lucide="check"></i><span>${Utils.escapeHtml(successLabel)}</span>`;
      if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch (_) {} }
      setTimeout(() => {
        btn.classList.remove('is-success');
        btn.innerHTML = original;
        btn.disabled = false;
        if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch (_) {} }
      }, revertMs);
      return true;
    } catch (err) {
      btn.classList.remove('is-loading');
      btn.innerHTML = original;
      btn.disabled = false;
      if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch (_) {} }
      toast({ message: err && err.message || 'Action failed', type: 'error' });
      throw err;
    }
  }

  function btnLoading(btn, on = true, label = 'Loading...') {
    if (!btn) return;
    if (on) {
      btn.dataset._original = btn.dataset._original || btn.innerHTML;
      btn.disabled = true;
      btn.classList.add('is-loading');
      btn.innerHTML = `<i class="btn-icon" data-lucide="loader-2"></i><span>${Utils.escapeHtml(label)}</span>`;
    } else {
      btn.disabled = false;
      btn.classList.remove('is-loading');
      if (btn.dataset._original) { btn.innerHTML = btn.dataset._original; delete btn.dataset._original; }
    }
    if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch (_) {} }
  }

  // ─────────────── BADGE UPDATER ───────────────
  // Updates a header-btn's dot-badge (notification count)
  function setBadge(selector, count) {
    const el = document.querySelector(selector);
    if (!el) return;
    let badge = el.querySelector('.dot-badge');
    if (!count || count <= 0) { if (badge) badge.remove(); return; }
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'dot-badge';
      el.appendChild(badge);
    }
    badge.textContent = count > 99 ? '99+' : String(count);
  }

  // ─────────────── ESC CLOSES TOP-LEVEL ───────────────
  function installEscapeHandler() {
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (closeTopDrawer()) return;
      if (closeTopModal()) return;
    });
  }

  return {
    toast, confirm, alert,
    openDrawer, closeTopDrawer,
    closeTopModal,
    btnSave, btnLoading,
    setBadge,
    installEscapeHandler
  };
})();

  // ═══════════════════════════════════════════════════════════
//  ICON + HTML BUILDERS
//  Pure functions returning HTML strings. Pages compose UI here.
//  Rule: No DOM writes. No side effects. Safe defaults everywhere.
// ═══════════════════════════════════════════════════════════

const UIKIT = (function () {
  'use strict';

  // ─────────────── ICON ───────────────
  // icon('user')         → <i data-lucide="user" class="nav-icon"></i>
  // icon('user', 16)     → sets width/height attrs
  // icon('user', 16, 'nav-icon')
  function icon(name, size = null, cls = '') {
    const attrs = [
      `data-lucide="${Utils.escapeHtml(name)}"`,
      cls ? `class="${Utils.escapeHtml(cls)}"` : '',
      size ? `width="${size}" height="${size}"` : ''
    ].filter(Boolean).join(' ');
    return `<i ${attrs}></i>`;
  }

  // ─────────────── AVATAR ───────────────
  // avatar('Ravi Kumar')            → default md
  // avatar('Ravi Kumar', 'lg')
  // avatar({ name, src, size, round, status })
  function avatar(input, size = 'md', opts = {}) {
    const cfg = typeof input === 'object' ? input : { name: input, size, ...opts };
    const sizeCls = 'avatar-' + (cfg.size || 'md');
    const roundCls = cfg.round ? 'avatar-round' : '';
    const src = cfg.src ? `<img src="${Utils.escapeHtml(cfg.src)}" alt="">` : Utils.initials(cfg.name || '');
    const base = `<div class="avatar ${sizeCls} ${roundCls}">${src}</div>`;
    if (cfg.status) {
      return `<div class="avatar-wrap">${base}<span class="avatar-status ${cfg.status === 'online' ? 'is-online' : cfg.status === 'away' ? 'is-away' : 'is-busy'}"></span></div>`;
    }
    return base;
  }

  // ─────────────── BADGE ───────────────
  // badge('Active', 'success')
  // badge({ text, type, icon, critical })
  function badge(input, type = 'neutral') {
    const cfg = typeof input === 'object' ? input : { text: input, type };
    const t = cfg.type || 'neutral';
    const ic = cfg.icon ? icon(cfg.icon, 11, 'badge-icon') : '';
    const cls = `badge badge-${t}${cfg.critical ? ' badge-critical' : ''}`;
    return `<span class="${cls}">${ic}${Utils.escapeHtml(cfg.text || '')}</span>`;
  }

  // ─────────────── CHIP ───────────────
  function chip(input, opts = {}) {
    const cfg = typeof input === 'object' ? input : { label: input, ...opts };
    const active = cfg.active ? 'is-active' : '';
    const count = cfg.count != null ? `<span class="chip-count">${Utils.escapeHtml(String(cfg.count))}</span>` : '';
    const data = cfg.data ? ` data-value="${Utils.escapeHtml(cfg.data)}"` : '';
    return `<button type="button" class="chip ${active}"${data}>${Utils.escapeHtml(cfg.label || '')}${count}</button>`;
  }

  // ─────────────── BUTTON ───────────────
  // button('Save', 'primary')
  // button({ label, variant, size, icon, block, id, attrs })
  function button(input, variant = 'primary', opts = {}) {
    const cfg = typeof input === 'object' ? input : { label: input, variant, ...opts };
    const v = cfg.variant || 'primary';
    const s = cfg.size ? ' btn-' + cfg.size : '';
    const b = cfg.block ? ' btn-block' : '';
    const id = cfg.id ? ` id="${Utils.escapeHtml(cfg.id)}"` : '';
    const data = cfg.data ? ` data-action="${Utils.escapeHtml(cfg.data)}"` : '';
    const disabled = cfg.disabled ? ' disabled' : '';
    const ic = cfg.icon ? icon(cfg.icon, null, 'btn-icon') : '';
    return `<button type="button"${id} class="btn btn-${v}${s}${b}"${data}${disabled}>${ic}<span>${Utils.escapeHtml(cfg.label || '')}</span></button>`;
  }

  // ─────────────── ICON BUTTON ───────────────
  function iconButton(iconName, opts = {}) {
    const cls = `btn-icon-only${opts.size ? ' btn-icon-' + opts.size : ''}`;
    const title = opts.title ? ` title="${Utils.escapeHtml(opts.title)}"` : '';
    const data = opts.data ? ` data-action="${Utils.escapeHtml(opts.data)}"` : '';
    return `<button type="button" class="${cls}"${title}${data}>${icon(iconName, 18, 'btn-icon')}</button>`;
  }

  // ─────────────── EMPTY STATE ───────────────
  // emptyState({ icon, title, message, actionLabel, actionData })
  function emptyState(opts = {}) {
    const ic = icon(opts.icon || 'inbox', 56, 'empty-icon');
    const action = opts.actionLabel
      ? `<div class="empty-action">${button({ label: opts.actionLabel, variant: opts.actionVariant || 'primary', icon: opts.actionIcon, data: opts.actionData })}</div>`
      : '';
    return `
      <div class="empty-state">
        ${ic}
        <div class="empty-title">${Utils.escapeHtml(opts.title || 'Nothing here yet')}</div>
        ${opts.message ? `<div class="empty-message">${Utils.escapeHtml(opts.message)}</div>` : ''}
        ${action}
      </div>`;
  }

  // ─────────────── ERROR STATE ───────────────
  function errorState(opts = {}) {
    return emptyState({
      icon: opts.icon || 'alert-triangle',
      title: opts.title || 'Something went wrong',
      message: opts.message || 'Please try again.',
      actionLabel: opts.retryLabel || 'Retry',
      actionData: opts.retryData || 'retry',
      actionVariant: 'primary',
      actionIcon: 'refresh-cw'
    });
  }

  // ─────────────── SKELETON ───────────────
  function skeleton(kind = 'text', opts = {}) {
    const cls = 'skeleton skeleton-' + kind;
    const style = opts.width ? ` style="width:${opts.width};"` : '';
    return `<div class="${cls}"${style}></div>`;
  }

  // ─────────────── STAT CARD ───────────────
  // statCard({ label, value, icon, data })
  function statCard(opts = {}) {
    const ic = opts.icon ? `<div class="stat-icon">${icon(opts.icon, 18)}</div>` : '';
    return `
      <div class="card card-stat"${opts.data ? ` data-action="${Utils.escapeHtml(opts.data)}"` : ''}>
        <div class="stat-header">${ic}</div>
        <div class="stat-value">${Utils.escapeHtml(String(opts.value ?? '—'))}</div>
        <div class="stat-label">${Utils.escapeHtml(opts.label || '')}</div>
      </div>`;
  }

  // ─────────────── LIST ITEM ───────────────
  // listItem({ title, subtitle, left, right, data })
  function listItem(opts = {}) {
    const left = opts.left || '';
    const right = opts.right || '';
    return `
      <div class="list-item"${opts.data ? ` data-action="${Utils.escapeHtml(opts.data)}"` : ''}>
        ${left}
        <div class="list-content">
          <div class="list-title">${Utils.escapeHtml(opts.title || '')}</div>
          ${opts.subtitle ? `<div class="list-subtitle">${Utils.escapeHtml(opts.subtitle)}</div>` : ''}
        </div>
        ${right}
      </div>`;
  }

  // ─────────────── DROPDOWN MENU ───────────────
  // menu([{ label, icon, data, danger }]) → wraps in .dropdown
  function dropdown(triggerHtml, items = []) {
    const rows = items.map(it => {
      if (it.separator) return '<div class="dropdown-separator"></div>';
      const ic = it.icon ? icon(it.icon, 15, 'dropdown-icon') : '';
      return `<div class="dropdown-item${it.danger ? ' is-danger' : ''}"${it.data ? ` data-action="${Utils.escapeHtml(it.data)}"` : ''}>${ic}${Utils.escapeHtml(it.label || '')}</div>`;
    }).join('');
    return `
      <div class="dropdown">
        ${triggerHtml}
        <div class="dropdown-menu">${rows}</div>
      </div>`;
  }

  // ─────────────── FIELD WRAPPER ───────────────
  // field({ label, required, html, helper, error })
  function field(opts = {}) {
    const req = opts.required ? ' <span class="required">*</span>' : '';
    const label = opts.label ? `<label class="field-label">${Utils.escapeHtml(opts.label)}${req}</label>` : '';
    const helper = opts.helper ? `<div class="field-helper">${Utils.escapeHtml(opts.helper)}</div>` : '';
    const error = opts.error ? `<div class="field-error">${Utils.escapeHtml(opts.error)}</div>` : '';
    return `<div class="field">${label}${opts.html || ''}${helper}${error}</div>`;
  }

  // ─────────────── TABLE BUILDER ───────────────
  // table({ columns:[{key,label,align}], rows:[{...}], empty })
  function table(opts = {}) {
    const cols = opts.columns || [];
    const rows = opts.rows || [];
    const head = cols.map(c => `<th${c.align ? ` style="text-align:${c.align};"` : ''}>${Utils.escapeHtml(c.label || '')}</th>`).join('');
    if (!rows.length) {
      return `<div class="table-wrap">${emptyState(opts.empty || { title: 'No data', icon: 'inbox' })}</div>`;
    }
    const body = rows.map(r => {
      const tds = cols.map(c => `<td>${r[c.key] ?? ''}</td>`).join('');
      return `<tr${r._id ? ` data-id="${Utils.escapeHtml(r._id)}"` : ''}>${tds}</tr>`;
    }).join('');
    return `
      <div class="table-wrap">
        <div class="table-scroll">
          <table class="table">
            <thead><tr>${head}</tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      </div>`;
  }

  // ─────────────── TABS (builder) ───────────────
  // tabs([{ id, label, active }], { pill })
  function tabs(items = [], opts = {}) {
    const pill = opts.pill;
    if (pill) {
      const rows = items.map(t => `<button type="button" class="tab-pill${t.active ? ' is-active' : ''}" data-tab="${Utils.escapeHtml(t.id)}">${Utils.escapeHtml(t.label)}</button>`).join('');
      return `<div class="tabs-pill">${rows}</div>`;
    }
    const rows = items.map(t => `<button type="button" class="tab${t.active ? ' is-active' : ''}" data-tab="${Utils.escapeHtml(t.id)}">${Utils.escapeHtml(t.label)}</button>`).join('');
    return `<div class="tabs">${rows}</div>`;
  }

  // ─────────────── PROGRESS ───────────────
  function progress(pct, variant = '') {
    const v = variant ? ' is-' + variant : '';
    const p = Utils.clamp(pct, 0, 100);
    return `<div class="progress"><div class="progress-bar${v}" style="width:${p}%;"></div></div>`;
  }

  // ─────────────── SPINNER ───────────────
  function spinner(lg = false) {
    return `<span class="spinner${lg ? ' spinner-lg' : ''}"></span>`;
  }

  return {
    icon, avatar, badge, chip, button, iconButton,
    emptyState, errorState, skeleton,
    statCard, listItem, dropdown,
    field, table, tabs, progress, spinner
  };
})();

  // ═══════════════════════════════════════════════════════════
//  GLOBAL ERROR HANDLER + BOOT SEQUENCE + INIT GLUE
//  Rule: Ek hi boot(). Sab errors yahan catch honge.
// ═══════════════════════════════════════════════════════════

const Boot = (function () {
  'use strict';

  let _booted = false;
  let _renderApp = null; // set by app shell (Chunk 20)

  // ─────────────── GLOBAL ERROR HANDLERS ───────────────
  function installErrorHandlers() {
    window.addEventListener('error', (e) => {
      console.error('[7H Error]', e.message, e.filename, e.lineno);
      // Silently ignore 404s for manifest/icons during dev
      if (/manifest\.json|icon-/.test(e.filename || '')) return;
    });

    window.addEventListener('unhandledrejection', (e) => {
      console.error('[7H Unhandled]', e.reason);
      // Non-fatal — keep UI alive
    });
  }

  // ─────────────── OFFLINE BANNER ───────────────
  function installOfflineBanner() {
    const ensure = () => {
      let b = document.getElementById('offline-banner');
      if (!b) {
        b = document.createElement('div');
        b.id = 'offline-banner';
        b.style.cssText = [
          'position:fixed', 'top:0', 'left:0', 'right:0',
          'background:#F59E0B', 'color:#fff', 'font:500 12px Inter,sans-serif',
          'padding:6px 12px', 'text-align:center', 'z-index:9999',
          'transform:translateY(-100%)', 'transition:transform .25s'
        ].join(';');
        b.textContent = 'You are offline — changes will sync automatically.';
        document.body.appendChild(b);
      }
      return b;
    };
    const update = () => {
      const b = ensure();
      b.style.transform = STATE.online ? 'translateY(-100%)' : 'translateY(0)';
    };
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    update();
  }

  // ─────────────── PWA SERVICE WORKER ───────────────
  function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol === 'file:') return; // skip on file://
    navigator.serviceWorker.register('service-worker.js').catch((err) => {
      console.warn('[7H] SW registration skipped:', err.message);
    });
  }

  // ─────────────── HIDE BOOT LOADER ───────────────
  function hideBootLoader() {
    const el = document.getElementById('boot-loader');
    if (el) {
      el.classList.add('is-hidden');
      setTimeout(() => el.remove(), 500);
    }
  }

  // ─────────────── SHOW LOGIN (fallback for Chunk 20-30) ───────────────
  function showLoginPlaceholder() {
    const app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = `
      <div class="page" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <div class="card" style="max-width:420px;width:100%;text-align:center;">
          <h1 style="font-family:var(--font-serif);font-size:var(--fs-3xl);letter-spacing:-0.02em;margin-bottom:12px;">Seven Horses</h1>
          <p class="text-muted" style="font-size:var(--fs-sm);">Authentication ready. Login UI arrives in Chunk 30.</p>
        </div>
      </div>`;
  }

  // ─────────────── SHOW DASHBOARD (fallback for Chunk 20-30) ───────────────
  function showDashboardPlaceholder(profile) {
    const app = document.getElementById('app');
    if (!app) return;
    const role = (STATE.roles && STATE.roles[0]) || 'USER';
    app.innerHTML = `
      <div class="page" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <div class="card" style="max-width:520px;width:100%;text-align:center;">
          <h1 style="font-family:var(--font-serif);font-size:var(--fs-3xl);letter-spacing:-0.02em;margin-bottom:12px;">Welcome back</h1>
          <p class="text-muted" style="font-size:var(--fs-sm);margin-bottom:16px;">
            ${Utils.escapeHtml(profile && (profile.name || profile.email) || 'User')} · Role: ${Utils.escapeHtml(role)}
          </p>
          <button class="btn btn-ghost" id="logout-btn">${UIKIT.icon('log-out', 14, 'btn-icon')} Sign out</button>
        </div>
      </div>`;
    const lo = document.getElementById('logout-btn');
    if (lo) lo.addEventListener('click', () => Auth.logout());
  }

  // ─────────────── BOOT ───────────────
  async function boot(opts = {}) {
    if (_booted) return;
    _booted = true;
    STATE.booted = true;

    console.log('[7H] Boot sequence started · v' + APP.version);

    installErrorHandlers();
    installOfflineBanner();
    registerServiceWorker();

    // Load config from Firestore (falls back to defaults)
    await Config.load();
    // Attach realtime config sync
    Config.watch();

    // Attach auth observer
    Auth.observe((user, profile) => {
      hideBootLoader();

      // Custom renderer provided by Chunk 20+ (app shell)
      if (typeof _renderApp === 'function') {
        _renderApp(user, profile);
        return;
      }

      // Fallback UI (until Chunk 20-30 land)
      if (!user || !profile) showLoginPlaceholder();
      else showDashboardPlaceholder(profile);
    });

    UI.installEscapeHandler();
    Router.installBackHandler();

    console.log('[7H] Boot sequence complete');
  }

  // ─────────────── CUSTOM RENDERER HOOK ───────────────
  // Chunk 20 will call Boot.setRenderer(fn) with the actual app shell.
  function setRenderer(fn) {
    _renderApp = typeof fn === 'function' ? fn : null;
  }

  return { boot, setRenderer };
})();

// ─────────────── AUTO BOOT ───────────────
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => Boot.boot());
} else {
  Boot.boot();
}

const AppShell = (function () {

  // Nav config — role filters applied at render time.
  // Page IDs will be registered in later chunks (21+).
  const NAV = [
    { section: 'Main' },
    { id: 'dashboard',   label: 'Dashboard',    icon: 'layout-dashboard' },
    { id: 'companies',   label: 'Companies',    icon: 'building-2',   badge: 'companies' },
    { id: 'candidates',  label: 'Candidates',   icon: 'users',        badge: 'candidates' },
    { id: 'requirements',label: 'Requirements', icon: 'clipboard-list' },
    { section: 'Work' },
    { id: 'tasks',       label: 'Tasks',        icon: 'check-square', badge: 'tasks' },
    { id: 'calendar',    label: 'Calendar',     icon: 'calendar' },
    { id: 'chat',        label: 'Chat',         icon: 'message-circle', badge: 'chats' },
    { section: 'Finance' },
    { id: 'invoices',    label: 'Invoices',     icon: 'file-text' },

    { id: 'settings',    label: 'Settings',     icon: 'settings' }

    ADMIN:  ['dashboard','companies','candidates','requirements','tasks','calendar','chat','invoices','payments','reports','audit','employees','settings'],
    MANAGER:['dashboard','companies','candidates','requirements','tasks','calendar','chat','reports','audit','employees'],
    EMPLOYEE:['dashboard','companies','candidates','requirements','tasks','calendar','chat'],

  // ─────────────── FILTER NAV BY ROLE ───────────────
  function visibleNav() {
    const roles = STATE.roles || [];
    const allow = new Set();
    for (const r of roles) {
      (ROLE_VISIBLE[r] || []).forEach(id => allow.add(id));
    }
    if (STATE.permissions && STATE.permissions.all) {
      // MASTER sees everything
      NAV.forEach(n => n.id && allow.add(n.id));

    const out = [];
    for (const item of NAV) {
      if (item.section) { out.push(item); continue; }

    return out.filter((item, i, arr) => {
      if (!item.section) return true;
      // section only if next non-section item exists
      for (let j = i + 1; j < arr.length; j++) {

  <script>
    'use strict';

// ═══════════════════════════════════════════════════════════
//  COMPANIES SERVICE
//  Stage flow: PROSPECT → LEAD → INTERESTED → CLIENT → PLACED → REPEAT
//  Agreement-First: client portal access only if agreement signed.
//  Rule: DB.* use karo, kabhi Firestore ko direct touch nahi.

const Companies = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.COMPANIES;

  // ─────────────── CREATE ───────────────
  async function create(data, opts = {}) {
    const payload = normalizePayload(data);
    validate(payload);

    // Duplicate check (block vs warn)
    const dup = await checkDuplicate(payload, opts.ignoreId);
    if (dup.block) throw new Error(dup.message);
    if (dup.warn && !opts.allowWarn) {
      console.warn('[Companies.create] Fuzzy match:', dup.message);
    }

    payload.stage = payload.stage || 'PROSPECT';
    payload.ownerId = payload.ownerId || STATE.user?.uid || null;
    payload.agreementSigned = false;
    payload.portalAccess = false;

    const id = await DB.add(COL, payload);
    await logActivity(id, 'created', { by: STATE.user?.uid });
    return id;
  }

  // ─────────────── READ ───────────────
  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function list(filters = {}) {
    const opts = { orderBy: ['updatedAt', 'desc'] };
    const where = [];
    if (filters.stage) where.push(['stage', '==', filters.stage]);
    if (filters.stages) where.push(['stage', 'in', filters.stages]);
    if (filters.ownerId) where.push(['ownerId', '==', filters.ownerId]);
    if (filters.serviceType) where.push(['serviceType', '==', filters.serviceType]);
    if (filters.isDeleted !== undefined) where.push(['isDeleted', '==', filters.isDeleted]);
    if (where.length) opts.where = where;
    if (filters.limit) opts.limit = filters.limit;
    return DB.list(COL, opts);
  }

  async function search(term, limit = 20) {
    const t = String(term || '').trim().toLowerCase();
    if (!t) return [];
    const rows = await list({ limit: 200 });
    return rows.filter(r => {
      return (r.name || '').toLowerCase().includes(t)
          || (r.city || '').toLowerCase().includes(t)
          || (r.email || '').toLowerCase().includes(t)
          || (r.phone || '').includes(t);
    }).slice(0, limit);
  }

  // ─────────────── UPDATE ───────────────
  async function update(id, data) {
    if (!id) throw new Error('Company id required');
    const patch = normalizePayload(data, true);
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'updated', { by: STATE.user?.uid, keys: Object.keys(patch) });
    return id;
  }

  async function setStage(id, newStage, meta = {}) {
    if (!CONST.COMPANY_STAGES.includes(newStage)) {
      throw new Error('Invalid stage: ' + newStage);
    }
    const patch = {
      stage: newStage,
      stageChangedAt: DB.ts(),
      stageChangedBy: STATE.user?.uid || null
    };
    if (newStage === 'CLIENT') patch.becameClientAt = DB.ts();
    if (newStage === 'BLACKLISTED') {
      patch.blacklistReason = meta.reason || null;
      patch.blacklistedAt = DB.ts();
    }
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'stage:' + newStage, { by: STATE.user?.uid, ...meta });
    return id;
  }

  async function assignOwner(id, ownerId) {
    return update(id, { ownerId });
  }

  // ─────────────── AGREEMENT-FIRST ───────────────
  async function markAgreementSigned(id, agreementId) {
    await DB.update(`${COL}/${id}`, {
      agreementSigned: true,
      agreementId,
      agreementSignedAt: DB.ts(),
      portalAccess: true
    });
    await logActivity(id, 'agreement:signed', { agreementId });
  }

  async function revokeAgreement(id, reason = '') {
    await DB.update(`${COL}/${id}`, {
      agreementSigned: false,
      agreementRevokedAt: DB.ts(),
      portalAccess: false,
      agreementRevokeReason: reason
    });
    await logActivity(id, 'agreement:revoked', { reason });
  }

  // ─────────────── DELETE ───────────────
  async function softDelete(id) {
    await DB.softDelete(`${COL}/${id}`, STATE.user?.uid || null);
    await logActivity(id, 'soft-deleted', { by: STATE.user?.uid });
  }

  async function restore(id) {
    await DB.restore(`${COL}/${id}`);
    await logActivity(id, 'restored', { by: STATE.user?.uid });
  }

  // ─────────────── DUPLICATE CHECK ───────────────
  async function checkDuplicate(data, ignoreId = null) {
    const phone = Utils.normalizePhone(data.phone);
    const email = Utils.normalizeEmail(data.email);
    const website = Utils.normalizeWebsite(data.website);
    const name = Utils.normalizeName(data.name);
    const city = Utils.normalizeName(data.city);

    if (!phone && !email && !website && !(name && city)) {
      return { block: false, warn: false };
    }

    const rows = await DB.list(COL, { limit: 500 });

    for (const r of rows) {
      if (ignoreId && r.id === ignoreId) continue;
      if (phone && Utils.normalizePhone(r.phone) === phone) {
        return { block: true, warn: false, message: `Company with phone ${phone} already exists.` };
      }
      if (email && Utils.normalizeEmail(r.email) === email) {
        return { block: true, warn: false, message: `Company with email ${email} already exists.` };
      }
      if (website && Utils.normalizeWebsite(r.website) === website) {
        return { block: true, warn: false, message: `Company with website ${website} already exists.` };
      }
    }

    if (name && city) {
      for (const r of rows) {
        if (ignoreId && r.id === ignoreId) continue;
        const rn = Utils.normalizeName(r.name);
        const rc = Utils.normalizeName(r.city);
        if (!rn || !rc) continue;
        if (similarity(name, rn) >= 0.8 && rc === city) {
          return { block: false, warn: true, message: `Similar company "${r.name}" in ${r.city} exists.` };
        }
      }
    }

    return { block: false, warn: false };
  }

  function similarity(a, b) {
    if (a === b) return 1;
    if (!a || !b) return 0;
    const bigrams = (s) => {
      const set = new Map();
      for (let i = 0; i < s.length - 1; i++) {
        const g = s.substring(i, i + 2);
        set.set(g, (set.get(g) || 0) + 1);
      }
      return set;
    };
    const A = bigrams(a); const B = bigrams(b);
    let inter = 0;
    for (const [g, c] of A) if (B.has(g)) inter += Math.min(c, B.get(g));
    const total = (a.length - 1) + (b.length - 1);
    return total > 0 ? (2 * inter) / total : 0;
  }

  // ─────────────── VALIDATION ───────────────
  function validate(data) {
    if (!data.name || !data.name.trim()) throw new Error('Company name is required');
    if (data.email && !Utils.isEmail(data.email)) throw new Error('Invalid email');
    if (data.phone && !Utils.isPhone(data.phone)) throw new Error('Invalid phone (10 digits, starts 6-9)');
    if (data.gstin && !Utils.isGSTIN(data.gstin)) throw new Error('Invalid GSTIN format');
  }

  // ─────────────── NORMALIZE ───────────────
  function normalizePayload(data, isUpdate = false) {
    const out = {};
    const keep = [
      'name','legalName','email','phone','alternatePhone','website',
      'address','city','state','pincode','country','gstin',
      'industry','companySize','serviceType','stage','ownerId',
      'notes','tags','source','referral','contactPerson','contactDesignation'
    ];
    for (const k of keep) {
      if (data[k] !== undefined) out[k] = data[k];
    }
    if (out.email) out.email = Utils.normalizeEmail(out.email);
    if (out.phone) out.phone = Utils.normalizePhone(out.phone);
    if (out.website) out.website = Utils.normalizeWebsite(out.website);
    if (out.gstin) out.gstin = String(out.gstin).trim().toUpperCase();
    if (!isUpdate) {
      out.dupKeys = {
        phone: out.phone || '',
        email: out.email || '',
        website: out.website || '',
        nameCity: (Utils.normalizeName(out.name) + '|' + Utils.normalizeName(out.city))
      };
    }
    return out;
  }

  // ─────────────── ACTIVITY LOG ───────────────
  async function logActivity(companyId, action, meta = {}) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'company',
        companyId,
        action,
        meta,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  // ─────────────── REALTIME ───────────────
  function watch(id, cb) {
    return DB.watch(`${COL}/${id}`, cb);
  }

  function watchList(filters, cb) {
    const opts = { orderBy: ['updatedAt', 'desc'], limit: filters.limit || 50 };
    const where = [];
    if (filters.stage) where.push(['stage', '==', filters.stage]);
    if (filters.ownerId) where.push(['ownerId', '==', filters.ownerId]);
    if (where.length) opts.where = where;
    return DB.watchList(COL, opts, cb);
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    create, getById, list, search,
    update, setStage, assignOwner,
    markAgreementSigned, revokeAgreement,
    softDelete, restore,
    checkDuplicate,
    watch, watchList,
    STAGES: CONST.COMPANY_STAGES
  };
})();
