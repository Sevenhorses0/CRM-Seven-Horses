        ${UIKIT.field({ label: 'Note (optional)', html: `<textarea class="textarea" name="notes" placeholder="Add context…"></textarea>` })}
      </form>`;
    const d = UI.openDrawer(html, { title: 'Send Task in Chat', subtitle: 'Task will be posted as a special message', size: 'md' });

    const footer = document.createElement('div');
    footer.className = 'drawer-footer';
    footer.innerHTML = `
      ${UIKIT.button({ label: 'Cancel', variant: 'ghost', data: 'cancel' })}
      ${UIKIT.button({ label: 'Send Task', variant: 'primary', icon: 'send', data: 'send-task' })}
    `;
    d.el.querySelector('.drawer').appendChild(footer);

    footer.querySelector('[data-action="cancel"]').addEventListener('click', d.close);
    footer.querySelector('[data-action="save"]')?.addEventListener('click', () => {});
    // safer bind
    footer.querySelectorAll('button[data-action]').forEach(btn => {
      if (btn.dataset.action !== 'send-task') return;
      btn.addEventListener('click', async (e) => {
        const form = d.el.querySelector('#task-in-chat-form');
        if (!form.reportValidity()) return;
        const obj = {};
        new FormData(form).forEach((v, k) => { const s = String(v).trim(); if (s) obj[k] = s; });
        await UI.btnSave(e.currentTarget, async () => {
          await Chat.sendMessage({
            chatId: _activeChatId,
            text: obj.title,
            task: { title: obj.title, priority: obj.priority || 'medium', dueDate: obj.dueDate || null, notes: obj.notes || '' },
            senderName: STATE.profile?.name || STATE.user?.email || 'You'
          });
          UI.toast({ message: 'Task sent in chat', type: 'success' });
          d.close();
          _messages = await Chat.listMessages(_activeChatId, { limit: 100 });
          refreshMessages();
        });
      });
    });
  }

  // ─────────────── NEW CHAT DRAWER ───────────────
  async function openNewChatDrawer() {
    // Refresh teammates
    try {
      const all = await DB.list(CONST.COLLECTIONS.USERS, { limit: 300 });
      _teammates = all.filter(u => u.primaryRole !== 'CLIENT' && u.id !== STATE.user?.uid && u.status === 'active');
    } catch (_) {}

    const teammateOptions = _teammates.length
      ? _teammates.map(t => `
          <label class="checkbox" style="padding:8px;border-bottom:1px solid var(--border-light);">
            <input type="checkbox" name="member" value="${Utils.escapeHtml(t.id)}" data-name="${Utils.escapeHtml(t.name || t.email || '')}">
            <span>${Utils.escapeHtml(t.name || t.email || t.id)} <span class="text-muted" style="font-size:11px;">· ${Utils.escapeHtml(t.primaryRole || '')}</span></span>
          </label>`).join('')
      : '<div class="text-muted" style="font-size:12px;padding:10px;">No teammates found.</div>';

    const html = `
      <form id="new-chat-form" style="display:flex;flex-direction:column;">
        ${UIKIT.field({ label: 'Chat Type', html: `
          <select class="select" name="type" id="new-chat-type">
            <option value="direct" selected>Direct (1-on-1)</option>
            <option value="group">Group (max 20)</option>
          </select>` })}

        <div id="new-chat-group-name" style="display:none;">
          ${UIKIT.field({ label: 'Group Name', html: `<input class="input" name="name" placeholder="Ops Team">` })}
        </div>

        <div class="field-label" style="margin-bottom:8px;">Select ${_teammates.length ? 'teammate' : 'members'}</div>
        <div style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);padding:4px;">
          ${teammateOptions}
        </div>
      </form>`;
    const d = UI.openDrawer(html, { title: 'New Chat', subtitle: 'Start a conversation', size: 'lg' });

    // Toggle group name field
    const typeSel = d.el.querySelector('#new-chat-type');
    const grpName = d.el.querySelector('#new-chat-group-name');
    typeSel.addEventListener('change', () => {
      grpName.style.display = typeSel.value === 'group' ? '' : 'none';
    });

    const footer = document.createElement('div');
    footer.className = 'drawer-footer';
    footer.innerHTML = `
      ${UIKIT.button({ label: 'Cancel', variant: 'ghost', data: 'cancel' })}
      ${UIKIT.button({ label: 'Start Chat', variant: 'primary', icon: 'message-plus', data: 'create' })}
    `;
    d.el.querySelector('.drawer').appendChild(footer);

    footer.querySelector('[data-action="cancel"]').addEventListener('click', d.close);
    footer.querySelector('[data-action="create"]').addEventListener('click', async (e) => {
      const form = d.el.querySelector('#new-chat-form');
      const checked = [...form.querySelectorAll('input[name="member"]:checked')];
      const type = typeSel.value;

      if (!checked.length) { UI.toast({ message: 'Select at least one member', type: 'error' }); return; }
      if (type === 'direct' && checked.length !== 1) { UI.toast({ message: 'Select exactly 1 member for direct chat', type: 'error' }); return; }
      if (type === 'group' && checked.length > 19) { UI.toast({ message: 'Group max 20 (incl. you)', type: 'error' }); return; }

      const memberIds = checked.map(c => c.value);
      const memberNames = {};
      checked.forEach(c => { memberNames[c.value] = c.dataset.name || c.value; });
      if (STATE.user?.uid) memberNames[STATE.user.uid] = STATE.profile?.name || STATE.user.email || 'You';

      await UI.btnSave(e.currentTarget, async () => {
        let chatId;
        if (type === 'direct') {
          chatId = await Chat.getOrCreateDirect(memberIds[0]);
        } else {
          const name = form.querySelector('[name="name"]').value.trim() || 'Group';
          chatId = await Chat.createChat({ type: 'group', name, members: memberIds, memberNames });
        }
        UI.toast({ message: 'Chat ready', type: 'success' });
        d.close();
        _chats = await Chat.listMine({ limit: 100 });
        refreshList();
        await selectChat(chatId);
      });
    });
  }

  // ─────────────── MEMBERS DRAWER (group) ───────────────
  async function openMembersDrawer() {
    if (!_activeChat || _activeChat.type !== 'group') return;
    const members = _activeChat.members || [];
    const html = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${members.map(m => {
          const t = _teammates.find(x => x.id === m);
          const name = t?.name || _activeChat.memberNames?.[m] || m;
          const isMe = m === STATE.user?.uid;
          const isCreator = m === _activeChat.createdBy;
          return `
            <div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);">
              <div class="avatar avatar-sm">${Utils.initials(name, 2)}</div>
              <div style="flex:1;min-width:0;">
                <div style="font-size:13px;font-weight:600;">${Utils.escapeHtml(name)} ${isMe ? '<span class="text-muted" style="font-size:11px;">(you)</span>' : ''}</div>
                <div class="text-muted" style="font-size:11px;">${isCreator ? 'Creator' : ''}</div>
              </div>
              ${(!isMe && isCreator) || (!isMe && canRemove()) ? UIKIT.iconButton('user-minus', { size: 'sm', data: 'remove-member', title: 'Remove' }) : ''}
            </div>`;
        }).join('')}
      </div>`;
    const d = UI.openDrawer(html, {
      title: _activeChat.name || 'Group',
      subtitle: `${members.length} members`,
      size: 'md'
    });

    d.el.querySelectorAll('[data-action="remove-member"]').forEach((btn, idx) => {
      const m = members[idx + 1] || members.find(x => x !== STATE.user?.uid);
      btn.addEventListener('click', async () => {
        const ok = await UI.confirm({ title: 'Remove member?', message: 'They will lose access to this chat.', danger: true, okText: 'Remove' });
        if (!ok) return;
        try {
          await Chat.removeMember(_activeChat.id, m);
          UI.toast({ message: 'Member removed', type: 'success' });
          d.close();
          _activeChat = await Chat.getById(_activeChat.id);
          refreshPanel();
        } catch (err) {
          UI.toast({ message: err.message, type: 'error' });
        }
      });
    });
  }

  function canRemove() {
    const myRole = STATE.primaryRole;
    return ['MASTER','ADMIN','MANAGER'].includes(myRole);
  }

  // ─────────────── REALTIME ───────────────
  function attachRealtime() {
    // Watch my chat list
    _unsubChats = Chat.watchMine((rows) => {
      _chats = rows;
      if (Router.current() !== 'chat') return;
      refreshList();
      // Update active chat from fresh list
      if (_activeChatId) {
        const fresh = _chats.find(c => c.id === _activeChatId);
        if (fresh) { _activeChat = fresh; refreshPanel(); }
      }
    }, 100);

    // Watch active chat messages
    if (_activeChatId) {
      _unsubMessages = Chat.watchMessages(_activeChatId, (rows) => {
        _messages = rows;
        if (Router.current() === 'chat') refreshMessages();
      }, 100);
    }
  }

  // ═══════════════ RETURN + CLOSE IIFE ═══════════════
  return { renderPage, after };
})();

// ─────────────── REGISTER ROUTE ───────────────
Router.register('chat', {
  title: 'Chat',
  render: ChatPage.renderPage,
  after: ChatPage.after,
  permission: ['chat', 'view']
});

const ReportsPage = (function () {

  // ─────────────── RANGE HELPERS ───────────────

    const to = new Date();

    if (preset === '7d') from.setDate(to.getDate() - 7);
    else if (preset === '30d') from.setDate(to.getDate() - 30);
    else if (preset === '90d') from.setDate(to.getDate() - 90);
    else if (preset === 'mtd') { from.setDate(1); }
    else if (preset === 'ytd') { from.setMonth(0); from.setDate(1); }
    return {
      from: from.toISOString().slice(0, 10),
      to: to.toISOString().slice(0, 10),

    };

    const fromMs = new Date(_range.from).getTime();
    const toMs = new Date(_range.to).getTime() + 86400000;

    // Fetch all relevant collections (bounded limit for free tier)
    const [companies, candidates, invoices, payments, contracts, employees] = await Promise.all([
      DB.list(CONST.COLLECTIONS.COMPANIES, { limit: 1000 }).catch(() => []),
      DB.list(CONST.COLLECTIONS.CANDIDATES, { limit: 1000 }).catch(() => []),
      DB.list(CONST.COLLECTIONS.INVOICES, { limit: 1000 }).catch(() => []),
      DB.list(CONST.COLLECTIONS.PAYMENTS, { limit: 1000 }).catch(() => []),
      DB.list(CONST.COLLECTIONS.CONTRACT_STAFF, { limit: 500 }).catch(() => []),
      DB.list(CONST.COLLECTIONS.USERS, { limit: 300 }).catch(() => [])
    ]);

    // Filter by range + optional company
    const inRange = (ts) => {
      if (!ts) return false;
      const ms = ts.toMillis ? ts.toMillis() : new Date(ts).getTime();
      return ms >= fromMs && ms <= toMs;
    };

    const compFilter = (c) => !_companyId || c.id === _companyId || c.companyId === _companyId;

    const filteredCompanies = companies.filter(c => inRange(c.createdAt));
    const filteredCandidates = candidates.filter(c => inRange(c.createdAt) && compFilter(c));
    const filteredInvoices = invoices.filter(i => inRange(i.createdAt) && compFilter(i));
    const filteredPayments = payments.filter(p => inRange(p.recordedAt || p.createdAt) && compFilter(p));

    // KPI aggregations
    const placed = filteredCandidates.filter(c => c.stage === 'PLACED').length;
    const placedTotal = candidates.filter(c => c.stage === 'PLACED' && compFilter(c)).length;

    // Revenue
    const revenue = {
      billed: filteredInvoices.reduce((s, i) => s + (Number(i.total) || 0), 0),
      received: filteredPayments.filter(p => p.status === 'RECORDED' || p.status === 'RECONCILED')
        .reduce((s, p) => s + (Number(p.amount) || 0), 0),
      outstanding: filteredInvoices.reduce((s, i) => s + (Number(i.balance) || 0), 0),
      overdue: filteredInvoices.filter(i => {
        if (i.status === 'PAID' || i.status === 'CANCELLED') return false;
        return i.dueDate && new Date(i.dueDate).getTime() < Date.now();
      }).length
    };

    // Trend — group by day for ≤30 days, by week otherwise
    const spanDays = Math.round((toMs - fromMs) / 86400000);
    const trend = buildTrend(filteredCandidates, spanDays);

    // Funnel — stage counts
    const funnel = [
      { label: 'New', value: candidates.filter(c => c.stage === 'NEW' && compFilter(c)).length, color: 'var(--text-muted)' },
      { label: 'Active', value: candidates.filter(c => c.stage === 'ACTIVE' && compFilter(c)).length, color: 'var(--info)' },
      { label: 'Submitted', value: candidates.filter(c => c.stage === 'SUBMITTED' && compFilter(c)).length, color: 'var(--warning)' },
      { label: 'Interview', value: candidates.filter(c => c.stage === 'INTERVIEW' && compFilter(c)).length, color: 'var(--gold)' },
      { label: 'Selected', value: candidates.filter(c => c.stage === 'SELECTED' && compFilter(c)).length, color: 'var(--success)' },
      { label: 'Placed', value: placedTotal, color: 'var(--navy)' }
    ];

    // Top companies by revenue
    const companyRevMap = new Map();
    for (const inv of filteredInvoices) {
      const key = inv.companyId || '_';
      if (!companyRevMap.has(key)) companyRevMap.set(key, { id: key, name: inv.companyName || '—', revenue: 0 });
      companyRevMap.get(key).revenue += Number(inv.total) || 0;
    }
    const topCompanies = [...companyRevMap.values()].sort((a, b) => b.revenue - a.revenue).slice(0, 8);

    // Top recruiters by placed count
    const recruiterMap = new Map();
    for (const c of candidates.filter(x => x.stage === 'PLACED' && compFilter(x))) {
      const key = c.placedByEmployeeId || c.submittedBy || c.createdBy || '_';
      if (!recruiterMap.has(key)) {
        const emp = employees.find(e => e.id === key);
        recruiterMap.set(key, { id: key, name: emp?.name || 'Unassigned', placed: 0 });
      }
      recruiterMap.get(key).placed++;
    }
    const topRecruiters = [...recruiterMap.values()].sort((a, b) => b.placed - a.placed).slice(0, 8);

    _data = {
      companies: { total: filteredCompanies.length },
      candidates: { total: filteredCandidates.length },
      placed: { total: placed },
      revenue,
      trend,
      funnel,
      topCompanies,
      topRecruiters
    };
    _loading = false;
    return _data;
  }

  function buildTrend(candidates, spanDays) {
    if (spanDays <= 31) {
      // Daily bars
      const buckets = new Map();
      const cursor = new Date(_range.from);
      const end = new Date(_range.to);
      while (cursor <= end) {
        buckets.set(cursor.toISOString().slice(0, 10), 0);
        cursor.setDate(cursor.getDate() + 1);
      }
      for (const c of candidates) {
        const ms = c.createdAt?.toMillis ? c.createdAt.toMillis() : new Date(c.createdAt).getTime();
        const key = new Date(ms).toISOString().slice(0, 10);
        if (buckets.has(key)) buckets.set(key, buckets.get(key) + 1);
      }
      return [...buckets.entries()].map(([k, v]) => ({
        label: k.slice(5),  // MM-DD
        value: v
      }));
    } else {
      // Weekly buckets
      const buckets = new Map();
      for (const c of candidates) {
        const ms = c.createdAt?.toMillis ? c.createdAt.toMillis() : new Date(c.createdAt).getTime();
        const d = new Date(ms);
        const weekStart = new Date(d);
        weekStart.setDate(d.getDate() - d.getDay());
        const key = weekStart.toISOString().slice(0, 10);
        buckets.set(key, (buckets.get(key) || 0) + 1);
      }
      return [...buckets.entries()]
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([k, v]) => ({ label: k.slice(5), value: v }));
    }
  }

  // ─────────────── AFTER HOOK ───────────────
  function after() {
    // Set default range if not set
    if (!_range.from || !_range.to) {
      const r = rangeFromPreset('30d');
      _range.from = r.from;
      _range.to = r.to;
    }

    loadData().then(() => {
      const root = document.getElementById('page-root');
      if (!root) return;
      const page = root.querySelector('.page');
      if (page) page.outerHTML = renderContent();
      bindEvents();
    });
    Router.setCleanup(() => {});
  }

  // ─────────────── EVENTS ───────────────
  function bindEvents() {
    // Preset chips
    document.querySelectorAll('[data-preset]').forEach(chip => {
      chip.addEventListener('click', async () => {
        const preset = chip.dataset.preset;
        const r = rangeFromPreset(preset);
        _range = r;
        await reloadAndRender();
      });
    });

    // Date pickers
    const fromIn = document.getElementById('rep-from');
    const toIn = document.getElementById('rep-to');
    if (fromIn) fromIn.addEventListener('change', async (e) => {
      _range.from = e.target.value;
      _range.preset = 'custom';
      await reloadAndRender();
    });
    if (toIn) toIn.addEventListener('change', async (e) => {
      _range.to = e.target.value;
      _range.preset = 'custom';
      await reloadAndRender();
    });

    // Refresh button
    const refreshBtn = document.querySelector('[data-action="refresh-rep"]');
    if (refreshBtn) refreshBtn.addEventListener('click', async (e) => {
      await UI.btnSave(e.currentTarget, async () => {
        await reloadAndRender();
      }, { label: 'Refreshing…', successLabel: 'Refreshed', revertMs: 800 });
    });

    // Export xlsx
    const expBtn = document.querySelector('[data-action="export-xlsx"]');
    if (expBtn) expBtn.addEventListener('click', exportXlsx);

    // Print
    const printBtn = document.querySelector('[data-action="print-rep"]');
    if (printBtn) printBtn.addEventListener('click', () => window.print());
  }

  async function reloadAndRender() {
    await loadData();
    const root = document.getElementById('page-root');
    if (!root) return;
    const page = root.querySelector('.page');
    if (page) page.outerHTML = renderContent();
    bindEvents();
  }

  // ─────────────── EXPORT XLSX ───────────────
  function exportXlsx() {
    try {
      if (typeof XLSX === 'undefined') {
        UI.toast({ message: 'Excel library not loaded', type: 'error' });
        return;
      }
      const d = _data || {};
      const wb = XLSX.utils.book_new();

      // Sheet 1: Summary
      const summary = [
        ['Seven Horses CRM — Reports'],
        ['Range', `${_range.from} → ${_range.to}`],
        ['Generated', new Date().toISOString()],
        [],
        ['KPI', 'Value'],
        ['Total Companies', d.companies?.total || 0],
        ['Total Candidates', d.candidates?.total || 0],
        ['Placed', d.placed?.total || 0],
        ['Revenue Billed', d.revenue?.billed || 0],
        ['Revenue Received', d.revenue?.received || 0],
        ['Outstanding', d.revenue?.outstanding || 0],
        ['Overdue Count', d.revenue?.overdue || 0]
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'Summary');

      // Sheet 2: Trend
      const trendRows = [['Date', 'Candidates'], ...(d.trend || []).map(t => [t.label, t.value])];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(trendRows), 'Trend');

      // Sheet 3: Funnel
      const funnelRows = [['Stage', 'Count'], ...(d.funnel || []).map(f => [f.label, f.value])];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(funnelRows), 'Funnel');

      // Sheet 4: Top Companies
      const topCompRows = [['Rank', 'Company', 'Revenue'],
        ...(d.topCompanies || []).map((c, i) => [i + 1, c.name, c.revenue])];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(topCompRows), 'Top Companies');

      // Sheet 5: Top Recruiters
      const topRecRows = [['Rank', 'Employee', 'Placed'],
        ...(d.topRecruiters || []).map((r, i) => [i + 1, r.name, r.placed])];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(topRecRows), 'Top Recruiters');

      const fname = `7H-Reports-${_range.from}_to_${_range.to}.xlsx`;
      XLSX.writeFile(wb, fname);
      UI.toast({ message: 'Exported', type: 'success' });
    } catch (err) {
      console.error('[Reports.export]', err);
      UI.toast({ message: 'Export failed: ' + err.message, type: 'error' });
    }
  }

  // ═══════════════ RETURN + CLOSE IIFE ═══════════════
  return { renderPage, after };
})();

// ─────────────── REGISTER ROUTE ───────────────
Router.register('reports', {
  title: 'Reports',
  render: ReportsPage.renderPage,
  after: ReportsPage.after,
  permission: ['reports', 'view']
});

console.log('[7H] Reports page registered');

  // ═══════════════════════════════════════════════════════════
//  AUDIT LOG PAGE — Part 1/2 (setup + filters + timeline)
//  Read-only feed from `audit` collection.
//  Immutable. No edit / delete. Pagination via Load More.
// ═══════════════════════════════════════════════════════════

const AuditPage = (function () {
  'use strict';

  let _rows = [];
  let _filter = { type: null, userId: null, query: '' };
  let _searchDebounce = null;
  let _loading = false;
  let _pageLimit = 100;
  let _hasMore = true;

  const TYPE_META = {
    company:    { label: 'Company',    icon: 'building-2',   color: 'navy' },
    candidate:  { label: 'Candidate',  icon: 'users',        color: 'info' },
    employee:   { label: 'Employee',   icon: 'user-cog',     color: 'warning' },
    client:     { label: 'Client',     icon: 'briefcase',    color: 'gold' },
    prospect:   { label: 'Prospect',   icon: 'target',       color: 'info' },
    invoice:    { label: 'Invoice',    icon: 'file-text',    color: 'navy' },
    payment:    { label: 'Payment',    icon: 'wallet',       color: 'success' },
    contract:   { label: 'Contract',   icon: 'factory',      color: 'warning' },
    attendance: { label: 'Attendance', icon: 'calendar-check', color: 'success' },
    payroll:    { label: 'Payroll',    icon: 'banknote',     color: 'gold' },
    task:       { label: 'Task',       icon: 'check-square', color: 'info' },
    system:     { label: 'System',     icon: 'settings',     color: 'navy' }
  };

  // ─────────────── SKELETON ───────────────
  function renderPage() {
    return `
      <div class="page">
        <div class="page-header"><div class="page-title-group"><div class="skeleton skeleton-title"></div></div></div>
        <div class="skeleton skeleton-block" style="height:64px;"></div>
        <div class="skeleton skeleton-block"></div>
        <div class="skeleton skeleton-block"></div>
      </div>`;
  }

  // ─────────────── FULL RENDER ───────────────
  function renderContent() {
    return `
      <div class="page">
        <div class="page-header">
          <div class="page-title-group">
            <div class="page-title">Audit Log</div>
            <div class="page-subtitle" id="audit-subtitle">${_rows.length} entries · read-only</div>
          </div>
          <div class="page-actions">
            ${UIKIT.button({ label: 'Refresh', variant: 'ghost', icon: 'refresh-cw', size: 'sm', data: 'audit-refresh' })}
            ${UIKIT.button({ label: 'Export', variant: 'primary', icon: 'download', size: 'sm', data: 'audit-export' })}
          </div>
        </div>

        <div class="section">
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="input-group" style="max-width:420px;">
              ${UIKIT.icon('search', 18, 'input-icon')}
              <input id="audit-search" class="input" type="text" placeholder="Search action, target, meta…" value="${Utils.escapeHtml(_filter.query)}">
            </div>
            <div class="chip-row" id="audit-type-chips">${renderTypeChips()}</div>
          </div>
        </div>

        <div class="section" id="audit-timeline">${renderTimeline()}</div>
      </div>`;
  }

  function renderTypeChips() {
    const types = ['ALL','company','candidate','employee','client','prospect','invoice','payment','contract','attendance','payroll','task','system'];
    return types.map(t => {
      const active = (t === 'ALL' && !_filter.type) || _filter.type === t;
      const count = t === 'ALL' ? _rows.length : _rows.filter(r => r.type === t).length;
      const meta = TYPE_META[t];
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-type="${t === 'ALL' ? '' : t}">
        ${t === 'ALL' ? 'All' : (meta?.label || t)}
        <span class="chip-count">${count}</span>
      </button>`;
    }).join('');
  }

  function renderTimeline() {
    const rows = applyFilters();
    if (!rows.length) {
      return UIKIT.emptyState({
        icon: 'history',
        title: 'No audit entries',
        message: 'Activity will appear here as your team works.'
      });
    }
    // Group by date
    const groups = new Map();
    for (const r of rows) {
      const at = r.at?.toDate ? r.at.toDate() : new Date(r.at || r.createdAt || Date.now());
      const key = at.toISOString().slice(0, 10);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push({ row: r, at });
    }

    let html = '';
    for (const [day, items] of groups) {
      html += `
        <div style="margin-bottom:20px;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <div style="font-family:var(--font-serif);font-size:var(--fs-base);font-weight:600;color:var(--text-primary);">${Utils.formatDate(day)}</div>
            <div style="flex:1;height:1px;background:var(--border-light);"></div>
            <div class="text-muted" style="font-size:11px;">${items.length} event${items.length > 1 ? 's' : ''}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${items.map(it => auditRow(it.row, it.at)).join('')}
          </div>
        </div>`;
    }

    if (_hasMore) {
      html += `
        <div style="text-align:center;padding:16px;">
          ${UIKIT.button({ label: 'Load More', variant: 'ghost', icon: 'chevron-down', data: 'audit-load-more' })}
        </div>`;
    }

    return html;
  }

  function auditRow(r, at) {
    const meta = TYPE_META[r.type] || { label: r.type, icon: 'dot', color: 'navy' };
    const time = Utils.formatTime(at);
    const actor = r.by || r.userId || 'system';
    const action = (r.action || '').replace(/:/g, ' · ');
    const targetName = r.meta?.name || r.meta?.companyName || r.meta?.candidateName || r.meta?.employeeName || '';
    const extraKeys = r.meta && typeof r.meta === 'object'
      ? Object.keys(r.meta).filter(k => !['name','companyName','candidateName','employeeName'].includes(k)).slice(0, 3)
      : [];
    const extraText = extraKeys.map(k => `${k}: ${String(r.meta[k]).slice(0, 24)}`).join(' · ');

    return `
      <div class="list-item audit-row" data-audit-id="${Utils.escapeHtml(r.id)}" role="button" tabindex="0" style="padding:10px 12px;">
        <div class="avatar avatar-sm" style="background:linear-gradient(135deg,var(--gold-light),var(--gold));">
          ${UIKIT.icon(meta.icon, 14)}
        </div>
        <div class="list-content">
          <div class="list-title" style="font-size:13px;">
            <span style="color:var(--${meta.color});font-weight:600;">${Utils.escapeHtml(meta.label)}</span>
            <span style="color:var(--text-secondary);"> · ${Utils.escapeHtml(action)}</span>
          </div>
          <div class="list-subtitle" style="font-size:11px;">
            ${targetName ? `<strong>${Utils.escapeHtml(targetName)}</strong> · ` : ''}by ${Utils.escapeHtml(String(actor).slice(0, 18))}
            ${extraText ? `<br><span style="opacity:0.75;">${Utils.escapeHtml(extraText)}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">
          <div class="text-muted" style="font-size:11px;font-variant-numeric:tabular-nums;">${time}</div>
          ${UIKIT.iconButton('chevron-right', { size: 'sm' })}
        </div>
      </div>`;
  }

  // ─────────────── AFTER HOOK ───────────────
  function after() {
    load().then(() => {
      const root = document.getElementById('page-root');
      if (!root) return;
      const page = root.querySelector('.page');
      if (page) page.outerHTML = renderContent();
      bindEvents();
    });
    Router.setCleanup(() => {
      if (_searchDebounce) clearTimeout(_searchDebounce);
    });
  }

  // ─────────────── LOAD ───────────────
  async function load(append = false) {
    if (_loading) return;
    _loading = true;
    try {
      const rows = await DB.list(CONST.COLLECTIONS.AUDIT, {
        orderBy: ['at', 'desc'],
        limit: _pageLimit
      });
      if (append) {
        // Dedup by id
        const seen = new Set(_rows.map(r => r.id));
        for (const r of rows) if (!seen.has(r.id)) _rows.push(r);
      } else {
        _rows = rows;
      }
      _hasMore = rows.length >= _pageLimit;
    } catch (err) {
      console.error('[AuditPage.load]', err);
      if (!append) _rows = [];
      UI.toast({ message: 'Failed to load audit log', type: 'error' });
    }
    _loading = false;
  }

  function applyFilters() {
    let rows = _rows;
    if (_filter.type) rows = rows.filter(r => r.type === _filter.type);
    if (_filter.query) {
      const q = _filter.query.toLowerCase();
      rows = rows.filter(r => {
        const action = (r.action || '').toLowerCase();
        const actor = String(r.by || r.userId || '').toLowerCase();
        const metaStr = JSON.stringify(r.meta || {}).toLowerCase();
        return action.includes(q) || actor.includes(q) || metaStr.includes(q);
      });
    }
    return rows;
  }

  function refreshList() {
    const tl = document.getElementById('audit-timeline');
    const chips = document.getElementById('audit-type-chips');
    const sub = document.getElementById('audit-subtitle');
    if (tl) { tl.innerHTML = renderTimeline(); bindTimelineEvents(); }
    if (chips) { chips.innerHTML = renderTypeChips(); bindChipClicks(); }
    if (sub) sub.textContent = `${_rows.length} entries · read-only`;
  }

    // ═══════════════════════════════════════════════════════════
  //  EVENTS + DETAIL + EXPORT
  // ═══════════════════════════════════════════════════════════

  function bindEvents() {
    // Refresh
    document.querySelectorAll('[data-action="audit-refresh"]').forEach(b => {
      b.addEventListener('click', async (e) => {
        await UI.btnSave(e.currentTarget, async () => {
          await load(false);
          refreshList();
        }, { label: 'Refreshing…', successLabel: 'Refreshed', revertMs: 800 });
      });
    });

    // Export
    document.querySelectorAll('[data-action="audit-export"]').forEach(b => {
      b.addEventListener('click', exportXlsx);
    });

    // Search
    const si = document.getElementById('audit-search');
    if (si) si.addEventListener('input', (e) => {
      if (_searchDebounce) clearTimeout(_searchDebounce);
      _searchDebounce = setTimeout(() => { _filter.query = e.target.value.trim(); refreshList(); }, 300);
    });

    bindChipClicks();
    bindTimelineEvents();
  }

  function bindChipClicks() {
    document.querySelectorAll('#audit-type-chips .chip').forEach(c => {
      c.addEventListener('click', () => { _filter.type = c.dataset.type || null; refreshList(); });
    });
  }

  function bindTimelineEvents() {
    // Row detail
    document.querySelectorAll('.audit-row[data-audit-id]').forEach(el => {
      el.addEventListener('click', () => openDetailDrawer(el.dataset.auditId));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetailDrawer(el.dataset.auditId); }
      });
    });

    // Load more
    document.querySelectorAll('[data-action="audit-load-more"]').forEach(b => {
      b.addEventListener('click', async (e) => {
        await UI.btnSave(e.currentTarget, async () => {
          _pageLimit += 100;
          await load(true);
          refreshList();
        }, { label: 'Loading…', successLabel: 'Loaded', revertMs: 800 });
      });
    });
  }

  // ─────────────── DETAIL DRAWER ───────────────
  function openDetailDrawer(auditId) {
    const r = _rows.find(x => x.id === auditId);
    if (!r) { UI.toast({ message: 'Entry not found', type: 'error' }); return; }

    const meta = TYPE_META[r.type] || { label: r.type, icon: 'dot', color: 'navy' };
    const at = r.at?.toDate ? r.at.toDate() : new Date(r.at || r.createdAt || Date.now());
    const action = (r.action || '').replace(/:/g, ' · ');

    // Pretty print meta object
    const metaRows = Object.entries(r.meta || {}).map(([k, v]) => {
      let display;
      if (v === null || v === undefined) display = '—';
      else if (typeof v === 'object') display = JSON.stringify(v);
      else display = String(v);
      return `
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-light);gap:12px;">
          <div class="text-muted" style="font-size:12px;text-transform:capitalize;">${Utils.escapeHtml(k)}</div>
          <div style="font-size:12px;font-weight:500;text-align:right;max-width:65%;word-break:break-word;font-family:monospace;">${Utils.escapeHtml(display)}</div>
        </div>`;
    }).join('');

    const headHtml = `
      <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:20px;">

    const metaHtml = metaRows
      ? `
        <div style="margin-top:20px;">
          <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">Metadata</div>
          <div>${metaRows}</div>
        </div>`
      : '';

    const rawHtml = `
      <div style="margin-top:20px;padding:12px;background:var(--bg-subtle);border-radius:var(--radius);">
        <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">Raw Entry</div>
        <pre style="font-size:11px;font-family:monospace;color:var(--text-secondary);margin:0;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto;">${Utils.escapeHtml(JSON.stringify({
          id: r.id, type: r.type, action: r.action, by: r.by || r.userId,
          at: at.toISOString(), meta: r.meta || null
        }, null, 2))}</pre>
      </div>`;

    const d = UI.openDrawer(headHtml + infoHtml + metaHtml + rawHtml, {
      title: 'Audit Entry',
      subtitle: 'Read-only · immutable',
      size: 'lg'
    });

    // Footer
    const footer = document.createElement('div');
    footer.className = 'drawer-footer';
    footer.innerHTML = `
      ${UIKIT.button({ label: 'Copy JSON', variant: 'ghost', icon: 'clipboard', data: 'copy-json' })}
      ${UIKIT.button({ label: 'Close', variant: 'primary', data: 'close' })}
    `;
    d.el.querySelector('.drawer').appendChild(footer);

    footer.querySelector('[data-action="close"]').addEventListener('click', d.close);
    footer.querySelector('[data-action="copy-json"]').addEventListener('click', async (e) => {
      const payload = JSON.stringify({
        id: r.id, type: r.type, action: r.action, by: r.by || r.userId,
        at: at.toISOString(), meta: r.meta || null
      }, null, 2);
      try {
        await navigator.clipboard.writeText(payload);
        UI.toast({ message: 'Copied to clipboard', type: 'success' });
      } catch (_) {
        UI.toast({ message: 'Copy failed', type: 'error' });
      }
    });
  }

  // ─────────────── EXPORT XLSX ───────────────
  function exportXlsx() {
    try {
      if (typeof XLSX === 'undefined') {
        UI.toast({ message: 'Excel library not loaded', type: 'error' });
        return;
      }
      const rows = applyFilters();
      if (!rows.length) { UI.toast({ message: 'Nothing to export', type: 'info' }); return; }

      const data = [['Timestamp', 'Type', 'Action', 'Actor', 'Target', 'Meta']];
      for (const r of rows) {
        const at = r.at?.toDate ? r.at.toDate() : new Date(r.at || r.createdAt || Date.now());
        data.push([
          at.toISOString(),
          r.type || '',
          r.action || '',
          r.by || r.userId || 'system',
          r.targetId || '',
          JSON.stringify(r.meta || {})
        ]);
      }

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, 'Audit Log');
      const fname = `7H-Audit-${new Date().toISOString().slice(0, 10)}.xlsx`;
      XLSX.writeFile(wb, fname);
      UI.toast({ message: 'Exported', type: 'success' });
    } catch (err) {
      console.error('[Audit.export]', err);
      UI.toast({ message: 'Export failed: ' + err.message, type: 'error' });
    }
  }

  // ═══════════════ RETURN + CLOSE IIFE ═══════════════
  return { renderPage, after };
})();

  // ═══════════════════════════════════════════════════════════
  //  AFTER HOOK + EVENTS
  // ═══════════════════════════════════════════════════════════

  function after() {
    // Permission gate
    const roles = STATE.roles || [];
    if (!roles.includes('MASTER') && !roles.includes('ADMIN')) {
      const root = document.getElementById('page-root');
      if (root) root.innerHTML = `<div class="page">${UIKIT.emptyState({
        icon: 'lock',
        title: 'Access Denied',
        message: 'Settings is available to MASTER and ADMIN only.'
      })}</div>`;
      return;
    }

    // Ensure config is loaded
    if (!STATE.config) {
      Config.load().then(() => {
        const root = document.getElementById('page-root');
        if (!root) return;
        root.innerHTML = renderContent();
        bindEvents();
        attachRealtime();
      });
    } else {
      const root = document.getElementById('page-root');
      if (root) root.innerHTML = renderContent();
      bindEvents();
      attachRealtime();
    }

    Router.setCleanup(() => {
      if (_unsub) { _unsub(); _unsub = null; }
    });
  }

  function bindEvents() {
    // Nav clicks
    document.querySelectorAll('#settings-nav .nav-item[data-group]').forEach(el => {
      el.addEventListener('click', () => {
        _activeGroup = el.dataset.group;
        document.getElementById('settings-nav').innerHTML = renderNav();
        document.getElementById('settings-panel').innerHTML = renderPanel();
        bindEvents();
      });
    });

    // Search
    const si = document.getElementById('settings-search');
    if (si) si.addEventListener('input', (e) => {
      _searchQuery = e.target.value.trim();
      document.getElementById('settings-nav').innerHTML = renderNav();
      // rebind nav
      document.querySelectorAll('#settings-nav .nav-item[data-group]').forEach(el => {
        el.addEventListener('click', () => {
          _activeGroup = el.dataset.group;
          document.getElementById('settings-nav').innerHTML = renderNav();
          document.getElementById('settings-panel').innerHTML = renderPanel();
          bindEvents();
        });
      });
    });

    // Save button
    const saveBtn = document.querySelector('[data-action="settings-save"]');
    if (saveBtn) saveBtn.addEventListener('click', handleSave);

    // FU add/remove
    document.querySelectorAll('[data-action="fu-add"]').forEach(b => {
      b.addEventListener('click', () => {
        const w = STATE.config?.workflow || {};
        const stages = Array.isArray(w.fuStages) ? [...w.fuStages] : [];
        stages.push({ day: 90, type: 'email', name: 'Follow-up' });
        // Persist immediately (dev-friendly)
        Config.set('workflow.fuStages', stages).then(() => {
          UI.toast({ message: 'FU stage added', type: 'success' });
          document.getElementById('settings-panel').innerHTML = renderPanel();
          bindEvents();
        });
      });
    });
    document.querySelectorAll('[data-action="fu-remove"]').forEach(b => {
      b.addEventListener('click', async () => {
        const idx = Number(b.dataset.index);
        const w = STATE.config?.workflow || {};
        const stages = Array.isArray(w.fuStages) ? [...w.fuStages] : [];
        stages.splice(idx, 1);
        await Config.set('workflow.fuStages', stages);
        UI.toast({ message: 'FU stage removed', type: 'info' });
        document.getElementById('settings-panel').innerHTML = renderPanel();
        bindEvents();
      });
    });

    // Dropdown add/remove
    document.querySelectorAll('[data-action="dd-add"]').forEach(b => {
      b.addEventListener('click', async () => {
        const key = b.dataset.key;
        const cfg = STATE.config?.dropdowns || {};
        const arr = Array.isArray(cfg[key]) ? [...cfg[key]] : [];
        arr.push('');
        await Config.set(`dropdowns.${key}`, arr);
        document.getElementById('settings-panel').innerHTML = renderPanel();
        bindEvents();
      });
    });
    document.querySelectorAll('[data-action="dd-remove"]').forEach(b => {
      b.addEventListener('click', async () => {
        const key = b.dataset.key;
        const idx = Number(b.dataset.index);
        const cfg = STATE.config?.dropdowns || {};
        const arr = Array.isArray(cfg[key]) ? [...cfg[key]] : [];
        arr.splice(idx, 1);
        await Config.set(`dropdowns.${key}`, arr);
        document.getElementById('settings-panel').innerHTML = renderPanel();
        bindEvents();
      });

    // Danger actions
    bindDangerActions();
  }

  function bindDangerActions() {

        UI.toast({ message: 'Cleanup job queued', type: 'info' });
      });

    // Export JSON
    document.querySelectorAll('[data-action="export-all-json"]').forEach(b => {
      b.addEventListener('click', () => UI.toast({ message: 'Full backup running (may take minutes)', type: 'info' }));
    });

    // Reset cache
    document.querySelectorAll('[data-action="reset-cache"]').forEach(b => {
          b.addEventListener('click', async () => {
            const ok = await UI.confirm({
              title: 'Reset Local Cache?',
              message: 'Local state will be cleared. You may need to refresh.',
              danger: true, okText: 'Reset'
            });
            if (!ok) return;
            try { localStorage.clear(); sessionStorage.clear(); } catch (_) {}
            UI.toast({ message: 'Cache cleared', type: 'success' });
            setTimeout(() => location.reload(), 800);
          });
        });

        // Reset config
        document.querySelectorAll('[data-action="reset-config"]').forEach(b => {
          b.addEventListener('click', async () => {
            const ok = await UI.confirm({
              title: 'Reset ALL Config?',
              message: 'This wipes every custom setting. Defaults will be restored.',
              danger: true, okText: 'Reset Everything'
            });
            if (!ok) return;
            await UI.btnSave(b, async () => {
              await Config.resetToDefaults();
              UI.toast({ message: 'Config reset to defaults', type: 'success' });
            });
          });
        });
      }

      // ─────────────── SAVE HANDLER ───────────────
      async function handleSave(e) {
        const btn = e.currentTarget;
        const panel = document.getElementById('settings-panel');
        const group = panel.querySelector('[data-settings-group]')?.dataset?.settingsGroup || _activeGroup;
        const form = panel.querySelector('form');
        if (!form) return;

        await UI.btnSave(btn, async () => {
          const patch = extractFormPatch(group, form);
          if (Object.keys(patch).length === 0) {
            UI.toast({ message: 'Nothing to save', type: 'info' });
            return;
          }
          await Config.replace(patch);
          await logConfigChange(group, patch);
          UI.toast({ message: 'Settings saved', type: 'success' });
        });
      }

      function extractFormPatch(group, form) {
        const patch = {};
        const fd = new FormData(form);

        // Straight fields
        for (const [name, value] of fd.entries()) {
          if (name.startsWith('flag_') || name.startsWith('fu_') || name.startsWith('dd_') ||
              name.startsWith('weight_') || name.startsWith('source_') || name.startsWith('billFactor_')) continue;
          const v = typeof value === 'string' ? value.trim() : value;
          if (v === '') continue;
          const isNum = !isNaN(Number(v)) && /^-?\d+(\.\d+)?$/.test(v) && !['name','legalName','short','gstin','phone','email','website','address','tagline','workerUrl','cloudinaryCloudName','cloudinaryPreset','sheetsId','brevoApiKey','brevoFromEmail','brevoFromName','emailjsServiceId','emailjsTemplateId','emailjsPublicKey','whatsappNumber','quietFrom','quietUntil','formTitle','successMessage','agreementTemplateId'].includes(name);
          patch[name] = isNum ? Number(v) : v;
        }

        // Checkboxes (unchecked are missing from FormData)
        form.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          const nm = cb.name;
          if (!nm) return;
          if (nm.startsWith('flag_')) {
            if (!patch.features) patch.features = {};
            patch.features[nm.replace(/^flag_/, '')] = cb.checked;
          } else if (nm.startsWith('source_')) {
            if (!patch.inquiry) patch.inquiry = {};
            if (!Array.isArray(patch.inquiry.sources)) patch.inquiry.sources = [];
            if (cb.checked) patch.inquiry.sources.push(nm.replace(/^source_/, ''));
          } else if (!nm.startsWith('fu_') && !nm.startsWith('dd_') && !nm.startsWith('weight_') && !nm.startsWith('billFactor_')) {
            patch[nm] = cb.checked;
          }
        });

        // FU stages
        const fuRows = form.querySelectorAll('.fu-row');
        if (fuRows.length) {
          const stages = [];
          fuRows.forEach((row, i) => {
            const day = Number(form.querySelector(`[name="fu_day_${i}"]`)?.value || 0);
            const type = form.querySelector(`[name="fu_type_${i}"]`)?.value || 'email';
            const name = form.querySelector(`[name="fu_name_${i}"]`)?.value || '';
            if (day > 0) stages.push({ day, type, name });
          });
          patch.fuStages = stages;
        }

        // Weights
        const weightInputs = form.querySelectorAll('[name^="weight_"]');
        if (weightInputs.length) {
          if (!patch.shortlist) patch.shortlist = {};
          patch.shortlist.weights = {};
          weightInputs.forEach(inp => {
            patch.shortlist.weights[inp.name.replace(/^weight_/, '')] = Number(inp.value) || 0;
          });
        }

        // Bill factors
        const billInputs = form.querySelectorAll('[name^="billFactor_"]');
        if (billInputs.length) {
          if (!patch.payroll) patch.payroll = {};
          patch.payroll.billFactors = {};
          billInputs.forEach(inp => {
            patch.payroll.billFactors[inp.name.replace(/^billFactor_/, '')] = Number(inp.value) || 0;
          });
        }

        // Form fields (forms group)
        if (group === 'forms') {
          const fieldsMap = {};
          const requiredMap = {};
          form.querySelectorAll('[data-field][data-prop]').forEach(cb => {
            const f = cb.dataset.field;
            const prop = cb.dataset.prop;
            if (prop === 'enabled') fieldsMap[f] = cb.checked;
            if (prop === 'required') requiredMap[f] = cb.checked;
          });
          if (Object.keys(fieldsMap).length) patch.fields = fieldsMap;
          if (Object.keys(requiredMap).length) patch.required = requiredMap;
        }

        // Dropdown items
        const dropdownGroups = {};
        form.querySelectorAll('.dd-row').forEach(row => {
          const key = row.dataset.key;
          const inp = row.querySelector('input');
          if (!inp || !inp.value.trim()) return;
          if (!dropdownGroups[key]) dropdownGroups[key] = [];
          dropdownGroups[key].push(inp.value.trim());
        });
        if (Object.keys(dropdownGroups).length) patch.dropdowns = dropdownGroups;

        // Wrap patch in top-level group key
        return { [group]: patch };
      }

      async function logConfigChange(group, patch) {
        try {
          await DB.add(CONST.COLLECTIONS.AUDIT, {
            type: 'system',
            action: 'settings:' + group,
            meta: { keys: Object.keys(patch[group] || {}) },
            at: DB.ts(),
            by: STATE.user?.uid || null
          });
        } catch (_) {}
      }

      // ─────────────── REALTIME (config sync) ───────────────
      function attachRealtime() {
        window.addEventListener('7h:config-update', handleConfigUpdate);
        _unsub = () => window.removeEventListener('7h:config-update', handleConfigUpdate);
      }

      function handleConfigUpdate() {
        if (Router.current() !== 'settings') return;
        // Re-render current panel only (don't disturb active group)
        const panel = document.getElementById('settings-panel');
        if (panel) {
          panel.innerHTML = renderPanel();
          bindEvents();
        }
      }

      // ═══════════════ RETURN + CLOSE IIFE ═══════════════
      return { renderPage, after };
    })();

    // ─────────────── REGISTER ROUTE ───────────────
    Router.register('settings', {
      title: 'Settings',
      render: SettingsPage.renderPage,
      after: SettingsPage.after,
      permission: ['settings', 'view']
    });

    console.log('[7H] Settings page registered');

                <div style="display:flex;justify-content:flex-end;margin-top:8px;">

  }

  function sessionCard(label, value, icon) {
    return `
      <div style="padding:12px;background:var(--bg-subtle);border-radius:var(--radius);">
        <div style="display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">
          ${UIKIT.icon(icon, 12)}
          ${Utils.escapeHtml(label)}
        </div>
        <div style="font-size:13px;font-weight:600;color:var(--text-primary);word-break:break-word;">${Utils.escapeHtml(String(value))}</div>
      </div>`;
  }

  // ─────────────── AFTER HOOK ───────────────
  function after() {
    load().then(() => {
      const root = document.getElementById('page-root');
      if (!root) return;
      root.innerHTML = renderContent();
      bindEvents();
      attachRealtime();
    });
    Router.setCleanup(() => {
      if (_unsub) { _unsub(); _unsub = null; }
    });
  }

  // ─────────────── LOAD ───────────────
  async function load() {
    const uid = STATE.user?.uid;
    if (!uid) { _profile = null; return; }
    try {
      _profile = await DB.get(`${CONST.COLLECTIONS.USERS}/${uid}`);
    } catch (err) {
      console.error('[ProfilePage.load]', err);
      _profile = STATE.profile || null;
    }
  }

    // ═══════════════════════════════════════════════════════════
  //  EVENTS + SAVE HANDLERS
  // ═══════════════════════════════════════════════════════════

  function bindEvents() {
    // Sign out (top)
    document.querySelectorAll('[data-action="profile-signout"]').forEach(b => {
      b.addEventListener('click', async () => {
        const ok = await UI.confirm({
          title: 'Sign out?',
          message: 'You will need to sign in again.',
          okText: 'Sign Out'
        });
        if (!ok) return;
        try { await Auth.logout(); } catch (e) { UI.toast({ message: e.message, type: 'error' }); }
      });
    });

    // Sign out everywhere
    document.querySelectorAll('[data-action="profile-signout-all"]').forEach(b => {
      b.addEventListener('click', async () => {
        const ok = await UI.confirm({
          title: 'Sign out everywhere?',
          message: 'All active sessions will end immediately.',
          danger: true, okText: 'Sign Out Everywhere'
        });
        if (!ok) return;
        try { await Auth.logout(); } catch (e) { UI.toast({ message: e.message, type: 'error' }); }
      });
    });

    // Save basic info
    const saveBasic = document.querySelector('[data-action="profile-save-basic"]');
    if (saveBasic) saveBasic.addEventListener('click', async (e) => {
      const form = document.getElementById('profile-basic');
      if (!form.reportValidity()) return;
      const data = extractBasic(form);

      // Validate phone if present
      if (data.phone && !Utils.isPhone(data.phone)) {
        UI.toast({ message: 'Invalid phone (10 digits, starts 6-9)', type: 'error' });
        return;
      }

      await UI.btnSave(e.currentTarget, async () => {
        const uid = STATE.user?.uid;
        if (!uid) throw new Error('Not authenticated');
        await DB.update(`${CONST.COLLECTIONS.USERS}/${uid}`, data);
        // Refresh local profile
        await load();
        // Also update STATE.profile for header/avatar
        STATE.profile = { ...(STATE.profile || {}), ...data };
        UI.toast({ message: 'Profile updated', type: 'success' });
      });
    });

    // Change password
    const savePass = document.querySelector('[data-action="profile-save-password"]');
    if (savePass) savePass.addEventListener('click', async (e) => {
      const form = document.getElementById('profile-password');
      if (!form.reportValidity()) return;
      const fd = new FormData(form);
      const cur = String(fd.get('currentPassword') || '');
      const newP = String(fd.get('newPassword') || '');
      const confirmP = String(fd.get('confirmPassword') || '');

      if (newP.length < 8) { UI.toast({ message: 'Password must be at least 8 characters', type: 'error' }); return; }
      if (newP !== confirmP) { UI.toast({ message: 'Passwords do not match', type: 'error' }); return; }
      if (newP === cur) { UI.toast({ message: 'New password must differ from current', type: 'error' }); return; }

      await UI.btnSave(e.currentTarget, async () => {
        const user = STATE.auth?.currentUser;
        if (!user) throw new Error('Not authenticated');

        // Re-authenticate first for security
        const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
        try {
          await user.reauthenticateWithCredential(cred);
        } catch (reauthErr) {
          if (reauthErr.code === 'auth/wrong-password' || reauthErr.code === 'auth/invalid-credential') {
            throw new Error('Current password is incorrect');
          }
          throw reauthErr;
        }

        // Now update password
        await user.updatePassword(newP);

        // Audit
        try {
          await DB.add(CONST.COLLECTIONS.AUDIT, {
            type: 'system',
            action: 'password:changed',
            meta: { self: true },
            at: DB.ts(),
            by: user.uid
          });
        } catch (_) {}

        // Clear form
        form.reset();
        UI.toast({ message: 'Password updated successfully', type: 'success' });
      });
    });
  }

  function extractBasic(form) {
    const out = {};
    const keep = ['name','phone','alternatePhone','city','state','address'];
    const fd = new FormData(form);
    for (const k of keep) {
      const v = fd.get(k);
      if (v === null) continue;
      const s = String(v).trim();
      if (k === 'phone' || k === 'alternatePhone') {
        if (s) out[k] = Utils.normalizePhone(s);
        else out[k] = '';
      } else {
        if (s) out[k] = s;
        else out[k] = '';
      }
    }
    return out;
  }

  // ─────────────── REALTIME ───────────────
  function attachRealtime() {
    const uid = STATE.user?.uid;
    if (!uid) return;
    // Watch own profile — reflect external changes (role change by admin)
    _unsub = DB.watch(`${CONST.COLLECTIONS.USERS}/${uid}`, async (doc) => {
      if (!doc || doc.isDeleted) return;
      _profile = doc;
      if (Router.current() === 'profile') {
        const root = document.getElementById('page-root');
        if (root) {
          root.innerHTML = renderContent();
          bindEvents();
        }
      }
    });
  }

  // ═══════════════ RETURN + CLOSE IIFE ═══════════════
  return { renderPage, after };
})();

  // ═══════════════════════════════════════════════════════════
//  HEADER SEARCH — Global search across collections
//  Debounce 300ms · Spinner · Recent history (last 10) ·
//  Keyboard nav · Route on click
// ═══════════════════════════════════════════════════════════

const HeaderSearch = (function () {
  'use strict';

  const HISTORY_KEY = '7h.searchHistory';
  const HISTORY_MAX = 10;
  const SEARCH_LIMIT = 20;
  let _debounce = null;
  let _drawer = null;
  let _activeIndex = -1;
  let _results = [];
  let _query = '';

  // ─────────────── SEARCH ───────────────
  async function runSearch(q) {
    const query = String(q || '').trim().toLowerCase();
    if (!query || query.length < 2) return [];
    const hits = [];

    // Companies
    try {
      const rows = await Companies.search(query, 10);
      for (const r of rows) {
        hits.push({
          type: 'company',
          id: r.id,
          title: r.name || '—',
          sub: [r.city, r.industry].filter(Boolean).join(' · ') || r.email || '',
          route: 'companies',
          params: { id: r.id },
          icon: 'building-2',
          badge: r.stage || ''
        });
      }
    } catch (_) {}

    // Candidates
    try {
      const rows = await Candidates.search(query, 10);
      for (const r of rows) {
        hits.push({
          type: 'candidate',
          id: r.id,
          title: r.name || '—',
          sub: [r.jobProfile, r.city, r.phone].filter(Boolean).join(' · ') || '',
          route: 'candidates',
          params: { id: r.id },
          icon: 'users',
          badge: r.stage || ''
        });
      }
    } catch (_) {}

    // Tasks
    try {
      const rows = await Tasks.search(query, 10);
      for (const r of rows) {
        hits.push({
          type: 'task',
          id: r.id,
          title: r.title || '—',
          sub: [r.priority, r.dueDate ? Utils.formatDate(r.dueDate) : ''].filter(Boolean).join(' · '),
          route: 'tasks',
          params: { id: r.id },
          icon: 'check-square',
          badge: r.completed ? 'done' : (r.priority || '')
        });
      }
    } catch (_) {}

    // Employees
    try {
      const all = await DB.list(CONST.COLLECTIONS.USERS, { limit: 300 });
      const rows = all.filter(u =>
        u.primaryRole !== 'CLIENT' &&
        ((u.name || '').toLowerCase().includes(query) ||
         (u.email || '').toLowerCase().includes(query) ||
         (u.employeeCode || '').toLowerCase().includes(query))
      ).slice(0, 10);
      for (const r of rows) {
        hits.push({
          type: 'employee',
          id: r.id,
          title: r.name || r.email || '—',
          sub: [r.designation, r.department, r.employeeCode].filter(Boolean).join(' · '),
          route: 'employees',
          params: { id: r.id },
          icon: 'user-cog',
          badge: r.primaryRole || ''
        });
      }
    } catch (_) {}

    return hits;
  }

  // ─────────────── HISTORY ───────────────
  function getHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (_) { return []; }
  }

  function pushHistory(entry) {
    try {
      const arr = getHistory().filter(x =>
        !(x.type === entry.type && x.id === entry.id)
      );
      arr.unshift(entry);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(arr.slice(0, HISTORY_MAX)));
    } catch (_) {}
  }

  function clearHistory() {
    try { localStorage.removeItem(HISTORY_KEY); } catch (_) {}
  }

  // ─────────────── RENDER ───────────────
  function renderResults() {
    if (!_query || _query.length < 2) {
      // Show recent searches
      const hist = getHistory();
      if (!hist.length) {
        return `<div class="text-muted" style="font-size:12px;padding:24px;text-align:center;">
          Type at least 2 characters to search
        </div>`;
      }
      return `
        <div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
          <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;">Recent</div>
          <button type="button" class="btn-text" style="font-size:11px;" data-action="search-clear-history">Clear</button>
        </div>
        ${hist.map((h, i) => resultRow(h, i, true)).join('')}`;
    }

    if (!_results.length) {
      return `<div class="text-muted" style="font-size:12px;padding:24px;text-align:center;">
        No results for "<strong>${Utils.escapeHtml(_query)}</strong>"
      </div>`;
    }

    return `
      <div style="padding:10px 16px;">
        <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;">${_results.length} result${_results.length > 1 ? 's' : ''}</div>
      </div>
      ${_results.map((r, i) => resultRow(r, i, false)).join('')}`;
  }

  function resultRow(r, i, isHistory) {
    const active = i === _activeIndex;
    const typeLabel = r.type ? r.type.charAt(0).toUpperCase() + r.type.slice(1) : '';
    return `
      <div class="search-result" data-search-index="${i}" data-history="${isHistory ? '1' : '0'}" role="button" tabindex="0"
           style="padding:10px 16px;display:flex;gap:10px;align-items:center;cursor:pointer;background:${active ? 'rgba(201,169,97,0.08)' : 'transparent'};border-left:3px solid ${active ? 'var(--gold)' : 'transparent'};transition:background .1s;">
        <div class="avatar avatar-sm">${UIKIT.icon(r.icon || 'search', 14)}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${Utils.escapeHtml(r.title || '—')}</div>
          <div class="text-muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
            ${typeLabel ? `<span style="color:var(--gold-dark);font-weight:600;">${typeLabel}</span> · ` : ''}${Utils.escapeHtml(r.sub || '')}
          </div>
        </div>
        ${r.badge ? UIKIT.badge(String(r.badge).toUpperCase(), 'neutral') : ''}
        ${UIKIT.icon('chevron-right', 14, 'text-muted')}
      </div>`;
  }

  // ─────────────── OPEN / CLOSE ───────────────
  function open() {
    _activeIndex = -1;
    _results = [];
    _query = '';

    const html = `
      <div style="display:flex;flex-direction:column;height:100%;">
        <div class="input-group" style="padding:12px 16px;border-bottom:1px solid var(--border-light);">
          ${UIKIT.icon('search', 16, 'input-icon')}
          <input id="global-search-input" class="input" type="text" placeholder="Search companies, candidates, tasks…" autocomplete="off">
          <span id="search-spinner" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;">
            <span class="spinner" style="width:14px;height:14px;border-width:2px;"></span>
          </span>
        </div>
        <div id="search-results" style="flex:1;overflow-y:auto;"></div>
        <div style="padding:10px 16px;border-top:1px solid var(--border-light);display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);">
          <span><kbd style="padding:1px 5px;background:var(--bg-subtle);border-radius:3px;font-family:monospace;">↑↓</kbd> Navigate</span>
          <span><kbd style="padding:1px 5px;background:var(--bg-subtle);border-radius:3px;font-family:monospace;">↵</kbd> Open</span>
          <span><kbd style="padding:1px 5px;background:var(--bg-subtle);border-radius:3px;font-family:monospace;">Esc</kbd> Close</span>
        </div>
      </div>`;

    _drawer = UI.openDrawer(html, { title: 'Search', subtitle: 'Across all records', size: 'md' });

    const input = document.getElementById('global-search-input');
    setTimeout(() => input && input.focus(), 100);

    input.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      _query = q;
      if (_debounce) clearTimeout(_debounce);
      const spinner = document.getElementById('search-spinner');
      if (q.length >= 2) {
        if (spinner) spinner.style.display = 'inline';
        _debounce = setTimeout(async () => {
          _results = await runSearch(q);
          if (spinner) spinner.style.display = 'none';
          renderResultsIntoPanel();
        }, 300);
      } else {
        _results = [];
        if (spinner) spinner.style.display = 'none';
        renderResultsIntoPanel();
      }
    });

    input.addEventListener('keydown', handleKeyNav);

    // Initial render (history)
    renderResultsIntoPanel();
  }

  function renderResultsIntoPanel() {
    const box = document.getElementById('search-results');
    if (!box) return;
    box.innerHTML = renderResults();
    bindResultClicks();
  }

  function bindResultClicks() {
    document.querySelectorAll('.search-result').forEach(el => {
      el.addEventListener('mouseenter', () => {
        const idx = Number(el.dataset.searchIndex);
        _activeIndex = idx;
        renderResultsIntoPanel();
      });
      el.addEventListener('click', () => selectResult(el.dataset.searchIndex, el.dataset.history === '1'));
    });
  }

  function handleKeyNav(e) {
    const items = _query && _query.length >= 2 ? _results : getHistory();
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _activeIndex = Math.min(_activeIndex + 1, items.length - 1);
      renderResultsIntoPanel();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _activeIndex = Math.max(_activeIndex - 1, 0);
      renderResultsIntoPanel();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (_activeIndex >= 0 && items[_activeIndex]) {
        selectResult(_activeIndex, !(_query && _query.length >= 2));
      } else if (items[0]) {
        selectResult(0, !(_query && _query.length >= 2));
      }
    } else if (e.key === 'Escape') {
      if (_drawer) _drawer.close();
    }
  }

  function selectResult(idxStr, isHistory) {
    const idx = Number(idxStr);
    const list = isHistory ? getHistory() : _results;
    const item = list[idx];
    if (!item) return;

    // Push to history
    pushHistory({
      type: item.type, id: item.id,
      title: item.title, sub: item.sub,
      icon: item.icon, badge: item.badge,
      route: item.route, params: item.params
    });

    if (_drawer) _drawer.close();
    const route = item.route;
    if (route && Router.list().includes(route)) {
      Router.navigateTo(route, item.params || {});
    } else {
      UI.toast({ message: 'Open ' + item.title, type: 'info' });
    }
  }

  // ─────────────── BIND HEADER ───────────────
  function bindHeader() {
    const btn = document.getElementById('btn-search');
    if (!btn || btn.dataset._bound) return;
    btn.dataset._bound = '1';
    btn.addEventListener('click', open);
  }

  return { open, bindHeader };
})();

const HeaderAddNew = (function () {
  'use strict';

  // Items registry — role gate via `roles` array
  const ITEMS = [
    { id: 'company',   label: 'Company',           icon: 'building-2', route: 'companies', roles: ['MASTER','ADMIN','MANAGER'] },
    { id: 'candidate', label: 'Candidate',         icon: 'user-plus',  route: 'candidates', roles: ['MASTER','ADMIN','MANAGER','EMPLOYEE'] },

    { id: 'employee',  label: 'Team Member',       icon: 'user-cog',   route: 'employees',  roles: ['MASTER','ADMIN','MANAGER'] },
    { id: 'invoice',   label: 'Invoice',           icon: 'file-plus',  route: 'invoices',   roles: ['MASTER','ADMIN'] },
    { id: 'payment',   label: 'Payment',           icon: 'wallet',     route: 'payments',   roles: ['MASTER','ADMIN'] },

    { id: 'chat',      label: 'New Chat',          icon: 'message-plus', route: 'chat',    roles: ['MASTER','ADMIN','MANAGER','EMPLOYEE','INTERNAL_SUPERVISOR'] }
  ];

  function allowedItems() {
    const roles = STATE.roles || [];
    return ITEMS.filter(it => it.roles.some(r => roles.includes(r)));
  }

  function open() {
    const items = allowedItems();
    if (!items.length) { UI.toast({ message: 'No quick-add options available', type: 'info' }); return; }

    const currentRoute = Router.current();

    // Mobile = bottom sheet, Desktop = popover near btn
    const isMobile = window.matchMedia('(max-width: 480px)').matches;

    if (isMobile) {
      openBottomSheet(items, currentRoute);
    } else {
      openPopover(items, currentRoute);
    }
  }

  // ─────────────── MOBILE BOTTOM SHEET ───────────────
  function openBottomSheet(items, currentRoute) {
    const wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.style.alignItems = 'flex-end';
    wrap.style.padding = '0';

    wrap.innerHTML = `
      <div class="modal" style="max-width:100%;border-radius:20px 20px 0 0;transform:translateY(100%);">
        <div style="padding:16px 20px 10px;text-align:center;border-bottom:1px solid var(--border-light);position:relative;">
          <div style="width:36px;height:4px;background:var(--border-strong);border-radius:2px;margin:0 auto 12px;"></div>
          <div style="font-family:var(--font-serif);font-size:var(--fs-lg);font-weight:600;letter-spacing:-0.02em;">Create New</div>
        </div>
        <div class="modal-body" style="padding:12px 12px 20px;">
          ${items.map(it => sheetItem(it, currentRoute)).join('')}
        </div>
      </div>`;
    document.body.appendChild(wrap);
    if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch (_) {} }
    requestAnimationFrame(() => {
      wrap.classList.add('is-open');
      const m = wrap.querySelector('.modal');
      if (m) m.style.transform = 'translateY(0)';
    });

    const close = () => {
      wrap.classList.remove('is-open');
      const m = wrap.querySelector('.modal');
      if (m) m.style.transform = 'translateY(100%)';
      setTimeout(() => wrap.remove(), 260);
    };

    wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });

    wrap.querySelectorAll('[data-add-route]').forEach(el => {
      el.addEventListener('click', () => {
        close();
        handleAdd(el.dataset.addRoute);
      });
    });
  }

  function sheetItem(it, currentRoute) {
    const isContext = currentRoute === it.route;
    return `
      <div data-add-route="${it.route}" role="button" tabindex="0"
           style="display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--radius);cursor:pointer;background:${isContext ? 'rgba(201,169,97,0.08)' : 'transparent'};border:1px solid ${isContext ? 'var(--gold)' : 'transparent'};margin-bottom:4px;">
        <div class="avatar avatar-sm" style="background:linear-gradient(135deg,var(--gold-light),var(--gold));">
          ${UIKIT.icon(it.icon, 14)}
        </div>
        <div style="flex:1;font-size:14px;font-weight:600;color:var(--text-primary);">${Utils.escapeHtml(it.label)}</div>
        ${isContext ? UIKIT.badge({ text: 'Here', type: 'gold' }) : UIKIT.icon('chevron-right', 14, 'text-muted')}
      </div>`;
  }

  // ─────────────── DESKTOP POPOVER ───────────────
  function openPopover(items, currentRoute) {
    // Remove any existing
    document.querySelectorAll('#add-new-popover').forEach(n => n.remove());

    const btn = document.getElementById('btn-new');
    if (!btn) return;
    const rect = btn.getBoundingClientRect();

    const pop = document.createElement('div');
    pop.id = 'add-new-popover';
    pop.style.cssText = `
      position:fixed;top:${rect.bottom + 6}px;right:${Math.max(8, window.innerWidth - rect.right)}px;
      min-width:220px;background:var(--white);border:1px solid var(--border);
      border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:6px;
      z-index:95;opacity:0;transform:translateY(-4px);
      transition:opacity .15s, transform .15s;max-height:60vh;overflow-y:auto;
    `;

    pop.innerHTML = `
      <div style="padding:6px 10px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);">Create New</div>
      ${items.map(it => popoverItem(it, currentRoute)).join('')}
    `;
    document.body.appendChild(pop);
    if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch (_) {} }
    requestAnimationFrame(() => { pop.style.opacity = '1'; pop.style.transform = 'translateY(0)'; });

    const outside = (e) => {
      if (pop.contains(e.target) || e.target === btn) return;
      closeAll();
    };

    const escH = (e) => { if (e.key === 'Escape') closeAll(); };

    function closeAll() {
      document.removeEventListener('click', outside);
      document.removeEventListener('keydown', escH);
      pop.style.opacity = '0';
      pop.style.transform = 'translateY(-4px)';
      setTimeout(() => pop.remove(), 150);
    }

    setTimeout(() => {
      document.addEventListener('click', outside);
      document.addEventListener('keydown', escH);
    }, 50);

    pop.querySelectorAll('[data-add-route]').forEach(el => {
      el.addEventListener('click', () => {
        const route = el.dataset.addRoute;
        closeAll();
        handleAdd(route);
      });
    });
  }

  function popoverItem(it, currentRoute) {
    const isContext = currentRoute === it.route;
    return `
      <div data-add-route="${it.route}" class="dropdown-item${isContext ? ' is-context' : ''}" role="button" tabindex="0" style="${isContext ? 'background:rgba(201,169,97,0.08);font-weight:600;' : ''}">
        ${UIKIT.icon(it.icon, 15, 'dropdown-icon')}
        <span style="flex:1;">${Utils.escapeHtml(it.label)}</span>
        ${isContext ? `<span class="badge badge-gold" style="font-size:9px;">Here</span>` : ''}
      </div>`;
  }

  // ─────────────── HANDLE ADD ───────────────
  function handleAdd(route) {
    // Route exists? Navigate + trigger "new" action
    if (Router.list().includes(route)) {
      Router.navigateTo(route, {});
      // After render, click the "new" button automatically
      setTimeout(() => {
        const newBtn = document.querySelector('[data-action^="new-"]');
        if (newBtn) newBtn.click();
      }, 400);
    } else {
      UI.toast({ message: 'Page coming soon: ' + route, type: 'info' });
    }
  }

  // ─────────────── BIND HEADER ───────────────
  function bindHeader() {
    const btn = document.getElementById('btn-new');
    if (!btn || btn.dataset._bound) return;
    btn.dataset._bound = '1';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      open();
    });
  }

  return { open, bindHeader };
})();

(function bindSearchShortcut() {

const Onboarding = (function () {
  'use strict';

  let _step = 0;
  let _overlay = null;
  let _onDone = null;

  const STEPS = [
    {

      title: 'Keep Your Profile Fresh',
      subtitle: 'You can update details anytime',
      body: `

          ${tipRow('ShieldCheck', 'Secure', 'Password change requires re-authentication')}
          ${tipRow('LogOut', 'Sign Out', 'Tap header avatar → sign out any time')}
        </div>`
    },
    {
      id: 'ready',
      icon: 'rocket',
      title: 'You are ready!',
      subtitle: 'Let\u2019s get to work',
      body: `
        <div style="text-align:center;padding:16px 0;">
          <div style="font-size:52px;margin-bottom:14px;">🐎</div>
