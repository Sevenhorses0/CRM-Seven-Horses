    footer.querySelector('[data-action="cancel"]').addEventListener('click', d.close);
    footer.querySelector('[data-action="save"]').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const form = d.el.querySelector('#pay-form');
      if (!form.reportValidity()) return;

      const data = formToObj(form);
      // Auto-fill companyId from selected invoice option
      const opt = invSel.options[invSel.selectedIndex];
      if (opt && opt.value) {
        data.companyId = opt.dataset.companyId || '';
        data.companyName = opt.dataset.companyName || data.companyName || '';
      }

      await UI.btnSave(btn, async () => {
        const id = await Payments.create(data);
        UI.toast({ message: 'Payment recorded', type: 'success' });
        d.close();
        await load(); refreshList();
        return id;
      });
    });
  }

  // ─────────────── DETAIL DRAWER ───────────────
  async function openDetailDrawer(paymentId) {
    const d = UI.openDrawer('<div class="skeleton skeleton-block" style="height:200px;"></div>', {
      title: 'Payment', subtitle: 'Loading…', size: 'lg'
    });
    try {
      const p = await Payments.getById(paymentId);
      if (!p) throw new Error('Not found');

      // Fetch invoice for context
      let inv = null;
      if (p.invoiceId) {
        try { inv = await Invoices.getById(p.invoiceId); } catch (_) {}
      }

      const sb = STATUS_LABELS[p.status] || { label: p.status, badge: 'neutral' };

      const head = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px;">
          <div style="min-width:0;flex:1;">
            <div style="font-family:var(--font-serif);font-size:var(--fs-3xl);font-weight:700;line-height:1;color:${p.status === 'BOUNCED' ? 'var(--error)' : 'var(--success)'};">
              ${Utils.formatCurrency(p.amount)}
            </div>
            <div class="text-muted" style="font-size:12px;margin-top:6px;">${Utils.escapeHtml(p.companyName || '—')}</div>
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
              ${UIKIT.badge(sb.label, sb.badge)}
              ${UIKIT.badge({ text: MODE_LABELS[p.mode] || p.mode || '—', type: 'gold' })}
            </div>
          </div>
        </div>`;

      const rows = [
        ['Invoice', inv?.number || p.invoiceId],
        ['Reference', p.reference],
        ['Bank', p.bankName],
        ['Paid On', p.paidAt ? Utils.formatDate(p.paidAt) : ''],
        ['Recorded By', p.recordedBy]
      ].map(([k, v]) => v ? `
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light);">
          <div class="text-muted" style="font-size:12px;">${Utils.escapeHtml(k)}</div>
          <div style="font-size:13px;font-weight:500;text-align:right;max-width:60%;word-break:break-word;">${Utils.escapeHtml(String(v))}</div>
        </div>` : '').join('');

      const invoicePanel = inv ? `
        <div style="margin-top:20px;padding:14px;background:var(--bg-subtle);border-radius:var(--radius);border:1px solid var(--border);">
          <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">Linked Invoice</div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div style="font-size:13px;font-weight:600;">${Utils.escapeHtml(inv.number || '')}</div>
              <div class="text-muted" style="font-size:11px;margin-top:2px;">Total ${Utils.formatCurrency(inv.total)} · Balance ${Utils.formatCurrency(inv.balance)}</div>
            </div>
            ${UIKIT.badge(inv.status, inv.status === 'PAID' ? 'success' : inv.status === 'OVERDUE' ? 'error' : 'info')}
          </div>
        </div>` : '';

      const notesPanel = p.notes ? `
        <div style="margin-top:16px;padding:12px;background:var(--bg-subtle);border-radius:var(--radius);">
          <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">Notes</div>
          <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">${Utils.escapeHtml(p.notes)}</div>
        </div>` : '';

      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = head + `<div>${rows}</div>` + invoicePanel + notesPanel;
      d.el.querySelector('.drawer-title').textContent = 'Payment Details';
      d.el.querySelector('.drawer-subtitle').textContent = p.companyName || '';

      // Footer actions
      const footer = document.createElement('div');
      footer.className = 'drawer-footer';
      const actions = [];
      if (p.status === 'RECORDED') {
        actions.push({ label: 'Reconcile', variant: 'success', icon: 'check-circle-2', data: 'reconcile' });
        actions.push({ label: 'Mark Bounced', variant: 'ghost', icon: 'alert-triangle', data: 'bounce' });
        actions.push({ label: 'Cancel', variant: 'ghost', icon: 'x', data: 'cancel-pay' });
      }
      actions.push({ label: 'Close', variant: 'ghost', data: 'close' });

      footer.innerHTML = actions.map(a => UIKIT.button(a)).join('');
      d.el.querySelector('.drawer').appendChild(footer);

      footer.querySelectorAll('button[data-action]').forEach(btn => {
        const act = btn.dataset.action;
        if (act === 'close') { btn.addEventListener('click', d.close); return; }
        btn.addEventListener('click', async (ev) => {
          await handlePaymentAction(act, p, ev.currentTarget, d);
        });
      });
    } catch (err) {
      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = UIKIT.errorState({ message: err.message });
    }
  }

  // ─────────────── ACTIONS ───────────────
  async function handlePaymentAction(act, p, btn, drawer) {
    if (act === 'reconcile') {
      await UI.btnSave(btn, async () => {
        await Payments.reconcile(p.id);
        UI.toast({ message: 'Payment reconciled', type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'bounce') {
      const reason = prompt('Bounce reason (cheque returned / insufficient funds):', '') || '';
      const ok = await UI.confirm({
        title: 'Mark as Bounced?',
        message: 'Invoice balance will be recalculated.',
        danger: true, okText: 'Mark Bounced'
      });
      if (!ok) return;
      await UI.btnSave(btn, async () => {
        await Payments.markBounced(p.id, reason);
        UI.toast({ message: 'Payment marked bounced', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'cancel-pay') {
      const reason = prompt('Cancel reason:', '') || '';
      await UI.btnSave(btn, async () => {
        await Payments.cancel(p.id, reason);
        UI.toast({ message: 'Payment cancelled', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
  }

  // ─────────────── HELPERS ───────────────
  function formToObj(form) {
    const obj = {};
    new FormData(form).forEach((v, k) => {
      const s = String(v).trim();
      if (!s) return;
      if (k === 'amount') obj[k] = Number(s) || 0;
      else obj[k] = s;
    });
    return obj;
  }

  // ═══════════════ RETURN + CLOSE IIFE ═══════════════
  return { renderPage, after };
})();

// ─────────────── REGISTER ROUTE ───────────────
Router.register('payments', {
  title: 'Payments',
  render: PaymentsPage.renderPage,
  after: PaymentsPage.after,
  permission: ['payments', 'view']
});

console.log('[7H] Payments page registered');

const ContractPage = (function () {
  'use strict';

  let _rows = [];
  let _filter = { status: null, companyId: null, query: '' };
  let _unsub = null;
  let _searchDebounce = null;

  const STATUS_LABELS = {
    ACTIVE:              { label: 'Active',              badge: 'success' },
    ON_NOTICE:           { label: 'On Notice',           badge: 'warning' },
    REPLACEMENT_PENDING: { label: 'Replacement Pending', badge: 'error' },
    RELEASED:            { label: 'Released',            badge: 'neutral' },
    CLOSED:              { label: 'Closed',              badge: 'neutral' },

  // ─────────────── SKELETON ───────────────
  function renderPage() {

      </div>`;
  }

  // ─────────────── FULL RENDER ───────────────
  function renderContent() {
    const t = computeTotals();
    return `
      <div class="page">
        <div class="page-header">
          <div class="page-title-group">
            <div class="page-title">Contract Staff</div>
            <div class="page-subtitle" id="cs-subtitle">${_rows.length} total · ${t.active} active · ${Utils.formatCurrency(t.monthly)} monthly</div>
          </div>
          <div class="page-actions">
            ${UIKIT.button({ label: 'Enroll Staff', variant: 'primary', icon: 'user-plus', data: 'new-contract' })}
          </div>
        </div>

        <div class="section">
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <div class="card card-stat" style="flex:1;min-width:160px;cursor:default;">
              <div class="stat-value" style="font-size:var(--fs-2xl);color:var(--success);">${t.active}</div>
              <div class="stat-label">Active Staff</div>
            </div>
            <div class="card card-stat" style="flex:1;min-width:160px;cursor:default;">
              <div class="stat-value" style="font-size:var(--fs-2xl);">${Utils.formatCompact(t.monthly)}</div>
              <div class="stat-label">Monthly Billing</div>
            </div>
            <div class="card card-stat" style="flex:1;min-width:160px;cursor:default;">
              <div class="stat-value" style="font-size:var(--fs-2xl);color:var(--warning);">${t.notice}</div>
              <div class="stat-label">On Notice</div>
            </div>
            <div class="card card-stat" style="flex:1;min-width:160px;cursor:default;">
              <div class="stat-value" style="font-size:var(--fs-2xl);color:var(--error);">${t.replacement}</div>
              <div class="stat-label">Replacement</div>
            </div>
          </div>
        </div>

        <div class="section">
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
              <div class="input-group" style="flex:1;min-width:240px;max-width:420px;">
                ${UIKIT.icon('search', 18, 'input-icon')}
                <input id="cs-search" class="input" type="text" placeholder="Search staff, code, site…" value="${Utils.escapeHtml(_filter.query)}">
              </div>
              <select class="select" id="cs-company-filter" style="max-width:260px;">
                <option value="">All Companies</option>
              </select>
            </div>
            <div class="chip-row" id="cs-status-chips">${renderStatusChips()}</div>
          </div>
        </div>

        <div class="section" id="cs-list">${renderList()}</div>
      </div>`;
  }

  function computeTotals() {
    let active = 0, notice = 0, replacement = 0, monthly = 0;
    for (const r of _rows) {
      if (r.status === 'ACTIVE') {
        active++;
        monthly += Number(r.monthlyRate) || 0;
      }
      if (r.status === 'ON_NOTICE') notice++;
      if (r.status === 'REPLACEMENT_PENDING') replacement++;
    }
    return { active, notice, replacement, monthly };
  }

  function renderStatusChips() {
    const statuses = ['ALL','ACTIVE','ON_NOTICE','REPLACEMENT_PENDING','RELEASED','SUSPENDED'];
    return statuses.map(s => {
      const active = (s === 'ALL' && !_filter.status) || _filter.status === s;
      const count = s === 'ALL' ? _rows.length : _rows.filter(r => r.status === s).length;
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-status="${s === 'ALL' ? '' : s}">
        ${s === 'ALL' ? 'All' : (STATUS_LABELS[s]?.label || s)}
        <span class="chip-count">${count}</span>
      </button>`;
    }).join('');
  }

  function renderList() {
    const rows = applyFilters();
    if (!rows.length) {
      return UIKIT.emptyState({
        icon: 'factory',
        title: 'No contract staff',
        message: 'Enroll your first staff member to a client site.',
        actionLabel: 'Enroll Staff',
        actionIcon: 'user-plus',
        actionData: 'new-contract'
      });
    }
    return rows.map(rowCard).join('');
  }

  function rowCard(r) {
    const sb = STATUS_LABELS[r.status] || { label: r.status, badge: 'neutral' };
    const sub = [r.position, r.site, r.companyName].filter(Boolean).join(' · ');
    const rateStr = r.monthlyRate ? Utils.formatCurrency(r.monthlyRate) + '/mo' : '—';
    return `
      <div class="list-item" data-contract-id="${Utils.escapeHtml(r.id)}" role="button" tabindex="0">
        <div class="avatar avatar-md">${Utils.initials(r.candidateName || '?')}</div>
        <div class="list-content">
          <div class="list-title">${Utils.escapeHtml(r.candidateName || '—')}</div>
          <div class="list-subtitle">${Utils.escapeHtml(sub || '—')}</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            ${UIKIT.badge(sb.label, sb.badge)}
            <span style="font-size:var(--fs-xs);font-weight:600;color:var(--text-primary);">${rateStr}</span>
            ${r.marginPct ? `<span class="text-muted" style="font-size:11px;">Margin ${r.marginPct}%</span>` : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div class="text-muted" style="font-size:11px;">${r.joinedAt ? Utils.formatDate(r.joinedAt) : '—'}</div>
          ${UIKIT.iconButton('chevron-right', { size: 'sm' })}
        </div>
      </div>`;
  }

  // ─────────────── AFTER HOOK ───────────────
  function after() {
    load().then(() => {
      const root = document.getElementById('page-root');
      if (!root) return;
      const page = root.querySelector('.page');
      if (page) page.outerHTML = renderContent();
      populateCompanyFilter();
      bindEvents();
      attachRealtime();
    });
    Router.setCleanup(() => {
      if (_unsub) { _unsub(); _unsub = null; }
      if (_searchDebounce) clearTimeout(_searchDebounce);
    });
  }

  // ─────────────── LOAD ───────────────
  async function load() {
    try {
      _rows = await Contract.list({ limit: 500 });
    } catch (err) {
      console.error('[ContractPage.load]', err);
      _rows = [];
      UI.toast({ message: 'Failed to load contract staff', type: 'error' });
    }
  }

  async function populateCompanyFilter() {
    const sel = document.getElementById('cs-company-filter');
    if (!sel) return;
    const companies = new Map();
    for (const r of _rows) {
      if (r.companyId && !companies.has(r.companyId)) {
        companies.set(r.companyId, r.companyName || r.companyId);
      }
    }
    const options = ['<option value="">All Companies</option>'];
    for (const [id, name] of companies) {
      options.push(`<option value="${Utils.escapeHtml(id)}">${Utils.escapeHtml(name)}</option>`);
    }
    sel.innerHTML = options.join('');
    if (_filter.companyId) sel.value = _filter.companyId;
  }

  function applyFilters() {
    let rows = _rows;
    if (_filter.status)    rows = rows.filter(r => r.status === _filter.status);
    if (_filter.companyId) rows = rows.filter(r => r.companyId === _filter.companyId);
    if (_filter.query) {
      const q = _filter.query.toLowerCase();
      rows = rows.filter(r => [r.candidateName, r.candidateCode, r.position, r.site, r.companyName, r.supervisorName]
        .some(x => String(x || '').toLowerCase().includes(q)));
    }
    return rows;
  }

  function refreshList() {
    const list = document.getElementById('cs-list');
    const sc = document.getElementById('cs-status-chips');
    const sub = document.getElementById('cs-subtitle');
    if (list) { list.innerHTML = renderList(); bindRowClicks(); }
    if (sc) { sc.innerHTML = renderStatusChips(); bindChipClicks(); }
    if (sub) {
      const t = computeTotals();
      sub.textContent = `${_rows.length} total · ${t.active} active · ${Utils.formatCurrency(t.monthly)} monthly`;
    }
  }

  // ─────────────── EVENTS ───────────────
  function bindEvents() {
    const newBtn = document.querySelector('[data-action="new-contract"]');
    if (newBtn) newBtn.addEventListener('click', openEnrollDrawer);

    const si = document.getElementById('cs-search');
    if (si) si.addEventListener('input', (e) => {
      if (_searchDebounce) clearTimeout(_searchDebounce);
      _searchDebounce = setTimeout(() => { _filter.query = e.target.value.trim(); refreshList(); }, 300);
    });

    const cf = document.getElementById('cs-company-filter');
    if (cf) cf.addEventListener('change', (e) => { _filter.companyId = e.target.value || null; refreshList(); });

    bindChipClicks();
    bindRowClicks();
  }

  function bindChipClicks() {
    document.querySelectorAll('#cs-status-chips .chip').forEach(c => {
      c.addEventListener('click', () => { _filter.status = c.dataset.status || null; refreshList(); });
    });
  }

  function bindRowClicks() {
    document.querySelectorAll('[data-contract-id]').forEach(el => {
      el.addEventListener('click', () => openDetailDrawer(el.dataset.contractId));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetailDrawer(el.dataset.contractId); }
      });
    });
  }

  // ─────────────── REALTIME ───────────────
  function attachRealtime() {
    _unsub = DB.watchList(CONST.COLLECTIONS.CONTRACT_STAFF, { limit: 500 }, (rows) => {
      _rows = rows;
      if (Router.current() === 'contract') {
        refreshList();
        populateCompanyFilter();
      }
    });
  }
  // ═══════════════════════════════════════════════════════════
  //  DRAWERS + ACTIONS

      .map(c => `<option value="${Utils.escapeHtml(c.id)}" data-name="${Utils.escapeHtml(c.name || '')}" data-code="${Utils.escapeHtml(c.employeeCode || '')}">${Utils.escapeHtml((c.name || '') + (c.jobProfile ? ' · ' + c.jobProfile : ''))}</option>`)
      .join('');

    const html = `
      <form id="cs-form" style="display:flex;flex-direction:column;">

          <select class="select" name="companyId" id="cs-company" required>

          ${UIKIT.field({ label: 'Shift', html: `<input class="input" name="shift" placeholder="Day / Night">` })}
          ${UIKIT.field({ label: 'Working Days', html: `<input class="input" type="number" name="workingDays" min="1" max="31" value="26">` })}
        </div>

        <div class="field-row">
          ${UIKIT.field({ label: 'Monthly Rate (₹)', required: true, html: `<input class="input" type="number" name="monthlyRate" id="cs-rate" min="1" required placeholder="26000">` })}

          ${UIKIT.field({ label: 'Start Date', required: true, html: `<input class="input" type="date" name="startDate" id="cs-start" required>` })}
          ${UIKIT.field({ label: 'End Date', html: `<input class="input" type="date" name="endDate">` })}

        ${UIKIT.field({ label: 'Supervisor (name, optional)', html: `<input class="input" name="supervisorName" placeholder="Suresh K.">` })}

        <div id="cs-preview" style="margin:8px 0 16px;padding:14px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius);">
          <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">Rate Preview</div>

    const d = UI.openDrawer(html, { title: 'Enroll Contract Staff', subtitle: 'Attendance-driven billing', size: 'lg' });

    d.el.querySelector('#cs-start').value = new Date().toISOString().slice(0, 10);

    const previewBox = d.el.querySelector('#cs-preview-body');
    function updatePreview() {

      if (!rate || !wd) { previewBox.textContent = 'Enter monthly rate to preview daily rate.'; return; }
      const daily = Contract.computeDailyRate(rate, wd);
      previewBox.innerHTML = `
        <div style="display:flex;justify-content:space-between;"><span>Daily Rate</span><span>${Utils.formatCurrency(daily)}</span></div>

        <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:6px;padding-top:6px;font-weight:600;color:var(--text-primary);"><span>Monthly</span><span>${Utils.formatCurrency(rate)}</span></div>`;
    }

    wdIn.addEventListener('input', updatePreview);

    // Footer
    const footer = document.createElement('div');
    footer.className = 'drawer-footer';
    footer.innerHTML = `
      ${UIKIT.button({ label: 'Cancel', variant: 'ghost', data: 'cancel' })}
      ${UIKIT.button({ label: 'Enroll Staff', variant: 'primary', icon: 'save', data: 'save' })}

    d.el.querySelector('.drawer').appendChild(footer);

    footer.querySelector('[data-action="cancel"]').addEventListener('click', d.close);

  // ─────────────── ACTIONS ───────────────
  async function handleContractAction(act, c, btn, drawer) {
    if (act === 'terminate') {
      const typeOpts = `
        Termination Type:
        1 = Client Initiated (30 days notice)
        2 = Company Initiated (7 days, payment default)
        3 = Mutual (0 days)
        4 = Force Majeure (0 days)

        Enter 1 / 2 / 3 / 4:`;
      const choice = prompt(typeOpts, '1');
      if (!choice) return;
      const typeMap = { '1':'client', '2':'company', '3':'mutual', '4':'force_majeure' };
      const type = typeMap[choice.trim()];
      if (!type) { UI.toast({ message: 'Invalid choice', type: 'error' }); return; }
      const reason = prompt('Reason (optional):', '') || '';
      await UI.btnSave(btn, async () => {
        await Contract.initiateTermination(c.id, type, { reason });
        UI.toast({ message: 'Termination initiated · On Notice', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'cancel-notice') {
      const reason = prompt('Cancellation reason:', '') || '';
      await UI.btnSave(btn, async () => {
        await Contract.cancelTermination(c.id, reason);
        UI.toast({ message: 'Notice cancelled', type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'complete-release') {
      const note = prompt('Final settlement note (optional):', '') || '';
      await UI.btnSave(btn, async () => {
        await Contract.completeTermination(c.id, { note });
        UI.toast({ message: 'Staff released', type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'replacement') {
      const reason = prompt('Replacement reason (staff left / client request):', 'staff-left') || 'staff-left';
      const ok = await UI.confirm({
        title: 'Initiate Replacement?',
        message: 'Free replacement window is 7 days from vacancy.',
        okText: 'Initiate'
      });
      if (!ok) return;
      await UI.btnSave(btn, async () => {
        await Contract.initiateReplacement(c.id, { reason });
        UI.toast({ message: 'Replacement requested · 7-day window', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'complete-replacement') {
      const newCandId = prompt('New candidate ID (from candidates collection):', '');
      if (!newCandId) return;
      const newCandName = prompt('New candidate name:', '') || '';
      await UI.btnSave(btn, async () => {
        const newId = await Contract.completeReplacement(c.id, newCandId.trim(), { newCandidateName: newCandName });
        UI.toast({ message: 'Replacement enrolled · ID: ' + newId.slice(-6), type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'suspend') {
      const reason = prompt('Suspend reason:', '') || '';
      await UI.btnSave(btn, async () => {
        await Contract.suspend(c.id, reason);
        UI.toast({ message: 'Suspended', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'resume') {
      await UI.btnSave(btn, async () => {
        await Contract.resume(c.id);
        UI.toast({ message: 'Resumed', type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
  }

  // ─────────────── HELPERS ───────────────
  function formToObj(form) {
    const obj = {};
    new FormData(form).forEach((v, k) => {
      const s = String(v).trim();
      if (!s) return;
      if (['monthlyRate','marginPct','workingDays'].includes(k)) obj[k] = Number(s) || 0;
      else obj[k] = s;
    });
    return obj;
  }

  // ═══════════════ RETURN + CLOSE IIFE ═══════════════
  return { renderPage, after };
})();

  async function handleMark(staffId, status, btn) {

    const isEdit = !!existing;

    // If editing and reason required → prompt

      if (!within) {

          danger: true, okText: 'Unlock & Edit'
        });

      }
      editReason = prompt('Reason for change (required):', '');
      if (!editReason || editReason.trim().length < 3) {
        UI.toast({ message: 'Reason required (min 3 chars)', type: 'error' });
        return;
      }
    }

    // Inline feedback on the specific button
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner" style="width:12px;height:12px;border-width:2px;"></span>`;

    try {
      const payload = {
        contractStaffId: staffId,
        candidateId: staff.candidateId || null,
        candidateName: staff.candidateName || null,
        companyId: staff.companyId || null,
        site: staff.site || null,
        supervisorId: staff.supervisorId || STATE.user?.uid || null,
        date: _date,
        status,
        editReason
      };

      if (isEdit && existing.markedAt && !Attendance.isWithinEditWindow(existing.markedAt)) {
        await Attendance.unlockAndMark(payload, editReason);
      } else {
        await Attendance.mark(payload);
      }

      // Optimistic local update
      _attendance[staffId] = { ...existing, ...payload, markedAt: new Date().toISOString() };

      // Swap button colors (re-render row)
      const row = btn.closest('[data-staff]')?.parentElement;
      if (row) {
        // Update status badge + button styles without full re-render
        updateRowVisuals(staffId);
      }

      // Update summary chip counts
      updateSummaryChips();

      UI.toast({ message: `${staff.candidateName || 'Staff'} → ${status}`, type: 'success', duration: 1000 });
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
      UI.toast({ message: err.message || 'Mark failed', type: 'error' });
    }
  }

  function updateRowVisuals(staffId) {
    const a = _attendance[staffId];
    if (!a) return;
    // Find buttons container
    const btns = document.querySelectorAll(`[data-action="mark"][data-staff="${staffId}"]`);
    btns.forEach(b => {
      const code = b.dataset.status;
      if (code === a.status) {
        b.style.background = `var(--${statusColor(code)})`;
        b.style.color = 'var(--white)';
        b.style.borderColor = `var(--${statusColor(code)})`;
        b.disabled = false;
        b.innerHTML = code;
      } else {
        b.style.background = '';
        b.style.color = '';
        b.style.borderColor = '';
        b.disabled = false;
        b.innerHTML = code;
      }
    });
    // Update badge in name row
    const nameEl = document.querySelector(`[data-action="mark"][data-staff="${staffId}"]`)?.closest('div[style*="flex:1"]');
    if (nameEl) {
      const titleDiv = nameEl.querySelector('div:first-child');
      if (titleDiv) {
        const baseName = titleDiv.textContent.replace(/\s+(P|H|A|L|WO|HO)$/,'').trim();
        titleDiv.innerHTML = `${Utils.escapeHtml(baseName)} <span class="badge badge-${statusBadge(a.status)}" style="margin-left:6px;">${a.status}</span>`;
      }
    }
  }

  function updateSummaryChips() {
    const sub = document.getElementById('att-subtitle');
    const summary = computeDaySummary();
    if (sub) sub.textContent = `${Utils.formatDate(_date)} · ${summary.marked}/${_staff.length} marked`;
    // Update counts chips — simpler: just re-render chip row values
    const chips = document.querySelectorAll('.card .chip-row .chip');
    if (chips.length >= 6) {
      chips[0].innerHTML = `<span style="color:var(--success);font-weight:700;">P</span> ${summary.counts.P}`;
      chips[1].innerHTML = `<span style="color:var(--warning);font-weight:700;">H</span> ${summary.counts.H}`;
      chips[2].innerHTML = `<span style="color:var(--error);font-weight:700;">A</span> ${summary.counts.A}`;
      chips[3].innerHTML = `<span style="color:var(--text-muted);font-weight:700;">L</span> ${summary.counts.L}`;
      chips[4].innerHTML = `<span style="color:var(--info);font-weight:700;">WO</span> ${summary.counts.WO}`;
      chips[5].innerHTML = `<span style="color:var(--gold-dark);font-weight:700;">HO</span> ${summary.counts.HO}`;
    }
  }

  async function markAllPresent() {
    const entries = _staff.map(s => ({
      contractStaffId: s.id,
      candidateId: s.candidateId,
      candidateName: s.candidateName,
      companyId: s.companyId,
      site: s.site,
      supervisorId: s.supervisorId || STATE.user?.uid || null,
      status: 'P'
    }));

  //  MONTH VIEW (read-only table)
  // ═══════════════════════════════════════════════════════════
  async function openMonthView() {
    const month = _date.slice(0, 7); // YYYY-MM
    const d = UI.openDrawer('<div class="skeleton skeleton-block" style="height:300px;"></div>', {
      title: 'Month View', subtitle: month, size: 'xl'
    });

    try {
      if (!_companyId) {
        throw new Error('Select a company to see month view');
      }
      const summary = await Attendance.companyMonthSummary(_companyId, month);
      if (!summary.perStaff.length) {
        const body = d.el.querySelector('.drawer-body');
        if (body) body.innerHTML = UIKIT.emptyState({
          icon: 'calendar-x',
          title: 'No records',
          message: `No attendance recorded for ${month}.`
        });
        return;
      }

      // Build table: staff name × day columns (1-31)
      const daysInMonth = new Date(month + '-01');
      const y = daysInMonth.getFullYear();
      const m = daysInMonth.getMonth();
      const totalDays = new Date(y, m + 1, 0).getDate();

      const dayHeaders = Array.from({length: totalDays}, (_, i) => `<th style="min-width:28px;text-align:center;font-size:10px;">${i + 1}</th>`).join('');

      const rowsHtml = summary.perStaff.map(s => {
        const dayCells = Array.from({length: totalDays}, (_, i) => {
          const dayStr = `${month}-${String(i + 1).padStart(2, '0')}`;
          // Use the byDate if we loaded per staff, else leave blank
          const code = (s.byDate && s.byDate[dayStr]) || '';
          const color = code ? `background:var(--${statusColor(code)});color:var(--white);` : '';
          return `<td style="text-align:center;padding:2px;"><span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;font-size:10px;font-weight:600;${color}">${code}</span></td>`;
        }).join('');
        return `
          <tr>
            <td style="position:sticky;left:0;background:var(--white);z-index:1;font-weight:600;font-size:12px;min-width:140px;padding:6px 8px;">
              ${Utils.escapeHtml(s.candidateName || '—')}
              <div class="text-muted" style="font-size:10px;">Billable: ${s.billableDays || 0}d</div>
            </td>
            ${dayCells}
            <td style="font-weight:700;text-align:center;background:var(--bg-subtle);">${s.billableDays || 0}</td>
          </tr>`;
      }).join('');

      const tableHtml = `
        <div class="table-wrap" style="overflow:auto;">
          <table class="table" style="min-width:${Math.max(900, totalDays * 30 + 200)}px;">
            <thead>
              <tr>
                <th style="position:sticky;left:0;background:var(--bg-subtle);z-index:2;">Staff</th>
                ${dayHeaders}
                <th style="min-width:50px;text-align:center;">Bill</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;">
          <span class="chip" style="cursor:default;"><span style="color:var(--success);font-weight:700;">P</span> Present</span>
          <span class="chip" style="cursor:default;"><span style="color:var(--warning);font-weight:700;">H</span> Half</span>
          <span class="chip" style="cursor:default;"><span style="color:var(--error);font-weight:700;">A</span> Absent</span>
          <span class="chip" style="cursor:default;"><span style="color:var(--text-muted);font-weight:700;">L</span> Leave</span>
          <span class="chip" style="cursor:default;"><span style="color:var(--info);font-weight:700;">WO</span> Week Off</span>
          <span class="chip" style="cursor:default;"><span style="color:var(--gold-dark);font-weight:700;">HO</span> Holiday</span>
        </div>`;

      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = tableHtml;
    } catch (err) {
      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = UIKIT.errorState({ message: err.message });
    }
  }

  // ─────────────── REALTIME ───────────────
  function attachRealtime() {
    // Watch today's attendance for the active company (if selected)
    if (_companyId) {
      _unsub = Attendance.watchByDate(_companyId, _date, (rows) => {
        _attendance = {};
        for (const a of rows) if (a.contractStaffId) _attendance[a.contractStaffId] = a;
        if (Router.current() === 'attendance') {
          document.querySelectorAll('[data-action="mark"]').forEach(b => {
            const staffId = b.dataset.staff;
            const code = b.dataset.status;
            const active = _attendance[staffId]?.status === code;
            if (active) {
              b.style.background = `var(--${statusColor(code)})`;
              b.style.color = 'var(--white)';
              b.style.borderColor = `var(--${statusColor(code)})`;
            } else {
              b.style.background = '';
              b.style.color = '';
              b.style.borderColor = '';
            }
          });
          updateSummaryChips();
        }
      });
    }
    // Watch staff list for changes
    _unsubStaff = DB.watchList(CONST.COLLECTIONS.CONTRACT_STAFF, {
      where: [['status', '==', 'ACTIVE']],
      limit: 500
    }, async (rows) => {
      if (_companyId) rows = rows.filter(r => r.companyId === _companyId);
      _staff = rows;
      if (Router.current() === 'attendance') {
        await loadAttendance();
        refreshAll();
      }
    });
  }

  // ═══════════════ RETURN + CLOSE IIFE ═══════════════
  return { renderPage, after };
})();

      staff += Number(s.staffCount) || 0;

      populateCompanyFilter();
      bindEvents();
      attachRealtime();

        actions.push({ label: 'Mark Paid', variant: 'success', icon: 'check', data: 'paid' });

      if (body) body.innerHTML = UIKIT.errorState({ message: err.message });

  // ─────────────── ACTIONS ───────────────
  async function handlePayrollAction(act, p, btn, drawer) {
    if (act === 'processing') {
      const note = prompt('Processing note (optional):', '') || '';
      await UI.btnSave(btn, async () => {
        await Payroll.markProcessing(p.id, note);
        UI.toast({ message: 'Marked as processing', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'paid') {
      const ref = prompt('Payment reference (optional):', '') || '';
      const ok = await UI.confirm({
        title: 'Mark Payroll Paid?',
        message: 'This will record the payroll as paid. Continue?',
        okText: 'Mark Paid'
      });
      if (!ok) return;
      await UI.btnSave(btn, async () => {
        await Payroll.markPaid(p.id, { reference: ref });
        UI.toast({ message: 'Payroll marked paid', type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'cancel') {
      const reason = prompt('Cancel reason:', '') || '';
      const ok = await UI.confirm({
        title: 'Cancel Payroll?',
        message: 'This run will be marked cancelled.',
        danger: true, okText: 'Cancel Payroll'
      });
      if (!ok) return;
      await UI.btnSave(btn, async () => {
        await Payroll.cancel(p.id, reason);
        UI.toast({ message: 'Payroll cancelled', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
  }

  // ═══════════════ RETURN + CLOSE IIFE ═══════════════
  return { renderPage, after };
})();

//  TASKS PAGE — Part 1/2 (setup + list + filters)

const TasksPage = (function () {
  'use strict';

  let _rows = [];
  let _view = 'today'; // today | overdue | all | done
  let _filter = { priority: null, query: '' };
  let _unsub = null;
  let _searchDebounce = null;

  const PRIORITY_BADGE = { low: 'neutral', medium: 'info', high: 'error' };
  const PRIORITY_LABEL = { low: 'Low', medium: 'Medium', high: 'High' };

  // ─────────────── SKELETON ───────────────
  function renderPage() {
    return `
      <div class="page">
        <div class="page-header"><div class="page-title-group"><div class="skeleton skeleton-title"></div></div></div>
        <div class="skeleton skeleton-block" style="height:64px;"></div>
        <div class="skeleton skeleton-block"></div>
      </div>`;
  }

  // ─────────────── FULL RENDER ───────────────
  function renderContent() {
    return `
      <div class="page">
        <div class="page-header">
          <div class="page-title-group">
            <div class="page-title">Tasks</div>
            <div class="page-subtitle" id="tasks-subtitle">${countsText()}</div>
          </div>
          <div class="page-actions">
            ${UIKIT.button({ label: 'New Task', variant: 'primary', icon: 'plus', data: 'new-task' })}
          </div>
        </div>

        <div class="section">
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="tabs" id="tasks-views">
              ${renderViewTabs()}
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
              <div class="input-group" style="flex:1;min-width:220px;max-width:380px;">
                ${UIKIT.icon('search', 18, 'input-icon')}
                <input id="tasks-search" class="input" type="text" placeholder="Search title, tags…" value="${Utils.escapeHtml(_filter.query)}">
              </div>
              <div class="chip-row" id="tasks-priority-chips">
                ${renderPriorityChips()}
              </div>
            </div>
          </div>
        </div>

        <div class="section" id="tasks-list">${renderList()}</div>
      </div>`;
  }

  function countsText() {
    const open = _rows.filter(r => !r.completed).length;
    const overdue = _rows.filter(r => !r.completed && r.dueDate && r.dueDate.slice(0,10) < new Date().toISOString().slice(0,10)).length;
    return `${open} open · ${overdue} overdue`;
  }

  function renderViewTabs() {
    const views = [
      { id: 'today',   label: 'Today' },
      { id: 'overdue', label: 'Overdue' },
      { id: 'all',     label: 'All Open' },
      { id: 'done',    label: 'Done' }
    ];
    return views.map(v =>
      `<button type="button" class="tab${_view === v.id ? ' is-active' : ''}" data-view="${v.id}">${v.label}</button>`
    ).join('');
  }

  function renderPriorityChips() {
    const priorities = ['ALL','high','medium','low'];
    return priorities.map(p => {
      const active = (p === 'ALL' && !_filter.priority) || _filter.priority === p;
      const count = p === 'ALL' ? _rows.length : _rows.filter(r => r.priority === p).length;
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-priority="${p === 'ALL' ? '' : p}">
        ${p === 'ALL' ? 'All Priority' : PRIORITY_LABEL[p]}
        <span class="chip-count">${count}</span>
      </button>`;
    }).join('');
  }

  function renderList() {
    const rows = applyFilters();
    if (!rows.length) {
      return UIKIT.emptyState({
        icon: _view === 'done' ? 'check-circle-2' : 'check-square',
        title: _view === 'done' ? 'No completed tasks' : 'No tasks',
        message: _view === 'done' ? 'Completed tasks will appear here.' : 'Add your first task to get started.',
        actionLabel: _view === 'done' ? null : 'New Task',
        actionIcon: 'plus',
        actionData: 'new-task'
      });
    }
    // Group by priority (high first) for open views
    const sorted = [...rows].sort((a, b) => {
      const pOrder = { high: 0, medium: 1, low: 2 };
      const pa = pOrder[a.priority] ?? 1;
      const pb = pOrder[b.priority] ?? 1;
      if (pa !== pb) return pa - pb;
      const da = a.dueDate || '9999';
      const db = b.dueDate || '9999';
      return da.localeCompare(db);
    });
    return sorted.map(rowCard).join('');
  }

  function rowCard(r) {
    const pb = PRIORITY_BADGE[r.priority] || 'neutral';
    const due = r.dueDate ? r.dueDate.slice(0, 10) : null;
    const today = new Date().toISOString().slice(0, 10);
    const isOverdue = due && due < today && !r.completed;
    const isToday = due && due === today;
    const subtasks = Array.isArray(r.subtasks) ? r.subtasks : [];
    const doneCount = subtasks.filter(s => s.completed).length;

    const sub = [
      r.assignedToName || (r.assignedTo ? 'Someone' : ''),
      subtasks.length ? `${doneCount}/${subtasks.length} subtasks` : '',
      r.recurring ? `Recurring: ${r.recurring}` : ''
    ].filter(Boolean).join(' · ');

    const dueBadge = due ? `
      <span style="font-size:11px;${isOverdue ? 'color:var(--error);font-weight:600;' : isToday ? 'color:var(--warning);font-weight:600;' : 'color:var(--text-muted);'}">
        ${isOverdue ? '⚠ ' : ''}${Utils.formatDate(due)}
      </span>` : '';

    return `
      <div class="list-item" data-task-id="${Utils.escapeHtml(r.id)}" role="button" tabindex="0">
        <button type="button" class="btn-icon-only" data-action="quick-toggle" data-task="${r.id}" title="${r.completed ? 'Reopen' : 'Mark complete'}" style="width:32px;height:32px;background:${r.completed ? 'var(--success-bg)' : 'var(--bg-subtle)'};border-color:${r.completed ? 'var(--success)' : 'var(--border)'};">
          ${UIKIT.icon(r.completed ? 'check' : 'circle', 16, 'btn-icon')}
        </button>
        <div class="list-content">
          <div class="list-title" style="${r.completed ? 'text-decoration:line-through;color:var(--text-muted);' : ''}">
            ${Utils.escapeHtml(r.title || '—')}
          </div>
          ${sub ? `<div class="list-subtitle">${Utils.escapeHtml(sub)}</div>` : ''}
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            ${UIKIT.badge(PRIORITY_LABEL[r.priority] || r.priority, pb)}
            ${dueBadge}
            ${r.completed ? UIKIT.badge({ text: 'Done', type: 'success', icon: 'check' }) : ''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          ${UIKIT.iconButton('chevron-right', { size: 'sm' })}
        </div>
      </div>`;
  }

  // ─────────────── AFTER HOOK ───────────────
  function after() {
    load().then(() => {
      const root = document.getElementById('page-root');
      if (!root) return;
      const page = root.querySelector('.page');
      if (page) page.outerHTML = renderContent();
      bindEvents();
      attachRealtime();
    });
    Router.setCleanup(() => {
      if (_unsub) { _unsub(); _unsub = null; }
      if (_searchDebounce) clearTimeout(_searchDebounce);
    });
  }

  // ─────────────── LOAD ───────────────
  async function load() {
    try {
      const uid = STATE.user?.uid;
      if (!uid) { _rows = []; return; }
      _rows = await DB.list(CONST.COLLECTIONS.TASKS, {
        where: [['assignedTo', '==', uid]],
        limit: 300
      });
    } catch (err) {
      console.error('[TasksPage.load]', err);
      _rows = [];
      UI.toast({ message: 'Failed to load tasks', type: 'error' });
    }
  }

  function applyFilters() {
    let rows = _rows;
    const today = new Date().toISOString().slice(0, 10);

    // View filter
    if (_view === 'today') {
      rows = rows.filter(r => !r.completed && (!r.dueDate || r.dueDate.slice(0, 10) <= today));
    } else if (_view === 'overdue') {
      rows = rows.filter(r => !r.completed && r.dueDate && r.dueDate.slice(0, 10) < today);
    } else if (_view === 'all') {
      rows = rows.filter(r => !r.completed);
    } else if (_view === 'done') {
      rows = rows.filter(r => r.completed);
    }

    if (_filter.priority) rows = rows.filter(r => r.priority === _filter.priority);
    if (_filter.query) {
      const q = _filter.query.toLowerCase();
      rows = rows.filter(r =>
        (r.title || '').toLowerCase().includes(q) ||
        (r.notes || '').toLowerCase().includes(q) ||
        (r.tags || []).some(x => String(x).toLowerCase().includes(q))
      );
    }
    return rows;
  }

  function refreshList() {
    const list = document.getElementById('tasks-list');
    const tabs = document.getElementById('tasks-views');
    const chips = document.getElementById('tasks-priority-chips');
    const sub = document.getElementById('tasks-subtitle');
    if (list) { list.innerHTML = renderList(); bindRowClicks(); }
    if (tabs) { tabs.innerHTML = renderViewTabs(); bindTabClicks(); }
    if (chips) { chips.innerHTML = renderPriorityChips(); bindChipClicks(); }
    if (sub) sub.textContent = countsText();
  }

  // ─────────────── EVENTS ───────────────
  function bindEvents() {
    const newBtn = document.querySelector('[data-action="new-task"]');
    if (newBtn) newBtn.addEventListener('click', openCreateDrawer);

    const si = document.getElementById('tasks-search');
    if (si) si.addEventListener('input', (e) => {
      if (_searchDebounce) clearTimeout(_searchDebounce);
      _searchDebounce = setTimeout(() => { _filter.query = e.target.value.trim(); refreshList(); }, 300);
    });

    bindTabClicks();
    bindChipClicks();
    bindRowClicks();
  }

  function bindTabClicks() {
    document.querySelectorAll('#tasks-views .tab').forEach(t => {
      t.addEventListener('click', () => { _view = t.dataset.view; refreshList(); });
    });
  }

  function bindChipClicks() {
    document.querySelectorAll('#tasks-priority-chips .chip').forEach(c => {
      c.addEventListener('click', () => { _filter.priority = c.dataset.priority || null; refreshList(); });
    });
  }

  function bindRowClicks() {
    // Quick toggle
    document.querySelectorAll('[data-action="quick-toggle"]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const tid = btn.dataset.task;
        const task = _rows.find(r => r.id === tid);
        if (!task) return;
        try {
          if (task.completed) {
            await Tasks.reopen(tid, 'quick-toggle');
          } else {
            await Tasks.complete(tid);
          }
          await load();
          refreshList();
          UI.toast({ message: task.completed ? 'Task reopened' : 'Task completed', type: 'success', duration: 1000 });
        } catch (err) {
          UI.toast({ message: err.message || 'Failed', type: 'error' });
        }
      });
    });
    // Row open detail
    document.querySelectorAll('[data-task-id]').forEach(el => {
      el.addEventListener('click', () => openDetailDrawer(el.dataset.taskId));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetailDrawer(el.dataset.taskId); }
      });
    });
  }

  // ─────────────── REALTIME ───────────────
  function attachRealtime() {
    const uid = STATE.user?.uid;
    if (!uid) return;
    _unsub = DB.watchList(CONST.COLLECTIONS.TASKS, {
      where: [['assignedTo', '==', uid]],
      limit: 300
    }, (rows) => {
      _rows = rows;
      if (Router.current() === 'tasks') refreshList();
    });
  }

    });
    try {
      const t = await Tasks.getById(taskId);
      if (!t) throw new Error('Not found');
      renderDetailBody(d, t);
    } catch (err) {
      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = UIKIT.errorState({ message: err.message });
    }
  }

  function renderDetailBody(d, t) {
    const pb = PRIORITY_BADGE[t.priority] || 'neutral';
    const subtasks = Array.isArray(t.subtasks) ? t.subtasks : [];
    const today = new Date().toISOString().slice(0, 10);
    const isOverdue = t.dueDate && t.dueDate.slice(0, 10) < today && !t.completed;

    const head = `
      <div style="margin-bottom:20px;">
        <div style="font-family:var(--font-serif);font-size:var(--fs-xl);font-weight:600;letter-spacing:-0.02em;${t.completed ? 'text-decoration:line-through;color:var(--text-muted);' : ''}">
          ${Utils.escapeHtml(t.title || '—')}
        </div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
          ${UIKIT.badge(PRIORITY_LABEL[t.priority] || t.priority, pb)}
          ${t.completed
            ? UIKIT.badge({ text: 'Done', type: 'success', icon: 'check' })
            : isOverdue
              ? UIKIT.badge({ text: 'Overdue', type: 'error', icon: 'alert-triangle' })
              : t.dueDate ? UIKIT.badge({ text: 'Due ' + Utils.formatDate(t.dueDate), type: 'info', icon: 'calendar' }) : ''}
          ${t.recurring ? UIKIT.badge({ text: 'Repeats ' + t.recurring, type: 'gold', icon: 'repeat' }) : ''}
        </div>
      </div>`;

    const rows = [
      ['Assigned To', t.assignedToName || t.assignedTo],
      ['Due Date', t.dueDate ? Utils.formatDate(t.dueDate) : ''],
      ['Completed At', t.completedAt ? Utils.formatDateTimeFull(t.completedAt) : ''],
      ['Tags', Array.isArray(t.tags) ? t.tags.join(', ') : '']
    ].map(([k, v]) => v ? `
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-light);">
        <div class="text-muted" style="font-size:12px;">${Utils.escapeHtml(k)}</div>
        <div style="font-size:13px;font-weight:500;text-align:right;max-width:60%;word-break:break-word;">${Utils.escapeHtml(String(v))}</div>
      </div>` : '').join('');

    const notesPanel = t.notes ? `
      <div style="margin-top:16px;padding:12px;background:var(--bg-subtle);border-radius:var(--radius);">
        <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">Notes</div>
        <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">${Utils.escapeHtml(t.notes)}</div>
      </div>` : '';

    const subtasksHtml = `
      <div style="margin-top:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;">
            Subtasks (${subtasks.filter(s => s.completed).length}/${subtasks.length})
          </div>
        </div>
        <div id="subtasks-list" style="display:flex;flex-direction:column;gap:6px;">
          ${subtasks.length ? subtasks.map(s => `
            <label class="checkbox" style="padding:8px;background:var(--bg-subtle);border-radius:var(--radius);">
              <input type="checkbox" data-subtask="${Utils.escapeHtml(s.id)}" ${s.completed ? 'checked' : ''}>
              <span style="${s.completed ? 'text-decoration:line-through;color:var(--text-muted);' : ''}">${Utils.escapeHtml(s.title)}</span>
            </label>`).join('') : '<div class="text-muted" style="font-size:12px;">No subtasks yet.</div>'}
        </div>
        <div style="display:flex;gap:6px;margin-top:10px;">
          <input class="input" id="subtask-new" placeholder="Add a subtask…" style="flex:1;">
          ${UIKIT.button({ label: 'Add', variant: 'ghost', size: 'sm', data: 'add-subtask' })}
        </div>
      </div>`;

    const body = d.el.querySelector('.drawer-body');
    if (body) body.innerHTML = head + `<div>${rows}</div>` + notesPanel + subtasksHtml;
    d.el.querySelector('.drawer-title').textContent = 'Task';
    d.el.querySelector('.drawer-subtitle').textContent = t.id;

    // Footer actions
    const footer = document.createElement('div');
    footer.className = 'drawer-footer';
    const actions = [];
    if (!t.completed) actions.push({ label: 'Mark Complete', variant: 'success', icon: 'check', data: 'complete' });
    else actions.push({ label: 'Reopen', variant: 'ghost', icon: 'undo-2', data: 'reopen' });
    actions.push({ label: 'Delete', variant: 'danger', icon: 'trash-2', data: 'delete' });
    actions.push({ label: 'Close', variant: 'ghost', data: 'close' });
    footer.innerHTML = actions.map(a => UIKIT.button(a)).join('');
    d.el.querySelector('.drawer').appendChild(footer);

    // Bind subtask checkboxes
    body.querySelectorAll('input[data-subtask]').forEach(cb => {
      cb.addEventListener('change', async () => {
        await Tasks.toggleSubtask(t.id, cb.dataset.subtask);
        const updated = await Tasks.getById(t.id);
        renderDetailBody(d, updated);
      });
    });

    // Add subtask
    footer.addEventListener('click', () => {}); // placeholder
    document.querySelectorAll('[data-action="add-subtask"]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const input = document.getElementById('subtask-new');
        const title = input?.value?.trim();
        if (!title) return;
        await Tasks.addSubtask(t.id, { title });
        const updated = await Tasks.getById(t.id);
        renderDetailBody(d, updated);
      });
    });

    // Footer action bindings
    footer.querySelectorAll('button[data-action]').forEach(btn => {
      const act = btn.dataset.action;
      if (act === 'close') { btn.addEventListener('click', d.close); return; }
      btn.addEventListener('click', async (ev) => {
        await handleTaskAction(act, t, ev.currentTarget, d);
      });
    });
  }

  // ─────────────── ACTIONS ───────────────
  async function handleTaskAction(act, t, btn, drawer) {
    if (act === 'complete') {
      await UI.btnSave(btn, async () => {
        await Tasks.complete(t.id, '');
        UI.toast({ message: 'Task completed', type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'reopen') {
      const reason = prompt('Reopen reason (optional):', '') || '';
      await UI.btnSave(btn, async () => {
        await Tasks.reopen(t.id, reason);
        UI.toast({ message: 'Task reopened', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'delete') {
      const ok = await UI.confirm({
        title: 'Delete this task?',
        message: 'This cannot be undone.',
        danger: true, okText: 'Delete'
      });
      if (!ok) return;
      await UI.btnSave(btn, async () => {
        await Tasks.remove(t.id);
        UI.toast({ message: 'Task deleted', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
  }

  // ─────────────── HELPERS ───────────────
  function formToObj(form) {
    const obj = {};
    new FormData(form).forEach((v, k) => {
      const s = String(v).trim();
      if (!s) return;
      obj[k] = s;
    });
    return obj;
  }

  // ═══════════════ RETURN + CLOSE IIFE ═══════════════
  return { renderPage, after };
})();

// ─────────────── REGISTER ROUTE ───────────────
Router.register('tasks', {
  title: 'Tasks',
  render: TasksPage.renderPage,
  after: TasksPage.after,
  permission: null
});

console.log('[7H] Tasks page registered');

// ═══════════════════════════════════════════════════════════
//  CHAT PAGE — Part 1/2 (chat list + search + new chat)
//  Internal only. 1-to-1 + groups (max 20). Text + task-in-chat.
// ═══════════════════════════════════════════════════════════

const ChatPage = (function () {
  'use strict';

  let _chats = [];
  let _activeChatId = null;
  let _activeChat = null;
  let _messages = [];
  let _teammates = [];
  let _unsubChats = null;
  let _unsubMessages = null;
  let _unsubActiveChat = null;
  let _searchDebounce = null;
  let _chatFilter = '';

  // ─────────────── SKELETON ───────────────
  function renderPage() {
    return `
      <div class="page">
        <div class="page-header"><div class="page-title-group"><div class="skeleton skeleton-title"></div></div></div>
        <div class="skeleton skeleton-block" style="height:500px;"></div>
      </div>`;
  }

  // ─────────────── FULL RENDER ───────────────
  function renderContent() {
    return `
      <div class="page" style="max-width:1400px;">
        <div class="page-header">
          <div class="page-title-group">
            <div class="page-title">Chat</div>
            <div class="page-subtitle">${_chats.length} conversations</div>
          </div>
          <div class="page-actions">
            ${UIKIT.button({ label: 'New Chat', variant: 'primary', icon: 'message-plus', data: 'new-chat' })}
          </div>
        </div>

        <div class="chat-layout" style="display:grid;grid-template-columns:320px 1fr;gap:16px;height:calc(100vh - 220px);min-height:520px;">
          <div class="card" style="padding:0;display:flex;flex-direction:column;overflow:hidden;">
            <div style="padding:12px 14px;border-bottom:1px solid var(--border-light);">
              <div class="input-group">
                ${UIKIT.icon('search', 16, 'input-icon')}
                <input id="chat-search" class="input" type="text" placeholder="Search chats…" value="${Utils.escapeHtml(_chatFilter)}" style="height:38px;">
              </div>
            </div>
            <div id="chat-list" style="flex:1;overflow-y:auto;">
              ${renderChatList()}
            </div>
          </div>

          <div class="card" style="padding:0;display:flex;flex-direction:column;overflow:hidden;" id="chat-panel">
            ${renderChatPanel()}
          </div>
        </div>
      </div>

      <style>
        @media (max-width: 900px) {
          .chat-layout { grid-template-columns: 1fr !important; height: auto !important; }
          .chat-layout > .card:first-child { max-height: 240px; }
          .chat-layout > .card:last-child { min-height: 520px; }
        }
      </style>`;
  }

  // ─────────────── CHAT LIST ───────────────
  function renderChatList() {
    const rows = applyChatFilter();
    if (!rows.length) {
      return `<div style="padding:24px;">${UIKIT.emptyState({
        icon: 'message-circle',
        title: 'No chats yet',
        message: 'Start a conversation with a teammate.',
        actionLabel: 'New Chat',
        actionIcon: 'message-plus',
        actionData: 'new-chat'
      })}</div>`;
    }
    return rows.map(chatRow).join('');
  }

  function applyChatFilter() {
    if (!_chatFilter) return _chats;
    const q = _chatFilter.toLowerCase();
    return _chats.filter(c => {
      const name = chatDisplayName(c).toLowerCase();
      const last = (c.lastMessage?.text || '').toLowerCase();
      return name.includes(q) || last.includes(q);
    });
  }

  function chatRow(c) {
    const isActive = c.id === _activeChatId;
    const isGroup = c.type === 'group';
    const name = chatDisplayName(c);
    const unread = Number((c.unreadBy || {})[STATE.user?.uid]) || 0;
    const initials = isGroup
      ? Utils.initials(name, 2)
      : Utils.initials(chatOtherName(c) || name, 2);
    const lastMsg = c.lastMessage
      ? `${c.lastMessage.task ? '📋 ' : ''}${Utils.truncate(c.lastMessage.text || '', 40)}`
      : 'No messages yet';
    const time = c.lastMessageAt ? Utils.formatRelative(c.lastMessageAt) : '';

    return `
      <div class="chat-row" data-chat-id="${Utils.escapeHtml(c.id)}" role="button" tabindex="0" style="padding:12px 14px;border-bottom:1px solid var(--border-light);cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:${isActive ? 'rgba(201,169,97,0.08)' : 'transparent'};transition:background .15s;">
        <div class="avatar avatar-md" style="${isGroup ? 'background:linear-gradient(135deg,var(--navy-light),var(--navy));' : ''}">${initials}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;gap:6px;align-items:center;">
            <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${Utils.escapeHtml(name)}</div>
            <div class="text-muted" style="font-size:10px;flex-shrink:0;">${Utils.escapeHtml(time)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;gap:6px;margin-top:2px;">
            <div class="text-muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">${Utils.escapeHtml(lastMsg)}</div>
            ${unread > 0 ? `<span class="nav-badge" style="font-size:10px;padding:1px 6px;">${unread > 99 ? '99+' : unread}</span>` : ''}
          </div>
        </div>
      </div>`;
  }

  function chatDisplayName(c) {
    if (c.type === 'group') return c.name || 'Group';
    return chatOtherName(c) || 'Direct Chat';
  }

  function chatOtherName(c) {
    const uid = STATE.user?.uid;
    if (!c.members || c.members.length < 2) return 'Chat';
    const otherId = c.members.find(m => m !== uid);
    // Try to find name from teammates cache
    const t = _teammates.find(x => x.id === otherId);
    return t?.name || c.memberNames?.[otherId] || otherId || 'Chat';
  }

  // ─────────────── CHAT PANEL ───────────────
  function renderChatPanel() {
    if (!_activeChat) {
      return `
        <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px;">
          ${UIKIT.emptyState({
            icon: 'message-square',
            title: 'Select a conversation',
            message: 'Choose a chat from the list, or start a new one.',
            actionLabel: 'New Chat',
            actionIcon: 'message-plus',
            actionData: 'new-chat'
          })}
        </div>`;
    }

    const name = chatDisplayName(_activeChat);
    const sub = _activeChat.type === 'group'
      ? `${_activeChat.members?.length || 0} members`
      : 'Direct message';

    return `
      <div style="padding:14px 18px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div style="display:flex;gap:10px;align-items:center;min-width:0;">
          <div class="avatar avatar-md" style="${_activeChat.type === 'group' ? 'background:linear-gradient(135deg,var(--navy-light),var(--navy));' : ''}">
            ${Utils.initials(name, 2)}
          </div>
          <div style="min-width:0;">
            <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${Utils.escapeHtml(name)}</div>
            <div class="text-muted" style="font-size:11px;">${Utils.escapeHtml(sub)}</div>
          </div>
        </div>
        ${_activeChat.type === 'group' ? UIKIT.iconButton('users', { title: 'Members', data: 'chat-members' }) : ''}
      </div>

      <div id="chat-messages" style="flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;">
        ${renderMessages()}
      </div>

      <div style="padding:12px 14px;border-top:1px solid var(--border-light);background:var(--bg-subtle);">
        <div style="display:flex;gap:8px;align-items:flex-end;">
          <textarea id="chat-input" class="textarea" placeholder="Type a message…" style="flex:1;min-height:42px;max-height:120px;padding:10px 12px;resize:none;font-size:14px;" rows="1"></textarea>
          ${UIKIT.button({ label: '', variant: 'ghost', icon: 'paperclip', data: 'chat-task', size: 'sm' })}
          ${UIKIT.button({ label: 'Send', variant: 'primary', icon: 'send', data: 'chat-send' })}
        </div>
      </div>`;
  }

  function renderMessages() {
    if (!_messages.length) {
      return `<div class="text-muted" style="text-align:center;font-size:12px;margin-top:20px;">No messages yet. Say hi 👋</div>`;
    }
    let html = '';
    let lastDate = '';
    for (const m of _messages) {
      const d = m.createdAt?.toDate ? m.createdAt.toDate() : new Date(m.createdAt || Date.now());
      const dayKey = d.toISOString().slice(0, 10);
      if (dayKey !== lastDate) {
        html += `<div style="text-align:center;margin:10px 0;"><span style="background:var(--bg);padding:3px 10px;border-radius:var(--radius-full);font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:0.08em;text-transform:uppercase;">${Utils.formatDate(d)}</span></div>`;
        lastDate = dayKey;
      }
      html += messageBubble(m);
    }
    return html;
  }

  function messageBubble(m) {
    const mine = m.senderId === STATE.user?.uid;
    const isTask = m.type === 'task' && m.task;
    const time = m.createdAt ? Utils.formatTime(m.createdAt) : '';
    const sender = mine ? '' : `<div style="font-size:10px;color:var(--text-muted);margin-bottom:2px;">${Utils.escapeHtml(m.senderName || '')}</div>`;
    const seen = mine && Array.isArray(m.seenBy) && m.seenBy.length > 0 ? '<span style="font-size:10px;color:var(--info);margin-left:6px;">✓✓</span>' : '';

    if (m.deleted) {
      return `<div style="text-align:${mine ? 'right' : 'left'};"><div style="display:inline-block;padding:8px 12px;background:var(--bg);border-radius:12px;font-style:italic;color:var(--text-muted);font-size:12px;">Message deleted</div></div>`;
    }

    if (isTask) {
      const t = m.task;
      return `
        <div style="text-align:${mine ? 'right' : 'left'};">
          ${sender}
          <div style="display:inline-block;max-width:78%;padding:10px 14px;background:${mine ? 'linear-gradient(135deg,var(--gold-light),var(--gold))' : 'var(--white)'};border:1px solid ${mine ? 'transparent' : 'var(--border)'};border-radius:12px;text-align:left;">
            <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:${mine ? 'var(--navy)' : 'var(--gold-dark)'};margin-bottom:6px;">📋 Task</div>
            <div style="font-size:13px;font-weight:600;color:var(--navy);">${Utils.escapeHtml(t.title || '')}</div>
            <div style="font-size:11px;color:${mine ? 'var(--navy)' : 'var(--text-secondary)'};margin-top:4px;opacity:0.85;">
              ${t.priority ? 'Priority: ' + t.priority : ''} ${t.dueDate ? '· Due ' + Utils.formatDate(t.dueDate) : ''}
            </div>
          </div>
          <div class="text-muted" style="font-size:10px;margin-top:3px;">${time}${seen}</div>
        </div>`;
    }

    return `
      <div style="text-align:${mine ? 'right' : 'left'};">
        ${sender}
        <div style="display:inline-block;max-width:78%;padding:8px 12px;background:${mine ? 'var(--navy)' : 'var(--white)'};color:${mine ? 'var(--white)' : 'var(--text-primary)'};border:1px solid ${mine ? 'transparent' : 'var(--border)'};border-radius:12px;text-align:left;font-size:13px;line-height:1.4;word-wrap:break-word;">
          ${Utils.escapeHtml(m.text || '').replace(/\n/g, '<br>')}
        </div>
        <div class="text-muted" style="font-size:10px;margin-top:3px;">${time}${seen}</div>
      </div>`;
  }

  // ─────────────── AFTER HOOK ───────────────
  function after() {
    bootstrap().then(() => {
      const root = document.getElementById('page-root');
      if (!root) return;
      const page = root.querySelector('.page');
      if (page) page.outerHTML = renderContent();
      bindEvents();
      attachRealtime();
    });
    Router.setCleanup(() => {
      if (_unsubChats) { _unsubChats(); _unsubChats = null; }
      if (_unsubMessages) { _unsubMessages(); _unsubMessages = null; }
      if (_unsubActiveChat) { _unsubActiveChat(); _unsubActiveChat = null; }
      if (_searchDebounce) clearTimeout(_searchDebounce);
    });
  }

  // ─────────────── BOOTSTRAP ───────────────
  async function bootstrap() {
    try {
      const [chats, users] = await Promise.all([
        Chat.listMine({ limit: 100 }),
        DB.list(CONST.COLLECTIONS.USERS, { limit: 300 }).catch(() => [])
      ]);
      _chats = chats;
      _teammates = users.filter(u => u.primaryRole !== 'CLIENT');
    } catch (err) {
      console.error('[ChatPage.bootstrap]', err);
      _chats = [];
      UI.toast({ message: 'Failed to load chats', type: 'error' });
    }
  }

  // ─────────────── REFRESH ───────────────
  function refreshList() {
    const listEl = document.getElementById('chat-list');
    if (listEl) { listEl.innerHTML = renderChatList(); bindChatRowClicks(); }
    const sub = document.querySelector('.page-subtitle');
    if (sub) sub.textContent = `${_chats.length} conversations`;
  }

  function refreshPanel() {
    const panel = document.getElementById('chat-panel');
    if (panel) { panel.innerHTML = renderChatPanel(); bindPanelEvents(); }
  }

  function refreshMessages() {
    const box = document.getElementById('chat-messages');
    if (box) {
      box.innerHTML = renderMessages();
      box.scrollTop = box.scrollHeight;
    }
  }

    // ═══════════════════════════════════════════════════════════
  //  EVENTS + REALTIME + DRAWERS
  // ═══════════════════════════════════════════════════════════

  // ─────────────── BIND EVENTS ───────────────
  function bindEvents() {
    // New chat
    document.querySelectorAll('[data-action="new-chat"]').forEach(b => {
      b.addEventListener('click', openNewChatDrawer);
    });

    // Chat search
    const si = document.getElementById('chat-search');
    if (si) si.addEventListener('input', (e) => {
      if (_searchDebounce) clearTimeout(_searchDebounce);
      _searchDebounce = setTimeout(() => { _chatFilter = e.target.value.trim(); refreshList(); }, 200);
    });

    bindChatRowClicks();
    bindPanelEvents();
  }

  function bindChatRowClicks() {
    document.querySelectorAll('[data-chat-id]').forEach(el => {
      el.addEventListener('click', () => selectChat(el.dataset.chatId));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectChat(el.dataset.chatId); }
      });
    });
  }

  function bindPanelEvents() {
    // Send
    const sendBtn = document.querySelector('[data-action="chat-send"]');
    if (sendBtn) sendBtn.addEventListener('click', handleSend);

    // Task in chat
    const taskBtn = document.querySelector('[data-action="chat-task"]');
    if (taskBtn) taskBtn.addEventListener('click', openTaskInChatDrawer);

    // Textarea: Enter sends, Shift+Enter newline, auto-grow
    const ta = document.getElementById('chat-input');
    if (ta) {
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });
      ta.addEventListener('input', () => {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
      });
    }

    // Members drawer for groups
    const mb = document.querySelector('[data-action="chat-members"]');
    if (mb) mb.addEventListener('click', openMembersDrawer);
  }

  // ─────────────── SELECT CHAT ───────────────
  async function selectChat(chatId) {
    if (_activeChatId === chatId) return;
    _activeChatId = chatId;
    _activeChat = _chats.find(c => c.id === chatId) || null;
    if (!_activeChat) {
      try { _activeChat = await Chat.getById(chatId); } catch (_) {}
    }

    // Load messages
    try {
      _messages = await Chat.listMessages(chatId, { limit: 100 });
    } catch (_) { _messages = []; }

    // Mark seen
    try { await Chat.markSeen(chatId); } catch (_) {}

    // Reset unread badge locally
    if (_activeChat && _activeChat.unreadBy) {
      _activeChat.unreadBy[STATE.user?.uid] = 0;
    }

    refreshList();
    refreshPanel();
  }

  // ─────────────── SEND ───────────────
  async function handleSend() {
    if (!_activeChatId) return;
    const ta = document.getElementById('chat-input');
    if (!ta) return;
    const text = ta.value.trim();
    if (!text) return;

    // Optimistic UI: clear input immediately
    ta.value = '';
    ta.style.height = 'auto';

    try {
      await Chat.sendMessage({
        chatId: _activeChatId,
        text,
        senderName: STATE.profile?.name || STATE.user?.email || 'You'
      });

      // Reload messages (realtime will also fire)
      _messages = await Chat.listMessages(_activeChatId, { limit: 100 });
      // Update chats list ordering
      try { _chats = await Chat.listMine({ limit: 100 }); } catch (_) {}
      refreshMessages();
      refreshList();
    } catch (err) {
      UI.toast({ message: err.message || 'Send failed', type: 'error' });
      // restore input
      ta.value = text;
    }
  }

  // ─────────────── TASK IN CHAT ───────────────
  function openTaskInChatDrawer() {
    if (!_activeChatId) { UI.toast({ message: 'Select a chat first', type: 'info' }); return; }
    const today = new Date().toISOString().slice(0, 10);
    const html = `
      <form id="task-in-chat-form" style="display:flex;flex-direction:column;">
        ${UIKIT.field({ label: 'Task Title', required: true, html: `<input class="input" name="title" required placeholder="Send JD to Ravi">` })}

          ${UIKIT.field({ label: 'Priority', html: `
            <select class="select" name="priority">
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>` })}
          ${UIKIT.field({ label: 'Due Date', html: `<input class="input" type="date" name="dueDate" value="${today}">` })}
