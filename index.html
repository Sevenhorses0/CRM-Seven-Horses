<script>
  'use strict';

  // ═══════════════════════════════════════════════════════════
  //  DASHBOARD PAGE — 8 role-wise KPI cards + realtime
  // ═══════════════════════════════════════════════════════════

  const DashboardPage = (function () {
    'use strict';

    let _unsubTasks = null;
    let _unsubNotif = null;
    let _refreshDebounce = null;

    // ─────────────── CARD CONFIG ───────────────
    function cardConfig(data) {
      return [
        {
          key: 'totalCompanies', label: 'Companies', icon: 'building-2',
          value: data.totalCompanies, route: 'companies',
          color: 'navy'
        },
        {
          key: 'totalCandidates', label: 'Candidates', icon: 'users',
          value: data.totalCandidates, route: 'candidates',
          color: 'navy'
        },
        {
          key: 'activeCandidates', label: 'Active Pool', icon: 'user-check',
          value: data.activeCandidates, route: 'candidates', params: { stage: 'ACTIVE' },
          color: 'gold'
        },
        {
          key: 'placedCandidates', label: 'Placed', icon: 'check-circle-2',
          value: data.placedCandidates, route: 'candidates', params: { stage: 'PLACED' },
          color: 'success'
        },
        {
          key: 'openTasks', label: 'Open Tasks', icon: 'check-square',
          value: data.openTasks, sub: data.overdueTasks > 0 ? `${data.overdueTasks} overdue` : null,
          route: 'tasks', color: data.overdueTasks > 0 ? 'error' : 'navy'
        },
        {
          key: 'pendingInvoices', label: 'Pending Invoices', icon: 'file-text',
          value: data.pendingInvoices, route: 'invoices', params: { status: 'pending' },
          color: 'warning'
        },
        {
          key: 'unreadChats', label: 'Chat', icon: 'message-circle',
          value: data.unreadChats, route: 'chat', color: 'gold'
        },
        {
          key: 'clientCompanies', label: 'Clients', icon: 'briefcase',
          value: data.clientCompanies, route: 'companies', params: { stage: 'CLIENT' },
          color: 'success'
        }
      ];
    }

    // ─────────────── RENDER ───────────────
    function render(data) {
      const role = STATE.primaryRole || 'EMPLOYEE';
      const name = Utils.escapeHtml(STATE.profile?.name || 'there');
      const cards = cardConfig(data);

      const cardsHtml = cards.map(c => {
        const subHtml = c.sub
          ? `<div class="stat-label" style="color:var(--${c.color});font-weight:600;">${Utils.escapeHtml(c.sub)}</div>`
          : `<div class="stat-label">${Utils.escapeHtml(c.label)}</div>`;
        const dataAttr = `data-route="${c.route}"${c.params ? ` data-params='${JSON.stringify(c.params)}'` : ''}`;
        return `
          <div class="card card-stat" ${dataAttr} role="button" tabindex="0">
            <div class="stat-header">
              <div class="stat-icon" style="${c.color !== 'navy' ? `background:rgba(var(--${c.color}-rgb,201 169 97),0.12);color:var(--${c.color});` : ''}">
                ${UIKIT.icon(c.icon, 18)}
              </div>
            </div>
            <div class="stat-value">${Utils.formatNumber(c.value || 0)}</div>
            ${subHtml}
          </div>`;
      }).join('');

      return `
        <div class="page">
          <div class="page-header">
            <div class="page-title-group">
              <div class="page-title">Welcome, ${name}</div>
              <div class="page-subtitle">
                ${UIKIT.icon('calendar', 12)} ${Utils.formatDate(new Date())} · ${Utils.formatTime(new Date())} IST
              </div>
            </div>
            <div class="page-actions">
              ${UIKIT.button({ label: 'Refresh', variant: 'ghost', icon: 'refresh-cw', size: 'sm', data: 'dash-refresh' })}
            </div>
          </div>

          <div class="section">
            <div class="grid grid-stats" id="dashboard-cards">
              ${cardsHtml}
            </div>
          </div>

          <div class="section" id="dashboard-quick">
            ${renderQuickPanel(role)}
          </div>
        </div>`;
    }

    function renderQuickPanel(role) {
      if (role === 'MASTER' || role === 'ADMIN') {
        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title">Quick Actions</div>
            </div>
            <div class="card-body" style="flex-direction:row;flex-wrap:wrap;gap:8px;">
              ${UIKIT.button({ label: 'New Company', variant: 'primary', icon: 'plus', size: 'sm', data: 'new-company' })}
              ${UIKIT.button({ label: 'New Candidate', variant: 'secondary', icon: 'user-plus', size: 'sm', data: 'new-candidate' })}
              ${UIKIT.button({ label: 'New Task', variant: 'ghost', icon: 'check-square', size: 'sm', data: 'new-task' })}
              ${UIKIT.button({ label: 'Invoice', variant: 'ghost', icon: 'file-plus', size: 'sm', data: 'new-invoice' })}
            </div>
          </div>`;
      }
      return '';
    }

    // ─────────────── LOAD ───────────────
    async function load() {
      try {
        const role = STATE.primaryRole;
        let kpis = {};
        // Role-based scope
        const scope = {};
        if (role === 'EMPLOYEE') scope.ownerId = STATE.user?.uid;
        kpis = await Aggregates.crmDashboard(scope);
        return kpis;
      } catch (err) {
        console.error('[Dashboard.load]', err);
        return {
          totalCompanies:0, clientCompanies:0, totalCandidates:0,
          activeCandidates:0, placedCandidates:0,
          openTasks:0, overdueTasks:0, pendingInvoices:0, unreadChats:0
        };
      }
    }

    // ─────────────── PAGE RENDER ───────────────
    async function renderPage() {
      // Skeleton
      return `
        <div class="page">
          <div class="page-header">
            <div class="page-title-group">
              <div class="skeleton skeleton-title"></div>
            </div>
          </div>
          <div class="grid grid-stats">
            ${Array(8).fill('<div class="skeleton skeleton-card"></div>').join('')}
          </div>
        </div>`;
    }

    // ─────────────── AFTER HOOK ───────────────
    function after() {
      // Load real data + inject
      load().then(data => {
        const root = document.getElementById('page-root');
        if (!root) return;
        const page = root.querySelector('.page');
        if (!page) return;
        page.outerHTML = render(data);
        bindEvents();
        attachRealtime();
      });

      // Cleanup registration
      Router.setCleanup(() => {
        if (_unsubTasks) { _unsubTasks(); _unsubTasks = null; }
        if (_unsubNotif) { _unsubNotif(); _unsubNotif = null; }
      });
    }

    // ─────────────── EVENTS ───────────────
    function bindEvents() {
      // Card clicks
      document.querySelectorAll('#dashboard-cards .card-stat[data-route]').forEach(el => {
        el.addEventListener('click', () => {
          const route = el.dataset.route;
          const params = el.dataset.params ? JSON.parse(el.dataset.params) : {};
          if (Router.list().includes(route)) Router.navigateTo(route, params);
          else UI.toast({ message: `"${route}" page coming soon`, type: 'info' });
        });
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            el.click();
          }
        });
      });

      // Refresh
      const refreshBtn = document.querySelector('[data-action="dash-refresh"]');
      if (refreshBtn) {
        refreshBtn.addEventListener('click', () => UI.btnSave(refreshBtn, async () => {
          await sleep(300);
          const data = await load();
          const grid = document.getElementById('dashboard-cards');
          if (grid) {
            const cards = cardConfig(data);
            grid.innerHTML = cards.map(c => {
              const subHtml = c.sub
                ? `<div class="stat-label" style="color:var(--${c.color});font-weight:600;">${Utils.escapeHtml(c.sub)}</div>`
                : `<div class="stat-label">${Utils.escapeHtml(c.label)}</div>`;
              const dataAttr = `data-route="${c.route}"${c.params ? ` data-params='${JSON.stringify(c.params)}'` : ''}`;
              return `
                <div class="card card-stat" ${dataAttr} role="button" tabindex="0">
                  <div class="stat-header">
                    <div class="stat-icon">${UIKIT.icon(c.icon, 18)}</div>
                  </div>
                  <div class="stat-value">${Utils.formatNumber(c.value || 0)}</div>
                  ${subHtml}
                </div>`;
            }).join('');
            bindEvents();
          }
        }, { label: 'Refreshing...', successLabel: 'Refreshed', revertMs: 800 }));
      }

      // Quick action buttons
      document.querySelectorAll('[data-action^="new-"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          UI.toast({ message: `${action.replace('new-','New ')} — coming soon`, type: 'info' });
        });
      });
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // ─────────────── REALTIME ───────────────
    function attachRealtime() {
      const uid = STATE.user?.uid;
      if (!uid) return;

      // Refresh KPIs when tasks change (debounced)
      _unsubTasks = DB.watchList(CONST.COLLECTIONS.TASKS, {
        where: [['assignedTo', '==', uid], ['completed', '==', false]],
        limit: 200
      }, () => {
        if (_refreshDebounce) clearTimeout(_refreshDebounce);
        _refreshDebounce = setTimeout(() => {
          if (Router.current() === 'dashboard') {
            const grid = document.getElementById('dashboard-cards');
            if (grid) grid.classList.add('is-refreshing');
            load().then(data => {
              const grid2 = document.getElementById('dashboard-cards');
              if (grid2) {
                const cards = cardConfig(data);
                grid2.innerHTML = cards.map(c => {
                  const subHtml = c.sub
                    ? `<div class="stat-label" style="color:var(--${c.color});font-weight:600;">${Utils.escapeHtml(c.sub)}</div>`
                    : `<div class="stat-label">${Utils.escapeHtml(c.label)}</div>`;
                  const dataAttr = `data-route="${c.route}"${c.params ? ` data-params='${JSON.stringify(c.params)}'` : ''}`;
                  return `
                    <div class="card card-stat" ${dataAttr} role="button" tabindex="0">
                      <div class="stat-header">
                        <div class="stat-icon">${UIKIT.icon(c.icon, 18)}</div>
                      </div>
                      <div class="stat-value">${Utils.formatNumber(c.value || 0)}</div>
                      ${subHtml}
                    </div>`;
                }).join('');
                bindEvents();
              }
            });
          }
        }, 800);
      });
    }

    return { renderPage, after };
  })();

  // ─────────────── REGISTER ROUTE ───────────────
  Router.register('dashboard', {
    title: 'Dashboard',
    render: DashboardPage.renderPage,
    after: DashboardPage.after,
    permission: null
  });

  console.log('[7H] Dashboard page registered');

  // ═══════════════════════════════════════════════════════════
//  COMPANIES PAGE
//  List + stage filter chips + search + New/View drawers
// ═══════════════════════════════════════════════════════════

const CompaniesPage = (function () {
  'use strict';

  let _rows = [];
  let _filter = { stage: null, query: '' };
  let _unsub = null;
  let _searchDebounce = null;

  const STAGE_LABELS = {
    PROSPECT:   { label: 'Prospect',   badge: 'neutral' },
    LEAD:       { label: 'Lead',       badge: 'info' },
    INTERESTED: { label: 'Interested', badge: 'warning' },
    CLIENT:     { label: 'Client',     badge: 'success' },
    PLACED:     { label: 'Placed',     badge: 'success' },
    REPEAT:     { label: 'Repeat',     badge: 'gold' },
    ARCHIVED:   { label: 'Archived',   badge: 'neutral' },
    BLACKLISTED:{ label: 'Blacklisted',badge: 'error' }
  };

  // ─────────────── RENDER (skeleton) ───────────────
  function renderPage() {
    return `
      <div class="page">
        <div class="page-header">
          <div class="page-title-group">
            <div class="skeleton skeleton-title"></div>
          </div>
        </div>
        <div class="skeleton skeleton-block" style="height:64px;"></div>
        <div class="skeleton skeleton-block"></div>
        <div class="skeleton skeleton-block"></div>
      </div>`;
  }

  // ─────────────── FULL RENDER ───────────────
  function renderContent() {
    const chipsHtml = renderStageChips();
    const listHtml = _rows.length
      ? _rows.map(rowCard).join('')
      : UIKIT.emptyState({
          icon: 'building-2',
          title: 'No companies yet',
          message: 'Add your first company to start tracking requirements.',
          actionLabel: 'Add Company',
          actionIcon: 'plus',
          actionData: 'new-company'
        });

    return `
      <div class="page">
        <div class="page-header">
          <div class="page-title-group">
            <div class="page-title">Companies</div>
            <div class="page-subtitle">${_rows.length} total · ${countByStage('CLIENT')} clients</div>
          </div>
          <div class="page-actions">
            ${UIKIT.button({ label: 'Add Company', variant: 'primary', icon: 'plus', data: 'new-company' })}
          </div>
        </div>

        <div class="section">
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="input-group" style="max-width:420px;">
              ${UIKIT.icon('search', 18, 'input-icon')}
              <input id="companies-search" class="input" type="text" placeholder="Search by name, city, phone…" value="${Utils.escapeHtml(_filter.query)}">
            </div>
            <div class="chip-row" id="companies-chips">
              ${chipsHtml}
            </div>
          </div>
        </div>

        <div class="section" id="companies-list">
          ${listHtml}
        </div>
      </div>`;
  }

  function renderStageChips() {
    const stages = ['ALL','PROSPECT','LEAD','INTERESTED','CLIENT','ARCHIVED','BLACKLISTED'];
    return stages.map(s => {
      const active = (s === 'ALL' && !_filter.stage) || _filter.stage === s;
      const count = s === 'ALL' ? _rows.length : countByStage(s);
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-stage="${s === 'ALL' ? '' : s}">
        ${s === 'ALL' ? 'All' : (STAGE_LABELS[s]?.label || s)}
        <span class="chip-count">${count}</span>
      </button>`;
    }).join('');
  }

  function countByStage(stage) {
    return _rows.filter(r => r.stage === stage).length;
  }

  function rowCard(r) {
    const sb = STAGE_LABELS[r.stage] || { label: r.stage, badge: 'neutral' };
    const subtitle = [r.city, r.industry].filter(Boolean).join(' · ') || '—';
    const agreement = r.agreementSigned
      ? `<span class="badge badge-success">${UIKIT.icon('check', 11, 'badge-icon')}Agreement</span>`
      : `<span class="badge badge-warning">${UIKIT.icon('alert-triangle', 11, 'badge-icon')}No Agreement</span>`;
    const portal = r.portalAccess
      ? `<span class="badge badge-info">Portal</span>`
      : '';

    return `
      <div class="list-item" data-company-id="${Utils.escapeHtml(r.id)}" role="button" tabindex="0">
        <div class="avatar avatar-md">${Utils.initials(r.name || '?')}</div>
        <div class="list-content">
          <div class="list-title">${Utils.escapeHtml(r.name || '—')}</div>
          <div class="list-subtitle">${Utils.escapeHtml(subtitle)}</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">
            ${UIKIT.badge(sb.label, sb.badge)}
            ${agreement}
            ${portal}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div class="text-muted" style="font-size:11px;">${Utils.formatRelative(r.updatedAt)}</div>
          ${UIKIT.iconButton('chevron-right', { size: 'sm' })}
        </div>
      </div>`;
  }

  // ─────────────── AFTER HOOK ───────────────
  function after() {
    load().then(() => {
      const root = document.getElementById('page-root');
      if (!root) return;
      const page = root.querySelector('.page');
      if (page) page.outerHTML = renderContent();
      bindEvents();
      attachRealtime();
    });

    Router.setCleanup(() => {
      if (_unsub) { _unsub(); _unsub = null; }
      if (_searchDebounce) clearTimeout(_searchDebounce);
    });
  }

  // ─────────────── LOAD ───────────────
  async function load() {
    try {
      const filters = { limit: 200 };
      // scope by owner for EMPLOYEE
      if (STATE.primaryRole === 'EMPLOYEE') filters.ownerId = STATE.user?.uid;
      _rows = await Companies.list(filters);
    } catch (err) {
      console.error('[CompaniesPage.load]', err);
      _rows = [];
      UI.toast({ message: 'Failed to load companies', type: 'error' });
    }
  }

  function applyFilters() {
    // Client-side filter on loaded rows (server filters applied in load)
    let rows = _rows;
    if (_filter.stage) rows = rows.filter(r => r.stage === _filter.stage);
    if (_filter.query) {
      const q = _filter.query.toLowerCase();
      rows = rows.filter(r => [
        r.name, r.city, r.email, r.phone, r.industry
      ].some(x => String(x || '').toLowerCase().includes(q)));
    }
    return rows;
  }

  function refreshList() {
    const list = document.getElementById('companies-list');
    const chips = document.getElementById('companies-chips');
    if (list) {
      const filtered = applyFilters();
      list.innerHTML = filtered.length
        ? filtered.map(rowCard).join('')
        : UIKIT.emptyState({
            icon: 'search-x',
            title: 'No matches',
            message: 'Try a different search or clear filters.'
          });
      bindRowClicks();
    }
    if (chips) chips.innerHTML = renderStageChips();
    bindChipClicks();
  }

  // ─────────────── EVENTS ───────────────
  function bindEvents() {
    // Add company
    const newBtn = document.querySelector('[data-action="new-company"]');
    if (newBtn) newBtn.addEventListener('click', openCreateDrawer);

    // Search
    const searchInput = document.getElementById('companies-search');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        if (_searchDebounce) clearTimeout(_searchDebounce);
        _searchDebounce = setTimeout(() => {
          _filter.query = e.target.value.trim();
          refreshList();
        }, 300);
      });
    }

    bindChipClicks();
    bindRowClicks();
  }

  function bindChipClicks() {
    document.querySelectorAll('#companies-chips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        _filter.stage = chip.dataset.stage || null;
        refreshList();
      });
    });
  }

  function bindRowClicks() {
    document.querySelectorAll('[data-company-id]').forEach(el => {
      el.addEventListener('click', () => openDetailDrawer(el.dataset.companyId));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openDetailDrawer(el.dataset.companyId);
        }
      });
    });
  }

  // ─────────────── CREATE DRAWER ───────────────
  function openCreateDrawer() {
    const html = `
      <form id="company-form" style="display:flex;flex-direction:column;gap:0;">
        ${UIKIT.field({
          label: 'Company Name', required: true,
          html: `<input class="input" name="name" required placeholder="Acme Pvt Ltd">`
        })}
        <div class="field-row">
          ${UIKIT.field({ label: 'Email', html: `<input class="input" type="email" name="email" placeholder="hello@acme.com">` })}
          ${UIKIT.field({ label: 'Phone', html: `<input class="input" type="tel" name="phone" placeholder="9876543210">` })}
        </div>
        <div class="field-row">
          ${UIKIT.field({ label: 'City', html: `<input class="input" name="city" placeholder="Mumbai">` })}
          ${UIKIT.field({ label: 'Website', html: `<input class="input" name="website" placeholder="acme.com">` })}
        </div>
        <div class="field-row">
          ${UIKIT.field({ label: 'GSTIN', html: `<input class="input" name="gstin" placeholder="27AAPFU0939F1ZV" style="text-transform:uppercase;">` })}
          ${UIKIT.field({ label: 'Service Type', html: `
            <select class="select" name="serviceType">
              <option value="placement">Placement</option>
              <option value="contract">Contract Staffing</option>
              <option value="both">Both</option>
            </select>` })}
        </div>
        ${UIKIT.field({ label: 'Notes', html: `<textarea class="textarea" name="notes" placeholder="Any additional details…"></textarea>` })}
      </form>`;
    const d = UI.openDrawer(html, { title: 'Add Company', subtitle: 'Fill basic details', size: 'lg' });

    // Footer buttons
    const footer = document.createElement('div');
    footer.className = 'drawer-footer';
    footer.innerHTML = `
      ${UIKIT.button({ label: 'Cancel', variant: 'ghost', data: 'cancel' })}
      ${UIKIT.button({ label: 'Save Company', variant: 'primary', icon: 'save', data: 'save' })}
    `;
    d.el.querySelector('.drawer').appendChild(footer);

    footer.querySelector('[data-action="cancel"]').addEventListener('click', d.close);
    footer.querySelector('[data-action="save"]').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const form = document.getElementById('company-form');
      if (!form.reportValidity()) return;
      const data = formToObj(form);
      await UI.btnSave(btn, async () => {
        const id = await Companies.create(data);
        UI.toast({ message: 'Company created', type: 'success' });
        d.close();
        await load();
        refreshList();
        return id;
      });
    });
  }

  // ─────────────── DETAIL DRAWER ───────────────
  async function openDetailDrawer(companyId) {
    const d = UI.openDrawer('<div class="skeleton skeleton-block" style="height:200px;"></div>', {
      title: 'Company', subtitle: 'Loading…', size: 'lg'
    });
    try {
      const c = await Companies.getById(companyId);
      if (!c) throw new Error('Not found');

      const sb = STAGE_LABELS[c.stage] || { label: c.stage, badge: 'neutral' };
      const headHtml = `
        <div style="display:flex;gap:14px;align-items:center;margin-bottom:20px;">
          <div class="avatar avatar-lg">${Utils.initials(c.name || '?')}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-family:var(--font-serif);font-size:var(--fs-xl);font-weight:600;letter-spacing:-0.02em;">${Utils.escapeHtml(c.name || '—')}</div>
            <div class="text-muted" style="font-size:12px;margin-top:2px;">
              ${Utils.escapeHtml([c.city, c.industry].filter(Boolean).join(' · ') || '—')}
            </div>
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
              ${UIKIT.badge(sb.label, sb.badge)}
              ${c.agreementSigned ? UIKIT.badge({ text:'Agreement Signed', type:'success', icon:'check' }) : UIKIT.badge({ text:'No Agreement', type:'warning', icon:'alert-triangle' })}
              ${c.portalAccess ? UIKIT.badge({ text:'Portal Access', type:'info' }) : ''}
            </div>
          </div>
        </div>`;

      const detailRows = [
        ['Email', c.email],
        ['Phone', c.phone],
        ['Website', c.website],
        ['GSTIN', c.gstin],
        ['Address', c.address],
        ['Service Type', c.serviceType],
        ['Owner', c.ownerId]
      ].map(([k, v]) => v ? `
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light);">
          <div class="text-muted" style="font-size:12px;">${Utils.escapeHtml(k)}</div>
          <div style="font-size:13px;font-weight:500;text-align:right;max-width:60%;word-break:break-word;">${Utils.escapeHtml(String(v))}</div>
        </div>` : '').join('');

      const notes = c.notes ? `
        <div style="margin-top:16px;padding:12px;background:var(--bg-subtle);border-radius:var(--radius);">
          <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">Notes</div>
          <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">${Utils.escapeHtml(c.notes)}</div>
        </div>` : '';

      const bodyHtml = headHtml + `<div>${detailRows}</div>` + notes;
      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = bodyHtml;

      const title = d.el.querySelector('.drawer-title');
      if (title) title.textContent = c.name || 'Company';
      const sub = d.el.querySelector('.drawer-subtitle');
      if (sub) sub.textContent = 'ID: ' + c.id;

      // Footer actions
      const footer = document.createElement('div');
      footer.className = 'drawer-footer';
      footer.innerHTML = `
        ${UIKIT.button({ label: 'Close', variant: 'ghost', data: 'close' })}
        ${UIKIT.button({ label: 'Mark Client', variant: 'secondary', icon: 'check-circle-2', data: 'mark-client' })}
        ${UIKIT.button({ label: 'Sign Agreement', variant: 'primary', icon: 'file-signature', data: 'sign-agr' })}
      `;
      d.el.querySelector('.drawer').appendChild(footer);

      footer.querySelector('[data-action="close"]').addEventListener('click', d.close);
      footer.querySelector('[data-action="mark-client"]').addEventListener('click', async (e) => {
        await UI.btnSave(e.currentTarget, async () => {
          await Companies.setStage(c.id, 'CLIENT');
          UI.toast({ message: 'Marked as Client', type: 'success' });
          d.close();
          await load();
          refreshList();
        });
      });
      footer.querySelector('[data-action="sign-agr"]').addEventListener('click', async (e) => {
        const agrId = prompt('Agreement ID:', 'AG-' + Date.now().toString(36).toUpperCase());
        if (!agrId) return;
        await UI.btnSave(e.currentTarget, async () => {
          await Companies.markAgreementSigned(c.id, agrId);
          UI.toast({ message: 'Agreement signed', type: 'success' });
          d.close();
          await load();
          refreshList();
        });
      });
    } catch (err) {
      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = UIKIT.errorState({ message: err.message });
    }
  }

  function formToObj(form) {
    const obj = {};
    new FormData(form).forEach((v, k) => {
      const s = String(v).trim();
      if (s) obj[k] = s;
    });
    return obj;
  }

  // ─────────────── REALTIME ───────────────
  function attachRealtime() {
    const filters = { limit: 200 };
    if (STATE.primaryRole === 'EMPLOYEE') filters.ownerId = STATE.user?.uid;
    _unsub = Companies.watchList(filters, (rows) => {
      _rows = rows;
      if (Router.current() === 'companies') refreshList();
    });
  }

  return { renderPage, after };
})();

// ─────────────── REGISTER ROUTE ───────────────
Router.register('companies', {
  title: 'Companies',
  render: CompaniesPage.renderPage,
  after: CompaniesPage.after,
  permission: ['companies', 'view']
});

console.log('[7H] Companies page registered');

  // ═══════════════════════════════════════════════════════════
//  CANDIDATES PAGE
//  6-stage flow + common pool toggle + search + drawers
// ═══════════════════════════════════════════════════════════

const CandidatesPage = (function () {
  'use strict';

  let _rows = [];
  let _filter = { stage: null, query: '', poolOnly: false };
  let _unsub = null;
  let _searchDebounce = null;

  const STAGE_LABELS = {
    NEW:       { label: 'New',       badge: 'neutral' },
    ACTIVE:    { label: 'Active',    badge: 'info' },
    SUBMITTED: { label: 'Submitted', badge: 'warning' },
    INTERVIEW: { label: 'Interview', badge: 'gold' },
    SELECTED:  { label: 'Selected',  badge: 'success' },
    PLACED:    { label: 'Placed',    badge: 'success' },
    REJECTED:  { label: 'Rejected',  badge: 'error' },
    DROPPED:   { label: 'Dropped',   badge: 'neutral' },
    REPLACED:  { label: 'Replaced',  badge: 'warning' },
    ARCHIVED:  { label: 'Archived',  badge: 'neutral' }
  };

  // ─────────────── RENDER (skeleton) ───────────────
  function renderPage() {
    return `
      <div class="page">
        <div class="page-header"><div class="page-title-group"><div class="skeleton skeleton-title"></div></div></div>
        <div class="skeleton skeleton-block" style="height:64px;"></div>
        <div class="skeleton skeleton-block"></div>
        <div class="skeleton skeleton-block"></div>
      </div>`;
  }

  // ─────────────── FULL RENDER ───────────────
  function renderContent() {
    return `
      <div class="page">
        <div class="page-header">
          <div class="page-title-group">
            <div class="page-title">Candidates</div>
            <div class="page-subtitle" id="cand-subtitle">${_rows.length} total · ${countByStage('ACTIVE')} active in pool</div>
          </div>
          <div class="page-actions">
            ${UIKIT.button({ label: 'Add Candidate', variant: 'primary', icon: 'user-plus', data: 'new-candidate' })}
          </div>
        </div>

        <div class="section">
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
              <div class="input-group" style="flex:1;min-width:240px;max-width:420px;">
                ${UIKIT.icon('search', 18, 'input-icon')}

              </div>
              <label class="checkbox" style="margin-top:0;">
                <input type="checkbox" id="candidates-pool-toggle" ${_filter.poolOnly ? 'checked' : ''}>
                <span>Common Pool Only</span>
              </label>
            </div>
            <div class="chip-row" id="candidates-chips">${renderStageChips()}</div>
          </div>
        </div>

        <div class="section" id="candidates-list">${renderList()}</div>
      </div>`;
  }

  function renderStageChips() {
    const stages = ['ALL','NEW','ACTIVE','SUBMITTED','INTERVIEW','SELECTED','PLACED','REJECTED'];
    return stages.map(s => {
      const active = (s === 'ALL' && !_filter.stage) || _filter.stage === s;
      const count = s === 'ALL' ? _rows.length : countByStage(s);
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-stage="${s === 'ALL' ? '' : s}">
        ${s === 'ALL' ? 'All' : (STAGE_LABELS[s]?.label || s)}
        <span class="chip-count">${count}</span>
      </button>`;
    }).join('');
  }

  function countByStage(stage) { return _rows.filter(r => r.stage === stage).length; }

  function renderList() {
    const rows = applyFilters();
    if (!rows.length) {
      return UIKIT.emptyState({
        icon: _filter.poolOnly ? 'users' : 'user-search',
        title: _filter.poolOnly ? 'No candidates in pool' : 'No candidates yet',
        message: _filter.poolOnly ? 'Activate candidates to see them here.' : 'Add your first candidate to begin.',
        actionLabel: _filter.poolOnly ? null : 'Add Candidate',

      });

    return `

          <div class="list-subtitle">${Utils.escapeHtml(subtitle)}</div>

        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">

          ${UIKIT.iconButton('chevron-right', { size: 'sm' })}
        </div>
      </div>`;

      const page = root.querySelector('.page');
      if (page) page.outerHTML = renderContent();
      bindEvents();
      attachRealtime();
    });

    Router.setCleanup(() => {
      if (_unsub) { _unsub(); _unsub = null; }
      if (_searchDebounce) clearTimeout(_searchDebounce);
    });
  }

  // ─────────────── LOAD ───────────────
  async function load() {
    try {
      const filters = { limit: 300 };
      if (STATE.primaryRole === 'EMPLOYEE') filters.assignedToEmployeeId = STATE.user?.uid;
      _rows = await Candidates.list(filters);
    } catch (err) {
      console.error('[CandidatesPage.load]', err);
      _rows = [];
      UI.toast({ message: 'Failed to load candidates', type: 'error' });
    }
  }

  function applyFilters() {
    let rows = _rows;
    if (_filter.stage) rows = rows.filter(r => r.stage === _filter.stage);
    if (_filter.poolOnly) rows = rows.filter(r => r.stage === 'ACTIVE' && !r.lockedToCompanyId && !r.onHold && !r.isDeleted);
    if (_filter.query) {
      const q = _filter.query.toLowerCase();
      rows = rows.filter(r => [r.name, r.city, r.email, r.phone, r.jobProfile]
        .some(x => String(x || '').toLowerCase().includes(q)));
    }
    return rows;
  }

  function refreshList() {
    const list = document.getElementById('candidates-list');
    const chips = document.getElementById('candidates-chips');
    const sub = document.getElementById('cand-subtitle');
    if (list) { list.innerHTML = renderList(); bindRowClicks(); }
    if (chips) { chips.innerHTML = renderStageChips(); bindChipClicks(); }
    if (sub) sub.textContent = `${_rows.length} total · ${countByStage('ACTIVE')} active in pool`;
  }

  // ─────────────── EVENTS ───────────────
  function bindEvents() {
    const newBtn = document.querySelector('[data-action="new-candidate"]');
    if (newBtn) newBtn.addEventListener('click', openCreateDrawer);

    const searchInput = document.getElementById('candidates-search');
    if (searchInput) searchInput.addEventListener('input', (e) => {
      if (_searchDebounce) clearTimeout(_searchDebounce);
      _searchDebounce = setTimeout(() => { _filter.query = e.target.value.trim(); refreshList(); }, 300);
    });

    const toggle = document.getElementById('candidates-pool-toggle');
    if (toggle) toggle.addEventListener('change', (e) => { _filter.poolOnly = e.target.checked; refreshList(); });

    bindChipClicks();
    bindRowClicks();
  }

  function bindChipClicks() {
    document.querySelectorAll('#candidates-chips .chip').forEach(chip => {
      chip.addEventListener('click', () => { _filter.stage = chip.dataset.stage || null; refreshList(); });
    });
  }

  function bindRowClicks() {
    document.querySelectorAll('[data-candidate-id]').forEach(el => {
      el.addEventListener('click', () => openDetailDrawer(el.dataset.candidateId));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetailDrawer(el.dataset.candidateId); }
      });
    });
  }

  // ─────────────── CREATE DRAWER ───────────────
  function openCreateDrawer() {
    const html = `
      <form id="candidate-form" style="display:flex;flex-direction:column;">
        ${UIKIT.field({ label: 'Full Name', required: true, html: `<input class="input" name="name" required placeholder="Ravi Kumar Sharma">` })}
        <div class="field-row">
          ${UIKIT.field({ label: 'Phone', required: true, html: `<input class="input" type="tel" name="phone" required placeholder="9876543210">` })}
          ${UIKIT.field({ label: 'Email', html: `<input class="input" type="email" name="email" placeholder="ravi@test.com">` })}
        </div>
        <div class="field-row">
          ${UIKIT.field({ label: 'City', html: `<input class="input" name="city" placeholder="Mumbai">` })}
          ${UIKIT.field({ label: 'Job Profile', html: `<input class="input" name="jobProfile" placeholder="Driver">` })}
        </div>
        <div class="field-row">
          ${UIKIT.field({ label: 'Experience (years)', html: `<input class="input" type="number" name="experienceYears" min="0" placeholder="3">` })}
          ${UIKIT.field({ label: 'Qualification', html: `<input class="input" name="qualification" placeholder="Graduate">` })}
        </div>
        <div class="field-row">
          ${UIKIT.field({ label: 'Current Salary', html: `<input class="input" type="number" name="currentSalary" min="0" placeholder="20000">` })}
          ${UIKIT.field({ label: 'Expected Salary', html: `<input class="input" type="number" name="expectedSalary" min="0" placeholder="25000">` })}
        </div>
        ${UIKIT.field({ label: 'Skills (comma separated)', html: `<input class="input" name="skillsRaw" placeholder="LMV, Heavy">` })}
        ${UIKIT.field({ label: 'Resume URL (optional)', html: `<input class="input" name="resumeUrl" placeholder="https://…">` })}
        ${UIKIT.field({ label: 'Notes', html: `<textarea class="textarea" name="notes" placeholder="Any additional details…"></textarea>` })}
      </form>`;
    const d = UI.openDrawer(html, { title: 'Add Candidate', subtitle: 'Auto-score computed on save', size: 'lg' });

    const footer = document.createElement('div');
    footer.className = 'drawer-footer';
    footer.innerHTML = `
      ${UIKIT.button({ label: 'Cancel', variant: 'ghost', data: 'cancel' })}
      ${UIKIT.button({ label: 'Save Candidate', variant: 'primary', icon: 'save', data: 'save' })}
    `;
    d.el.querySelector('.drawer').appendChild(footer);
    footer.querySelector('[data-action="cancel"]').addEventListener('click', d.close);
    footer.querySelector('[data-action="save"]').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const form = document.getElementById('candidate-form');
      if (!form.reportValidity()) return;
      const data = formToObj(form);
      if (data.skillsRaw) {
        data.skills = data.skillsRaw.split(',').map(s => s.trim()).filter(Boolean);
        delete data.skillsRaw;
      }
      await UI.btnSave(btn, async () => {
        const id = await Candidates.create(data);
        UI.toast({ message: 'Candidate created', type: 'success' });
        d.close();
        await load();
        refreshList();
        return id;
      });
    });
  }

  // ─────────────── DETAIL DRAWER ───────────────
  async function openDetailDrawer(candidateId) {
    const d = UI.openDrawer('<div class="skeleton skeleton-block" style="height:200px;"></div>', {
      title: 'Candidate', subtitle: 'Loading…', size: 'lg'
    });
    try {
      const c = await Candidates.getById(candidateId);
      if (!c) throw new Error('Not found');

      const sb = STAGE_LABELS[c.stage] || { label: c.stage, badge: 'neutral' };
      const score = c.score || 0;
      const scoreColor = score >= 60 ? 'success' : 'warning';

      const head = `
        <div style="display:flex;gap:14px;align-items:center;margin-bottom:20px;">
          <div class="avatar avatar-lg">${Utils.initials(c.name || '?')}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-family:var(--font-serif);font-size:var(--fs-xl);font-weight:600;letter-spacing:-0.02em;">${Utils.escapeHtml(c.name || '—')}</div>
            <div class="text-muted" style="font-size:12px;margin-top:2px;">${Utils.escapeHtml([c.jobProfile, c.city].filter(Boolean).join(' · ') || '—')}</div>
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
              ${UIKIT.badge(sb.label, sb.badge)}
              ${UIKIT.badge({ text: 'Score ' + score, type: scoreColor, icon: 'target' })}
              ${c.onHold ? UIKIT.badge({ text:'On Hold', type:'warning', icon:'pause-circle' }) : ''}
              ${c.lockedToCompanyId ? UIKIT.badge({ text:'Locked to Company', type:'navy', icon:'lock' }) : ''}
            </div>
          </div>
        </div>`;

      const rows = [
        ['Phone', c.phone], ['Email', c.email],
        ['Experience', c.experienceYears ? c.experienceYears + ' years' : ''],
        ['Qualification', c.qualification],
        ['Current Salary', c.currentSalary ? Utils.formatCurrency(c.currentSalary) : ''],
        ['Expected Salary', c.expectedSalary ? Utils.formatCurrency(c.expectedSalary) : ''],
        ['Skills', Array.isArray(c.skills) ? c.skills.join(', ') : ''],
        ['Notice Period', c.noticePeriod]
      ].map(([k, v]) => v ? `
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light);">
          <div class="text-muted" style="font-size:12px;">${Utils.escapeHtml(k)}</div>
          <div style="font-size:13px;font-weight:500;text-align:right;max-width:60%;word-break:break-word;">${Utils.escapeHtml(String(v))}</div>
        </div>` : '').join('');

      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = head + `<div>${rows}</div>`;
      d.el.querySelector('.drawer-title').textContent = c.name || 'Candidate';
      d.el.querySelector('.drawer-subtitle').textContent = 'ID: ' + c.id;

      // Footer actions
      const footer = document.createElement('div');
      footer.className = 'drawer-footer';
      const stageActions = [];
      if (c.stage === 'NEW') stageActions.push({ label: 'Activate', variant: 'primary', icon: 'check-circle-2', act: 'activate' });
      if (c.stage === 'ACTIVE') stageActions.push({ label: 'Submit to Company', variant: 'primary', icon: 'send', act: 'submit' });
      if (['SUBMITTED','INTERVIEW'].includes(c.stage)) {
        stageActions.push({ label: 'Mark Selected', variant: 'success', icon: 'check', act: 'select' });
        stageActions.push({ label: 'Reject', variant: 'ghost', icon: 'x', act: 'reject' });
      }
      if (c.stage === 'SELECTED') stageActions.push({ label: 'Mark Placed', variant: 'success', icon: 'trophy', act: 'place' });
      if (c.lockedToCompanyId && c.stage !== 'PLACED') {
        stageActions.push({ label: 'Unlock', variant: 'ghost', icon: 'unlock', act: 'unlock' });
      }

      footer.innerHTML = `
        ${UIKIT.button({ label: 'Close', variant: 'ghost', data: 'close' })}
        ${stageActions.map(a => UIKIT.button(a)).join('')}
      `;
      d.el.querySelector('.drawer').appendChild(footer);

      footer.querySelector('[data-action="close"]').addEventListener('click', d.close);
      footer.querySelectorAll('button[data-action]').forEach(btn => {
        const act = btn.dataset.action;
        if (act === 'close') return;
        btn.addEventListener('click', async (e) => {
          await handleAction(act, c, e.currentTarget, d);
        });
      });
    } catch (err) {
      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = UIKIT.errorState({ message: err.message });
    }
  }

  async function handleAction(act, c, btn, drawer) {
    if (act === 'activate') {
      await UI.btnSave(btn, async () => {
        await Candidates.setStage(c.id, 'ACTIVE');
        UI.toast({ message: 'Candidate activated', type: 'success' });
        drawer.close();
        await load(); refreshList();
      });
    }
    else if (act === 'submit') {
      const companyName = prompt('Company name (for reference):', '');
      if (companyName === null) return;
      const companyId = prompt('Company ID:', '');
      if (!companyId) return;
      await UI.btnSave(btn, async () => {
        await Candidates.submitToCompany(c.id, companyId.trim());
        UI.toast({ message: 'Submitted to company', type: 'success' });
        drawer.close();
        await load(); refreshList();
      });
    }
    else if (act === 'select') {
      await UI.btnSave(btn, async () => {
        await Candidates.setStage(c.id, 'SELECTED');
        UI.toast({ message: 'Marked as Selected', type: 'success' });
        drawer.close();
        await load(); refreshList();
      });
    }
    else if (act === 'reject') {
      const reason = prompt('Rejection reason:', '');
      if (reason === null) return;
      await UI.btnSave(btn, async () => {
        await Candidates.setStage(c.id, 'REJECTED', { reason });
        UI.toast({ message: 'Candidate rejected', type: 'info' });
        drawer.close();
        await load(); refreshList();
      });
    }
    else if (act === 'place') {
      await UI.btnSave(btn, async () => {
        await Candidates.setStage(c.id, 'PLACED');
        UI.toast({ message: 'Marked as Placed 🎉', type: 'success' });
        drawer.close();
        await load(); refreshList();
      });
    }
    else if (act === 'unlock') {
      await UI.btnSave(btn, async () => {
        await Candidates.unlock(c.id, 'manual-unlock');
        UI.toast({ message: 'Candidate unlocked', type: 'success' });
        drawer.close();
        await load(); refreshList();
      });
    }
  }

  function formToObj(form) {
    const obj = {};
    new FormData(form).forEach((v, k) => {
      const s = String(v).trim();
      if (!s) return;
      if (['experienceYears','currentSalary','expectedSalary'].includes(k)) {
        obj[k] = Number(s) || 0;
      } else obj[k] = s;
    });
    return obj;
  }

  // ─────────────── REALTIME ───────────────
  function attachRealtime() {
    const filters = { limit: 300 };
    if (STATE.primaryRole === 'EMPLOYEE') filters.assignedToEmployeeId = STATE.user?.uid;
    _unsub = Candidates.watchList ? Candidates.watchList(filters, (rows) => {
      _rows = rows;
      if (Router.current() === 'candidates') refreshList();
    }) : null;
  }

  return { renderPage, after };
})();

// ─────────────── REGISTER ROUTE ───────────────
Router.register('candidates', {
  title: 'Candidates',
  render: CandidatesPage.renderPage,
  after: CandidatesPage.after,
  permission: ['candidates', 'view']
});

const EmployeesPage = (function () {
  'use strict';

  let _rows = [];
  let _filter = { role: null, status: null, query: '' };
  let _unsub = null;
  let _searchDebounce = null;

  const ROLE_LABELS = {
    MASTER:               { label: 'Master',     badge: 'navy' },
    ADMIN:                { label: 'Admin',      badge: 'gold' },
    MANAGER:              { label: 'Manager',    badge: 'info' },
    EMPLOYEE:             { label: 'Employee',   badge: 'neutral' },
    INTERNAL_SUPERVISOR:  { label: 'Supervisor', badge: 'warning' }
  };

  const STATUS_LABELS = {
    active:    { label: 'Active',    badge: 'success' },
    inactive:  { label: 'Inactive',  badge: 'neutral' },
    'on-leave':{ label: 'On Leave',  badge: 'warning' },
    exited:    { label: 'Exited',    badge: 'error' }
  };

  // ─────────────── RENDER (skeleton) ───────────────
  function renderPage() {
    return `
      <div class="page">
        <div class="page-header"><div class="page-title-group"><div class="skeleton skeleton-title"></div></div></div>
        <div class="skeleton skeleton-block" style="height:64px;"></div>
        <div class="skeleton skeleton-block"></div>
        <div class="skeleton skeleton-block"></div>
      </div>`;
  }

  // ─────────────── FULL RENDER ───────────────
  function renderContent() {
    return `
      <div class="page">
        <div class="page-header">
          <div class="page-title-group">
            <div class="page-title">Team</div>
            <div class="page-subtitle" id="team-subtitle">${_rows.length} members · ${countByStatus('active')} active</div>
          </div>
          <div class="page-actions">
            ${UIKIT.button({ label: 'Add Member', variant: 'primary', icon: 'user-plus', data: 'new-employee' })}
          </div>
        </div>

        <div class="section">
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="input-group" style="max-width:420px;">

            <div class="chip-row" id="team-role-chips">${renderRoleChips()}</div>
            <div class="chip-row" id="team-status-chips">${renderStatusChips()}</div>
          </div>
        </div>

        <div class="section" id="team-list">${renderList()}</div>
      </div>`;
  }

  function renderRoleChips() {
    const roles = ['ALL','MASTER','ADMIN','MANAGER','EMPLOYEE','INTERNAL_SUPERVISOR'];
    return roles.map(r => {
      const active = (r === 'ALL' && !_filter.role) || _filter.role === r;
      const count = r === 'ALL' ? _rows.length : _rows.filter(x =>
        (x.primaryRole === r) || (Array.isArray(x.roles) && x.roles.includes(r))
      ).length;
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-role="${r === 'ALL' ? '' : r}">

        <span class="chip-count">${count}</span>
      </button>`;
    }).join('');
  }

  function renderStatusChips() {
    const statuses = ['ALL','active','inactive','on-leave','exited'];
    return statuses.map(s => {
      const active = (s === 'ALL' && !_filter.status) || _filter.status === s;
      const count = s === 'ALL' ? _rows.length : countByStatus(s);
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-status="${s === 'ALL' ? '' : s}">

    const rows = applyFilters();

    const sb = STATUS_LABELS[r.status] || { label: r.status, badge: 'neutral' };

    const supBadge = r.supervisorToggle ? UIKIT.badge({ text: 'Supervisor', type: 'warning', icon: 'shield' }) : '';

    return `

  // ─────────────── AFTER HOOK ───────────────
  function after() {
    load().then(() => {

      _rows = _rows.filter(r => r.primaryRole !== 'CLIENT' && r.role !== 'CLIENT');

  function applyFilters() {
    let rows = _rows;
    if (_filter.role) rows = rows.filter(r =>

  // ─────────────── DETAIL DRAWER ───────────────
  async function openDetailDrawer(employeeId) {
    const d = UI.openDrawer('<div class="skeleton skeleton-block" style="height:200px;"></div>', {
      title: 'Employee', subtitle: 'Loading…', size: 'lg'
    });
    try {
      const e = await Employees.getById(employeeId);
      if (!e) throw new Error('Not found');

      const rb = ROLE_LABELS[e.primaryRole] || { label: e.primaryRole, badge: 'neutral' };
      const sb = STATUS_LABELS[e.status] || { label: e.status, badge: 'neutral' };

      const head = `
        <div style="display:flex;gap:14px;align-items:center;margin-bottom:20px;">
          <div class="avatar avatar-lg">${Utils.initials(e.name || '?')}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-family:var(--font-serif);font-size:var(--fs-xl);font-weight:600;letter-spacing:-0.02em;">${Utils.escapeHtml(e.name || '—')}</div>

            </div>
          </div>
        </div>`;

      const rows = [
        ['Email', e.email],
        ['Phone', e.phone],
        ['Code', e.employeeCode],
        ['Joining', e.joiningDate ? Utils.formatDate(e.joiningDate) : ''],
        ['Salary', e.salary ? Utils.formatCurrency(e.salary) : ''],
        ['Roles', (e.roles || [e.primaryRole]).join(', ')]
      ].map(([k, v]) => v ? `
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light);">
          <div class="text-muted" style="font-size:12px;">${Utils.escapeHtml(k)}</div>
          <div style="font-size:13px;font-weight:500;text-align:right;max-width:60%;word-break:break-word;">${Utils.escapeHtml(String(v))}</div>
        </div>` : '').join('');

      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = head + `<div>${rows}</div>`;
      d.el.querySelector('.drawer-title').textContent = e.name || 'Employee';
      d.el.querySelector('.drawer-subtitle').textContent = 'ID: ' + e.id;

      // Footer actions
      const footer = document.createElement('div');
      footer.className = 'drawer-footer';
      const actions = [];
      if (e.status === 'active') actions.push({ label: 'Deactivate', variant: 'ghost', icon: 'pause', act: 'deactivate' });
      else if (['inactive','on-leave'].includes(e.status)) actions.push({ label: 'Reactivate', variant: 'success', icon: 'play', act: 'reactivate' });
      if (e.status !== 'exited') actions.push({ label: 'Exit', variant: 'danger', icon: 'log-out', act: 'exit' });
      actions.push({ label: 'Handover', variant: 'secondary', icon: 'arrow-right-left', act: 'handover' });

      footer.innerHTML = `
        ${UIKIT.button({ label: 'Close', variant: 'ghost', data: 'close' })}
        ${actions.map(a => UIKIT.button(a)).join('')}
      `;
      d.el.querySelector('.drawer').appendChild(footer);

      footer.querySelector('[data-action="close"]').addEventListener('click', d.close);
      footer.querySelectorAll('button[data-action]:not([data-action="close"])').forEach(btn => {
        btn.addEventListener('click', async (ev) => {
          await handleAction(btn.dataset.action, e, ev.currentTarget, d);
        });
      });
    } catch (err) {
      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = UIKIT.errorState({ message: err.message });
    }
  }

  async function handleAction(act, e, btn, drawer) {
    if (act === 'deactivate') {
      const reason = prompt('Reason for deactivation:', '') || '';
      await UI.btnSave(btn, async () => {
        await Employees.deactivate(e.id, reason);
        UI.toast({ message: 'Member deactivated', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'reactivate') {
      await UI.btnSave(btn, async () => {
        await Employees.reactivate(e.id);
        UI.toast({ message: 'Member reactivated', type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'exit') {
      const reason = prompt('Exit reason (resigned / terminated / other):', '');
      if (reason === null) return;
      const ok = await UI.confirm({
        title: 'Confirm Exit',
        message: 'This will free all candidates assigned to this member.',
        danger: true, okText: 'Process Exit'
      });
      if (!ok) return;
      await UI.btnSave(btn, async () => {
        await Employees.processExit(e.id, { reason });
        UI.toast({ message: 'Exit processed', type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'handover') {
      const targetId = prompt('Target employee ID (Manager/Admin/Master):', '');
      if (!targetId) return;
      const reason = prompt('Handover reason (min 5 chars):', '');
      if (!reason || reason.trim().length < 5) { UI.toast({ message: 'Reason too short', type: 'error' }); return; }
      await UI.btnSave(btn, async () => {
        const res = await Employees.handover(e.id, targetId.trim(), reason);
        UI.toast({ message: `Handover done · ${res.companies} companies · ${res.candidates} candidates`, type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
  }

  function formToObj(form) {
    const obj = {};
    new FormData(form).forEach((v, k) => {
      if (k === 'supervisorToggle') { obj[k] = (v === 'on'); return; }
      const s = String(v).trim();
      if (!s) return;
      if (k === 'salary') obj[k] = Number(s) || 0;
      else obj[k] = s;
    });
    return obj;
  }

  // ─────────────── REALTIME ───────────────
  function attachRealtime() {
    _unsub = DB.watchList(CONST.COLLECTIONS.USERS, { limit: 300 }, (rows) => {
      _rows = rows.filter(r => r.primaryRole !== 'CLIENT' && r.role !== 'CLIENT');
      if (Router.current() === 'employees') refreshList();
    });
  }

  return { renderPage, after };
})();

});

const InvoicesPage = (function () {
  'use strict';

  let _rows = [];
  let _filter = { status: null, type: null, query: '' };
  let _unsub = null;
  let _searchDebounce = null;

  const STATUS_LABELS = {
    DRAFT:     { label: 'Draft',     badge: 'neutral' },
    SENT:      { label: 'Sent',      badge: 'info' },
    PARTIAL:   { label: 'Partial',   badge: 'warning' },
    PAID:      { label: 'Paid',      badge: 'success' },
    OVERDUE:   { label: 'Overdue',   badge: 'error' },
    CANCELLED: { label: 'Cancelled', badge: 'neutral' }
  };

  // ─────────────── RENDER (skeleton) ───────────────
  function renderPage() {
    return `
      <div class="page">
        <div class="page-header"><div class="page-title-group"><div class="skeleton skeleton-title"></div></div></div>
        <div class="skeleton skeleton-block" style="height:64px;"></div>
        <div class="skeleton skeleton-block"></div>
      </div>`;
  }

  // ─────────────── FULL RENDER ───────────────
  function renderContent() {
    const totals = computeTotals();
    return `
      <div class="page">
        <div class="page-header">
          <div class="page-title-group">
            <div class="page-title">Invoices</div>
            <div class="page-subtitle" id="inv-subtitle">${_rows.length} total · ${Utils.formatCurrency(totals.balance)} outstanding</div>
          </div>
          <div class="page-actions">
            ${UIKIT.button({ label: 'New Invoice', variant: 'primary', icon: 'file-plus', data: 'new-invoice' })}
          </div>
        </div>

        <div class="section">
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <div class="card card-stat" style="flex:1;min-width:160px;cursor:default;">
              <div class="stat-value" style="font-size:var(--fs-2xl);">${Utils.formatCompact(totals.billed)}</div>
              <div class="stat-label">Total Billed</div>
            </div>
            <div class="card card-stat" style="flex:1;min-width:160px;cursor:default;">
              <div class="stat-value" style="font-size:var(--fs-2xl);color:var(--success);">${Utils.formatCompact(totals.paid)}</div>
              <div class="stat-label">Received</div>
            </div>
            <div class="card card-stat" style="flex:1;min-width:160px;cursor:default;">
              <div class="stat-value" style="font-size:var(--fs-2xl);color:var(--warning);">${Utils.formatCompact(totals.balance)}</div>
              <div class="stat-label">Outstanding</div>
            </div>
            <div class="card card-stat" style="flex:1;min-width:160px;cursor:default;">
              <div class="stat-value" style="font-size:var(--fs-2xl);color:var(--error);">${totals.overdue}</div>

        <div class="section">
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="input-group" style="max-width:420px;">
              ${UIKIT.icon('search', 18, 'input-icon')}
              <input id="inv-search" class="input" type="text" placeholder="Search number, company…" value="${Utils.escapeHtml(_filter.query)}">
            </div>
            <div class="chip-row" id="inv-status-chips">${renderStatusChips()}</div>
            <div class="chip-row" id="inv-type-chips">${renderTypeChips()}</div>
          </div>
        </div>

        <div class="section" id="inv-list">${renderList()}</div>
      </div>`;
  }

  function computeTotals() {
    let billed = 0, paid = 0, balance = 0, overdue = 0;
    const now = Date.now();
    for (const r of _rows) {
      if (r.status === 'CANCELLED') continue;
      billed  += Number(r.total) || 0;
      paid    += Number(r.paidAmount) || 0;
      balance += Number(r.balance) || 0;
      if (r.status !== 'PAID' && r.dueDate && new Date(r.dueDate).getTime() < now) overdue++;
    }
    return { billed, paid, balance, overdue };
  }

  function renderStatusChips() {
    const statuses = ['ALL','DRAFT','SENT','PARTIAL','PAID','OVERDUE','CANCELLED'];
    return statuses.map(s => {
      const active = (s === 'ALL' && !_filter.status) || _filter.status === s;
      const count = s === 'ALL' ? _rows.length : _rows.filter(r => r.status === s).length;
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-status="${s === 'ALL' ? '' : s}">
        ${s === 'ALL' ? 'All' : (STATUS_LABELS[s]?.label || s)}
        <span class="chip-count">${count}</span>
      </button>`;
    }).join('');
  }

  function renderTypeChips() {
    const types = ['ALL','placement','contract'];
    return types.map(t => {
      const active = (t === 'ALL' && !_filter.type) || _filter.type === t;
      const count = t === 'ALL' ? _rows.length : _rows.filter(r => r.type === t).length;
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-type="${t === 'ALL' ? '' : t}">
        ${t === 'ALL' ? 'All Types' : (t === 'placement' ? 'Placement' : 'Contract')}
        <span class="chip-count">${count}</span>
      </button>`;
    }).join('');
  }

  function renderList() {
    const rows = applyFilters();
    if (!rows.length) {
      return UIKIT.emptyState({
        icon: 'file-text',
        title: 'No invoices',
        message: 'Create your first invoice after placing a candidate.',
        actionLabel: 'New Invoice',
        actionIcon: 'file-plus',
        actionData: 'new-invoice'
      });
    }
    return rows.map(rowCard).join('');
  }

  function rowCard(r) {
    const sb = STATUS_LABELS[r.status] || { label: r.status, badge: 'neutral' };
    const typeLabel = r.type === 'contract' ? 'Contract' : 'Placement';
    const sub = [r.number, typeLabel, r.companyName].filter(Boolean).join(' · ');
    return `
      <div class="list-item" data-invoice-id="${Utils.escapeHtml(r.id)}" role="button" tabindex="0">
        <div class="avatar avatar-md" style="background:linear-gradient(135deg,var(--gold-light),var(--gold));">${UIKIT.icon('file-text', 18)}</div>
        <div class="list-content">
          <div class="list-title">${Utils.escapeHtml(r.number || '—')}</div>
          <div class="list-subtitle">${Utils.escapeHtml(sub)}</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            ${UIKIT.badge(sb.label, sb.badge)}
            <span style="font-size:var(--fs-xs);font-weight:600;color:var(--text-primary);">${Utils.formatCurrency(r.total)}</span>
            ${Number(r.balance) > 0 ? `<span style="font-size:11px;color:var(--warning);">Bal ${Utils.formatCompact(r.balance)}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div class="text-muted" style="font-size:11px;">${r.dueDate ? Utils.formatDate(r.dueDate) : '—'}</div>
          ${UIKIT.iconButton('chevron-right', { size: 'sm' })}
        </div>
      </div>`;
  }

  // ─────────────── AFTER HOOK ───────────────
  function after() {
    load().then(() => {
      const root = document.getElementById('page-root');
      if (!root) return;
      const page = root.querySelector('.page');
      if (page) page.outerHTML = renderContent();
      bindEvents();
      attachRealtime();
    });
    Router.setCleanup(() => {
      if (_unsub) { _unsub(); _unsub = null; }
      if (_searchDebounce) clearTimeout(_searchDebounce);
    });
  }

  // ─────────────── LOAD ───────────────
  async function load() {
    try {
      _rows = await Invoices.list({ limit: 300 });
    } catch (err) {
      console.error('[InvoicesPage.load]', err);
      _rows = [];
      UI.toast({ message: 'Failed to load invoices', type: 'error' });
    }
  }

  function applyFilters() {
    let rows = _rows;
    if (_filter.status) rows = rows.filter(r => r.status === _filter.status);
    if (_filter.type)   rows = rows.filter(r => r.type === _filter.type);
    if (_filter.query) {
      const q = _filter.query.toLowerCase();
      rows = rows.filter(r => [r.number, r.companyName, r.candidateName]
        .some(x => String(x || '').toLowerCase().includes(q)));
    }
    return rows;
  }

  function refreshList() {
    const list = document.getElementById('inv-list');
    const sc = document.getElementById('inv-status-chips');
    const tc = document.getElementById('inv-type-chips');
    const sub = document.getElementById('inv-subtitle');
    if (list) { list.innerHTML = renderList(); bindRowClicks(); }
    if (sc) { sc.innerHTML = renderStatusChips(); bindChipClicks(); }
    if (tc) { tc.innerHTML = renderTypeChips(); bindChipClicks(); }

      const t = computeTotals();
      sub.textContent = `${_rows.length} total · ${Utils.formatCurrency(t.balance)} outstanding`;

      _searchDebounce = setTimeout(() => { _filter.query = e.target.value.trim(); refreshList(); }, 300);
    });
    bindChipClicks();
    bindRowClicks();
  }

  function bindChipClicks() {
    document.querySelectorAll('#inv-status-chips .chip').forEach(c => {
      c.addEventListener('click', () => { _filter.status = c.dataset.status || null; refreshList(); });
    });
    document.querySelectorAll('#inv-type-chips .chip').forEach(c => {
      c.addEventListener('click', () => { _filter.type = c.dataset.type || null; refreshList(); });
    });
  }

  function bindRowClicks() {
    document.querySelectorAll('[data-invoice-id]').forEach(el => {
      el.addEventListener('click', () => openDetailDrawer(el.dataset.invoiceId));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetailDrawer(el.dataset.invoiceId); }
      });

  // ─────────────── REALTIME ───────────────
  function attachRealtime() {
    _unsub = DB.watchList(CONST.COLLECTIONS.INVOICES, { limit: 300 }, (rows) => {
      _rows = rows;
      if (Router.current() === 'invoices') refreshList();
    });
  }

        const months = Number(d.el.querySelector('#inv-months').value || 1);
        if (!actSal) { previewBox.textContent = 'Enter actual salary to preview.'; return; }

        previewBox.innerHTML = `
          <div style="display:flex;justify-content:space-between;"><span>Margin / pos</span><span>${Utils.formatCurrency(calc.perPosition)}</span></div>
          <div style="display:flex;justify-content:space-between;"><span>Positions</span><span>${pos} × ${months} mo</span></div>
          <div style="display:flex;justify-content:space-between;"><span>Base</span><span>${Utils.formatCurrency(calc.baseAmount)}</span></div>

          <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:6px;padding-top:6px;font-weight:600;color:var(--text-primary);"><span>Total</span><span>${Utils.formatCurrency(calc.total)}</span></div>`;

    footer.querySelector('[data-action="save"]').addEventListener('click', async (e) => {
      const btn = e.currentTarget;

      const data = formToObj(form);

  async function openDetailDrawer(invoiceId) {
    const d = UI.openDrawer('<div class="skeleton skeleton-block" style="height:200px;"></div>', {
      title: 'Invoice', subtitle: 'Loading…', size: 'lg'
    });
    try {
      const inv = await Invoices.getById(invoiceId);
      if (!inv) throw new Error('Not found');
      const payments = await Payments.listByInvoice(invoiceId).catch(() => []);
      const sb = STATUS_LABELS[inv.status] || { label: inv.status, badge: 'neutral' };

      const head = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px;">
          <div>
            <div style="font-family:var(--font-serif);font-size:var(--fs-xl);font-weight:600;letter-spacing:-0.02em;">${Utils.escapeHtml(inv.number || '—')}</div>

            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
              ${UIKIT.badge(sb.label, sb.badge)}

        </div>`;

      const detailRows = [
        ['Issued', inv.issueDate ? Utils.formatDate(inv.issueDate) : ''],
        ['Due', inv.dueDate ? Utils.formatDate(inv.dueDate) : ''],
        ['Base Amount', inv.baseAmount ? Utils.formatCurrency(inv.baseAmount) : ''],
        ['GST', inv.gstAmount ? `${Utils.formatCurrency(inv.gstAmount)} (${inv.gstRate}%)` : ''],
        ['Paid', inv.paidAmount ? Utils.formatCurrency(inv.paidAmount) : '₹0']
      ].map(([k, v]) => v ? `
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-light);">
          <div class="text-muted" style="font-size:12px;">${Utils.escapeHtml(k)}</div>
          <div style="font-size:13px;font-weight:500;">${Utils.escapeHtml(String(v))}</div>
        </div>` : '').join('');

      const payHtml = payments.length ? `
        <div style="margin-top:20px;">
          <div class="text-muted" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">Payments (${payments.length})</div>
          ${payments.map(p => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg-subtle);border-radius:var(--radius);margin-bottom:6px;">
              <div>
                <div style="font-size:13px;font-weight:600;">${Utils.formatCurrency(p.amount)}</div>
                <div class="text-muted" style="font-size:11px;">${Utils.escapeHtml(p.mode || '')} · ${p.paidAt ? Utils.formatDate(p.paidAt) : ''} ${p.reference ? '· ' + Utils.escapeHtml(p.reference) : ''}</div>
              </div>
              ${UIKIT.badge(p.status || 'RECORDED', p.status === 'BOUNCED' ? 'error' : 'success')}
            </div>`).join('')}
        </div>` : '';

      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = head + `<div>${detailRows}</div>` + payHtml;
      d.el.querySelector('.drawer-title').textContent = inv.number || 'Invoice';
      d.el.querySelector('.drawer-subtitle').textContent = inv.companyName || '';

      const footer = document.createElement('div');
      footer.className = 'drawer-footer';
      const actions = [];
      if (inv.status === 'DRAFT') actions.push({ label: 'Mark Sent', variant: 'secondary', icon: 'send', data: 'send' });
      if (['SENT','PARTIAL','OVERDUE'].includes(inv.status)) {
        actions.push({ label: 'Record Payment', variant: 'primary', icon: 'wallet', data: 'pay' });
      }
      if (inv.status !== 'CANCELLED' && inv.status !== 'PAID') {
        actions.push({ label: 'Cancel', variant: 'ghost', icon: 'x', data: 'cancel' });
      }
      actions.push({ label: 'Close', variant: 'ghost', data: 'close' });
      footer.innerHTML = actions.map(a => UIKIT.button(a)).join('');
      d.el.querySelector('.drawer').appendChild(footer);

      footer.querySelectorAll('button[data-action]').forEach(btn => {
        const act = btn.dataset.action;
        if (act === 'close') { btn.addEventListener('click', d.close); return; }
        btn.addEventListener('click', async (ev) => {
          await handleInvoiceAction(act, inv, ev.currentTarget, d);
        });
      });
    } catch (err) {
      const body = d.el.querySelector('.drawer-body');
      if (body) body.innerHTML = UIKIT.errorState({ message: err.message });
    }
  }

  async function handleInvoiceAction(act, inv, btn, drawer) {
    if (act === 'send') {
      await UI.btnSave(btn, async () => {
        await Invoices.markSent(inv.id);
        UI.toast({ message: 'Invoice sent', type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'cancel') {
      const reason = prompt('Cancel reason:', '') || '';
      await UI.btnSave(btn, async () => {
        await Invoices.markCancelled(inv.id, reason);
        UI.toast({ message: 'Invoice cancelled', type: 'info' });
        drawer.close(); await load(); refreshList();
      });
    }
    else if (act === 'pay') {
      const amount = prompt('Amount (₹):', String(inv.balance || 0));
      if (!amount || Number(amount) <= 0) return;
      const mode = (prompt('Mode (cash/cheque/neft/rtgs/upi/card/other):', 'neft') || 'neft').toLowerCase();
      const reference = prompt('Reference (optional):', '') || '';
      const paidAt = new Date().toISOString().slice(0, 10);
      await UI.btnSave(btn, async () => {
        await Payments.create({
          invoiceId: inv.id,
          companyId: inv.companyId,
          companyName: inv.companyName,
          amount: Number(amount),
          mode,
          reference,
          paidAt
        });
        UI.toast({ message: 'Payment recorded', type: 'success' });
        drawer.close(); await load(); refreshList();
      });
    }
  }

  function formToObj(form) {
    const obj = {};
    new FormData(form).forEach((v, k) => {
      const s = String(v).trim();
      if (!s) return;
      if (['minSalary','actualSalary','marginPct','positions','months','paymentTermsDays'].includes(k)) {
        obj[k] = Number(s) || 0;
      } else obj[k] = s;
    });
    return obj;
  }

  // ═══════════════ RETURN + CLOSE IIFE ═══════════════
  return { renderPage, after };
})();

  function computeTotals() {
    let received = 0, bounced = 0, pending = 0;
    for (const r of _rows) {
      if (r.status === 'RECORDED' || r.status === 'RECONCILED') received += Number(r.amount) || 0;
      if (r.status === 'BOUNCED') bounced += Number(r.amount) || 0;
      if (r.status === 'RECORDED') pending++;
    }
    return { received, bounced, pending };
  }

  function renderStatusChips() {
    const statuses = ['ALL','RECORDED','RECONCILED','BOUNCED','CANCELLED'];
    return statuses.map(s => {
      const active = (s === 'ALL' && !_filter.status) || _filter.status === s;
      const count = s === 'ALL' ? _rows.length : _rows.filter(r => r.status === s).length;
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-status="${s === 'ALL' ? '' : s}">

        <span class="chip-count">${count}</span>
      </button>`;
    }).join('');
  }

  function renderModeChips() {
    const modes = ['ALL','cash','cheque','neft','rtgs','upi','card','other'];
    return modes.map(m => {
      const active = (m === 'ALL' && !_filter.mode) || _filter.mode === m;
      const count = m === 'ALL' ? _rows.length : _rows.filter(r => r.mode === m).length;
      return `<button type="button" class="chip${active ? ' is-active' : ''}" data-mode="${m === 'ALL' ? '' : m}">

  // ─────────────── AFTER HOOK ───────────────
  function after() {
    load().then(() => {

      if (page) page.outerHTML = renderContent();
      bindEvents();
      attachRealtime();

      console.error('[PaymentsPage.load]', err);
      _rows = [];
      UI.toast({ message: 'Failed to load payments', type: 'error' });
    }

  function applyFilters() {
    let rows = _rows;
    if (_filter.status) rows = rows.filter(r => r.status === _filter.status);
    if (_filter.mode)   rows = rows.filter(r => r.mode === _filter.mode);
    if (_filter.query) {
      const q = _filter.query.toLowerCase();
