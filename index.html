    // ═══════════════════════════════════════════════════════════
//  CANDIDATES SERVICE
//  Stages: NEW → ACTIVE → SUBMITTED → INTERVIEW → SELECTED → PLACED
//  Side:   REJECTED / DROPPED / REPLACED / ARCHIVED
//  Score:  60 base (compulsory) + 40 optional
//  Lock:   SUBMITTED → locked to company, removed from common pool
// ═══════════════════════════════════════════════════════════

const Candidates = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.CANDIDATES;
  const SCORE_BASE_MAX = 60;
  const SCORE_OPTIONAL_MAX = 40;

  // ─────────────── AUTO SCORE ───────────────
  // Compulsory (60): phone 15, email 15, name 10, city 10, profile 10
  // Optional (40):   resume 15, photo 10, skills 10, salary 5
  function computeScore(data, opts = {}) {
    let base = 0;
    let opt = 0;

    if (Utils.isPhone(data.phone)) base += 15;
    if (Utils.isEmail(data.email)) base += 15;
    if (data.name && String(data.name).trim().split(/\s+/).length >= 2) base += 10;
    if (data.city && String(data.city).trim().length >= 2) base += 10;
    if (data.jobProfile && String(data.jobProfile).trim().length >= 2) base += 10;

    if (data.resumeUrl) opt += 15;
    if (data.photoUrl) opt += 10;
    if (Array.isArray(data.skills) ? data.skills.length : data.skills) opt += 10;
    if (data.expectedSalary) opt += 5;

    const total = Utils.clamp(base + opt, 0, 100);
    return { base, optional: opt, total, threshold: 60 };
  }

  // ─────────────── CREATE ───────────────
  async function create(data, opts = {}) {
    const payload = normalizePayload(data);
    validate(payload);

    const dup = await checkDuplicate(payload, opts.ignoreId);
    if (dup.block) throw new Error(dup.message);
    if (dup.warn && !opts.allowWarn) {
      console.warn('[Candidates.create] Fuzzy match:', dup.message);
    }

    const score = computeScore(payload);
    payload.score = score.total;
    payload.scoreBreakdown = score;
    payload.stage = score.total >= score.threshold ? 'ACTIVE' : 'NEW';
    payload.poolEligible = payload.stage === 'ACTIVE';
    payload.lockedToCompanyId = null;
    payload.onHold = false;
    payload.createdBy = STATE.user?.uid || null;

    const id = await DB.add(COL, payload);
    await logActivity(id, 'created', { by: STATE.user?.uid, score: score.total });

    if (payload.stage === 'ACTIVE') {
      await logActivity(id, 'auto-activated', { score: score.total });
    }
    return id;
  }

  // ─────────────── READ ───────────────
  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function list(filters = {}) {
    const opts = { orderBy: ['updatedAt', 'desc'] };
    const where = [];
    if (filters.stage) where.push(['stage', '==', filters.stage]);
    if (filters.stages) where.push(['stage', 'in', filters.stages]);
    if (filters.city) where.push(['city', '==', filters.city]);
    if (filters.jobProfile) where.push(['jobProfile', '==', filters.jobProfile]);
    if (filters.lockedToCompanyId) where.push(['lockedToCompanyId', '==', filters.lockedToCompanyId]);
    if (filters.poolEligible !== undefined) where.push(['poolEligible', '==', filters.poolEligible]);
    if (filters.isDeleted !== undefined) where.push(['isDeleted', '==', filters.isDeleted]);
    if (where.length) opts.where = where;
    if (filters.limit) opts.limit = filters.limit;
    return DB.list(COL, opts);
  }

  // Common pool = ACTIVE + not locked + not on hold + not deleted
  async function commonPool(limit = 100) {
    const rows = await list({ stage: 'ACTIVE', limit: limit * 2 });
    return rows.filter(r => !r.lockedToCompanyId && !r.onHold && !r.isDeleted).slice(0, limit);
  }

  async function search(term, limit = 20) {
    const t = String(term || '').trim().toLowerCase();
    if (!t) return [];
    const rows = await list({ limit: 300 });
    return rows.filter(r => {
      return (r.name || '').toLowerCase().includes(t)
          || (r.city || '').toLowerCase().includes(t)
          || (r.email || '').toLowerCase().includes(t)
          || (r.phone || '').includes(t)
          || (r.jobProfile || '').toLowerCase().includes(t);
    }).slice(0, limit);
  }

  // ─────────────── UPDATE ───────────────
  async function update(id, data) {
    if (!id) throw new Error('Candidate id required');
    const patch = normalizePayload(data, true);

    // Recompute score (increase only — never auto-decrease)
    if (data.resumeUrl || data.photoUrl || data.skills || data.expectedSalary ||
        data.phone || data.email || data.name || data.city || data.jobProfile) {
      const current = await getById(id);
      if (current) {
        const merged = { ...current, ...patch };
        const nextScore = computeScore(merged).total;
        if (nextScore > (current.score || 0)) {
          patch.score = nextScore;
          patch.scoreBreakdown = computeScore(merged);
        }
      }
    }
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'updated', { by: STATE.user?.uid, keys: Object.keys(patch) });
    return id;
  }

  // ─────────────── STAGE TRANSITIONS ───────────────
  async function setStage(id, newStage, meta = {}) {
    if (!CONST.CANDIDATE_STAGES.includes(newStage)) {
      throw new Error('Invalid stage: ' + newStage);
    }
    const patch = {
      stage: newStage,
      stageChangedAt: DB.ts(),
      stageChangedBy: STATE.user?.uid || null
    };
    if (newStage === 'REJECTED') {
      patch.rejectedAt = DB.ts();
      patch.rejectReason = meta.reason || null;
      patch.poolEligible = false;
    }
    if (newStage === 'PLACED') {
      patch.placedAt = DB.ts();
      patch.placedCompanyId = meta.companyId || null;
      patch.poolEligible = false;
    }
    if (newStage === 'ACTIVE') patch.poolEligible = true;
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'stage:' + newStage, { by: STATE.user?.uid, ...meta });
    return id;
  }

  // ─────────────── SUBMIT (LOCK TO COMPANY) ───────────────
  async function submitToCompany(id, companyId, requirementId = null) {
    if (!id || !companyId) throw new Error('id + companyId required');
    await DB.update(`${COL}/${id}`, {
      stage: 'SUBMITTED',
      lockedToCompanyId: companyId,
      submittedToRequirementId: requirementId,
      submittedAt: DB.ts(),
      submittedBy: STATE.user?.uid || null,
      poolEligible: false,
      onHold: false
    });
    await logActivity(id, 'submitted', { companyId, requirementId });
    return id;
  }

  // ─────────────── UNLOCK (back to pool) ───────────────
  async function unlock(id, reason = '') {
    await DB.update(`${COL}/${id}`, {
      stage: 'ACTIVE',
      lockedToCompanyId: null,
      submittedToRequirementId: null,
      unlockedAt: DB.ts(),
      unlockedBy: STATE.user?.uid || null,
      unlockReason: reason,
      poolEligible: true,
      onHold: false
    });
    await logActivity(id, 'unlocked', { reason });
  }

  // ─────────────── ON HOLD ───────────────
  async function holdAtCompany(id, companyId, days = null) {
    const maxDays = days || Config.get('workflow.onHoldDays', 7);
    const now = new Date();
    const deadline = new Date(now.getTime() + maxDays * 86400000);
    await DB.update(`${COL}/${id}`, {
      onHold: true,
      onHoldCompanyId: companyId,
      onHoldStartedAt: DB.ts(),
      onHoldDeadline: deadline.toISOString(),
      onHoldExtensions: 0,
      poolEligible: false
    });
    await logActivity(id, 'on-hold', { companyId, days: maxDays });
  }

  async function extendHold(id, extraDays = null) {
    const current = await getById(id);
    if (!current || !current.onHold) throw new Error('Candidate not on hold');
    const maxExt = Config.get('workflow.onHoldMaxExtensions', 2);
    if ((current.onHoldExtensions || 0) >= maxExt) {
      throw new Error('Max extensions reached');
    }
    const addDays = extraDays || Config.get('workflow.onHoldDays', 7);
    const deadline = new Date(new Date(current.onHoldDeadline).getTime() + addDays * 86400000);
    await DB.update(`${COL}/${id}`, {
      onHoldDeadline: deadline.toISOString(),
      onHoldExtensions: (current.onHoldExtensions || 0) + 1
    });
    await logActivity(id, 'on-hold:extended', { addDays });
  }

  async function releaseFromHold(id, reason = '') {
    await DB.update(`${COL}/${id}`, {
      onHold: false,
      onHoldCompanyId: null,
      onHoldDeadline: null,
      releasedAt: DB.ts(),
      releasedBy: STATE.user?.uid || null,
      releaseReason: reason
    });
    await logActivity(id, 'on-hold:released', { reason });
  }

  // ─────────────── DELETE ───────────────
  async function softDelete(id) {
    await DB.softDelete(`${COL}/${id}`, STATE.user?.uid || null);
    await logActivity(id, 'soft-deleted', { by: STATE.user?.uid });
  }

  async function restore(id) {
    await DB.restore(`${COL}/${id}`);
    await logActivity(id, 'restored', { by: STATE.user?.uid });
  }

  // ─────────────── DUPLICATE CHECK ───────────────
  // phone/email BLOCK; name+phone 100% BLOCK
  async function checkDuplicate(data, ignoreId = null) {
    const phone = Utils.normalizePhone(data.phone);
    const email = Utils.normalizeEmail(data.email);
    const name = Utils.normalizeName(data.name);

    if (!phone && !email && !name) return { block: false, warn: false };

    const rows = await DB.list(COL, { limit: 500 });
    for (const r of rows) {
      if (ignoreId && r.id === ignoreId) continue;
      if (phone && Utils.normalizePhone(r.phone) === phone) {
        return { block: true, message: `Candidate with phone ${phone} already exists.` };
      }
      if (email && Utils.normalizeEmail(r.email) === email) {
        return { block: true, message: `Candidate with email ${email} already exists.` };
      }
      if (name && phone && Utils.normalizeName(r.name) === name &&
          Utils.normalizePhone(r.phone) === phone) {
        return { block: true, message: `Candidate "${data.name}" with same phone exists.` };
      }
    }
    return { block: false, warn: false };
  }

  // ─────────────── VALIDATION ───────────────
  function validate(data) {
    if (!data.name || !String(data.name).trim()) throw new Error('Name is required');
    if (!data.phone) throw new Error('Phone is required');
    if (!Utils.isPhone(data.phone)) throw new Error('Invalid phone (10 digits, starts 6-9)');
    if (data.email && !Utils.isEmail(data.email)) throw new Error('Invalid email');
  }

  // ─────────────── NORMALIZE ───────────────
  function normalizePayload(data, isUpdate = false) {
    const out = {};
    const keep = [
      'name','phone','alternatePhone','email','gender','dob','age',
      'city','state','pincode','currentLocation',
      'jobProfile','experienceYears','qualification','skills',
      'currentSalary','expectedSalary','noticePeriod','jobType',
      'resumeUrl','photoUrl','notes','tags','source','referral',
      'stage','lockedToCompanyId','poolEligible','onHold'
    ];
    for (const k of keep) {
      if (data[k] !== undefined) out[k] = data[k];
    }
    if (out.phone) out.phone = Utils.normalizePhone(out.phone);
    if (out.email) out.email = Utils.normalizeEmail(out.email);
    if (Array.isArray(out.skills)) out.skills = out.skills.filter(Boolean);
    if (out.experienceYears !== undefined) out.experienceYears = Number(out.experienceYears) || 0;
    if (!isUpdate) {
      out.dupKeys = {
        phone: out.phone || '',
        email: out.email || '',
        name: Utils.normalizeName(out.name)
      };
    }
    return out;
  }

  // ─────────────── ACTIVITY ───────────────
  async function logActivity(candidateId, action, meta = {}) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'candidate',
        candidateId,
        action,
        meta,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  // ─────────────── REALTIME ───────────────
  function watch(id, cb) { return DB.watch(`${COL}/${id}`, cb); }

  function watchPool(cb, limit = 100) {
    return DB.watchList(COL, {
      where: [['stage', '==', 'ACTIVE'], ['poolEligible', '==', true]],
      orderBy: ['updatedAt', 'desc'],
      limit
    }, cb);
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    create, getById, list, commonPool, search,
    update, setStage,
    submitToCompany, unlock,
    holdAtCompany, extendHold, releaseFromHold,
    softDelete, restore,
    checkDuplicate, computeScore,
    watch, watchPool,
    STAGES: CONST.CANDIDATE_STAGES
  };
})();

    // ═══════════════════════════════════════════════════════════
//  EMPLOYEES SERVICE
//  Handles: EMPLOYEE, MANAGER, ADMIN, MASTER, INTERNAL_SUPERVISOR
//  Supervisor toggle (internal CRM access) supported.
//  Handover up-chain only. Reason compulsory.
// ═══════════════════════════════════════════════════════════

const Employees = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.USERS;
  const VALID_ROLES = [
    'MASTER','ADMIN','MANAGER','EMPLOYEE','INTERNAL_SUPERVISOR'
  ];

  // ─────────────── CREATE ───────────────
  // Note: actual auth user creation happens via Firebase Console / Admin SDK.
  // This creates the Firestore profile that will be linked post first login.
  async function create(data, opts = {}) {
    const payload = normalizePayload(data);
    validate(payload);

    const dup = await checkDuplicate(payload, opts.ignoreId);
    if (dup.block) throw new Error(dup.message);

    payload.status = payload.status || 'active';
    payload.roles = payload.roles && payload.roles.length ? payload.roles : ['EMPLOYEE'];
    payload.primaryRole = payload.primaryRole || payload.roles[0];
    payload.activeApp = 'crm';
    payload.supervisorToggle = payload.supervisorToggle === true;
    payload.createdBy = STATE.user?.uid || null;

    const id = await DB.add(COL, payload);
    await logActivity(id, 'employee:created', { roles: payload.roles });
    return id;
  }

  // ─────────────── READ ───────────────
  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function list(filters = {}) {
    const opts = { orderBy: ['updatedAt', 'desc'] };
    const where = [];
    if (filters.status) where.push(['status', '==', filters.status]);
    if (filters.primaryRole) where.push(['primaryRole', '==', filters.primaryRole]);
    if (filters.department) where.push(['department', '==', filters.department]);
    if (filters.supervisorToggle !== undefined) {
      where.push(['supervisorToggle', '==', filters.supervisorToggle]);
    }
    if (filters.isDeleted !== undefined) where.push(['isDeleted', '==', filters.isDeleted]);
    if (where.length) opts.where = where;
    if (filters.limit) opts.limit = filters.limit;
    return DB.list(COL, opts);
  }

  async function search(term, limit = 20) {
    const t = String(term || '').trim().toLowerCase();
    if (!t) return [];
    const rows = await list({ limit: 300 });
    return rows.filter(r => {
      return (r.name || '').toLowerCase().includes(t)
          || (r.email || '').toLowerCase().includes(t)
          || (r.phone || '').includes(t)
          || (r.employeeCode || '').toLowerCase().includes(t);
    }).slice(0, limit);
  }

  // ─────────────── UPDATE ───────────────
  async function update(id, data) {
    if (!id) throw new Error('Employee id required');
    const patch = normalizePayload(data, true);
    if (patch.roles && !patch.roles.every(r => VALID_ROLES.includes(r))) {
      throw new Error('Invalid role in roles array');
    }
    if (patch.roles && !patch.primaryRole) {
      patch.primaryRole = patch.roles[0];
    }
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'employee:updated', { keys: Object.keys(patch) });
    return id;
  }

  // ─────────────── STATUS ───────────────
  async function setStatus(id, status, reason = '') {
    if (!['active','inactive','on-leave','exited'].includes(status)) {
      throw new Error('Invalid status');
    }
    await DB.update(`${COL}/${id}`, {
      status,
      statusChangedAt: DB.ts(),
      statusReason: reason || null
    });
    await logActivity(id, 'employee:status:' + status, { reason });
  }

  async function deactivate(id, reason = '') {
    return setStatus(id, 'inactive', reason);
  }

  async function reactivate(id) {
    return setStatus(id, 'active', 'reactivated');
  }

  // ─────────────── EXIT (employee leaving) ───────────────
  async function processExit(id, opts = {}) {
    const reason = opts.reason || 'not-specified';
    const effectiveDate = opts.effectiveDate || new Date().toISOString().slice(0, 10);
    await DB.update(`${COL}/${id}`, {
      status: 'exited',
      exitReason: reason,
      exitEffectiveDate: effectiveDate,
      exitInitiatedAt: DB.ts(),
      exitInitiatedBy: STATE.user?.uid || null,
      activeApp: null
    });
    // Free any locked candidates under this employee (back to pool)
    await freeLockedCandidates(id);
    await logActivity(id, 'employee:exited', { reason, effectiveDate });
  }

  async function freeLockedCandidates(employeeId) {
    try {
      const rows = await DB.list(CONST.COLLECTIONS.CANDIDATES, {
        where: [['assignedToEmployeeId', '==', employeeId]],
        limit: 200
      });
      for (const r of rows) {
        await DB.update(`${CONST.COLLECTIONS.CANDIDATES}/${r.id}`, {
          assignedToEmployeeId: null,
          reassignedAt: DB.ts(),
          reassignedReason: 'employee-exit'
        });
      }
    } catch (e) { console.warn('[Employees.exit] freeCandidates', e.message); }
  }

  // ─────────────── SUPERVISOR TOGGLE ───────────────
  // Internal supervisor = employee with CRM access toggle
  async function toggleSupervisor(id, enabled) {
    const current = await getById(id);
    if (!current) throw new Error('Employee not found');
    const roles = new Set(current.roles || []);
    if (enabled) roles.add('INTERNAL_SUPERVISOR');
    else roles.delete('INTERNAL_SUPERVISOR');
    await DB.update(`${COL}/${id}`, {
      supervisorToggle: !!enabled,
      roles: [...roles],
      supervisorChangedAt: DB.ts(),
      supervisorChangedBy: STATE.user?.uid || null
    });
    await logActivity(id, 'employee:supervisor:' + (enabled ? 'on' : 'off'));
  }

  // ─────────────── HANDOVER (up chain only) ───────────────
  const HANDOVER_MATRIX = {
    EMPLOYEE: ['MANAGER', 'ADMIN'],
    MANAGER:  ['ADMIN', 'MASTER'],
    ADMIN:    ['MANAGER', 'MASTER'],
    MASTER:   [] // cannot handover
  };

  function canHandover(fromRole, toRole) {
    const allowed = HANDOVER_MATRIX[fromRole] || [];
    return allowed.includes(toRole);
  }

  async function handover(fromEmployeeId, toEmployeeId, reason = '') {
    if (!reason || reason.trim().length < 5) {
      throw new Error('Handover reason is compulsory (min 5 chars)');
    }
    const from = await getById(fromEmployeeId);
    const to = await getById(toEmployeeId);
    if (!from || !to) throw new Error('Invalid from/to employee');
    const fromRole = from.primaryRole;
    const toRole = to.primaryRole;
    if (!canHandover(fromRole, toRole)) {
      throw new Error(`Handover not allowed: ${fromRole} → ${toRole}`);
    }

    // Move assigned companies + candidates from → to
    const companies = await DB.list(CONST.COLLECTIONS.COMPANIES, {
      where: [['ownerId', '==', fromEmployeeId]],
      limit: 500
    });
    const candidates = await DB.list(CONST.COLLECTIONS.CANDIDATES, {
      where: [['assignedToEmployeeId', '==', fromEmployeeId]],
      limit: 500
    });

    const ops = [];
    for (const c of companies) {
      ops.push({ type: 'update', path: `${CONST.COLLECTIONS.COMPANIES}/${c.id}`, data: {
        ownerId: toEmployeeId, handoverFrom: fromEmployeeId, handoverAt: DB.ts()
      }});
    }
    for (const c of candidates) {
      ops.push({ type: 'update', path: `${CONST.COLLECTIONS.CANDIDATES}/${c.id}`, data: {
        assignedToEmployeeId: toEmployeeId, handoverFrom: fromEmployeeId, handoverAt: DB.ts()
      }});
    }
    if (ops.length) await DB.batch(ops);

    await logActivity(fromEmployeeId, 'handover:from', {
      to: toEmployeeId, reason, companies: companies.length, candidates: candidates.length
    });
    await logActivity(toEmployeeId, 'handover:to', {
      from: fromEmployeeId, reason
    });
    return { companies: companies.length, candidates: candidates.length };
  }

  // ─────────────── DELETE ───────────────
  async function softDelete(id) {
    await DB.softDelete(`${COL}/${id}`, STATE.user?.uid || null);
    await logActivity(id, 'employee:soft-deleted');
  }

  async function restore(id) {
    await DB.restore(`${COL}/${id}`);
    await logActivity(id, 'employee:restored');
  }

  // ─────────────── DUPLICATE CHECK ───────────────
  async function checkDuplicate(data, ignoreId = null) {
    const email = Utils.normalizeEmail(data.email);
    const phone = Utils.normalizePhone(data.phone);
    const code = (data.employeeCode || '').trim().toUpperCase();
    if (!email && !phone && !code) return { block: false };

    const rows = await DB.list(COL, { limit: 500 });
    for (const r of rows) {
      if (ignoreId && r.id === ignoreId) continue;
      if (email && Utils.normalizeEmail(r.email) === email) {
        return { block: true, message: `Employee with email ${email} exists.` };
      }
      if (code && (r.employeeCode || '').toUpperCase() === code) {
        return { block: true, message: `Employee code ${code} already used.` };
      }
    }
    return { block: false };
  }

  // ─────────────── VALIDATION ───────────────
  function validate(data) {
    if (!data.name || !String(data.name).trim()) throw new Error('Name is required');
    if (!data.email || !Utils.isEmail(data.email)) throw new Error('Valid email required');
    if (!data.phone || !Utils.isPhone(data.phone)) throw new Error('Valid phone required');
    if (data.roles && !data.roles.every(r => VALID_ROLES.includes(r))) {
      throw new Error('Invalid role in roles array');
    }
  }

  // ─────────────── NORMALIZE ───────────────
  function normalizePayload(data, isUpdate = false) {
    const out = {};
    const keep = [
      'name','email','phone','alternatePhone','employeeCode','designation',
      'department','roles','primaryRole','supervisorToggle','status',
      'joiningDate','salary','address','city','state','pincode',
      'emergencyContactName','emergencyContactPhone',
      'notes','tags','activeApp'
    ];
    for (const k of keep) {
      if (data[k] !== undefined) out[k] = data[k];
    }
    if (out.email) out.email = Utils.normalizeEmail(out.email);
    if (out.phone) out.phone = Utils.normalizePhone(out.phone);
    if (out.employeeCode) out.employeeCode = String(out.employeeCode).trim().toUpperCase();
    if (Array.isArray(out.roles)) out.roles = [...new Set(out.roles.filter(Boolean))];
    if (!isUpdate) {
      out.dupKeys = { email: out.email || '', employeeCode: out.employeeCode || '' };
    }
    return out;
  }

  // ─────────────── ACTIVITY ───────────────
  async function logActivity(employeeId, action, meta = {}) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'employee',
        employeeId,
        action,
        meta,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  // ─────────────── REALTIME ───────────────
  function watch(id, cb) { return DB.watch(`${COL}/${id}`, cb); }

  function watchList(filters, cb) {
    const opts = { orderBy: ['updatedAt', 'desc'], limit: filters.limit || 50 };
    const where = [];
    if (filters.status) where.push(['status', '==', filters.status]);
    if (filters.primaryRole) where.push(['primaryRole', '==', filters.primaryRole]);
    if (where.length) opts.where = where;
    return DB.watchList(COL, opts, cb);
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    create, getById, list, search,
    update,
    setStatus, deactivate, reactivate,
    processExit,
    toggleSupervisor,
    canHandover, handover,
    softDelete, restore,
    checkDuplicate,
    watch, watchList,
    VALID_ROLES,
    HANDOVER_MATRIX
  };
})();

const Clients = (function () {

    const payload = normalizePayload(data);
    validate(payload);

    const dup = await checkDuplicate(payload, opts.ignoreId);
    if (dup.block) throw new Error(dup.message);

    // Agreement-First check
    const company = await DB.get(`${CONST.COLLECTIONS.COMPANIES}/${payload.companyId}`);
    if (!company) throw new Error('Company not found');
    if (!company.agreementSigned && !opts.allowPreAgreement) {
      throw new Error('Agreement not signed — client cannot be onboarded yet.');
    }

    payload.roles = ['CLIENT'];
    payload.primaryRole = 'CLIENT';
    payload.clientSubRoles = payload.clientSubRoles && payload.clientSubRoles.length
      ? payload.clientSubRoles
      : ['VIEWER'];
    payload.status = payload.status || 'invited';
    payload.portalAccess = company.agreementSigned === true;
    payload.activeApp = 'client';
    payload.createdBy = STATE.user?.uid || null;

    const id = await DB.add(COL, payload);
    await logActivity(id, 'client:created', { companyId: payload.companyId });
    return id;
  }

  // ─────────────── READ ───────────────
  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function list(filters = {}) {
    const opts = { orderBy: ['updatedAt', 'desc'] };
    const where = [['primaryRole', '==', 'CLIENT']];
    if (filters.companyId) where.push(['companyId', '==', filters.companyId]);
    if (filters.status) where.push(['status', '==', filters.status]);
    if (filters.subRole) where.push(['clientSubRoles', 'array-contains', filters.subRole]);
    if (filters.isDeleted !== undefined) where.push(['isDeleted', '==', filters.isDeleted]);
    opts.where = where;
    if (filters.limit) opts.limit = filters.limit;
    return DB.list(COL, opts);
  }

  async function listByCompany(companyId) {
    if (!companyId) return [];
    return list({ companyId, limit: 100 });
  }

  async function search(term, limit = 20) {
    const t = String(term || '').trim().toLowerCase();
    if (!t) return [];
    const rows = await list({ limit: 300 });
    return rows.filter(r => {
      return (r.name || '').toLowerCase().includes(t)
          || (r.email || '').toLowerCase().includes(t)
          || (r.phone || '').includes(t);
    }).slice(0, limit);
  }

  // ─────────────── UPDATE ───────────────
  async function update(id, data) {
    if (!id) throw new Error('Client id required');
    const patch = normalizePayload(data, true);
    if (patch.clientSubRoles && !patch.clientSubRoles.every(r => SUB_ROLES.includes(r))) {
      throw new Error('Invalid sub-role');
    }
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'client:updated', { keys: Object.keys(patch) });
    return id;

  // ─────────────── STATUS ───────────────

    });

  async function activate(id) { return setStatus(id, 'active'); }
  async function suspend(id, reason) { return setStatus(id, 'suspended', reason); }
  async function disable(id, reason) { return setStatus(id, 'disabled', reason); }

  // ─────────────── PORTAL ACCESS ───────────────
  async function grantPortalAccess(id) {
    await DB.update(`${COL}/${id}`, {
      portalAccess: true,
      portalAccessGrantedAt: DB.ts(),
      portalAccessGrantedBy: STATE.user?.uid || null
    });
    await logActivity(id, 'client:portal:granted');

  async function revokePortalAccess(id, reason = '') {
    await DB.update(`${COL}/${id}`, {
      portalAccess: false,
      portalAccessRevokedAt: DB.ts(),
      portalAccessRevokedBy: STATE.user?.uid || null,
      portalAccessRevokeReason: reason
    });
    await logActivity(id, 'client:portal:revoked', { reason });
  }

  // ─────────────── PASSWORD RESET (EmailJS later) ───────────────
  async function sendInvite(id) {

    });

  // ─────────────── SUB-ROLE MANAGEMENT ───────────────
  async function addSubRole(id, subRole) {
    if (!SUB_ROLES.includes(subRole)) throw new Error('Invalid sub-role: ' + subRole);
    const c = await getById(id);
    const roles = new Set(c.clientSubRoles || []);

    await logActivity(id, 'client:subrole:added', { subRole });

  async function removeSubRole(id, subRole) {

    await logActivity(id, 'client:subrole:removed', { subRole });
  }

  // ─────────────── DELETE ───────────────
  async function softDelete(id) {
    await DB.softDelete(`${COL}/${id}`, STATE.user?.uid || null);
    await logActivity(id, 'client:soft-deleted');
  }

  async function restore(id) {
    await DB.restore(`${COL}/${id}`);
    await logActivity(id, 'client:restored');
  }

  // ─────────────── DUPLICATE ───────────────
  async function checkDuplicate(data, ignoreId = null) {

    if (!email) return { block: false };
    const rows = await list({ limit: 500 });
    for (const r of rows) {
      if (ignoreId && r.id === ignoreId) continue;
      if (Utils.normalizeEmail(r.email) === email) {
        return { block: true, message: `Client with email ${email} exists.` };
      }
    }
    return { block: false };
  }

  // ─────────────── VALIDATION ───────────────
  function validate(data) {
    if (!data.name || !String(data.name).trim()) throw new Error('Name is required');
    if (!data.email || !Utils.isEmail(data.email)) throw new Error('Valid email required');
    if (!data.companyId) throw new Error('companyId is required');
    if (data.clientSubRoles && !data.clientSubRoles.every(r => SUB_ROLES.includes(r))) {
      throw new Error('Invalid sub-role');
    }
  }

  // ─────────────── NORMALIZE ───────────────
  function normalizePayload(data, isUpdate = false) {

    const keep = [
      'name','email','phone','designation','companyId','companyName',
      'clientSubRoles','status','portalAccess','lastLoginAt',
      'notes','tags','photoUrl'
    ];
    for (const k of keep) {
      if (data[k] !== undefined) out[k] = data[k];
    }
    if (out.email) out.email = Utils.normalizeEmail(out.email);
    if (out.phone) out.phone = Utils.normalizePhone(out.phone);
    if (Array.isArray(out.clientSubRoles)) {
      out.clientSubRoles = [...new Set(out.clientSubRoles.filter(Boolean))];
    }
    if (!isUpdate) {
      out.dupKeys = { email: out.email || '' };
    }
    return out;

  // ─────────────── ACTIVITY ───────────────
  async function logActivity(userId, action, meta = {}) {

      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'client',

        action,
        meta,
        at: DB.ts(),

      });

  // ─────────────── PUBLIC API ───────────────

// ═══════════════════════════════════════════════════════════
//  PROSPECTS SERVICE
//  Sales pipeline: PROSPECT → LEAD → INTERESTED → (convert) CLIENT
//  7-stage FU sequence: D2/5/10/18/30/45/60 — manual send, in-app reminder
// ═══════════════════════════════════════════════════════════

const Prospects = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.INQUIRIES; // use inquiries collection for sales pipeline
  const STAGES = ['PROSPECT','LEAD','INTERESTED','CONVERTED','LOST'];
  const FU_TYPES = ['email','whatsapp','call'];

  // ─────────────── CREATE ───────────────
  async function create(data, opts = {}) {
    const payload = normalizePayload(data);
    validate(payload);

    const dup = await checkDuplicate(payload, opts.ignoreId);
    if (dup.block) throw new Error(dup.message);

    payload.stage = payload.stage || 'PROSPECT';
    payload.ownerId = payload.ownerId || STATE.user?.uid || null;
    payload.fuStage = 0;
    payload.fuNextAt = computeNextFUDate(0, payload.createdAtIso);
    payload.fuManual = false;
    payload.source = payload.source || 'manual';
    payload.createdBy = STATE.user?.uid || null;

    const id = await DB.add(COL, payload);
    await logActivity(id, 'prospect:created');
    return id;
  }

  // ─────────────── READ ───────────────
  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function list(filters = {}) {
    const opts = { orderBy: ['updatedAt', 'desc'] };
    const where = [];
    if (filters.stage) where.push(['stage', '==', filters.stage]);
    if (filters.stages) where.push(['stage', 'in', filters.stages]);
    if (filters.ownerId) where.push(['ownerId', '==', filters.ownerId]);
    if (filters.fuManual !== undefined) where.push(['fuManual', '==', filters.fuManual]);
    if (filters.isDeleted !== undefined) where.push(['isDeleted', '==', filters.isDeleted]);
    if (where.length) opts.where = where;
    if (filters.limit) opts.limit = filters.limit;
    return DB.list(COL, opts);
  }

  async function dueToday(limit = 100) {
    const rows = await list({ limit: limit * 2 });
    const now = Date.now();
    const endOfDay = new Date(); endOfDay.setHours(23, 59, 59, 999);
    return rows.filter(r => {
      if (!r.fuNextAt) return false;
      if (r.fuManual) return false;
      if (['CONVERTED','LOST'].includes(r.stage)) return false;
      const t = new Date(r.fuNextAt).getTime();
      return t <= endOfDay.getTime();
    }).slice(0, limit);
  }

  async function search(term, limit = 20) {
    const t = String(term || '').trim().toLowerCase();
    if (!t) return [];
    const rows = await list({ limit: 300 });
    return rows.filter(r => {
      return (r.name || '').toLowerCase().includes(t)
          || (r.companyName || '').toLowerCase().includes(t)
          || (r.email || '').toLowerCase().includes(t)
          || (r.phone || '').includes(t);
    }).slice(0, limit);
  }

  // ─────────────── UPDATE ───────────────
  async function update(id, data) {
    if (!id) throw new Error('Prospect id required');
    const patch = normalizePayload(data, true);
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'prospect:updated', { keys: Object.keys(patch) });
    return id;
  }

  async function setStage(id, newStage, meta = {}) {
    if (!STAGES.includes(newStage)) throw new Error('Invalid stage: ' + newStage);
    const patch = {
      stage: newStage,
      stageChangedAt: DB.ts(),
      stageChangedBy: STATE.user?.uid || null
    };
    if (newStage === 'CONVERTED') {
      patch.convertedAt = DB.ts();
      patch.convertedCompanyId = meta.companyId || null;
      patch.fuNextAt = null;
    }
    if (newStage === 'LOST') {
      patch.lostAt = DB.ts();
      patch.lostReason = meta.reason || null;
      patch.fuNextAt = null;
    }
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'prospect:stage:' + newStage, meta);
    return id;
  }

  // ─────────────── FU SEQUENCE ───────────────
  // fuStages config from Config.get('workflow.fuStages')
  function fuSchedule() {
    return Config.get('workflow.fuStages', []);
  }

  function computeNextFUDate(stageIdx, fallbackIso = null) {
    const schedule = fuSchedule();
    const stage = schedule[stageIdx];
    if (!stage) return null;
    const base = fallbackIso ? new Date(fallbackIso).getTime() : Date.now();
    return new Date(base + stage.day * 86400000).toISOString();
  }

  function currentFU(id) {
    return getById(id).then(p => {
      if (!p) return null;
      const schedule = fuSchedule();
      const idx = p.fuStage || 0;
      return { stage: idx, config: schedule[idx] || null };
    });
  }

  // Mark FU N as done → schedule next
  async function markFUDone(id, note = '') {
    const p = await getById(id);
    if (!p) throw new Error('Prospect not found');
    const idx = p.fuStage || 0;
    const schedule = fuSchedule();
    const next = idx + 1;
    const hasNext = next < schedule.length;
    const patch = {
      fuStage: hasNext ? next : idx,
      fuLastDoneAt: DB.ts(),
      fuLastNote: note || null,
      fuLog: DB.arrayUnion({
        stage: idx, at: new Date().toISOString(), note: note || ''
      })
    };
    if (hasNext) {
      const base = p.createdAtIso || p.createdAt || new Date().toISOString();
      patch.fuNextAt = computeNextFUDate(next, base);
    } else {
      patch.fuNextAt = null;
      patch.fuComplete = true;
    }
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'prospect:fu:done', { stage: idx, note });
    return { next: hasNext ? next : null };
  }

  // Stop FU (client replied / deal closed / rejected)
  async function stopFU(id, reason = '') {
    await DB.update(`${COL}/${id}`, {
      fuManual: true,
      fuStoppedAt: DB.ts(),
      fuStopReason: reason,
      fuNextAt: null
    });
    await logActivity(id, 'prospect:fu:stopped', { reason });
  }

  // Resume FU (employee re-enables manual override)
  async function resumeFU(id) {
    const p = await getById(id);
    const idx = p.fuStage || 0;
    await DB.update(`${COL}/${id}`, {
      fuManual: false,
      fuNextAt: computeNextFUDate(idx, p.createdAtIso || null)
    });
    await logActivity(id, 'prospect:fu:resumed');
  }

  // ─────────────── CONVERT TO COMPANY ───────────────
  async function convertToCompany(id, companyPayload = {}) {
    const p = await getById(id);
    if (!p) throw new Error('Prospect not found');
    if (p.stage === 'CONVERTED') throw new Error('Already converted');

    // Create company (Agreement-First — client onboarding handled separately)
    const companyId = await Companies.create({
      name: companyPayload.name || p.companyName || p.name,
      email: companyPayload.email || p.email,
      phone: companyPayload.phone || p.phone,
      city: companyPayload.city || p.city,
      website: companyPayload.website || p.website,
      serviceType: companyPayload.serviceType || p.serviceType || 'placement',
      source: 'prospect',
      referral: p.source || null
    });

    await setStage(id, 'CONVERTED', { companyId });
    await DB.update(`${COL}/${id}`, { convertedCompanyId: companyId });
    return companyId;
  }

  // ─────────────── DELETE ───────────────
  async function softDelete(id) {
    await DB.softDelete(`${COL}/${id}`, STATE.user?.uid || null);
    await logActivity(id, 'prospect:soft-deleted');
  }

  async function restore(id) {
    await DB.restore(`${COL}/${id}`);
    await logActivity(id, 'prospect:restored');
  }

  // ─────────────── DUPLICATE ───────────────
  // Rule: phone/email block within 30 days
  async function checkDuplicate(data, ignoreId = null) {
    const phone = Utils.normalizePhone(data.phone);
    const email = Utils.normalizeEmail(data.email);
    if (!phone && !email) return { block: false };

    const rows = await DB.list(COL, { limit: 300 });
    const cutoff = Date.now() - 30 * 86400000;
    for (const r of rows) {
      if (ignoreId && r.id === ignoreId) continue;
      const createdMs = r.createdAt?.toMillis ? r.createdAt.toMillis() : new Date(r.createdAt).getTime();
      if (createdMs < cutoff) continue;
      if (phone && Utils.normalizePhone(r.phone) === phone) {
        return { block: true, message: `Recent inquiry with phone ${phone} (within 30 days).` };
      }
      if (email && Utils.normalizeEmail(r.email) === email) {
        return { block: true, message: `Recent inquiry with email ${email} (within 30 days).` };
      }
    }
    return { block: false };
  }

  // ─────────────── VALIDATION ───────────────
  function validate(data) {
    if (!data.name && !data.companyName) throw new Error('Name or company name required');
    if (data.email && !Utils.isEmail(data.email)) throw new Error('Invalid email');
    if (data.phone && !Utils.isPhone(data.phone)) throw new Error('Invalid phone');
  }

  // ─────────────── NORMALIZE ───────────────
  function normalizePayload(data, isUpdate = false) {
    const out = {};
    const keep = [
      'name','companyName','email','phone','website','city','state',
      'industry','companySize','serviceType','stage','ownerId',
      'source','referral','notes','tags',
      'fuStage','fuManual','fuNextAt'
    ];
    for (const k of keep) {
      if (data[k] !== undefined) out[k] = data[k];
    }
    if (out.email) out.email = Utils.normalizeEmail(out.email);
    if (out.phone) out.phone = Utils.normalizePhone(out.phone);
    if (out.website) out.website = Utils.normalizeWebsite(out.website);
    if (!isUpdate) {
      out.createdAtIso = new Date().toISOString();
      out.dupKeys = { phone: out.phone || '', email: out.email || '' };
    }
    return out;
  }

  // ─────────────── ACTIVITY ───────────────
  async function logActivity(id, action, meta = {}) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'prospect',
        prospectId: id,
        action,
        meta,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  // ─────────────── REALTIME ───────────────
  function watch(id, cb) { return DB.watch(`${COL}/${id}`, cb); }

  function watchList(filters, cb) {
    const opts = { orderBy: ['updatedAt', 'desc'], limit: filters.limit || 50 };
    const where = [];
    if (filters.stage) where.push(['stage', '==', filters.stage]);
    if (filters.ownerId) where.push(['ownerId', '==', filters.ownerId]);
    if (where.length) opts.where = where;
    return DB.watchList(COL, opts, cb);
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    create, getById, list, dueToday, search,
    update, setStage,
    currentFU, markFUDone, stopFU, resumeFU,
    convertToCompany,
    softDelete, restore,
    checkDuplicate,
    watch, watchList,
    STAGES, FU_TYPES
  };
})();

    // ═══════════════════════════════════════════════════════════
//  INVOICES SERVICE
//  Types: placement (one-time) | contract (monthly)
//  Fee: min salary × % (15/30) + 18% GST (placements)
//  Status: DRAFT → SENT → PARTIAL → PAID | OVERDUE | CANCELLED
//  Auto-number: INV-YYYYMM-####
// ═══════════════════════════════════════════════════════════

const Invoices = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.INVOICES;
  const STATUS = ['DRAFT','SENT','PARTIAL','PAID','OVERDUE','CANCELLED'];
  const TYPES = ['placement','contract'];

  // ─────────────── NUMBER GENERATION ───────────────
  async function generateNumber(prefix = 'INV') {
    const now = new Date();
    const ym = now.getFullYear().toString() + String(now.getMonth() + 1).padStart(2, '0');
    const head = `${prefix}-${ym}-`;
    // Query latest invoice with this prefix
    const rows = await DB.list(COL, {
      where: [['number', '>=', head], ['number', '<', head + 'zzzz']],
      orderBy: ['number', 'desc'],
      limit: 1
    });
    let next = 1;
    if (rows.length && rows[0].number) {
      const parts = rows[0].number.split('-');
      const last = parseInt(parts[parts.length - 1], 10);
      if (!isNaN(last)) next = last + 1;
    }
    return head + String(next).padStart(4, '0');
  }

  // ─────────────── COMPUTE PLACEMENT FEE ───────────────
  // Rule: min salary × % (15 normal / 30 urgent) + 18% GST
  function computePlacementFee(opts = {}) {
    const gstRate = Number(Config.get('business.gstRate', 18));
    const feeNormal = Number(Config.get('business.placementFeeNormal', 15));
    const feeUrgent = Number(Config.get('business.placementFeeUrgent', 30));
    const minSalary = Number(opts.minSalary || 0);
    const urgency = opts.urgency === 'urgent' ? 'urgent' : 'normal';
    const pct = urgency === 'urgent' ? feeUrgent : feeNormal;
    const baseAmount = Math.round(minSalary * pct / 100);
    const gstAmount = Math.round(baseAmount * gstRate / 100);
    const total = baseAmount + gstAmount;
    return {
      minSalary, urgency, feePct: pct,
      baseAmount, gstRate, gstAmount,
      subtotal: baseAmount, total
    };
  }

  // ─────────────── COMPUTE CONTRACT FEE ───────────────
  // Rule: monthly, margin % on ACTUAL salary
  function computeContractFee(opts = {}) {
    const gstRate = Number(Config.get('business.gstRate', 18));
    const actualSalary = Number(opts.actualSalary || 0);
    const marginPct = Number(opts.marginPct || 22);
    const positions = Number(opts.positions || 1);
    const months = Number(opts.months || 1);
    const perPosition = Math.round(actualSalary * marginPct / 100);
    const baseAmount = perPosition * positions * months;
    const gstAmount = Math.round(baseAmount * gstRate / 100);
    return {
      actualSalary, marginPct, positions, months,
      perPosition, baseAmount, gstRate, gstAmount,
      subtotal: baseAmount, total: baseAmount + gstAmount
    };
  }

  // ─────────────── CREATE ───────────────
  async function create(data, opts = {}) {
    const payload = normalizePayload(data);
    validate(payload);

    if (!payload.number) payload.number = await generateNumber(payload.type === 'contract' ? 'CON' : 'INV');
    if (!payload.issueDate) payload.issueDate = new Date().toISOString().slice(0, 10);
    if (!payload.dueDate) {
      const days = payload.paymentTermsDays || 15;
      payload.dueDate = new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
    }

    // Auto-compute if not provided
    if (!payload.subtotal && payload.type === 'placement' && payload.minSalary) {
      const calc = computePlacementFee({
        minSalary: payload.minSalary,
        urgency: payload.urgency || 'normal'
      });
      Object.assign(payload, {
        feePct: calc.feePct, baseAmount: calc.baseAmount,
        gstRate: calc.gstRate, gstAmount: calc.gstAmount,
        subtotal: calc.subtotal, total: calc.total
      });
    }
    if (!payload.subtotal && payload.type === 'contract' && payload.actualSalary) {
      const calc = computeContractFee({
        actualSalary: payload.actualSalary,
        marginPct: payload.marginPct,
        positions: payload.positions,
        months: payload.months
      });
      Object.assign(payload, {
        perPosition: calc.perPosition, marginPct: calc.marginPct,
        positions: calc.positions, months: calc.months,
        gstRate: calc.gstRate, gstAmount: calc.gstAmount,
        subtotal: calc.subtotal, total: calc.total
      });
    }

    payload.status = payload.status || 'DRAFT';
    payload.paidAmount = 0;
    payload.balance = payload.total || 0;
    payload.createdBy = STATE.user?.uid || null;

    const id = await DB.add(COL, payload);
    await logActivity(id, 'invoice:created', { number: payload.number });
    return id;
  }

  // ─────────────── READ ───────────────
  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function list(filters = {}) {
    const opts = { orderBy: ['issueDate', 'desc'] };
    const where = [];
    if (filters.status) where.push(['status', '==', filters.status]);
    if (filters.statuses) where.push(['status', 'in', filters.statuses]);
    if (filters.type) where.push(['type', '==', filters.type]);
    if (filters.companyId) where.push(['companyId', '==', filters.companyId]);
    if (filters.candidateId) where.push(['candidateId', '==', filters.candidateId]);
    if (filters.isDeleted !== undefined) where.push(['isDeleted', '==', filters.isDeleted]);
    if (where.length) opts.where = where;
    if (filters.limit) opts.limit = filters.limit;
    return DB.list(COL, opts);
  }

  async function search(term, limit = 20) {
    const t = String(term || '').trim().toLowerCase();
    if (!t) return [];
    const rows = await list({ limit: 300 });
    return rows.filter(r => {
      return (r.number || '').toLowerCase().includes(t)
          || (r.companyName || '').toLowerCase().includes(t)
          || (r.candidateName || '').toLowerCase().includes(t);
    }).slice(0, limit);
  }

  // ─────────────── UPDATE ───────────────
  async function update(id, data) {
    if (!id) throw new Error('Invoice id required');
    const patch = normalizePayload(data, true);
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'invoice:updated', { keys: Object.keys(patch) });
    return id;
  }

  // ─────────────── STATUS ───────────────
  async function setStatus(id, status, meta = {}) {
    if (!STATUS.includes(status)) throw new Error('Invalid status: ' + status);
    const patch = {
      status,
      statusChangedAt: DB.ts(),
      statusChangedBy: STATE.user?.uid || null
    };
    if (status === 'SENT') patch.sentAt = DB.ts();
    if (status === 'PAID') {
      patch.paidAt = DB.ts();
      patch.balance = 0;
    }
    if (status === 'CANCELLED') {
      patch.cancelledAt = DB.ts();
      patch.cancelReason = meta.reason || null;
    }
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'invoice:status:' + status, meta);
    return id;
  }

  async function markSent(id) { return setStatus(id, 'SENT'); }
  async function markCancelled(id, reason) { return setStatus(id, 'CANCELLED', { reason }); }

  // ─────────────── DELETE ───────────────
  async function softDelete(id) {
    await DB.softDelete(`${COL}/${id}`, STATE.user?.uid || null);
    await logActivity(id, 'invoice:soft-deleted');
  }

  async function restore(id) {
    await DB.restore(`${COL}/${id}`);
    await logActivity(id, 'invoice:restored');
  }

  // ─────────────── VALIDATION ───────────────
  function validate(data) {
    if (!data.companyId) throw new Error('companyId is required');
    if (!data.type || !TYPES.includes(data.type)) throw new Error('Invalid invoice type');
    if (!data.total && !data.subtotal) throw new Error('Invoice total required');
  }

  // ─────────────── NORMALIZE ───────────────
  function normalizePayload(data, isUpdate = false) {
    const out = {};
    const keep = [
      'number','type','companyId','companyName','companyGstin',
      'candidateId','candidateName',
      'requirementId','agreementId',
      'minSalary','actualSalary','urgency','feePct','marginPct',
      'positions','months','perPosition',
      'baseAmount','gstRate','gstAmount','subtotal','total',
      'issueDate','dueDate','paymentTermsDays',
      'status','paidAmount','balance',
      'notes','items','tags'
    ];
    for (const k of keep) {
      if (data[k] !== undefined) out[k] = data[k];
    }
    ['minSalary','actualSalary','feePct','marginPct','positions','months',
     'perPosition','baseAmount','gstRate','gstAmount','subtotal','total',
     'paidAmount','balance'].forEach(k => {
      if (out[k] !== undefined) out[k] = Number(out[k]) || 0;
    });
    if (out.companyGstin) out.companyGstin = String(out.companyGstin).trim().toUpperCase();
    return out;
  }

  // ─────────────── SUMMARY HELPERS ───────────────
  async function companySummary(companyId) {
    const rows = await list({ companyId, limit: 500 });
    const out = { total: 0, paid: 0, balance: 0, count: 0, overdue: 0 };
    const now = Date.now();
    for (const r of rows) {
      out.count++;
      out.total += Number(r.total) || 0;
      out.paid += Number(r.paidAmount) || 0;
      out.balance += Number(r.balance) || 0;
      if (r.status !== 'PAID' && r.status !== 'CANCELLED' && r.dueDate) {
        if (new Date(r.dueDate).getTime() < now) out.overdue++;
      }
    }
    return out;
  }

  // ─────────────── ACTIVITY ───────────────
  async function logActivity(invoiceId, action, meta = {}) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'invoice',
        invoiceId,
        action,
        meta,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  // ─────────────── REALTIME ───────────────
  function watch(id, cb) { return DB.watch(`${COL}/${id}`, cb); }

  function watchList(filters, cb) {
    const opts = { orderBy: ['issueDate', 'desc'], limit: filters.limit || 50 };
    const where = [];
    if (filters.status) where.push(['status', '==', filters.status]);
    if (filters.companyId) where.push(['companyId', '==', filters.companyId]);
    if (where.length) opts.where = where;
    return DB.watchList(COL, opts, cb);
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    create, getById, list, search,
    update, setStatus, markSent, markCancelled,
    softDelete, restore,
    generateNumber,
    computePlacementFee, computeContractFee,
    companySummary,
    watch, watchList,
    STATUS, TYPES
  };
})();

// ═══════════════════════════════════════════════════════════
//  PAYMENTS SERVICE
//  Records payments against invoices.
//  Auto-updates invoice.status (PARTIAL / PAID).
//  Modes: cash | cheque | neft | rtgs | upi | card | other
// ═══════════════════════════════════════════════════════════

const Payments = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.PAYMENTS;
  const MODES = ['cash','cheque','neft','rtgs','upi','card','other'];
  const STATUS = ['RECORDED','RECONCILED','BOUNCED','CANCELLED'];

  // ─────────────── CREATE ───────────────
  async function create(data) {
    const payload = normalizePayload(data);
    validate(payload);

    payload.status = payload.status || 'RECORDED';
    payload.recordedBy = STATE.user?.uid || null;
    payload.recordedAt = DB.ts();

    const id = await DB.add(COL, payload);
    await logActivity(id, 'payment:recorded', {
      invoiceId: payload.invoiceId, amount: payload.amount
    });

    // Update invoice: paidAmount, balance, status
    if (payload.invoiceId) {
      await recomputeInvoice(payload.invoiceId);
    }
    return id;
  }

  // ─────────────── READ ───────────────
  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function list(filters = {}) {
    const opts = { orderBy: ['recordedAt', 'desc'] };
    const where = [];
    if (filters.invoiceId) where.push(['invoiceId', '==', filters.invoiceId]);
    if (filters.companyId) where.push(['companyId', '==', filters.companyId]);
    if (filters.status) where.push(['status', '==', filters.status]);
    if (filters.mode) where.push(['mode', '==', filters.mode]);
    if (filters.isDeleted !== undefined) where.push(['isDeleted', '==', filters.isDeleted]);
    if (where.length) opts.where = where;
    if (filters.limit) opts.limit = filters.limit;
    return DB.list(COL, opts);
  }

  async function listByInvoice(invoiceId) {
    if (!invoiceId) return [];
    return list({ invoiceId, limit: 100 });
  }

  // ─────────────── UPDATE ───────────────
  async function update(id, data) {
    const existing = await getById(id);
    if (!existing) throw new Error('Payment not found');
    const patch = normalizePayload(data, true);
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'payment:updated', { keys: Object.keys(patch) });
    if (existing.invoiceId) await recomputeInvoice(existing.invoiceId);
    return id;
  }

  // ─────────────── STATUS ───────────────
  async function setStatus(id, status, meta = {}) {
    if (!STATUS.includes(status)) throw new Error('Invalid status: ' + status);
    const patch = {
      status,
      statusChangedAt: DB.ts(),
      statusChangedBy: STATE.user?.uid || null
    };
    if (status === 'RECONCILED') patch.reconciledAt = DB.ts();
    if (status === 'BOUNCED') {
      patch.bouncedAt = DB.ts();
      patch.bounceReason = meta.reason || null;
    }
    if (status === 'CANCELLED') {
      patch.cancelledAt = DB.ts();
      patch.cancelReason = meta.reason || null;
    }
    const p = await getById(id);
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'payment:status:' + status, meta);
    if (p && p.invoiceId) await recomputeInvoice(p.invoiceId);
  }

  async function reconcile(id) { return setStatus(id, 'RECONCILED'); }
  async function markBounced(id, reason) { return setStatus(id, 'BOUNCED', { reason }); }
  async function cancel(id, reason) { return setStatus(id, 'CANCELLED', { reason }); }

  // ─────────────── INVOICE RECOMPUTE ───────────────
  async function recomputeInvoice(invoiceId) {
    try {
      const inv = await Invoices.getById(invoiceId);
      if (!inv) return;
      const payments = await DB.list(COL, {
        where: [['invoiceId', '==', invoiceId]],
        limit: 500
      });
      const valid = payments.filter(p => p.status === 'RECORDED' || p.status === 'RECONCILED');
      const paid = valid.reduce((s, p) => s + (Number(p.amount) || 0), 0);
      const total = Number(inv.total) || 0;
      const balance = Math.max(total - paid, 0);
      let status = inv.status;
      if (status !== 'CANCELLED' && status !== 'DRAFT') {
        if (balance <= 0.5) status = 'PAID';
        else if (paid > 0) status = 'PARTIAL';
        else if (inv.status === 'PAID' || inv.status === 'PARTIAL') status = 'SENT';
      }
      await DB.update(`${CONST.COLLECTIONS.INVOICES}/${invoiceId}`, {
        paidAmount: paid, balance, status,
        lastPaymentAt: DB.ts()
      });
    } catch (e) {
      console.warn('[Payments.recomputeInvoice]', e.message);
    }
  }

  // ─────────────── DELETE ───────────────
  async function softDelete(id) {
    const p = await getById(id);
    await DB.softDelete(`${COL}/${id}`, STATE.user?.uid || null);
    await logActivity(id, 'payment:soft-deleted');
    if (p && p.invoiceId) await recomputeInvoice(p.invoiceId);
  }

  async function restore(id) {
    const p = await getById(id);
    await DB.restore(`${COL}/${id}`);
    await logActivity(id, 'payment:restored');
    if (p && p.invoiceId) await recomputeInvoice(p.invoiceId);
  }

  // ─────────────── VALIDATION ───────────────
  function validate(data) {
    if (!data.invoiceId) throw new Error('invoiceId is required');
    if (!data.amount || Number(data.amount) <= 0) throw new Error('Amount must be > 0');
    if (!data.mode || !MODES.includes(data.mode)) throw new Error('Invalid payment mode');
    if (!data.paidAt) throw new Error('paidAt (date) required');
  }

  // ─────────────── NORMALIZE ───────────────
  function normalizePayload(data, isUpdate = false) {
    const out = {};
    const keep = [
      'invoiceId','companyId','companyName',
      'amount','mode','reference','bankName',
      'paidAt','notes','status','recordedBy'
    ];
    for (const k of keep) {
      if (data[k] !== undefined) out[k] = data[k];
    }
    if (out.amount !== undefined) out.amount = Number(out.amount) || 0;
    if (out.reference) out.reference = String(out.reference).trim();
    return out;
  }

  // ─────────────── ACTIVITY ───────────────
  async function logActivity(paymentId, action, meta = {}) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'payment',
        paymentId,
        action,
        meta,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  // ─────────────── SUMMARY ───────────────
  async function companySummary(companyId) {
    const rows = await list({ companyId, limit: 500 });
    let received = 0, bounced = 0;
    for (const r of rows) {
      if (r.status === 'RECORDED' || r.status === 'RECONCILED') received += Number(r.amount) || 0;
      if (r.status === 'BOUNCED') bounced += Number(r.amount) || 0;
    }
    return { received, bounced, count: rows.length };
  }

  // ─────────────── REALTIME ───────────────
  function watch(id, cb) { return DB.watch(`${COL}/${id}`, cb); }

  function watchByInvoice(invoiceId, cb) {
    return DB.watchList(COL, {
      where: [['invoiceId', '==', invoiceId]],
      orderBy: ['recordedAt', 'desc'],
      limit: 100
    }, cb);
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    create, getById, list, listByInvoice,
    update, setStatus, reconcile, markBounced, cancel,
    softDelete, restore,
    companySummary,
    recomputeInvoice,
    watch, watchByInvoice,
    MODES, STATUS
  };
})();

    // ═══════════════════════════════════════════════════════════
//  CONTRACT STAFFING SERVICE
//  Recurring monthly staffing. Attendance-driven billing.
//  Termination: client(30d) | company(7d) | mutual | force-majeure
//  Renewal: D-30 notice → renew/extension/fresh
//  Backup: small team(≤5) paid, large(≥10) auto-adjusted
// ═══════════════════════════════════════════════════════════

const Contract = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.CONTRACT_STAFF;

  // ─────────────── ENROLL STAFF ───────────────
  // Links a candidate as contract staff under a client company
  async function enroll(data, opts = {}) {
    const payload = normalizePayload(data);
    validate(payload);

    // Duplicate check — same candidate under same company active?
    const existing = await DB.list(COL, {
      where: [
        ['candidateId', '==', payload.candidateId],
        ['companyId', '==', payload.companyId],
        ['status', 'in', ['ACTIVE', 'ON_NOTICE', 'REPLACEMENT_PENDING']]
      ],
      limit: 5
    });
    if (existing.length) throw new Error('Candidate already enrolled in this company');

    payload.status = payload.status || 'ACTIVE';
    payload.joinedAt = payload.joinedAt || new Date().toISOString().slice(0, 10);
    payload.attendanceLocked = false;
    payload.enrolledBy = STATE.user?.uid || null;

    const id = await DB.add(COL, payload);
    await logActivity(id, 'contract:enrolled', {
      candidateId: payload.candidateId, companyId: payload.companyId
    });
    return id;
  }

  // ─────────────── READ ───────────────
  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function list(filters = {}) {
    const opts = { orderBy: ['updatedAt', 'desc'] };
    const where = [];
    if (filters.companyId) where.push(['companyId', '==', filters.companyId]);
    if (filters.status) where.push(['status', '==', filters.status]);
    if (filters.statuses) where.push(['status', 'in', filters.statuses]);
    if (filters.candidateId) where.push(['candidateId', '==', filters.candidateId]);
    if (filters.supervisorId) where.push(['supervisorId', '==', filters.supervisorId]);
    if (filters.site) where.push(['site', '==', filters.site]);
    if (filters.isDeleted !== undefined) where.push(['isDeleted', '==', filters.isDeleted]);
    if (where.length) opts.where = where;
    if (filters.limit) opts.limit = filters.limit;
    return DB.list(COL, opts);
  }

  async function listByCompany(companyId) {
    if (!companyId) return [];
    return list({ companyId, limit: 500 });
  }

  async function listActive(companyId) {
    return list({ companyId, status: 'ACTIVE', limit: 500 });
  }

  async function search(term, limit = 20) {
    const t = String(term || '').trim().toLowerCase();
    if (!t) return [];
    const rows = await list({ limit: 500 });
    return rows.filter(r => {
      return (r.candidateName || '').toLowerCase().includes(t)
          || (r.candidateCode || '').toLowerCase().includes(t)
          || (r.site || '').toLowerCase().includes(t);
    }).slice(0, limit);
  }

  // ─────────────── UPDATE ───────────────
  async function update(id, data) {
    if (!id) throw new Error('Contract staff id required');
    const patch = normalizePayload(data, true);
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'contract:updated', { keys: Object.keys(patch) });
    return id;
  }

  // ─────────────── PAY RATES ───────────────
  function computeDailyRate(monthlyRate, workingDays) {
    const wd = Number(workingDays) || 26;
    return Math.round((Number(monthlyRate) || 0) / wd);
  }

  // ─────────────── BILLING (attendance-driven) ───────────────
  // Per position: days worked × per-day rate. Gap days = 0 bill.
  // Week off (WO) and Holiday (HO) = full bill if staffed.
  function computeMonthlyBill(opts = {}) {
    const gstRate = Number(Config.get('business.gstRate', 18));
    const monthlyRate = Number(opts.monthlyRate || 0);
    const workingDays = Number(opts.workingDays || 26);
    const dailyRate = computeDailyRate(monthlyRate, workingDays);
    const attendance = Array.isArray(opts.attendance) ? opts.attendance : [];

    let billableDays = 0;
    const breakdown = { P: 0, H: 0, A: 0, L: 0, WO: 0, HO: 0 };
    for (const a of attendance) {
      const code = a.status || a;
      if (!(code in breakdown)) continue;
      breakdown[code]++;
      const factor = CONST.ATTENDANCE_STATUS[code]?.billFactor;
      if (factor === 1.0) billableDays += 1;
      else if (factor === 0.5) billableDays += 0.5;
      // A → 0; L → depends on config (default 0 for unpaid leave)
    }

    const baseAmount = Math.round(dailyRate * billableDays);
    const gstAmount = Math.round(baseAmount * gstRate / 100);
    return {
      monthlyRate, workingDays, dailyRate, billableDays,
      breakdown, baseAmount, gstRate, gstAmount,
      subtotal: baseAmount, total: baseAmount + gstAmount
    };
  }

  // ─────────────── BACKUP LOGIC ───────────────
  // ≤5 team → client pays for backup
  // ≥10 team → auto-adjust in roster (no extra bill)
  // Working-day gap = no bill (already handled by attendance)
  function backupPolicy(teamSize) {
    const size = Number(teamSize) || 0;
    if (size <= 5) return { mode: 'client-paid', autoAdjust: false, threshold: 5 };
    if (size >= 10) return { mode: 'auto-adjust', autoAdjust: true, threshold: 10 };
    return { mode: 'flexible', autoAdjust: true, threshold: 7 };
  }

  // ─────────────── TERMINATION (4 types) ───────────────
  const TERMINATION_TYPES = {
    client: { noticeDays: 30, label: 'Client Initiated' },
    company: { noticeDays: 7,  label: 'Company Initiated (payment default)' },
    mutual: { noticeDays: 0,   label: 'Mutual' },
    force_majeure: { noticeDays: 0, label: 'Force Majeure' }
  };

  async function initiateTermination(id, type, meta = {}) {
    if (!TERMINATION_TYPES[type]) throw new Error('Invalid termination type');
    const cfg = TERMINATION_TYPES[type];
    const noticeDays = meta.noticeDays ?? cfg.noticeDays;
    const effectiveDate = meta.effectiveDate ||
      new Date(Date.now() + noticeDays * 86400000).toISOString().slice(0, 10);
    await DB.update(`${COL}/${id}`, {
      status: 'ON_NOTICE',
      terminationType: type,
      terminationReason: meta.reason || null,
      noticeDays,
      noticeStartedAt: DB.ts(),
      noticeEffectiveDate: effectiveDate,
      terminationInitiatedBy: STATE.user?.uid || null
    });
    await logActivity(id, 'contract:termination-initiated', {
      type, noticeDays, effectiveDate
    });
  }

  async function completeTermination(id, meta = {}) {
    await DB.update(`${COL}/${id}`, {
      status: 'RELEASED',
      releasedAt: DB.ts(),
      finalSettlementNote: meta.note || null,
      releasedBy: STATE.user?.uid || null
    });
    await logActivity(id, 'contract:released', meta);
  }

  async function cancelTermination(id, reason = '') {
    await DB.update(`${COL}/${id}`, {
      status: 'ACTIVE',
      terminationType: null,
      cancellationReason: reason,
      terminationCancelledAt: DB.ts()
    });
    await logActivity(id, 'contract:termination-cancelled', { reason });
  }

  // ─────────────── REPLACEMENT (during contract) ───────────────
  // Free replacement within 7 days of vacancy
  async function initiateReplacement(id, meta = {}) {
    await DB.update(`${COL}/${id}`, {
      status: 'REPLACEMENT_PENDING',
      replacementReason: meta.reason || 'staff-left',
      replacementRequestedAt: DB.ts(),
      replacementDeadline: new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10)
    });
    await logActivity(id, 'contract:replacement-requested', meta);
  }

  async function completeReplacement(id, newCandidateId, meta = {}) {
    const old = await getById(id);
    if (!old) throw new Error('Contract staff not found');

    // Release old + create new
    const ops = [
      {
        type: 'update',
        path: `${COL}/${id}`,
        data: {
          status: 'RELEASED',
          replacedByCandidateId: newCandidateId,
          replacedAt: DB.ts(),
          releaseReason: 'replacement',
          releasedBy: STATE.user?.uid || null
        }
      }
    ];
    await DB.batch(ops);

    // Enroll new candidate preserving contract terms
    const newId = await enroll({
      candidateId: newCandidateId,
      candidateName: meta.newCandidateName || '',
      companyId: old.companyId,
      companyName: old.companyName,
      site: old.site,
      position: old.position,
      monthlyRate: old.monthlyRate,
      marginPct: old.marginPct,
      workingDays: old.workingDays,
      supervisorId: old.supervisorId,
      joinedAt: new Date().toISOString().slice(0, 10),
      replacesId: id
    });
    await logActivity(id, 'contract:replacement-completed', {
      newId, newCandidateId
    });
    return newId;
  }

  // ─────────────── RENEWAL ───────────────
  function shouldNotifyRenewal(endDate) {
    const notice = Config.get('business.contractRenewalNoticeDays', 30);
    const diff = (new Date(endDate).getTime() - Date.now()) / 86400000;
    return diff <= notice && diff > 0;
  }

  async function renew(id, opts = {}) {
    const old = await getById(id);
    if (!old) throw new Error('Contract staff not found');
    const newEnd = opts.newEndDate ||
      new Date(Date.now() + (opts.months || 12) * 30 * 86400000).toISOString().slice(0, 10);

    // Option A: extend same record
    if (opts.mode === 'extend') {
      await DB.update(`${COL}/${id}`, {
        endDate: newEnd,
        renewedAt: DB.ts(),
        renewedBy: STATE.user?.uid || null,
        renewalCount: (old.renewalCount || 0) + 1
      });
      await logActivity(id, 'contract:renewed-extend', { newEnd });
      return id;
    }

    // Option B: fresh record (new terms)
    const newId = await enroll({
      ...old,
      id: undefined,
      _id: undefined,
      joinedAt: opts.newStartDate || new Date().toISOString().slice(0, 10),
      endDate: newEnd,
      monthlyRate: opts.monthlyRate || old.monthlyRate,
      marginPct: opts.marginPct || old.marginPct,
      renewalOf: id
    });
    await DB.update(`${COL}/${id}`, {
      status: 'CLOSED',
      renewedIntoId: newId,
      closedAt: DB.ts()
    });
    await logActivity(id, 'contract:renewed-fresh', { newId });
    return newId;
  }

  // ─────────────── STATUS ───────────────
  async function setStatus(id, status, meta = {}) {
    const VALID = ['ACTIVE','ON_NOTICE','REPLACEMENT_PENDING','RELEASED','CLOSED','SUSPENDED'];
    if (!VALID.includes(status)) throw new Error('Invalid status: ' + status);
    await DB.update(`${COL}/${id}`, {
      status,
      statusChangedAt: DB.ts(),
      statusChangedBy: STATE.user?.uid || null,
      statusNote: meta.note || null
    });
    await logActivity(id, 'contract:status:' + status, meta);
  }

  async function suspend(id, reason) { return setStatus(id, 'SUSPENDED', { note: reason }); }
  async function resume(id) { return setStatus(id, 'ACTIVE'); }

  // ─────────────── DELETE ───────────────
  async function softDelete(id) {
    await DB.softDelete(`${COL}/${id}`, STATE.user?.uid || null);
    await logActivity(id, 'contract:soft-deleted');
  }

  async function restore(id) {
    await DB.restore(`${COL}/${id}`);
    await logActivity(id, 'contract:restored');
  }

  // ─────────────── VALIDATION ───────────────
  function validate(data) {
    if (!data.companyId) throw new Error('companyId is required');
    if (!data.candidateId) throw new Error('candidateId is required');
    if (!data.monthlyRate || Number(data.monthlyRate) <= 0) throw new Error('monthlyRate required');
    if (data.marginPct && (Number(data.marginPct) < 0 || Number(data.marginPct) > 100)) {
      throw new Error('Invalid marginPct');
    }
  }

  // ─────────────── NORMALIZE ───────────────
  function normalizePayload(data, isUpdate = false) {
    const out = {};
    const keep = [
      'companyId','companyName','candidateId','candidateName','candidateCode',
      'position','site','shift','supervisorId','supervisorName',
      'monthlyRate','marginPct','workingDays','gstRate',
      'startDate','endDate','joinedAt',
      'status','attendanceLocked','notes','tags',
      'agreementId','contractType'
    ];
    for (const k of keep) {
      if (data[k] !== undefined) out[k] = data[k];
    }
    ['monthlyRate','marginPct','workingDays','gstRate'].forEach(k => {
      if (out[k] !== undefined) out[k] = Number(out[k]) || 0;
    });
    if (out.startDate && !out.joinedAt) out.joinedAt = out.startDate;
    if (!isUpdate) {
      out.contractNumber = data.contractNumber ||
        ('CT-' + Date.now().toString(36).toUpperCase());
    }
    return out;
  }

  // ─────────────── ACTIVITY ───────────────
  async function logActivity(contractId, action, meta = {}) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'contract',
        contractId,
        action,
        meta,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  // ─────────────── REALTIME ───────────────
  function watch(id, cb) { return DB.watch(`${COL}/${id}`, cb); }

  function watchByCompany(companyId, cb) {
    return DB.watchList(COL, {
      where: [['companyId', '==', companyId]],
      orderBy: ['updatedAt', 'desc'],
      limit: 200
    }, cb);
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    enroll, getById, list, listByCompany, listActive, search,
    update,
    computeDailyRate, computeMonthlyBill, backupPolicy,
    initiateTermination, completeTermination, cancelTermination,
    initiateReplacement, completeReplacement,
    shouldNotifyRenewal, renew,
    setStatus, suspend, resume,
    softDelete, restore,
    watch, watchByCompany,
    TERMINATION_TYPES
  };
})();
