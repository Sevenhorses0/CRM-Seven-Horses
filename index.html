    // ═══════════════════════════════════════════════════════════
//  MATCH ENGINE — 7 Layers (Bulletproof)
//  L1: Deal-breakers (auto-reject)
//  L2: Per-client weights (customizable)
//  L3: Detailed scoring
//  L4: Smart filters
//  L5: Feedback loop (learns from rejections)
//  L6: Manual verification (1-min review)
//  L7: Pre-shortlist checklist (10 checks)
// ═══════════════════════════════════════════════════════════

const Match = (function () {
  'use strict';

  const DEFAULT_WEIGHTS = {
    jobProfile:    30,
    experience:    20,
    qualification: 15,
    salary:        15,
    location:      10,
    skills:        10
  };

  // ─────────────── LAYER 1 — DEAL-BREAKERS ───────────────
  function applyDealBreakers(candidate, requirement) {
    const reasons = [];

    // Location mismatch (city groups)
    if (requirement.location && candidate.city) {
      if (!locationMatches(candidate.city, requirement.location)) {
        reasons.push(`Location mismatch: ${candidate.city} vs ${requirement.location}`);
      }
    }

    // Experience below min
    const minExp = Number(requirement.minExperienceYears || 0);
    const candExp = Number(candidate.experienceYears || 0);
    if (minExp && candExp < minExp) {
      reasons.push(`Experience ${candExp}y < min ${minExp}y`);
    }

    // Qualification missing
    if (requirement.qualification && candidate.qualification) {
      if (!qualificationMatches(candidate.qualification, requirement.qualification)) {
        reasons.push(`Qualification mismatch`);
      }
    }

    // Salary >40% above max
    const maxSal = Number(requirement.maxSalary || 0);
    const expected = Number(candidate.expectedSalary || 0);
    if (maxSal && expected > maxSal * 1.4) {
      reasons.push(`Expected ₹${expected} exceeds ₹${maxSal} by >40%`);
    }

    // Blacklisted
    if (candidate.blacklisted) reasons.push('Blacklisted candidate');

    return { blocked: reasons.length > 0, reasons };
  }

  // ─────────────── LAYER 2 — WEIGHTS ───────────────
  function resolveWeights(requirement) {
    return { ...DEFAULT_WEIGHTS, ...(requirement.matchWeights || {}) };
  }

  // ─────────────── LAYER 3 — DETAILED SCORING ───────────────
  function scoreCandidate(candidate, requirement, weights = DEFAULT_WEIGHTS) {
    const parts = {};

    // Job Profile (family + level)
    parts.jobProfile = scoreJobProfile(candidate.jobProfile, requirement.jobProfile);

    // Experience (range + relevance)
    parts.experience = scoreExperience(
      candidate.experienceYears,
      requirement.minExperienceYears,
      requirement.maxExperienceYears
    );

    // Qualification (hierarchy)
    parts.qualification = scoreQualification(candidate.qualification, requirement.qualification);

    // Salary (range + negotiable)
    parts.salary = scoreSalary(
      candidate.expectedSalary,
      requirement.minSalary,
      requirement.maxSalary
    );

    // Location (city groups)
    parts.location = scoreLocation(candidate.city, requirement.location);

    // Skills (synonym mapping)
    parts.skills = scoreSkills(candidate.skills, requirement.skills);

    // Weighted total (0-100)
    const total = Object.entries(parts).reduce((sum, [k, v]) => {
      return sum + (v * (weights[k] || 0)) / 100;
    }, 0);

    return { parts, total: Math.round(total), weights };
  }

  // ─────────────── SCORING HELPERS ───────────────
  function scoreJobProfile(a, b) {
    if (!a || !b) return 50;
    const na = Utils.normalizeName(a);
    const nb = Utils.normalizeName(b);
    if (na === nb) return 100;
    if (na.includes(nb) || nb.includes(na)) return 80;
    // Family match (first token)
    const [fa] = na.split(' ');
    const [fb] = nb.split(' ');
    if (fa && fb && fa === fb) return 70;
    return 20;
  }

  function scoreExperience(years, min, max) {
    const y = Number(years || 0);
    const lo = Number(min || 0);
    const hi = Number(max || Infinity);
    if (y < lo) return Math.max(0, 40 - (lo - y) * 10);
    if (y > hi) return Math.max(0, 60 - (y - hi) * 5);
    // In range — higher = better up to a point
    if (hi === Infinity) return 90;
    const span = hi - lo || 1;
    return 70 + Math.min(30, ((y - lo) / span) * 30);
  }

  function scoreQualification(a, b) {
    if (!a || !b) return 50;
    const levels = ['10th','12th','diploma','iti','graduate','bachelor','b.tech','b.e','b.sc','b.com','ba',
                    'postgraduate','master','m.tech','mba','m.sc','m.com','phd','doctorate'];
    const la = levels.indexOf(String(a).toLowerCase());
    const lb = levels.indexOf(String(b).toLowerCase());
    if (la < 0 || lb < 0) return 50;
    const diff = Math.abs(la - lb);
    if (diff === 0) return 100;
    if (diff === 1) return 85;
    if (diff === 2) return 65;
    return 40;
  }

  function scoreSalary(expected, min, max) {
    const e = Number(expected || 0);
    const lo = Number(min || 0);
    const hi = Number(max || Infinity);
    if (!e) return 50;
    if (e >= lo && e <= hi) {
      const span = hi - lo || 1;
      const mid = lo + span / 2;
      return 100 - Math.min(30, (Math.abs(e - mid) / span) * 60);
    }
    if (e < lo) return 80;
    if (e > hi) {
      const over = (e - hi) / (hi || 1);
      return Math.max(0, 50 - over * 100);
    }
    return 50;
  }

  const CITY_GROUPS = {
    mumbai:   ['mumbai','thane','navi mumbai','vasai','virar','kalyan'],
    pune:     ['pune','pimpri','chinchwad','hinjewadi'],
    delhi:    ['delhi','new delhi','noida','gurgaon','gurugram','ghaziabad','faridabad'],
    bengaluru:['bengaluru','bangalore','whitefield','electronic city'],
    hyderabad:['hyderabad','secunderabad','gachibowli'],
    chennai:  ['chennai','omr','tambaram'],
    kolkata:  ['kolkata','howrah','salt lake'],
    ahmedabad:['ahmedabad','gandhinagar']
  };

  function scoreLocation(a, b) {
    if (!a || !b) return 50;
    const na = Utils.normalizeName(a);
    const nb = Utils.normalizeName(b);
    if (na === nb) return 100;
    for (const group of Object.values(CITY_GROUPS)) {
      if (group.includes(na) && group.includes(nb)) return 90;
    }
    return 30;
  }

  function locationMatches(city, required) {
    if (!city || !required) return true;
    const c = Utils.normalizeName(city);
    const r = Utils.normalizeName(required);
    if (c === r) return true;
    for (const group of Object.values(CITY_GROUPS)) {
      if (group.includes(c) && group.includes(r)) return true;
    }
    // Also allow if required lists multiple locations
    if (r.includes(',') || r.includes('/')) {
      return r.split(/[,\/]/).map(s => s.trim()).some(x => locationMatches(city, x));
    }
    return false;
  }

  function qualificationMatches(have, need) {
    if (!need) return true;
    return scoreQualification(have, need) >= 65;
  }

  // Skills synonyms (basic)
  const SKILL_SYNONYMS = {
    'driving':       ['driver','lmv','hmv','heavy','lmv driving','hmv driving'],
    'cooking':       ['cook','chef','kitchen'],
    'security':      ['guard','security guard','watchman'],
    'housekeeping':  ['cleaner','cleaning','house keeping','hk'],
    'welding':       ['welder','arc welding','mig welding'],
    'plumbing':      ['plumber','pipe fitting'],
    'electrical':    ['electrician','wireman'],
    'sales':         ['salesman','sales executive','field sales'],
    'billing':       ['cashier','billing executive'],
    'data entry':    ['typist','data operator'],
    'packing':       ['packer','packaging'],
    'loading':       ['loader','loader-unloader'],
    'fabrication':   ['fitter','fitment'],
    'tailoring':     ['tailor','stitching']
  };

  function expandSkill(s) {
    const key = String(s).toLowerCase().trim();
    for (const [base, syns] of Object.entries(SKILL_SYNONYMS)) {
      if (base === key || syns.includes(key)) return base;
    }
    return key;
  }

  function scoreSkills(candSkills, reqSkills) {
    const cs = Array.isArray(candSkills) ? candSkills.map(expandSkill) : [];
    const rs = Array.isArray(reqSkills) ? reqSkills.map(expandSkill) : [];
    if (!rs.length) return 70;
    if (!cs.length) return 30;
    const matched = rs.filter(s => cs.includes(s)).length;
    return Math.round((matched / rs.length) * 100);
  }

  // ─────────────── LAYER 4 — SMART FILTERS ───────────────
  function applySmartFilters(candidate, requirement, opts = {}) {
    const filters = {
      noticePeriod: opts.maxNoticeDays ? Number(candidate.noticePeriod || 0) <= Number(opts.maxNoticeDays) : true,
      industry:     opts.industry ? (candidate.industry === opts.industry) : true,
      stability:    opts.minStabilityMonths ? (Number(candidate.lastJobMonths || 0) >= Number(opts.minStabilityMonths)) : true,
      education:    opts.education ? qualificationMatches(candidate.qualification, opts.education) : true
    };
    const passed = Object.values(filters).every(Boolean);
    return { passed, filters };
  }

  // ─────────────── LAYER 5 — FEEDBACK LOOP ───────────────
  // Store rejections → adjust future scoring. Simple: track reject reason stats.
  async function recordFeedback(candidateId, requirementId, action, reason = '') {
    try {
      await DB.add('match_feedback', {
        candidateId,
        requirementId,
        action,
        reason,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  async function feedbackAdjustment(requirementId) {
    try {
      const rows = await DB.list('match_feedback', {
        where: [['requirementId', '==', requirementId]],
        limit: 200
      });
      const stats = {};
      for (const r of rows) {
        if (r.action !== 'rejected') continue;
        const key = (r.reason || 'other').toLowerCase();
        stats[key] = (stats[key] || 0) + 1;
      }
      return stats;
    } catch (_) { return {}; }
  }

  // ─────────────── LAYER 6 — MANUAL VERIFICATION ───────────────
  // Structure for employee review session
  function createReviewSession(shortlist) {
    return {
      createdAt: new Date().toISOString(),
      total: shortlist.length,
      selected: shortlist.map(s => ({ ...s, reviewed: false, keep: true })),
      meta: { verifiedBy: STATE.user?.uid || null }
    };
  }

  // ─────────────── LAYER 7 — PRE-SHORTLIST CHECKLIST ───────────────
  const PRE_SHORTLIST_CHECKS = [
    { key: 'phoneValid',       label: 'Phone valid & reachable' },
    { key: 'emailValid',       label: 'Email valid' },
    { key: 'scoreAbove60',     label: 'Candidate score ≥ 60' },
    { key: 'notLocked',        label: 'Not locked to another company' },
    { key: 'notOnHold',        label: 'Not on hold elsewhere' },
    { key: 'notBlacklisted',   label: 'Not blacklisted' },
    { key: 'resumeUploaded',   label: 'Resume uploaded' },
    { key: 'locationMatch',    label: 'Location acceptable' },
    { key: 'experienceOk',     label: 'Experience meets requirement' },
    { key: 'salaryWithinBand', label: 'Expected salary within band' }
  ];

  function runPreShortlistChecklist(candidate, requirement) {
    const results = {};
    results.phoneValid = Utils.isPhone(candidate.phone);
    results.emailValid = !candidate.email || Utils.isEmail(candidate.email);
    results.scoreAbove60 = Number(candidate.score || 0) >= 60;
    results.notLocked = !candidate.lockedToCompanyId;
    results.notOnHold = !candidate.onHold;
    results.notBlacklisted = !candidate.blacklisted;
    results.resumeUploaded = !!candidate.resumeUrl;
    results.locationMatch = locationMatches(candidate.city, requirement.location);
    results.experienceOk = Number(candidate.experienceYears || 0) >= Number(requirement.minExperienceYears || 0);
    results.salaryWithinBand = (() => {
      const e = Number(candidate.expectedSalary || 0);
      const max = Number(requirement.maxSalary || Infinity);
      if (!max || max === Infinity) return true;
      return e <= max * 1.4;
    })();

    const allPassed = Object.values(results).every(Boolean);
    const failures = PRE_SHORTLIST_CHECKS
      .filter(c => !results[c.key])
      .map(c => c.label);
    return { results, allPassed, failures, checks: PRE_SHORTLIST_CHECKS };
  }

  // ─────────────── AUTO-MATCH FLOW ───────────────
  // Trigger: manual "Find Matches". Source: common pool only.
  async function findMatches(requirement, opts = {}) {
    const weights = resolveWeights(requirement);
    const autoShortlistCount = opts.autoShortlistCount ||
      Config.get('workflow.autoShortlistCount', 20);
    const maxPool = opts.maxPool || 500;

    // Fetch common pool
    const pool = opts.candidates || await Candidates.commonPool(maxPool);

    // L1: Deal-breakers
    const survivors = [];
    const rejected = [];
    for (const c of pool) {
      const db = applyDealBreakers(c, requirement);
      if (db.blocked) { rejected.push({ candidate: c, reasons: db.reasons }); continue; }
      survivors.push(c);
    }

    // L4: Smart filters (optional)
    const filtered = survivors.filter(c => {
      const f = applySmartFilters(c, requirement, opts.smartFilters || {});
      return f.passed;
    });

    // L3: Score + sort
    const scored = filtered.map(c => {
      const s = scoreCandidate(c, requirement, weights);
      return { candidate: c, score: s.total, parts: s.parts };
    }).sort((a, b) => b.score - a.score);

    // L7: Pre-shortlist check (informational)
    for (const item of scored) {
      item.checklist = runPreShortlistChecklist(item.candidate, requirement);
    }

    // Top N
    const shortlist = scored.slice(0, autoShortlistCount);

    // L6: Build review session
    const session = createReviewSession(shortlist);
    session.weights = weights;
    session.autoShortlistCount = autoShortlistCount;
    session.totalInPool = pool.length;
    session.totalAfterDealBreakers = survivors.length;
    session.totalAfterFilters = filtered.length;

    // Low pool warning
    const lowPool = filtered.length < autoShortlistCount;

    return {
      session,
      shortlist,
      rejected,
      lowPool,
      stats: {
        pool: pool.length,
        dealBreakerRejected: rejected.length,
        afterDealBreakers: survivors.length,
        afterFilters: filtered.length,
        shortlisted: shortlist.length
      }
    };
  }

  // ─────────────── SEND TO CLIENT (locks candidates) ───────────────
  async function sendToClient(requirement, candidateIds, opts = {}) {
    if (!requirement || !requirement.companyId) throw new Error('Requirement with companyId required');
    if (!Array.isArray(candidateIds) || !candidateIds.length) {
      throw new Error('At least one candidate required');
    }

    const ops = [];
    for (const cid of candidateIds) {
      ops.push({
        type: 'update',
        path: `${CONST.COLLECTIONS.CANDIDATES}/${cid}`,
        data: {
          stage: 'SUBMITTED',
          lockedToCompanyId: requirement.companyId,
          submittedToRequirementId: requirement.id,
          submittedAt: DB.ts(),
          submittedBy: STATE.user?.uid || null,
          poolEligible: false,
          onHold: false
        }
      });
      await recordFeedback(cid, requirement.id, 'submitted');
    }
    if (ops.length) await DB.batch(ops);

    // Update requirement status → SHORTLISTED
    try {
      await DB.update(`${CONST.COLLECTIONS.REQUIREMENTS}/${requirement.id}`, {
        status: 'SHORTLISTED',
        shortlistedAt: DB.ts(),
        shortlistedBy: STATE.user?.uid || null,
        shortlistedCount: candidateIds.length
      });
    } catch (_) {}

    return { submitted: candidateIds.length };
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    // Layers
    applyDealBreakers,
    resolveWeights,
    scoreCandidate,
    applySmartFilters,
    recordFeedback, feedbackAdjustment,
    createReviewSession,
    runPreShortlistChecklist,
    // Helpers
    locationMatches, qualificationMatches,
    expandSkill, scoreSkills,
    // Flow
    findMatches, sendToClient,
    // Constants
    DEFAULT_WEIGHTS, PRE_SHORTLIST_CHECKS, CITY_GROUPS
  };
})();

    // ═══════════════════════════════════════════════════════════
//  ATTENDANCE SERVICE
//  6 statuses: P (present) / H (half) / A (absent) /
//              L (leave) / WO (week off) / HO (holiday)
//  24hr edit window. Reason compulsory for edits.
//  Auto-sync: Supervisor → Firestore → CRM (< 1 sec)
//  Offline: writes queue, auto-sync on reconnect.
// ═══════════════════════════════════════════════════════════

const Attendance = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.ATTENDANCE;
  const STATUS = CONST.ATTENDANCE_STATUS;
  const EDIT_WINDOW_HOURS = 24;

  // Date key: YYYY-MM-DD (IST-safe)
  function dateKey(d = new Date()) {
    const ist = new Date(d.getTime() + (330 + d.getTimezoneOffset()) * 60000);
    return ist.toISOString().slice(0, 10);
  }

  function monthKey(d = new Date()) {
    return dateKey(d).slice(0, 7); // YYYY-MM
  }

  // ─────────────── MARK / UPSERT ───────────────
  // attendanceId = `${contractStaffId}_${dateKey}`
  async function mark(data, opts = {}) {
    const payload = normalizeMark(data);
    validateMark(payload);

    const docId = payload.contractStaffId + '_' + payload.date;
    const existing = await DB.get(`${COL}/${docId}`);

    if (existing) {
      // Edit within window?
      if (!opts.force && !isWithinEditWindow(existing.markedAt)) {
        throw new Error('Edit window (24h) has passed. Contact admin to unlock.');
      }
      if (!payload.editReason && !opts.force) {
        throw new Error('Reason required for edits');
      }
      payload.editHistory = DB.arrayUnion({
        prevStatus: existing.status,
        prevMarkedAt: existing.markedAt,
        editedAt: new Date().toISOString(),
        by: STATE.user?.uid || null,
        reason: payload.editReason || ''
      });
    } else {
      payload.markedAt = new Date().toISOString();
      payload.markedBy = STATE.user?.uid || null;
    }

    await DB.set(`${COL}/${docId}`, payload, true);
    await logActivity(docId, existing ? 'attendance:edited' : 'attendance:marked', {
      status: payload.status, contractStaffId: payload.contractStaffId
    });

    return docId;
  }

  function isWithinEditWindow(markedAtIso) {
    if (!markedAtIso) return true;
    const t = new Date(markedAtIso).getTime();
    return Date.now() - t <= EDIT_WINDOW_HOURS * 3600000;
  }

  // Unlock by admin (bypass window)
  async function unlockAndMark(data, reason) {
    if (!reason || reason.trim().length < 3) throw new Error('Reason required');
    return mark({ ...data, editReason: reason }, { force: true });
  }

  // ─────────────── BULK MARK (roster day) ───────────────
  // Marks multiple staff for one date in atomic batch
  async function bulkMark(date, entries, opts = {}) {
    if (!Array.isArray(entries) || !entries.length) throw new Error('No entries');
    const dk = dateKey(new Date(date));
    const ops = [];
    for (const e of entries) {
      const docId = e.contractStaffId + '_' + dk;
      ops.push({
        type: 'set',
        path: `${COL}/${docId}`,
        data: {
          contractStaffId: e.contractStaffId,
          candidateId: e.candidateId || null,
          candidateName: e.candidateName || null,
          companyId: e.companyId || null,
          site: e.site || null,
          supervisorId: e.supervisorId || STATE.user?.uid || null,
          date: dk,
          monthKey: dk.slice(0, 7),
          status: e.status,
          reason: e.reason || null,
          markedAt: new Date().toISOString(),
          markedBy: STATE.user?.uid || null
        },
        merge: true
      });
    }
    await DB.batch(ops);
    await logActivity('bulk:' + dk, 'attendance:bulk-marked', { count: entries.length });
    return entries.length;
  }

  // ─────────────── READ ───────────────
  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function getByDate(contractStaffId, date) {
    const dk = typeof date === 'string' ? date : dateKey(date);
    return DB.get(`${COL}/${contractStaffId}_${dk}`);
  }

  async function listByStaff(contractStaffId, opts = {}) {
    const where = [['contractStaffId', '==', contractStaffId]];
    if (opts.month) where.push(['monthKey', '==', opts.month]);
    return DB.list(COL, {
      where,
      orderBy: ['date', 'desc'],
      limit: opts.limit || 100
    });
  }

  async function listByCompanyMonth(companyId, month, opts = {}) {
    return DB.list(COL, {
      where: [
        ['companyId', '==', companyId],
        ['monthKey', '==', month]
      ],
      orderBy: ['date', 'desc'],
      limit: opts.limit || 2000
    });
  }

  async function listByDate(companyId, date, opts = {}) {
    const dk = typeof date === 'string' ? date : dateKey(date);
    return DB.list(COL, {
      where: [
        ['companyId', '==', companyId],
        ['date', '==', dk]
      ],
      limit: opts.limit || 1000
    });
  }

  // ─────────────── MONTHLY SUMMARY ───────────────
  // Returns per-day status map + totals per code.
  async function monthlySummary(contractStaffId, month) {
    const rows = await listByStaff(contractStaffId, { month });
    const totals = { P: 0, H: 0, A: 0, L: 0, WO: 0, HO: 0 };
    const byDate = {};
    for (const r of rows) {
      if (byDate[r.date]) continue; // latest wins (ordered desc)
      byDate[r.date] = r.status;
      if (r.status in totals) totals[r.status]++;
    }
    const billableDays = totals.P + (totals.H * 0.5) + totals.WO + totals.HO;
    return { month, totals, byDate, billableDays, recordCount: rows.length };
  }

  // ─────────────── COMPANY-WIDE SUMMARY ───────────────
  async function companyMonthSummary(companyId, month) {
    const rows = await listByCompanyMonth(companyId, month);
    const perStaff = {};
    for (const r of rows) {
      const sid = r.contractStaffId;
      if (!perStaff[sid]) {
        perStaff[sid] = {
          contractStaffId: sid,
          candidateId: r.candidateId,
          candidateName: r.candidateName,
          site: r.site,
          totals: { P: 0, H: 0, A: 0, L: 0, WO: 0, HO: 0 }
        };
      }
      if (perStaff[sid].totals[r.status] !== undefined) {
        perStaff[sid].totals[r.status]++;
      }
    }
    for (const s of Object.values(perStaff)) {
      s.billableDays = s.totals.P + (s.totals.H * 0.5) + s.totals.WO + s.totals.HO;
    }
    return { month, perStaff: Object.values(perStaff), totalRecords: rows.length };
  }

  // ─────────────── VALIDATION ───────────────
  function validateMark(data) {
    if (!data.contractStaffId) throw new Error('contractStaffId required');
    if (!data.date) throw new Error('date required (YYYY-MM-DD)');
    if (!data.status || !(data.status in STATUS)) {
      throw new Error('Invalid status. Use P/H/A/L/WO/HO.');
    }
  }

  function normalizeMark(data) {
    const out = {};
    const keep = ['contractStaffId','candidateId','candidateName','companyId',
                  'site','supervisorId','date','monthKey','status',
                  'reason','editReason','markedAt','markedBy'];
    for (const k of keep) {
      if (data[k] !== undefined) out[k] = data[k];
    }
    if (!out.date) out.date = dateKey();
    out.monthKey = out.monthKey || out.date.slice(0, 7);
    return out;
  }

  // ─────────────── ACTIVITY ───────────────
  async function logActivity(id, action, meta = {}) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'attendance',
        attendanceId: id,
        action,
        meta,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  // ─────────────── REALTIME ───────────────
  function watchByDate(companyId, date, cb) {
    const dk = typeof date === 'string' ? date : dateKey(date);
    return DB.watchList(COL, {
      where: [['companyId', '==', companyId], ['date', '==', dk]],
      limit: 1000
    }, cb);
  }

  function watchByCompanyMonth(companyId, month, cb) {
    return DB.watchList(COL, {
      where: [['companyId', '==', companyId], ['monthKey', '==', month]],
      limit: 2000
    }, cb);
  }

  // ─────────────── PUBLIC API ───────────────
  return {
    mark, bulkMark,
    unlockAndMark,
    getById, getByDate,
    listByStaff, listByCompanyMonth, listByDate,
    monthlySummary, companyMonthSummary,
    isWithinEditWindow,
    dateKey, monthKey,
    watchByDate, watchByCompanyMonth,
    STATUS, EDIT_WINDOW_HOURS
  };
})();

// ═══════════════════════════════════════════════════════════
//  PAYROLL SERVICE
//  Monthly salary sheet. Attendance-driven.
//  Per-day rate = Monthly / Working days.
//  Billable days from attendance (P+H*0.5+WO+HO).
// ═══════════════════════════════════════════════════════════

const Payroll = (function () {
  'use strict';

  const COL = 'payroll';

  // ─────────────── COMPUTE ───────────────
  // Per-staff payroll from attendance summary
  function computeStaffPayroll(staff, attendanceSummary) {
    const monthlyRate = Number(staff.monthlyRate || 0);
    const workingDays = Number(staff.workingDays || 26);
    const dailyRate = workingDays > 0 ? Math.round(monthlyRate / workingDays) : 0;
    const billableDays = Number(attendanceSummary.billableDays || 0);
    const gross = Math.round(dailyRate * billableDays);
    const otAmount = Math.round(Number(staff.otHours || 0) * (dailyRate / 8) * 1.5);
    const deductions = Number(staff.deductions || 0);
    const advance = Number(staff.advance || 0);
    const netPayable = Math.max(gross + otAmount - deductions - advance, 0);
    return {
      monthlyRate, workingDays, dailyRate, billableDays,
      gross, otAmount, deductions, advance,
      netPayable,
      totals: attendanceSummary.totals
    };
  }

  // ─────────────── CREATE / RUN ───────────────
  async function runForCompanyMonth(companyId, month, opts = {}) {
    if (!companyId || !month) throw new Error('companyId + month required');

    // Prevent duplicate run for same month (unless force)
    if (!opts.force) {
      const existing = await DB.list(COL, {
        where: [['companyId', '==', companyId], ['month', '==', month]],
        limit: 1
      });
      if (existing.length) throw new Error('Payroll already run for this month');
    }

    const staffList = await Contract.listActive(companyId);
    const entries = [];
    for (const staff of staffList) {
      const att = await Attendance.monthlySummary(staff.id, month);
      const pay = computeStaffPayroll(staff, att);
      entries.push({
        contractStaffId: staff.id,
        candidateId: staff.candidateId,
        candidateName: staff.candidateName,
        site: staff.site,
        position: staff.position,
        monthlyRate: pay.monthlyRate,
        workingDays: pay.workingDays,
        dailyRate: pay.dailyRate,
        billableDays: pay.billableDays,
        gross: pay.gross,
        otAmount: pay.otAmount,
        deductions: pay.deductions,
        advance: pay.advance,
        netPayable: pay.netPayable,
        totals: pay.totals
      });
    }

    const payrollDoc = {
      companyId,
      month,
      generatedAt: new Date().toISOString(),
      generatedBy: STATE.user?.uid || null,
      entries,
      summary: {
        staffCount: entries.length,
        totalGross: entries.reduce((s, e) => s + e.gross, 0),
        totalNet:   entries.reduce((s, e) => s + e.netPayable, 0)
      }
    };

    const id = await DB.add(COL, payrollDoc);
    await logActivity(id, 'payroll:run', { companyId, month, staffCount: entries.length });
    return id;
  }

  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function list(filters = {}) {
    const opts = { orderBy: ['generatedAt', 'desc'] };
    const where = [];
    if (filters.companyId) where.push(['companyId', '==', filters.companyId]);
    if (filters.month) where.push(['month', '==', filters.month]);
    if (where.length) opts.where = where;
    if (filters.limit) opts.limit = filters.limit;
    return DB.list(COL, opts);
  }

  async function latestForCompany(companyId) {
    const rows = await list({ companyId, limit: 1 });
    return rows[0] || null;
  }

  async function markPaid(id, meta = {}) {
    await DB.update(`${COL}/${id}`, {
      paidStatus: 'PAID',
      paidAt: DB.ts(),
      paidBy: STATE.user?.uid || null,
      paidNote: meta.note || null,
      paidReference: meta.reference || null
    });
    await logActivity(id, 'payroll:paid', meta);
  }

  async function markProcessing(id, note = '') {
    await DB.update(`${COL}/${id}`, {
      paidStatus: 'PROCESSING',
      processingStartedAt: DB.ts(),
      processingNote: note
    });
    await logActivity(id, 'payroll:processing');
  }

  async function cancel(id, reason = '') {
    await DB.update(`${COL}/${id}`, {
      paidStatus: 'CANCELLED',
      cancelReason: reason,
      cancelledAt: DB.ts(),
      cancelledBy: STATE.user?.uid || null
    });
    await logActivity(id, 'payroll:cancelled', { reason });
  }

  // ─────────────── DELETE ───────────────
  async function softDelete(id) {
    await DB.softDelete(`${COL}/${id}`, STATE.user?.uid || null);
    await logActivity(id, 'payroll:soft-deleted');
  }

  // ─────────────── ACTIVITY ───────────────
  async function logActivity(id, action, meta = {}) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'payroll',
        payrollId: id,
        action,
        meta,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  return {
    computeStaffPayroll,
    runForCompanyMonth,
    getById, list, latestForCompany,
    markPaid, markProcessing, cancel,
    softDelete
  };
})();

    // ═══════════════════════════════════════════════════════════
//  NOTIFICATIONS SERVICE
//  Channels: in-app (unlimited) | email (Brevo) | emailjs (auth)
//  Priority: critical / high / medium / low
// ═══════════════════════════════════════════════════════════

const Notifications = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.NOTIFICATIONS;
  const PRIORITY = CONST.NOTIFICATION_PRIORITY;

  const DEFAULT_ROUTING = {
    'interview.scheduled':  { roles: ['ADMIN','MANAGER','EMPLOYEE'], priority: 'high',  channels: ['inapp','email'] },
    'interview.confirmed':  { roles: ['ADMIN','MANAGER','EMPLOYEE'], priority: 'high',  channels: ['inapp'] },
    'candidate.selected':   { roles: ['ADMIN','MANAGER','EMPLOYEE'], priority: 'high',  channels: ['inapp','email'] },
    'candidate.placed':     { roles: ['ADMIN','MANAGER'],            priority: 'critical', channels: ['inapp','email'] },
    'candidate.rejected':   { roles: ['ADMIN','MANAGER','EMPLOYEE'], priority: 'medium', channels: ['inapp','email'] },
    'invoice.overdue':      { roles: ['ADMIN','MANAGER'],            priority: 'high',  channels: ['inapp','email'] },
    'payment.received':     { roles: ['ADMIN','MANAGER'],            priority: 'medium', channels: ['inapp'] },
    'contract.expiring':    { roles: ['ADMIN','MANAGER'],            priority: 'high',  channels: ['inapp','email'] },
    'task.assigned':        { roles: ['*'],                          priority: 'medium', channels: ['inapp'] },
    'task.due':             { roles: ['*'],                          priority: 'high',  channels: ['inapp'] },
    'chat.message':         { roles: ['*'],                          priority: 'medium', channels: ['inapp'] },
    'system':               { roles: ['*'],                          priority: 'low',    channels: ['inapp'] }
  };

  // ─────────────── CREATE ───────────────
  async function notify(opts = {}) {
    const cfg = DEFAULT_ROUTING[opts.type] || {};
    const priority = opts.priority || cfg.priority || 'low';
    const channels = opts.channels || cfg.channels || ['inapp'];
    const payload = {
      userId: opts.userId || null,
      title: opts.title || '',
      message: opts.message || '',
      type: opts.type || 'system',
      priority,
      channels,
      read: false,
      dismissed: false,
      data: opts.data || null,
      createdAt: DB.ts(),
      createdBy: STATE.user?.uid || null
    };

    if (!opts.force && shouldQuiet(priority)) {
      payload.queuedUntil = nextQuietEnd();
    }

    const id = await DB.add(COL, payload);

    if (!opts.userId && cfg.roles && cfg.roles.length) {
      await fanoutToRoles(id, payload, cfg.roles);
    }

    if (channels.includes('inapp') && typeof STATE !== 'undefined') {
      STATE.unreadNotifications = (STATE.unreadNotifications || 0) + 1;
      try { window.dispatchEvent(new CustomEvent('7h:notif-new', { detail: payload })); } catch (_) {}
    }

    if (channels.includes('email') && typeof Worker !== 'undefined' && Worker.sendEmail) {
      try { await Worker.sendEmail({ toUserId: opts.userId, template: opts.type, vars: payload }); }
      catch (_) {}
    }
    return id;
  }

  async function fanoutToRoles(parentId, basePayload, roles) {
    try {
      const users = await DB.list(CONST.COLLECTIONS.USERS, {
        where: [['status', '==', 'active']],
        limit: 500
      });
      const targets = users.filter(u => {
        const userRoles = u.roles || [u.primaryRole];
        return roles.includes('*') || userRoles.some(r => roles.includes(r));
      });
      for (const t of targets) {
        await DB.add(COL, { ...basePayload, userId: t.id, parentId });
      }
    } catch (e) {
      console.warn('[Notifications.fanout]', e.message);
    }
  }

  function shouldQuiet(priority) {
    if (priority === 'critical' || priority === 'high') return false;
    const now = new Date();
    const ist = new Date(now.getTime() + (330 + now.getTimezoneOffset()) * 60000);
    const h = ist.getHours();
    return h >= 22 || h < 8;
  }

  function nextQuietEnd() {
    const now = new Date();
    const ist = new Date(now.getTime() + (330 + now.getTimezoneOffset()) * 60000);
    ist.setHours(8, 0, 0, 0);
    if (ist.getTime() <= now.getTime()) ist.setDate(ist.getDate() + 1);
    return ist.toISOString();
  }

  // ─────────────── READ ───────────────
  async function listForUser(userId, opts = {}) {
    const uid = userId || STATE.user?.uid;
    if (!uid) return [];
    const where = [['userId', '==', uid], ['dismissed', '==', false]];
    if (opts.unreadOnly) where.push(['read', '==', false]);
    return DB.list(COL, {
      where,
      orderBy: ['createdAt', 'desc'],
      limit: opts.limit || 50
    });
  }

  async function unreadCount(userId) {
    const uid = userId || STATE.user?.uid;
    if (!uid) return 0;
    const rows = await DB.list(COL, {
      where: [['userId', '==', uid], ['read', '==', false], ['dismissed', '==', false]],
      limit: 100
    });
    return rows.length;
  }

  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  // ─────────────── MARK ───────────────
  async function markRead(id) {
    await DB.update(`${COL}/${id}`, { read: true, readAt: DB.ts() });
  }

  async function markAllRead(userId) {
    const uid = userId || STATE.user?.uid;
    if (!uid) return 0;
    const rows = await DB.list(COL, {
      where: [['userId', '==', uid], ['read', '==', false]],
      limit: 200
    });
    for (const r of rows) await DB.update(`${COL}/${r.id}`, { read: true, readAt: DB.ts() });
    STATE.unreadNotifications = 0;
    return rows.length;
  }

  async function dismiss(id) {
    await DB.update(`${COL}/${id}`, { dismissed: true, dismissedAt: DB.ts() });
  }

  // ─────────────── PREFS ───────────────
  async function savePrefs(userId, prefs) {
    const uid = userId || STATE.user?.uid;
    if (!uid) throw new Error('userId required');
    await DB.update(`${CONST.COLLECTIONS.USERS}/${uid}`, {
      'preferences.notifications': prefs
    });
  }

  async function getPrefs(userId) {
    const uid = userId || STATE.user?.uid;
    if (!uid) return null;
    const u = await DB.get(`${CONST.COLLECTIONS.USERS}/${uid}`);
    return u?.preferences?.notifications || null;
  }

  // ─────────────── REALTIME ───────────────
  function watchForUser(userId, cb, limit = 30) {
    const uid = userId || STATE.user?.uid;
    if (!uid) return () => {};
    return DB.watchList(COL, {
      where: [['userId', '==', uid], ['dismissed', '==', false]],
      orderBy: ['createdAt', 'desc'],
      limit
    }, (rows) => {
      STATE.unreadNotifications = rows.filter(r => !r.read).length;
      if (typeof cb === 'function') cb(rows);
    });
  }

  return {
    notify,
    listForUser, unreadCount, getById,
    markRead, markAllRead, dismiss,
    getPrefs, savePrefs,
    watchForUser,
    DEFAULT_ROUTING, PRIORITY
  };
})();

// ═══════════════════════════════════════════════════════════
//  CHAT SERVICE
//  Internal only. 1-to-1 + group (max 20). Text only.
// ═══════════════════════════════════════════════════════════

const Chat = (function () {
  'use strict';

  const CHATS = CONST.COLLECTIONS.CHATS;
  const MESSAGES = CONST.COLLECTIONS.MESSAGES;

  async function createChat(data) {
    const payload = {
      type: data.type || 'direct',
      name: data.name || null,
      members: Array.isArray(data.members) ? [...new Set(data.members)] : [],
      memberNames: data.memberNames || {},
      createdBy: STATE.user?.uid || null,
      lastMessage: null,
      lastMessageAt: null,
      unreadBy: {},
      createdAt: DB.ts(),
      updatedAt: DB.ts()
    };
    if (!payload.members.includes(STATE.user?.uid)) {
      payload.members.push(STATE.user?.uid);
    }
    if (payload.type === 'group' && payload.members.length > 20) {
      throw new Error('Group max 20 members');
    }
    if (payload.type === 'direct' && payload.members.length !== 2) {
      throw new Error('Direct chat needs exactly 2 members');
    }
    return DB.add(CHATS, payload);
  }

  async function findDirectChat(userA, userB) {
    const rows = await DB.list(CHATS, {
      where: [['type', '==', 'direct'], ['members', 'array-contains', userA]],
      limit: 50
    });
    return rows.find(c => (c.members || []).includes(userB)) || null;
  }

  async function getOrCreateDirect(userB) {
    const uid = STATE.user?.uid;
    if (!uid) throw new Error('Login required');
    if (uid === userB) throw new Error('Cannot chat with yourself');
    const existing = await findDirectChat(uid, userB);
    if (existing) return existing.id;
    return createChat({ type: 'direct', members: [uid, userB] });
  }

  async function listMine(opts = {}) {
    const uid = STATE.user?.uid;
    if (!uid) return [];
    return DB.list(CHATS, {
      where: [['members', 'array-contains', uid]],
      orderBy: ['updatedAt', 'desc'],
      limit: opts.limit || 50
    });
  }

  async function getById(id) {
    if (!id) return null;
    return DB.get(`${CHATS}/${id}`);
  }

  async function sendMessage(data) {
    if (!data.chatId) throw new Error('chatId required');
    const text = String(data.text || '').trim();
    if (!text && !data.task) throw new Error('Text or task required');
    if (text.length > 2000) throw new Error('Message too long');

    const msg = {
      chatId: data.chatId,
      senderId: STATE.user?.uid || null,
      senderName: data.senderName || STATE.profile?.name || null,
      text,
      type: data.task ? 'task' : 'text',
      task: data.task || null,
      deleted: false,
      createdAt: DB.ts(),
      seenBy: []
    };
    const id = await DB.add(MESSAGES, msg);

    try {
      const chat = await getById(data.chatId);
      const unreadBy = { ...(chat?.unreadBy || {}) };
      for (const m of (chat?.members || [])) {
        if (m === STATE.user?.uid) { unreadBy[m] = 0; continue; }
        unreadBy[m] = (unreadBy[m] || 0) + 1;
      }
      await DB.update(`${CHATS}/${data.chatId}`, {
        lastMessage: { text: text.slice(0, 100), task: !!data.task, senderId: STATE.user?.uid },
        lastMessageAt: DB.ts(),
        unreadBy
      });
    } catch (_) {}

    return id;
  }

  async function listMessages(chatId, opts = {}) {
    if (!chatId) return [];
    return DB.list(MESSAGES, {
      where: [['chatId', '==', chatId]],
      orderBy: ['createdAt', 'asc'],
      limit: opts.limit || 100
    });
  }

  async function markSeen(chatId, userId) {
    const uid = userId || STATE.user?.uid;
    if (!chatId || !uid) return;
    const msgs = await DB.list(MESSAGES, {
      where: [['chatId', '==', chatId]],
      orderBy: ['createdAt', 'desc'],
      limit: 50
    });
    for (const m of msgs) {
      if (m.senderId === uid) continue;
      if (Array.isArray(m.seenBy) && m.seenBy.includes(uid)) continue;
      await DB.update(`${MESSAGES}/${m.id}`, {
        seenBy: DB.arrayUnion(uid),
        seenAt: DB.ts()
      });
    }
    try {
      const chat = await getById(chatId);
      const unreadBy = { ...(chat?.unreadBy || {}) };
      unreadBy[uid] = 0;
      await DB.update(`${CHATS}/${chatId}`, { unreadBy });
    } catch (_) {}
  }

  async function deleteMessage(messageId) {
    const m = await DB.get(`${MESSAGES}/${messageId}`);
    if (!m) return;
    if (m.senderId !== STATE.user?.uid) throw new Error('Only sender can delete');
    await DB.update(`${MESSAGES}/${messageId}`, {
      deleted: true, text: '', deletedAt: DB.ts()
    });
  }

  async function addMember(chatId, userId) {
    const chat = await getById(chatId);
    if (!chat || chat.type !== 'group') throw new Error('Not a group chat');
    if ((chat.members || []).length >= 20) throw new Error('Group full (20 max)');
    await DB.update(`${CHATS}/${chatId}`, { members: DB.arrayUnion(userId) });
  }

  async function removeMember(chatId, userId) {
    await DB.update(`${CHATS}/${chatId}`, { members: DB.arrayRemove(userId) });
  }

  async function renameGroup(chatId, name) {
    await DB.update(`${CHATS}/${chatId}`, { name });
  }

  async function setTyping(chatId, isTyping) {
    const uid = STATE.user?.uid;
    if (!chatId || !uid) return;
    const id = `${chatId}_${uid}`;
    try {
      await DB.set(`chat_typing/${id}`, {
        chatId, userId: uid, at: DB.ts(), typing: !!isTyping
      }, true);
    } catch (_) {}
  }

  async function search(term, opts = {}) {
    const uid = STATE.user?.uid;
    if (!uid || !term) return { messages: [], tasks: [] };
    const t = String(term).toLowerCase();
    const myChats = await listMine({ limit: 100 });
    const chatIds = myChats.map(c => c.id);
    const messages = [];
    const tasks = [];
    for (const cid of chatIds.slice(0, 30)) {
      const msgs = await DB.list(MESSAGES, {
        where: [['chatId', '==', cid]],
        orderBy: ['createdAt', 'desc'],
        limit: 50
      });
      for (const m of msgs) {
        if ((m.text || '').toLowerCase().includes(t)) messages.push(m);
        if (m.type === 'task' && m.task && (m.task.title || '').toLowerCase().includes(t)) {
          tasks.push({ ...m.task, messageId: m.id, chatId: m.chatId });
        }
      }
    }
    return {
      messages: messages.slice(0, 50),
      tasks: tasks.slice(0, 50)
    };
  }

  function watchChat(chatId, cb) {
    return DB.watch(`${CHATS}/${chatId}`, cb);
  }

  function watchMessages(chatId, cb, limit = 100) {
    return DB.watchList(MESSAGES, {
      where: [['chatId', '==', chatId]],
      orderBy: ['createdAt', 'asc'],
      limit
    }, cb);
  }

  function watchMine(cb, limit = 50) {
    const uid = STATE.user?.uid;
    if (!uid) return () => {};
    return DB.watchList(CHATS, {
      where: [['members', 'array-contains', uid]],
      orderBy: ['updatedAt', 'desc'],
      limit
    }, cb);
  }

  return {
    createChat, findDirectChat, getOrCreateDirect,
    listMine, getById,
    sendMessage, listMessages, markSeen, deleteMessage,
    addMember, removeMember, renameGroup,
    setTyping,
    search,
    watchChat, watchMessages, watchMine
  };
})();

    // ═══════════════════════════════════════════════════════════
//  TASKS SERVICE
//  Assign self/others. Priority. Due date. Recurring.
//  Complete/reopen. Subtasks. Tags. Notification at 9AM digest.
// ═══════════════════════════════════════════════════════════

const Tasks = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.TASKS;
  const PRIORITY = ['low', 'medium', 'high'];
  const RECURRING = ['daily','weekly','biweekly','monthly'];

  // ─────────────── CREATE ───────────────
  async function create(data) {
    const payload = normalizePayload(data);
    validate(payload);

    payload.status = 'open';
    payload.completed = false;
    payload.createdBy = STATE.user?.uid || null;
    payload.assignedTo = payload.assignedTo || STATE.user?.uid || null;

    const id = await DB.add(COL, payload);
    await logActivity(id, 'task:created');

    if (payload.assignedTo && payload.assignedTo !== STATE.user?.uid) {
      try {
        await Notifications.notify({
          userId: payload.assignedTo,
          type: 'task.assigned',
          title: 'New task assigned',
          message: payload.title,
          data: { taskId: id }
        });
      } catch (_) {}
    }
    return id;
  }

  // ─────────────── READ ───────────────
  async function getById(id) {
    if (!id) return null;
    return DB.get(`${COL}/${id}`);
  }

  async function list(filters = {}) {
    const opts = { orderBy: ['dueDate', 'asc'] };
    const where = [];
    if (filters.assignedTo) where.push(['assignedTo', '==', filters.assignedTo]);
    if (filters.completed !== undefined) where.push(['completed', '==', filters.completed]);
    if (filters.status) where.push(['status', '==', filters.status]);
    if (filters.priority) where.push(['priority', '==', filters.priority]);
    if (where.length) opts.where = where;
    if (filters.limit) opts.limit = filters.limit;
    return DB.list(COL, opts);
  }

  async function listMine(view = 'today') {
    const uid = STATE.user?.uid;
    if (!uid) return [];
    if (view === 'done') {
      return DB.list(COL, {
        where: [['assignedTo', '==', uid], ['completed', '==', true]],
        orderBy: ['completedAt', 'desc'],
        limit: 100
      });
    }
    const rows = await list({ assignedTo: uid, completed: false, limit: 300 });
    const today = new Date().toISOString().slice(0, 10);
    if (view === 'today') {
      return rows.filter(t => !t.dueDate || t.dueDate.slice(0, 10) <= today);
    }
    if (view === 'overdue') {
      return rows.filter(t => t.dueDate && t.dueDate.slice(0, 10) < today);
    }
    return rows; // "all"
  }

  async function search(term, limit = 20) {
    const t = String(term || '').trim().toLowerCase();
    if (!t) return [];
    const rows = await DB.list(COL, { limit: 300 });
    return rows.filter(r =>
      (r.title || '').toLowerCase().includes(t) ||
      (r.notes || '').toLowerCase().includes(t) ||
      (r.tags || []).some(x => String(x).toLowerCase().includes(t))
    ).slice(0, limit);
  }

  // ─────────────── UPDATE ───────────────
  async function update(id, data) {
    if (!id) throw new Error('Task id required');
    const patch = normalizePayload(data, true);
    await DB.update(`${COL}/${id}`, patch);
    await logActivity(id, 'task:updated', { keys: Object.keys(patch) });
    return id;
  }

  // ─────────────── COMPLETE / REOPEN ───────────────
  async function complete(id, note = '') {
    const t = await getById(id);
    if (!t) throw new Error('Task not found');
    await DB.update(`${COL}/${id}`, {
      completed: true,
      status: 'done',
      completedAt: DB.ts(),
      completedBy: STATE.user?.uid || null,
      completionNote: note || null
    });
    await logActivity(id, 'task:completed');

    if (t.recurring && RECURRING.includes(t.recurring)) {
      await spawnNextRecurring(t);
    }
    return id;
  }

  async function reopen(id, reason = '') {
    await DB.update(`${COL}/${id}`, {
      completed: false,
      status: 'open',
      reopenedAt: DB.ts(),
      reopenedBy: STATE.user?.uid || null,
      reopenReason: reason || null
    });
    await logActivity(id, 'task:reopened', { reason });
  }

  // ─────────────── RECURRING ───────────────
  function nextDueDate(currentDue, recurring) {
    if (!currentDue) return null;
    const d = new Date(currentDue);
    if (recurring === 'daily')    d.setDate(d.getDate() + 1);
    if (recurring === 'weekly')   d.setDate(d.getDate() + 7);
    if (recurring === 'biweekly') d.setDate(d.getDate() + 14);
    if (recurring === 'monthly')  d.setMonth(d.getMonth() + 1);
    return d.toISOString().slice(0, 10);
  }

  async function spawnNextRecurring(task) {
    const next = {
      title: task.title,
      notes: task.notes,
      assignedTo: task.assignedTo,
      priority: task.priority,
      tags: task.tags || [],
      recurring: task.recurring,
      dueDate: nextDueDate(task.dueDate, task.recurring),
      parentTaskId: task.id,
      createdBy: STATE.user?.uid || null
    };
    const id = await DB.add(COL, next);
    await DB.update(`${COL}/${task.id}`, { spawnedNextId: id });
    return id;
  }

  // ─────────────── ASSIGN ───────────────
  async function assign(id, userId) {
    await DB.update(`${COL}/${id}`, {
      assignedTo: userId,
      assignedAt: DB.ts(),
      assignedBy: STATE.user?.uid || null
    });
    try {
      const t = await getById(id);
      await Notifications.notify({
        userId, type: 'task.assigned',
        title: 'Task assigned',
        message: t?.title || 'New task',
        data: { taskId: id }
      });
    } catch (_) {}
  }

  // ─────────────── SUBTASKS ───────────────
  async function addSubtask(id, subtask) {
    const t = await getById(id);
    if (!t) throw new Error('Task not found');
    const arr = Array.isArray(t.subtasks) ? [...t.subtasks] : [];
    arr.push({
      id: Utils.uid('sub_'),
      title: subtask.title || '',
      completed: false,
      createdAt: new Date().toISOString()
    });
    await DB.update(`${COL}/${id}`, { subtasks: arr });
  }

  async function toggleSubtask(id, subtaskId) {
    const t = await getById(id);
    if (!t || !Array.isArray(t.subtasks)) return;
    const arr = t.subtasks.map(s =>
      s.id === subtaskId ? { ...s, completed: !s.completed } : s
    );
    await DB.update(`${COL}/${id}`, { subtasks: arr });
  }

  async function removeSubtask(id, subtaskId) {
    const t = await getById(id);
    if (!t || !Array.isArray(t.subtasks)) return;
    const arr = t.subtasks.filter(s => s.id !== subtaskId);
    await DB.update(`${COL}/${id}`, { subtasks: arr });
  }

  // ─────────────── DELETE ───────────────
  async function remove(id) {
    await DB.remove(`${COL}/${id}`);
    await logActivity(id, 'task:deleted');
  }

  async function softDelete(id) {
    await DB.softDelete(`${COL}/${id}`, STATE.user?.uid || null);
    await logActivity(id, 'task:soft-deleted');
  }

  // ─────────────── VALIDATION ───────────────
  function validate(data) {
    if (!data.title || !String(data.title).trim()) throw new Error('Title required');
    if (data.priority && !PRIORITY.includes(data.priority)) throw new Error('Invalid priority');
    if (data.recurring && !RECURRING.includes(data.recurring)) throw new Error('Invalid recurring');
  }

  function normalizePayload(data, isUpdate = false) {
    const out = {};
    const keep = [
      'title','notes','assignedTo','assignedToName',
      'priority','dueDate','recurring','tags',
      'status','completed','subtasks','parentTaskId',
      'relatedType','relatedId'
    ];
    for (const k of keep) {
      if (data[k] !== undefined) out[k] = data[k];
    }
    if (Array.isArray(out.tags)) out.tags = [...new Set(out.tags.filter(Boolean))];
    if (out.priority) out.priority = String(out.priority).toLowerCase();
    return out;
  }

  // ─────────────── ACTIVITY ───────────────
  async function logActivity(taskId, action, meta = {}) {
    try {
      await DB.add(CONST.COLLECTIONS.ACTIVITY, {
        type: 'task',
        taskId,
        action,
        meta,
        at: DB.ts(),
        by: STATE.user?.uid || null
      });
    } catch (_) {}
  }

  // ─────────────── REALTIME ───────────────
  function watchMine(cb) {
    const uid = STATE.user?.uid;
    if (!uid) return () => {};
    return DB.watchList(COL, {
      where: [['assignedTo', '==', uid]],
      orderBy: ['dueDate', 'asc'],
      limit: 200
    }, cb);
  }

  return {
    create, getById, list, listMine, search,
    update, complete, reopen, assign,
    addSubtask, toggleSubtask, removeSubtask,
    remove, softDelete,
    watchMine,
    PRIORITY, RECURRING
  };
})();

const Aggregates = (function () {
  'use strict';

  // ─────────────── PLACEMENT CLIENT DASHBOARD (8 cards) ───────────────
  async function placementDashboard(companyId) {
    if (!companyId) return emptyPlacement();
    const [reqs, cands, invs, agrs] = await Promise.all([
      DB.list(CONST.COLLECTIONS.REQUIREMENTS, { where: [['companyId','==',companyId]], limit: 500 }),
      DB.list(CONST.COLLECTIONS.CANDIDATES,     { where: [['lockedToCompanyId','==',companyId]], limit: 500 }),
      DB.list(CONST.COLLECTIONS.INVOICES,       { where: [['companyId','==',companyId], ['type','==','placement']], limit: 500 }),
      DB.list(CONST.COLLECTIONS.AGREEMENTS,     { where: [['companyId','==',companyId], ['status','==','ACTIVE']], limit: 50 })
    ]);
    const openReqs    = reqs.filter(r => ['PENDING','APPROVED','SOURCING','SHORTLISTED','INTERVIEW'].includes(r.status)).length;
    const candsSent   = cands.length;
    const interviews  = cands.filter(c => c.stage === 'INTERVIEW').length;
    const placed      = cands.filter(c => c.stage === 'PLACED').length;
    const pendingFB   = 0; // filled by feedback service later
    const pendingInv  = invs.filter(i => ['SENT','PARTIAL','OVERDUE'].includes(i.status)).length;
    const activeAgr   = agrs.length;
    return {
      openRequirements: openReqs,
      candidatesSent:   candsSent,
      interviews,
      placed,
      pendingFeedback:  pendingFB,
      pendingInvoices:  pendingInv,
      activeAgreements: activeAgr
    };
  }

  function emptyPlacement() {
    return { openRequirements:0, candidatesSent:0, interviews:0, placed:0,
             pendingFeedback:0, pendingInvoices:0, activeAgreements:0 };
  }

  // ─────────────── CONTRACT CLIENT DASHBOARD (8 cards) ───────────────
  async function contractDashboard(companyId) {
    if (!companyId) return emptyContract();
    const staff = await DB.list(CONST.COLLECTIONS.CONTRACT_STAFF, {
      where: [['companyId','==',companyId]], limit: 1000
    });
    const active = staff.filter(s => s.status === 'ACTIVE');
    const supervisors = new Set(staff.map(s => s.supervisorId).filter(Boolean));

    // Today's attendance %
    const today = new Date().toISOString().slice(0, 10);
    const att = await DB.list(CONST.COLLECTIONS.ATTENDANCE, {
      where: [['companyId','==',companyId], ['date','==',today]], limit: 1000
    }).catch(() => []);
    const present = att.filter(a => a.status === 'P' || a.status === 'WO' || a.status === 'HO').length;
    const total   = active.length || 1;
    const attPct  = Math.round((present / total) * 100);

    // Monthly bill (using rates)
    let monthlyBill = 0;
    for (const s of active) monthlyBill += Number(s.monthlyRate) || 0;

    return {
      activeStaff:      active.length,
      attendancePct:    attPct,
      monthlyBill,
      supervisors:      supervisors.size,
      pendingFeedback:  0,
      pendingInvoices:  0,   // filled by invoices service
      activeAgreements: 0,
      notifications:    0
    };
  }

  function emptyContract() {
    return { activeStaff:0, attendancePct:0, monthlyBill:0, supervisors:0,
             pendingFeedback:0, pendingInvoices:0, activeAgreements:0, notifications:0 };
  }

  // ─────────────── CRM INTERNAL DASHBOARD ───────────────
  async function crmDashboard(roleScope = {}) {
    const uid = STATE.user?.uid;
    const ownerFilter = roleScope.ownerId || null;

    const [companies, candidates, tasks, invoices, chats] = await Promise.all([
      DB.list(CONST.COLLECTIONS.COMPANIES, ownerFilter
        ? { where: [['ownerId','==',ownerFilter]], limit: 500 }
        : { limit: 500 }),
      DB.list(CONST.COLLECTIONS.CANDIDATES, ownerFilter
        ? { where: [['assignedToEmployeeId','==',ownerFilter]], limit: 500 }
        : { limit: 500 }),
      uid ? DB.list(CONST.COLLECTIONS.TASKS, {
        where: [['assignedTo','==',uid], ['completed','==',false]], limit: 200
      }) : Promise.resolve([]),
      DB.list(CONST.COLLECTIONS.INVOICES, {
        where: [['status','in',['SENT','PARTIAL','OVERDUE']]], limit: 500
      }),
      uid ? DB.list(CONST.COLLECTIONS.CHATS, {
        where: [['members','array-contains',uid]], limit: 100
      }) : Promise.resolve([])
    ]);

    const totalCandidates = candidates.length;
    const activeCandidates = candidates.filter(c => c.stage === 'ACTIVE').length;
    const placedCandidates = candidates.filter(c => c.stage === 'PLACED').length;
    const totalCompanies   = companies.length;
    const clientCompanies  = companies.filter(c => c.stage === 'CLIENT').length;
    const openTasks        = tasks.length;
    const overdueTasks     = tasks.filter(t => t.dueDate && t.dueDate.slice(0,10) < new Date().toISOString().slice(0,10)).length;
    const pendingInvoices  = invoices.length;

    let unreadChats = 0;
    for (const c of chats) {
      unreadChats += Number((c.unreadBy || {})[uid]) || 0;
    }

    return {
      totalCompanies, clientCompanies,
      totalCandidates, activeCandidates, placedCandidates,
      openTasks, overdueTasks,
      pendingInvoices,
      unreadChats
    };
  }

  // ─────────────── COMPANY KPI HELPERS ───────────────
  async function companyOverview(companyId) {
    const [comp, reqs, cands, invs, contracts] = await Promise.all([
      DB.get(`${CONST.COLLECTIONS.COMPANIES}/${companyId}`),
      DB.list(CONST.COLLECTIONS.REQUIREMENTS, { where:[['companyId','==',companyId]], limit: 200 }),
      DB.list(CONST.COLLECTIONS.CANDIDATES,   { where:[['lockedToCompanyId','==',companyId]], limit: 500 }),
      DB.list(CONST.COLLECTIONS.INVOICES,     { where:[['companyId','==',companyId]], limit: 500 }),
      DB.list(CONST.COLLECTIONS.CONTRACT_STAFF,{ where:[['companyId','==',companyId]], limit: 500 })
    ]);
    const billedTotal = invs.reduce((s,i) => s + Number(i.total||0), 0);
    const paidTotal   = invs.reduce((s,i) => s + Number(i.paidAmount||0), 0);
    const balanceTotal= invs.reduce((s,i) => s + Number(i.balance||0), 0);
    return {
      company: comp,
      requirements: { total: reqs.length, open: reqs.filter(r => !['CLOSED','REJECTED'].includes(r.status)).length },
      candidates:   { total: cands.length, placed: cands.filter(c => c.stage === 'PLACED').length },
      invoices:     { total: invs.length, billedTotal, paidTotal, balanceTotal },
      contracts:    { total: contracts.length, active: contracts.filter(c => c.status === 'ACTIVE').length }
    };
  }

  return {
    placementDashboard, contractDashboard, crmDashboard,
    companyOverview
  };
})();

//  FU TRACKER — Daily FU due list + reminders
//  Reminders: in-app notification only. Employee sends manually.
// ═══════════════════════════════════════════════════════════

const FUTracker = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.INQUIRIES;

  // All FU due today / overdue
  async function dueList(ownerId = null) {
    const where = [['fuManual','==',false]];
    if (ownerId) where.push(['ownerId','==',ownerId]);
    const rows = await DB.list(COL, { where, limit: 500 });

    const todayStr = new Date().toISOString().slice(0, 10);
    const out = { overdue: [], today: [], upcoming: [] };
    for (const r of rows) {
      if (['CONVERTED','LOST'].includes(r.stage)) continue;
      if (!r.fuNextAt) continue;
      const due = r.fuNextAt.slice(0, 10);
      if (due < todayStr) out.overdue.push(r);
      else if (due === todayStr) out.today.push(r);
      else out.upcoming.push(r);
    }
    return out;
  }

  // Schedule 9 AM reminder (called from boot daily check)
  async function scheduleDailyReminders() {
    const uid = STATE.user?.uid;
    if (!uid) return 0;
    const due = await dueList(uid);
    const count = due.overdue.length + due.today.length;
    if (count === 0) return 0;

    try {
      await Notifications.notify({
        userId: uid,
        type: 'task.due',
        title: `Follow-ups pending (${count})`,
        message: `${due.overdue.length} overdue · ${due.today.length} today`,
        data: { kind: 'fu-daily', overdue: due.overdue.length, today: due.today.length }
      });
    } catch (_) {}
    return count;
  }

  // D-7 + D-1 archive notices (client inactivity)
  async function findInactiveClients(days = 365) {
    const cutoff = Date.now() - days * 86400000;
    const companies = await DB.list(CONST.COLLECTIONS.COMPANIES, {
      where: [['stage','==','CLIENT']], limit: 500
    });
    const out = [];
    for (const c of companies) {
      const last = c.lastActivityAt?.toMillis ? c.lastActivityAt.toMillis()
                 : c.lastActivityAt ? new Date(c.lastActivityAt).getTime() : 0;
      if (last && last < cutoff) out.push(c);
    }
    return out;
  }

  return {
    dueList,
    scheduleDailyReminders,
    findInactiveClients
  };
})();

//  ACTIVITY LOG SERVICE — cross-collection feed reader
// ═══════════════════════════════════════════════════════════

const Activity = (function () {
  'use strict';

  const COL = CONST.COLLECTIONS.ACTIVITY;

  async function list(filters = {}) {
    const opts = { orderBy: ['at','desc'] };
    const where = [];
    if (filters.type)   where.push(['type','==',filters.type]);
    if (filters.userId) where.push(['by','==',filters.userId]);
    if (filters.since)  where.push(['at','>=',filters.since]);
    if (where.length) opts.where = where;
    opts.limit = filters.limit || 100;
    return DB.list(COL, opts);
  }

  async function listForTarget(type, id, limit = 50) {
    const key = type + 'Id';
    return DB.list(COL, {
      where: [[key,'==',id]],
      orderBy: ['at','desc'],
      limit
    });
  }

  async function log(entry) {
    return DB.add(COL, {
      ...entry,
      at: DB.ts(),
      by: STATE.user?.uid || null
    });
  }

  return { list, listForTarget, log };
})();
